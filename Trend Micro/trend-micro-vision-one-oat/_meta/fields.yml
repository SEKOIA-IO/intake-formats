trendmicro.visionone.oat.attackphase.source:
  description: Source-side MITRE ATT&CK attack phase from the sAttackPhase raw field
    (e.g. `Command and Control Comm.`).
  name: trendmicro.visionone.oat.attackphase.source
  type: keyword

trendmicro.visionone.oat.attackphase.target:
  description: Target-side MITRE ATT&CK attack phase from the pAttackPhase raw field
    (e.g. `Lateral Movement`).
  name: trendmicro.visionone.oat.attackphase.target
  type: keyword

trendmicro.visionone.oat.count:
  description: Aggregated event count from the cnt raw field (e.g. `7`).
  name: trendmicro.visionone.oat.count
  type: long

trendmicro.visionone.oat.detectionType:
  description: ''
  name: trendmicro.visionone.oat.detectionType
  type: keyword

