trendmicro.visionone.oat.eventSubName:
  description: ''
  name: trendmicro.visionone.oat.eventSubName
  type: keyword

trendmicro.visionone.oat.filter.id:
  description: Detection filter identifier reported by Trend Micro Vision One (e.g.
    `F3087`, `PDI-100119-4226`).
  name: trendmicro.visionone.oat.filter.id
  type: keyword

trendmicro.visionone.oat.malName:
  description: Malware or suspicious object name reported by Trend Micro Vision One
    (e.g. `USR_SUSPICIOUS_DOMAIN.UMXX`).
  name: trendmicro.visionone.oat.malName
  type: keyword

trendmicro.visionone.oat.malType:
  description: Malware category reported by Trend Micro Vision One (e.g. `MALWARE`,
    `OTHERS`).
  name: trendmicro.visionone.oat.malType
  type: keyword

trendmicro.visionone.oat.riskLevel:
  description: Risk level reported by Trend Micro Vision One (e.g. `low`, `medium`,
    `high`).
  name: trendmicro.visionone.oat.riskLevel
  type: keyword

trendmicro.visionone.oat.threatType:
  description: Threat type code reported by Trend Micro Vision One (e.g. `1` for Malware,
    `2` for Others, `5` for Web).
  name: trendmicro.visionone.oat.threatType
  type: keyword
