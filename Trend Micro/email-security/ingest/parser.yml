name: trend-micro-email-security
pipeline:
  - name: parse_event
    external:
      name: json.parse-json

  - name: set_basic_fields
  - name: set_ecs_fields
  - name: set_custom_fields

stages:
  set_basic_fields:
    actions:
      - set:
          "@timestamp": "{{ parse_event.message.timestamp }}"

          event.category: ["email"]
          event.type: ["info"]

  set_ecs_fields:
    actions:
      - set:
          email.attachments: >-
            {%- if parse_event.message.attachments -%}
            [
              {%- for item in parse_event.message.attachments -%}
                {"file": {"name": "{{item.fileName}}", "hash": {"sha256": "{{item.sha256}}"} }},
              {%- endfor -%}
            ]
            {%- endif -%}
          email.delivery_timestamp: "{{ parse_event.message.deliveryTime }}"
          email.direction: "{{ 'inbound' if parse_event.message.direction == 'in' else 'outbound' if parse_event.message.direction == 'out' else parse_event.message.direction }}"
          email.from.address: "{{ parse_event.message.headerFrom }}"
          email.local_id: "{{ parse_event.message.mailID }}"
          email.message_id: "{{ parse_event.message.messageID.strip('<').strip('>') }}"
          email.sender.address: "{{ parse_event.message.sender }}"
          email.subject: "{{ parse_event.message.subject }}"
          email.to.address: "{{ parse_event.message.headerTo }}"
          event.action: "{{ parse_event.message.action }}"
          source.ip: "{{ parse_event.message.senderIP }}"

      - set:
          destination.address: "{{ parse_event.message.deliveredTo }}"
        filter: "{{ parse_event.message.deliveredTo not in [None, '', 'none'] }}"

      - set:
          email.to.address: "{{ parse_event.message.recipient }}"
        filter: "{{ parse_event.message.headerTo in [None, '', ['']] and '@' in parse_event.message.recipient }}"

  set_custom_fields:
    actions:
      - set:
          trendmicro.email.embedded_urls: "{{ parse_event.message.embeddedUrls }}"
