allentis.qe_secure.alert.signature_severity:
  description: Severity label of the signature, from the rule metadata (e.g. Informational,
    Minor, Major, Critical)
  name: allentis.qe_secure.alert.signature_severity
  type: keyword

allentis.qe_secure.anomaly.layer:
  description: Layer where the protocol anomaly was detected (e.g. proto_parser, proto_detect)
  name: allentis.qe_secure.anomaly.layer
  type: keyword

allentis.qe_secure.anomaly.type:
  description: Type of the protocol anomaly (decode, stream or applayer)
  name: allentis.qe_secure.anomaly.type
  type: keyword

allentis.qe_secure.dns.question.name_length:
  description: Number of characters of the queried domain name
  name: allentis.qe_secure.dns.question.name_length
  type: number

allentis.qe_secure.event_type:
  description: Type of the QE-Secure event (alert, flow, dns, http, tls, fileinfo,
    anomaly, stats...)
  name: allentis.qe_secure.event_type
  type: keyword

allentis.qe_secure.fileinfo.magic:
  description: File type description computed by libmagic
  name: allentis.qe_secure.fileinfo.magic
  type: keyword

allentis.qe_secure.flow_id:
  description: Identifier of the network flow, shared by all the events of the same
    flow
  name: allentis.qe_secure.flow_id
  type: keyword

allentis.qe_secure.http.content_type:
  description: Value of the Content-Type header of the HTTP response
  name: allentis.qe_secure.http.content_type
  type: keyword

allentis.qe_secure.icmp.code:
  description: ICMP code of the packet
  name: allentis.qe_secure.icmp.code
  type: keyword

allentis.qe_secure.icmp.type:
  description: ICMP type of the packet
  name: allentis.qe_secure.icmp.type
  type: keyword

allentis.qe_secure.rdp.cookie:
  description: RDP cookie sent by the client in the connection request (often the
    username)
  name: allentis.qe_secure.rdp.cookie
  type: keyword

allentis.qe_secure.rdp.event_type:
  description: Type of the RDP transaction (initial_request, connect_request, tls_handshake...)
  name: allentis.qe_secure.rdp.event_type
  type: keyword

allentis.qe_secure.smb.command:
  description: SMB command of the transaction
  name: allentis.qe_secure.smb.command
  type: keyword

allentis.qe_secure.smb.dialect:
  description: SMB dialect negotiated between the client and the server
  name: allentis.qe_secure.smb.dialect
  type: keyword

allentis.qe_secure.ssh.client.proto_version:
  description: SSH protocol version announced by the client
  name: allentis.qe_secure.ssh.client.proto_version
  type: keyword

allentis.qe_secure.ssh.client.software_version:
  description: SSH software version announced by the client
  name: allentis.qe_secure.ssh.client.software_version
  type: keyword

allentis.qe_secure.ssh.server.proto_version:
  description: SSH protocol version announced by the server
  name: allentis.qe_secure.ssh.server.proto_version
  type: keyword

allentis.qe_secure.ssh.server.software_version:
  description: SSH software version announced by the server
  name: allentis.qe_secure.ssh.server.software_version
  type: keyword
