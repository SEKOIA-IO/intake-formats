name: QE-Secure
slug: qe-secure

description: QE-Secure is the sovereign NDR solution engineered by Allentis, a 100% subsidiary of Framatome (EDF Group). More than 20 years of expertise in real-time network flow decoding and analysis. Designed, developed and supported in France.
data_sources:
  Network device logs: By decoding network traffic, QE-Secure makes it possible to identify communications between the various devices.
  Network intrusion detection system: Identifies suspicious behavior, lateral movement, command and control, ransomware activity, and data exfiltration at the closest point to the network, producing contextualized events.
  Network protocol analysis:  QE-Secure uses protocol decoding to identify the type of activity performed by various devices.
  DNS records: QE-Secure can decode and display the contents of DNS queries and answers
  SSL/TLS certificates: QE-Secure can decode and display the contents of TLS certificates
