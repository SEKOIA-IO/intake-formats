name: qe-secure
ignored_values: null
pipeline:
  - name: json_event
    description: ''
    filter: ''
    external:
      name: json.parse-json
      properties:
        input_field: '{{original.message}}'
        output_field: message
  - name: parsed_date
    description: ''
    filter: ''
    external:
      name: date.parse
      properties:
        input_field: '{{json_event.message.event_original.timestamp}}'
        output_field: datetime
        format: null
        timezone: UTC
  - name: set_base_fields
    description: ''
    filter: ''
    external: null
stages:
  set_base_fields:
    actions:
      - set:
          dns.id: '{{json_event.message.event_original.dns.id}}'
          host.ip: '{{json_event.message.event_original.src_ip}}'
          dns.type: '{{json_event.message.event_original.dns.type}}'
          source.ip: '{{json_event.message.event_original.src_ip}}'
          '@timestamp': '{{parsed_date.datetime}}'
          event.type: '{{json_event.message.event_original.event_type}}'
          url.domain: '{{json_event.message.event_original.http.hostname}}'
          action.name: '{{json_event.message.event_original.alert.action}}'
          action.type: '{{json_event.message.event_original.event_type}}'
          source.port: '{{json_event.message.event_original.src_port}}'
          tls.version: '{{json_event.message.event_original.tls.version}}'
          http.version: '{{json_event.message.event_original.http.protocol.split("/")[1]}}'
          source.bytes: '{{json_event.message.event_original.flow.bytes_toserver}}'
          url.original: '{{json_event.message.event_original.http.url}}'
          destination.ip: '{{json_event.message.event_original.dest_ip}}'
          event.category:
            - network
          event.severity: '{{json_event.message.event_original.alert.severity}}'
          tls.client.ja3: '{{json_event.message.event_original.tls.ja3}}'
          destination.port: '{{json_event.message.event_original.dest_port}}'
          network.protocol: '{{json_event.message.event_original.proto}}'
          network.transport: '{{final.network.protocol}}'
          tls.client.issuer: '{{json_event.message.event_original.tls.issuerdn}}'
          tls.client.subject: '{{json_event.message.event_original.tls.subject}}'
          http.request.method: '{{json_event.message.event_original.http.http_method}}'
          http.response.bytes: '{{json_event.message.event_original.http.length}}'
          user_agent.original: '{{json_event.message.event_original.http.http_user_agent}}'
          network.community_id: '{{json_event.message.event_original.community_id}}'
          tls.client.not_after: '{{json_event.message.event_original.tls.notafter}}'
          http.request.referrer: '{{json_event.message.event_original.http.http_refer}}'
          tls.client.not_before: '{{json_event.message.event_original.tls.notbefore}}'
          tls.client.server_name: '{{json_event.message.event_original.tls.sni}}'
          http.response.mime_type: '{{json_event.message.event_original.http.http_content_type}}'
          http.response.status_code: '{{json_event.message.event_original.http.status}}'
          action.properties.category: '{{json_event.message.event_original.alert.category}}'
          action.properties.severity: >-
            {{json_event.message.event_original.alert.metadata.signature_severity[0]}}
          action.properties.signature: '{{json_event.message.event_original.alert.signature}}'
          action.properties.signature_id: '{{json_event.message.event_original.alert.signature_id}}'
        filter: ''
        name: set
      - set:
          event.type:
            - info
          event.action: '{{json_event.message.event_original.anomaly.event}}'
        filter: '{{json_event.message.event_original.get("event_type") == "anomaly"}}'
        name: set
      - set:
          event.type:
            - info
        filter: '{{json_event.message.event_original.get("event_type") == "stats"}}'
        name: set
      - set:
          event.kind: alert
        filter: '{{json_event.message.event_original.get("event_type") == "alert"}}'
        name: set
      - set:
          dns.question.name: '{{json_event.message.event_original.dns.rrname}}'
          dns.question.type: '{{json_event.message.event_original.dns.rrtype}}'
        filter: >-
          {{json_event.message.event_original.dns.get("type") == "query" or
          json_event.message.dns.get("grouped") != None}}
        name: set
      - set:
          dns.answers: >
            [ {"type": "{{json_event.message.event_original.dns.rrtype}}",
            "name": "{{json_event.message.event_original.dns.rrname}}"} ]
          dns.response_code: '{{json_event.message.event_original.dns.rcode}}'
        filter: >-
          {{json_event.message.event_original.dns.get("type") == "answer" and
          json_event.message.dns.get("answers") == None}}
        name: set
      - set:
          dns.answers: |
            [
                {% for item in json_event.message.dns.answers %}
                {"type": "{{item.rrtype}}", "name": "{{item.rrname}}"},
                {% endfor %}
            ]
          dns.response_code: '{{json_event.message.event_original.dns.rcode}}'
        filter: '{{json_event.message.event_original.dns.get("answers") != None}}'
        name: set
      - set:
          dns.answers: |
            [
                {% for type, record in json_event.message.dns.grouped.items() %}
                    {% for item in record %}
                    {"type": "{{type}}", "name": "{{item}}"},
                    {% endfor %}
                {% endfor %}
            ]
        filter: '{{json_event.message.event_original.dns.get("grouped") != None}}'
        name: set
      - set:
          host.name: '{{json_event.message.event_original.get("host")}}'
          event.type:
            - info
          action.type: '{{json_event.message.event_original.get("tags")[0]}}'
        filter: >-
          {{json_event.message.event_original.get("tags")[0] == "metric" or
          json_event.message.get("tags")[0] == "beats_input_raw_event"}}
        name: set
      - set:
          dns.size_in_char: '{{json_event.message.event_original.dns.rrname | length}}'
        filter: '{{json_event.message.event_original.dns.get("rrname") != None}}'
        name: set
      - set:
          event.end: '{{json_event.message.event_original.flow.end}}'
          event.start: '{{json_event.message.event_original.flow.start}}'
          event.reason: '{{json_event.message.event_original.flow.reason}}'
          suricata.icmp.code: '{{json_event.message.event_original.icmp_code}}'
          suricata.icmp.type: '{{json_event.message.event_original.icmp_type}}'
          observer.ingress.interface.name: '{{json_event.message.event_original.in_iface}}'
        filter: ''
        name: set
