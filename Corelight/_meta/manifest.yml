name: Corelight
slug: corelight
description: >-
  Corelight is an Open NDR platform built on Zeek and Suricata. It transforms
  network traffic into rich, structured logs (conn, dns, http, ssl, files,
  notice, intel) and Suricata alerts (suricata_corelight) for threat detection,
  hunting and incident response.
