name: Corelight
slug: corelight
description: >-
  Corelight is an Open NDR platform built on Zeek and Suricata. It transforms
  network traffic into rich, structured logs (connections, protocols,
  authentication, mail and files, entity inventory, industrial control) and
  Suricata alerts for threat detection, hunting and incident response.
