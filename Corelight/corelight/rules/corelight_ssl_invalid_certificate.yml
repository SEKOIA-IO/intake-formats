version: 1.0
uuid: 9e7c6b11-5730-4f8a-a018-10c50bea6f10
format_uuid: 21e0297d-93cc-4d92-90df-cefc92be563d
rule: Corelight TLS Certificate Validation Failure
description: >-
  Detects a TLS session observed by a Corelight sensor whose certificate failed
  validation (e.g. self signed certificate, unable to get local issuer
  certificate). Invalid certificates are frequently associated with malware
  command-and-control channels and interception.
sources: https://docs.zeek.org/en/master/logs/ssl.html
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: "21e0297d-93cc-4d92-90df-cefc92be563d"
    event.dataset: "ssl"
  filter_ok:
    corelight.ssl.validation_status: "ok"
  filter_empty:
    corelight.ssl.validation_status: null
  condition: selection and not (filter_ok or filter_empty)
alert_category: command-and-control
alert_type: system-compromise
alert_severity: 60
similarity_strategy:
  - source.ip
  - destination.ip
attack:
  - T1573
data_sources:
  - SSL/TLS certificates
tags:
  - Corelight
changelog:
  - date: 17/06/2026
    level: minor
    change: Initial Corelight rule
