version: 1.0
uuid: 96d51f24-b948-430d-bb89-66248c3532e4
format_uuid: 21e0297d-93cc-4d92-90df-cefc92be563d
rule: Corelight Lateral Movement Notice
description: >-
  Detects a Zeek notice raised by a Corelight sensor that is related to
  lateral movement activity (e.g. ATTACK::Lateral_Movement), often indicating
  an adversary moving across internal hosts.
sources: https://docs.zeek.org/en/master/frameworks/notice.html
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: "21e0297d-93cc-4d92-90df-cefc92be563d"
    event.dataset: "notice"
    rule.name|contains: "Lateral_Movement"
  condition: selection
alert_category: intrusions
alert_type: system-compromise
alert_severity: 80
similarity_strategy:
  - source.ip
  - destination.ip
attack:
  - T1021
data_sources:
  - Network protocol analysis
tags:
  - Corelight
changelog:
  - date: 17/06/2026
    level: minor
    change: Initial Corelight rule
