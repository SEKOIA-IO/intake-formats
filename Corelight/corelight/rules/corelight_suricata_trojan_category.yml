version: 2.0
uuid: a2a5cac7-1ae1-4b0c-8530-659e15e81be1
format_uuid: 21e0297d-93cc-4d92-90df-cefc92be563d
rule: Corelight Suricata Trojan Activity Alert
description: >-
  Detects a Suricata IDS alert categorized as trojan activity (e.g. "A Network
  Trojan was detected") reported by a Corelight sensor. This category typically
  flags malware command-and-control or beaconing traffic.
sources: https://docs.suricata.io/en/latest/output/eve/eve-json-format.html
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: '21e0297d-93cc-4d92-90df-cefc92be563d'
    event.dataset: "suricata_corelight"
    event.kind: alert
    rule.category|contains: "Trojan"
  condition: selection
alert_category: intrusions
alert_type: system-compromise
alert_severity: 70
similarity_strategy:
  - rule.name
  - source.ip
attack:
  - T1071
data_sources:
  - Network intrusion detection system
tags:
  - Corelight
