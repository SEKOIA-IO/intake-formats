rule: Corelight Threat Intelligence Indicator Match
description: >-
  Detects a match against the Zeek Intelligence Framework on a Corelight sensor
  (intel log), meaning observed network traffic matched a known threat
  intelligence indicator (domain, IP, hash, etc.).
sources: https://docs.zeek.org/en/master/frameworks/intel.html
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: '21e0297d-93cc-4d92-90df-cefc92be563d'
    event.dataset: "intel"
  condition: selection
alert_category: intrusions
alert_type: system-compromise
alert_severity: 70
similarity_strategy:
  - threat.indicator.name
  - source.ip
attack:
  - T1071
data_sources:
  - Network protocol analysis
tags:
  - Corelight
