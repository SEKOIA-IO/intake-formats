version: 1.0
uuid: f293488c-f212-4277-97e5-43e0265cc35a
format_uuid: 21e0297d-93cc-4d92-90df-cefc92be563d
rule: Corelight Windows Executable Download
description: >-
  Detects the transfer of a Windows executable (PE / application/x-dosexec)
  observed by a Corelight sensor in the files log. Executable downloads are a
  common malware delivery vector and warrant investigation.
sources: https://docs.zeek.org/en/master/logs/files.html
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: "21e0297d-93cc-4d92-90df-cefc92be563d"
    event.dataset: "files"
    file.mime_type|contains: "application/x-dosexec"
  condition: selection
alert_category: malicious-file
alert_type: system-compromise
alert_severity: 50
similarity_strategy:
  - file.hash.sha256
  - destination.ip
attack:
  - T1105
data_sources:
  - Network protocol analysis
tags:
  - Corelight
changelog:
  - date: 17/06/2026
    level: minor
    change: Initial Corelight rule
