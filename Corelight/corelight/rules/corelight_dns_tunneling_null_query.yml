version: 2.0
uuid: 05e01c1a-40f0-4d1f-a802-8ed0b500fd93
format_uuid: 21e0297d-93cc-4d92-90df-cefc92be563d
rule: Corelight DNS NULL Record Query (Possible Tunneling)
description: >-
  Detects DNS queries of type NULL observed by a Corelight sensor. NULL record
  queries are rarely used by legitimate clients and are a strong indicator of
  DNS tunneling used for command-and-control or data exfiltration.
sources: https://docs.zeek.org/en/master/logs/dns.html
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: '21e0297d-93cc-4d92-90df-cefc92be563d'
    event.dataset: "dns"
    dns.question.type: "NULL"
  condition: selection
alert_category: malicious-traffic
alert_type: c&c
alert_severity: 70
similarity_strategy:
  - source.ip
  - dns.question.name
attack:
  - T1071.004
data_sources:
  - DNS records
tags:
  - Corelight
