corelight.conn.history:
  description: Zeek connection history string (sequence of connection state flags).
  name: corelight.conn.history
  type: keyword

corelight.conn.state:
  description: Zeek connection state (conn_state), e.g. SF, OTH, S1.
  name: corelight.conn.state
  type: keyword

corelight.dce_rpc.endpoint:
  description: DCE/RPC endpoint (interface) being called, e.g. samr, drsuapi, svcctl.
  name: corelight.dce_rpc.endpoint
  type: keyword

corelight.dce_rpc.named_pipe:
  description: SMB named pipe the DCE/RPC call was carried over, e.g. \pipe\lsass.
  name: corelight.dce_rpc.named_pipe
  type: keyword

corelight.dce_rpc.operation:
  description: DCE/RPC operation invoked on the endpoint, e.g. SamrEnumerateDomainsInSamServer.
  name: corelight.dce_rpc.operation
  type: keyword

corelight.files.source:
  description: Protocol over which the file was seen (e.g. HTTP, SMTP, FTP).
  name: corelight.files.source
  type: keyword

corelight.intel.sources:
  description: Threat intelligence sources that matched in the Zeek Intelligence Framework.
  name: corelight.intel.sources
  type: keyword

corelight.intel.where:
  description: Location in the connection where the intel indicator was seen (seen.where).
  name: corelight.intel.where
  type: keyword

corelight.kerberos.cipher:
  description: Ticket encryption type negotiated for the Kerberos exchange, e.g. aes256-cts-hmac-sha1-96,
    rc4-hmac.
  name: corelight.kerberos.cipher
  type: keyword

corelight.kerberos.error_message:
  description: Kerberos error returned by the KDC (error_msg), e.g. KDC_ERR_PREAUTH_FAILED.
  name: corelight.kerberos.error_message
  type: keyword

corelight.kerberos.forwardable:
  description: Whether the requested Kerberos ticket is forwardable.
  name: corelight.kerberos.forwardable
  type: boolean

corelight.kerberos.renewable:
  description: Whether the requested Kerberos ticket is renewable.
  name: corelight.kerberos.renewable
  type: boolean

corelight.kerberos.request_type:
  description: Kerberos request type, AS for the initial authentication or TGS for
    a service ticket request.
  name: corelight.kerberos.request_type
  type: keyword

corelight.kerberos.service:
  description: Service principal the ticket was requested for, e.g. LDAP/dc.windomain.local/windomain.local.
  name: corelight.kerberos.service
  type: keyword

corelight.kerberos.till:
  description: Expiration time requested for the Kerberos ticket.
  name: corelight.kerberos.till
  type: date

corelight.ldap.argument:
  description: Argument of the LDAP operation. Corelight redacts credentials, emitting
    REDACTED for a bind password.
  name: corelight.ldap.argument
  type: keyword

corelight.ldap.message_id:
  description: LDAP message identifier, used to correlate a request with its response.
  name: corelight.ldap.message_id
  type: long

corelight.ldap.object:
  description: Object the LDAP operation applies to, e.g. the bind distinguished name.
  name: corelight.ldap.object
  type: keyword

corelight.ldap.opcode:
  description: LDAP operation performed, e.g. bind simple, bind SASL, modify, delete.
  name: corelight.ldap.opcode
  type: keyword

corelight.ldap.result:
  description: LDAP result code name, e.g. success, invalid credentials, no such object.
  name: corelight.ldap.result
  type: keyword

corelight.ldap.version:
  description: LDAP protocol version announced by the client, usually 3.
  name: corelight.ldap.version
  type: long

corelight.ldap_search.base_object:
  description: Base distinguished name the LDAP search starts from, e.g. DC=windomain,DC=local.
  name: corelight.ldap_search.base_object
  type: keyword

corelight.ldap_search.deref_aliases:
  description: Alias dereferencing policy of the LDAP search, e.g. never, in searching,
    always.
  name: corelight.ldap_search.deref_aliases
  type: keyword

corelight.ldap_search.filter:
  description: LDAP search filter. Broad or recursive filters are a common directory
    enumeration signal.
  name: corelight.ldap_search.filter
  type: keyword

corelight.ldap_search.result_count:
  description: Number of entries returned by the LDAP search.
  name: corelight.ldap_search.result_count
  type: long

corelight.ldap_search.scope:
  description: Scope of the LDAP search, e.g. base, single, tree.
  name: corelight.ldap_search.scope
  type: keyword

corelight.notice.message:
  description: Human-readable Zeek notice message (msg field), e.g. "SMB::FILE_WRITE
    to admin file share".
  name: corelight.notice.message
  type: keyword

corelight.notice.sub:
  description: Sub-message of a Zeek notice (sub field).
  name: corelight.notice.sub
  type: keyword

corelight.ntlm.server_dns_computer_name:
  description: DNS computer name advertised by the server in the NTLM challenge.
  name: corelight.ntlm.server_dns_computer_name
  type: keyword

corelight.ntlm.server_tree_name:
  description: DNS forest (tree) name advertised by the server in the NTLM challenge.
  name: corelight.ntlm.server_tree_name
  type: keyword

corelight.ssh.auth_attempts:
  description: Number of authentication attempts Zeek observed on the SSH session.
  name: corelight.ssh.auth_attempts
  type: long

corelight.ssh.cipher_alg:
  description: Symmetric cipher negotiated for the SSH session, e.g. chacha20-poly1305@openssh.com.
  name: corelight.ssh.cipher_alg
  type: keyword

corelight.ssh.client:
  description: SSH client version string, e.g. SSH-2.0-OpenSSH_9.0.
  name: corelight.ssh.client
  type: keyword

corelight.ssh.compression_alg:
  description: Compression algorithm negotiated for the SSH session.
  name: corelight.ssh.compression_alg
  type: keyword

corelight.ssh.hassh:
  description: HASSH fingerprint of the SSH client, derived from its algorithm offer.
    Identifies the client implementation even when the version string is spoofed.
  name: corelight.ssh.hassh
  type: keyword

corelight.ssh.hassh_server:
  description: HASSH fingerprint of the SSH server (hasshServer).
  name: corelight.ssh.hassh_server
  type: keyword

corelight.ssh.host_key:
  description: Fingerprint of the SSH server host key. A change on a known server
    is a man-in-the-middle signal.
  name: corelight.ssh.host_key
  type: keyword

corelight.ssh.host_key_alg:
  description: Algorithm of the SSH server host key, e.g. ssh-ed25519, ssh-rsa.
  name: corelight.ssh.host_key_alg
  type: keyword

corelight.ssh.kex_alg:
  description: Key exchange algorithm negotiated for the SSH session.
  name: corelight.ssh.kex_alg
  type: keyword

corelight.ssh.mac_alg:
  description: Message authentication algorithm negotiated for the SSH session.
  name: corelight.ssh.mac_alg
  type: keyword

corelight.ssh.server:
  description: SSH server version string, e.g. SSH-2.0-OpenSSH_8.9p1.
  name: corelight.ssh.server
  type: keyword

corelight.ssh.version:
  description: SSH protocol version, 1 or 2.
  name: corelight.ssh.version
  type: long

corelight.ssl.validation_status:
  description: TLS certificate chain validation status (e.g. ok, self signed certificate,
    unable to get local issuer certificate).
  name: corelight.ssl.validation_status
  type: keyword

corelight.uid:
  description: Zeek connection unique identifier (uid), used to pivot across logs.
  name: corelight.uid
  type: keyword
