corelight.conn.history:
  description: Zeek connection history string (sequence of connection state flags).
  name: corelight.conn.history
  type: keyword

corelight.conn.state:
  description: Zeek connection state (conn_state), e.g. SF, OTH, S1.
  name: corelight.conn.state
  type: keyword

corelight.dce_rpc.endpoint:
  description: DCE/RPC endpoint (interface) being called, e.g. samr, drsuapi, svcctl.
  name: corelight.dce_rpc.endpoint
  type: keyword

corelight.dce_rpc.named_pipe:
  description: SMB named pipe the DCE/RPC call was carried over, e.g. \pipe\lsass.
  name: corelight.dce_rpc.named_pipe
  type: keyword

corelight.dce_rpc.operation:
  description: DCE/RPC operation invoked on the endpoint, e.g. SamrEnumerateDomainsInSamServer.
  name: corelight.dce_rpc.operation
  type: keyword

corelight.files.source:
  description: Protocol over which the file was seen (e.g. HTTP, SMTP, FTP).
  name: corelight.files.source
  type: keyword

corelight.ftp.arg:
  description: Argument of the FTP command, when there is one.
  name: corelight.ftp.arg
  type: keyword

corelight.ftp.data_channel.orig_h:
  description: Source address of the data channel.
  name: corelight.ftp.data_channel.orig_h
  type: ip

corelight.ftp.data_channel.passive:
  description: Whether the data channel was negotiated in passive mode.
  name: corelight.ftp.data_channel.passive
  type: boolean

corelight.ftp.data_channel.resp_h:
  description: Destination address of the data channel.
  name: corelight.ftp.data_channel.resp_h
  type: ip

corelight.ftp.data_channel.resp_p:
  description: Destination port of the data channel.
  name: corelight.ftp.data_channel.resp_p
  type: long

corelight.ftp.reply_code:
  description: Numeric reply code returned by the server.
  name: corelight.ftp.reply_code
  type: long

corelight.ftp.reply_msg:
  description: Textual reply returned by the server.
  name: corelight.ftp.reply_msg
  type: keyword

corelight.fuid:
  description: Zeek file identifier, used to correlate a log entry with the files
    log.
  name: corelight.fuid
  type: keyword

corelight.intel.sources:
  description: Threat intelligence sources that matched in the Zeek Intelligence Framework.
  name: corelight.intel.sources
  type: keyword

corelight.intel.where:
  description: Location in the connection where the intel indicator was seen (seen.where).
  name: corelight.intel.where
  type: keyword

corelight.kerberos.cipher:
  description: Ticket encryption type negotiated for the Kerberos exchange, e.g. aes256-cts-hmac-sha1-96,
    rc4-hmac.
  name: corelight.kerberos.cipher
  type: keyword

corelight.kerberos.error_message:
  description: Kerberos error returned by the KDC (error_msg), e.g. KDC_ERR_PREAUTH_FAILED.
  name: corelight.kerberos.error_message
  type: keyword

corelight.kerberos.forwardable:
  description: Whether the requested Kerberos ticket is forwardable.
  name: corelight.kerberos.forwardable
  type: boolean

corelight.kerberos.renewable:
  description: Whether the requested Kerberos ticket is renewable.
  name: corelight.kerberos.renewable
  type: boolean

corelight.kerberos.request_type:
  description: Kerberos request type, AS for the initial authentication or TGS for
    a service ticket request.
  name: corelight.kerberos.request_type
  type: keyword

corelight.kerberos.service:
  description: Service principal the ticket was requested for, e.g. LDAP/dc.windomain.local/windomain.local.
  name: corelight.kerberos.service
  type: keyword

corelight.kerberos.till:
  description: Expiration time requested for the Kerberos ticket.
  name: corelight.kerberos.till
  type: date

corelight.ldap.argument:
  description: Argument of the LDAP operation. Corelight redacts credentials, emitting
    REDACTED for a bind password.
  name: corelight.ldap.argument
  type: keyword

corelight.ldap.message_id:
  description: LDAP message identifier, used to correlate a request with its response.
  name: corelight.ldap.message_id
  type: long

corelight.ldap.object:
  description: Object the LDAP operation applies to, e.g. the bind distinguished name.
  name: corelight.ldap.object
  type: keyword

corelight.ldap.opcode:
  description: LDAP operation performed, e.g. bind simple, bind SASL, modify, delete.
  name: corelight.ldap.opcode
  type: keyword

corelight.ldap.result:
  description: LDAP result code name, e.g. success, invalid credentials, no such object.
  name: corelight.ldap.result
  type: keyword

corelight.ldap.version:
  description: LDAP protocol version announced by the client, usually 3.
  name: corelight.ldap.version
  type: long

corelight.ldap_search.base_object:
  description: Base distinguished name the LDAP search starts from, e.g. DC=windomain,DC=local.
  name: corelight.ldap_search.base_object
  type: keyword

corelight.ldap_search.deref_aliases:
  description: Alias dereferencing policy of the LDAP search, e.g. never, in searching,
    always.
  name: corelight.ldap_search.deref_aliases
  type: keyword

corelight.ldap_search.filter:
  description: LDAP search filter. Broad or recursive filters are a common directory
    enumeration signal.
  name: corelight.ldap_search.filter
  type: keyword

corelight.ldap_search.result_count:
  description: Number of entries returned by the LDAP search.
  name: corelight.ldap_search.result_count
  type: long

corelight.ldap_search.scope:
  description: Scope of the LDAP search, e.g. base, single, tree.
  name: corelight.ldap_search.scope
  type: keyword

corelight.notice.message:
  description: Human-readable Zeek notice message (msg field), e.g. "SMB::FILE_WRITE
    to admin file share".
  name: corelight.notice.message
  type: keyword

corelight.notice.sub:
  description: Sub-message of a Zeek notice (sub field).
  name: corelight.notice.sub
  type: keyword

corelight.ntlm.server_dns_computer_name:
  description: DNS computer name advertised by the server in the NTLM challenge.
  name: corelight.ntlm.server_dns_computer_name
  type: keyword

corelight.ntlm.server_tree_name:
  description: DNS forest (tree) name advertised by the server in the NTLM challenge.
  name: corelight.ntlm.server_tree_name
  type: keyword

corelight.pe.compile_ts:
  description: Compilation timestamp recorded in the PE header.
  name: corelight.pe.compile_ts
  type: date

corelight.pe.has_cert_table:
  description: Whether the executable carries a certificate table.
  name: corelight.pe.has_cert_table
  type: boolean

corelight.pe.has_debug_data:
  description: Whether the executable carries debug data.
  name: corelight.pe.has_debug_data
  type: boolean

corelight.pe.has_export_table:
  description: Whether the executable carries an export table.
  name: corelight.pe.has_export_table
  type: boolean

corelight.pe.has_import_table:
  description: Whether the executable carries an import table.
  name: corelight.pe.has_import_table
  type: boolean

corelight.pe.is_64bit:
  description: Whether the executable is 64-bit.
  name: corelight.pe.is_64bit
  type: boolean

corelight.pe.is_exe:
  description: Whether the file is an executable rather than a library.
  name: corelight.pe.is_exe
  type: boolean

corelight.pe.machine:
  description: Target architecture of the executable, as recorded in the PE header.
  name: corelight.pe.machine
  type: keyword

corelight.pe.os:
  description: Operating system the executable targets.
  name: corelight.pe.os
  type: keyword

corelight.pe.section_names:
  description: Names of the sections declared by the executable.
  name: corelight.pe.section_names
  type: keyword

corelight.pe.subsystem:
  description: Subsystem the executable runs under.
  name: corelight.pe.subsystem
  type: keyword

corelight.pe.uses_aslr:
  description: Whether the executable opts into address space layout randomization.
  name: corelight.pe.uses_aslr
  type: boolean

corelight.pe.uses_code_integrity:
  description: Whether the executable requires code integrity checks.
  name: corelight.pe.uses_code_integrity
  type: boolean

corelight.pe.uses_dep:
  description: Whether the executable opts into data execution prevention.
  name: corelight.pe.uses_dep
  type: boolean

corelight.pe.uses_seh:
  description: Whether the executable uses structured exception handling.
  name: corelight.pe.uses_seh
  type: boolean

corelight.smb_files.data_len_req:
  description: Number of bytes requested by the client.
  name: corelight.smb_files.data_len_req
  type: long

corelight.smb_files.data_offset_req:
  description: Offset requested by the client in the file.
  name: corelight.smb_files.data_offset_req
  type: long

corelight.smb_mapping.native_file_system:
  description: File system backing the share.
  name: corelight.smb_mapping.native_file_system
  type: keyword

corelight.smb_mapping.object_path:
  description: Share the client mapped.
  name: corelight.smb_mapping.object_path
  type: keyword

corelight.smb_mapping.service:
  description: Service the share exposes, as announced by the server.
  name: corelight.smb_mapping.service
  type: keyword

corelight.smb_mapping.share_type:
  description: 'Type of share: DISK, PIPE or PRINT.'
  name: corelight.smb_mapping.share_type
  type: keyword

corelight.smtp.date:
  description: 'Date: header of the message, kept verbatim in its RFC 5322 form.'
  name: corelight.smtp.date
  type: keyword

corelight.smtp.domains:
  description: Domains found in the message body.
  name: corelight.smtp.domains
  type: keyword

corelight.smtp.fuids:
  description: Zeek file identifiers of the attachments carried by the message.
  name: corelight.smtp.fuids
  type: keyword

corelight.smtp.helo:
  description: Argument of the HELO or EHLO command sent by the client.
  name: corelight.smtp.helo
  type: keyword

corelight.smtp.is_webmail:
  description: Whether the message was submitted through a webmail interface.
  name: corelight.smtp.is_webmail
  type: boolean

corelight.smtp.last_reply:
  description: Last server reply seen in the SMTP transaction.
  name: corelight.smtp.last_reply
  type: keyword

corelight.smtp.path:
  description: 'Chain of hosts the message transited through, read from the Received:
    headers.'
  name: corelight.smtp.path
  type: keyword

corelight.smtp.rcptto:
  description: Envelope recipients of the message, from the RCPT TO commands.
  name: corelight.smtp.rcptto
  type: keyword

corelight.smtp.trans_depth:
  description: Rank of the transaction inside the SMTP connection.
  name: corelight.smtp.trans_depth
  type: long

corelight.smtp.urls:
  description: URLs found in the message body.
  name: corelight.smtp.urls
  type: keyword

corelight.ssh.auth_attempts:
  description: Number of authentication attempts Zeek observed on the SSH session.
  name: corelight.ssh.auth_attempts
  type: long

corelight.ssh.cipher_alg:
  description: Symmetric cipher negotiated for the SSH session, e.g. chacha20-poly1305@openssh.com.
  name: corelight.ssh.cipher_alg
  type: keyword

corelight.ssh.client:
  description: SSH client version string, e.g. SSH-2.0-OpenSSH_9.0.
  name: corelight.ssh.client
  type: keyword

corelight.ssh.compression_alg:
  description: Compression algorithm negotiated for the SSH session.
  name: corelight.ssh.compression_alg
  type: keyword

corelight.ssh.hassh:
  description: HASSH fingerprint of the SSH client, derived from its algorithm offer.
    Identifies the client implementation even when the version string is spoofed.
  name: corelight.ssh.hassh
  type: keyword

corelight.ssh.hassh_server:
  description: HASSH fingerprint of the SSH server (hasshServer).
  name: corelight.ssh.hassh_server
  type: keyword

corelight.ssh.host_key:
  description: Fingerprint of the SSH server host key. A change on a known server
    is a man-in-the-middle signal.
  name: corelight.ssh.host_key
  type: keyword

corelight.ssh.host_key_alg:
  description: Algorithm of the SSH server host key, e.g. ssh-ed25519, ssh-rsa.
  name: corelight.ssh.host_key_alg
  type: keyword

corelight.ssh.kex_alg:
  description: Key exchange algorithm negotiated for the SSH session.
  name: corelight.ssh.kex_alg
  type: keyword

corelight.ssh.mac_alg:
  description: Message authentication algorithm negotiated for the SSH session.
  name: corelight.ssh.mac_alg
  type: keyword

corelight.ssh.server:
  description: SSH server version string, e.g. SSH-2.0-OpenSSH_8.9p1.
  name: corelight.ssh.server
  type: keyword

corelight.ssh.version:
  description: SSH protocol version, 1 or 2.
  name: corelight.ssh.version
  type: long

corelight.ssl.validation_status:
  description: TLS certificate chain validation status (e.g. ok, self signed certificate,
    unable to get local issuer certificate).
  name: corelight.ssl.validation_status
  type: keyword

corelight.uid:
  description: Zeek connection unique identifier (uid), used to pivot across logs.
  name: corelight.uid
  type: keyword

corelight.x509.basic_constraints_ca:
  description: Whether the basic constraints extension marks the certificate as a
    CA.
  name: corelight.x509.basic_constraints_ca
  type: boolean

corelight.x509.client_cert:
  description: Whether the certificate was presented by the client.
  name: corelight.x509.client_cert
  type: boolean

corelight.x509.host_cert:
  description: Whether the certificate belongs to the host it was presented for.
  name: corelight.x509.host_cert
  type: boolean

corelight.x509.key_type:
  description: 'Family of the public key: rsa, dsa or ecdsa.'
  name: corelight.x509.key_type
  type: keyword

x509.alternative_names:
  description: List of subject alternative names (SAN). Name types vary by certificate
    authority and certificate type but commonly contain IP addresses, DNS names (and
    wildcards), and email addresses.
  name: x509.alternative_names
  type: keyword

x509.issuer.distinguished_name:
  description: Distinguished name (DN) of issuing certificate authority.
  name: x509.issuer.distinguished_name
  type: keyword

x509.not_after:
  description: Time at which the certificate is no longer considered valid.
  name: x509.not_after
  type: date

x509.not_before:
  description: Time at which the certificate is first considered valid.
  name: x509.not_before
  type: date

x509.public_key_algorithm:
  description: Algorithm used to generate the public key.
  name: x509.public_key_algorithm
  type: keyword

x509.public_key_exponent:
  description: Exponent used to derive the public key. This is algorithm specific.
  name: x509.public_key_exponent
  type: long

x509.public_key_size:
  description: The size of the public key space in bits.
  name: x509.public_key_size
  type: long

x509.serial_number:
  description: Unique serial number issued by the certificate authority. For consistency,
    if this value is alphanumeric, it should be formatted without colons and uppercase
    characters.
  name: x509.serial_number
  type: keyword

x509.signature_algorithm:
  description: Identifier for certificate signature algorithm. We recommend using
    names found in Go Lang Crypto library. See https://github.com/golang/go/blob/go1.14/src/crypto/x509/x509.go#L337-L353.
  name: x509.signature_algorithm
  type: keyword

x509.subject.distinguished_name:
  description: Distinguished name (DN) of the certificate subject entity.
  name: x509.subject.distinguished_name
  type: keyword

x509.version_number:
  description: Version of x509 format.
  name: x509.version_number
  type: keyword
