corelight.rdp.client_dig_product_id:
  description: Product identifier the RDP client reported.
  name: corelight.rdp.client_dig_product_id
  type: keyword

corelight.rdp.client_name:
  description: Machine name reported by the client.
  name: corelight.rdp.client_name
  type: keyword

corelight.rdp.cookie:
  description: Cookie sent in the connection request; it usually carries the account
    being used (mstshash).
  name: corelight.rdp.cookie
  type: keyword

corelight.rdp.desktop_height:
  description: Height of the requested desktop, in pixels.
  name: corelight.rdp.desktop_height
  type: long

corelight.rdp.desktop_width:
  description: Width of the requested desktop, in pixels.
  name: corelight.rdp.desktop_width
  type: long

corelight.rdp.encryption_level:
  description: Encryption level negotiated for the session.
  name: corelight.rdp.encryption_level
  type: keyword

corelight.rdp.encryption_method:
  description: Encryption method negotiated for the session.
  name: corelight.rdp.encryption_method
  type: keyword

corelight.rdp.inferences:
  description: Behavioural inferences Corelight drew from the session.
  name: corelight.rdp.inferences
  type: keyword

corelight.rdp.keyboard_layout:
  description: Keyboard layout advertised by the client, which hints at its locale.
  name: corelight.rdp.keyboard_layout
  type: keyword

corelight.rdp.rdfp_hash:
  description: Corelight RDP fingerprint (RDFP) of the client.
  name: corelight.rdp.rdfp_hash
  type: keyword

corelight.rdp.rdfp_string:
  description: Raw string the RDP fingerprint is computed from.
  name: corelight.rdp.rdfp_string
  type: keyword

corelight.rdp.requested_color_depth:
  description: Colour depth the client asked for.
  name: corelight.rdp.requested_color_depth
  type: keyword

corelight.rdp.result:
  description: Outcome reported for the connection request, e.g. encrypted, success,
    failure.
  name: corelight.rdp.result
  type: keyword

corelight.rdp.security_protocol:
  description: Security protocol selected for the session, e.g. HYBRID, SSL, RDP.
  name: corelight.rdp.security_protocol
  type: keyword

corelight.s7comm.error_class:
  description: Class of the error returned by the PLC, 0 when there is none.
  name: corelight.s7comm.error_class
  type: long

corelight.s7comm.error_code:
  description: Code of the error returned by the PLC, 0 when there is none.
  name: corelight.s7comm.error_code
  type: long

corelight.s7comm.function_code:
  description: Numeric S7comm function code.
  name: corelight.s7comm.function_code
  type: long

corelight.s7comm.function_name:
  description: S7comm function invoked, e.g. read-var or download-block.
  name: corelight.s7comm.function_name
  type: keyword

corelight.s7comm.is_orig:
  description: Whether the message was sent by the originator of the connection.
  name: corelight.s7comm.is_orig
  type: boolean

corelight.s7comm.pdu_reference:
  description: Reference linking an S7comm request to its reply.
  name: corelight.s7comm.pdu_reference
  type: long

corelight.s7comm.rosctr_code:
  description: Numeric S7comm remote operating service control code.
  name: corelight.s7comm.rosctr_code
  type: long

corelight.s7comm.rosctr_name:
  description: S7comm message class, e.g. job, ack-data or userdata.
  name: corelight.s7comm.rosctr_name
  type: keyword

corelight.s7comm.subfunction_code:
  description: Numeric S7comm subfunction code.
  name: corelight.s7comm.subfunction_code
  type: long

corelight.s7comm.subfunction_name:
  description: S7comm subfunction invoked, when the function has one.
  name: corelight.s7comm.subfunction_name
  type: keyword

corelight.smb_files.data_len_req:
  description: Number of bytes requested by the client.
  name: corelight.smb_files.data_len_req
  type: long

corelight.smb_files.data_offset_req:
  description: Offset requested by the client in the file.
  name: corelight.smb_files.data_offset_req
  type: long

corelight.smb_files.previous_name:
  description: Name the file had before it was renamed.
  name: corelight.smb_files.previous_name
  type: keyword

corelight.smb_mapping.native_file_system:
  description: File system backing the share.
  name: corelight.smb_mapping.native_file_system
  type: keyword

corelight.smb_mapping.object_path:
  description: Share the client mapped.
  name: corelight.smb_mapping.object_path
  type: keyword

corelight.smb_mapping.path:
  description: Share the client mapped, as reported by sensors that use the "path"
    field name.
  name: corelight.smb_mapping.path
  type: keyword

corelight.smb_mapping.service:
  description: Service the share exposes, as announced by the server.
  name: corelight.smb_mapping.service
  type: keyword

corelight.smb_mapping.share_type:
  description: 'Type of share: DISK, PIPE or PRINT.'
  name: corelight.smb_mapping.share_type
  type: keyword

corelight.smtp.date:
  description: 'Date: header of the message, kept verbatim in its RFC 5322 form.'
  name: corelight.smtp.date
  type: keyword

corelight.smtp.domains:
  description: Domains found in the message body.
  name: corelight.smtp.domains
  type: keyword

corelight.smtp.first_received:
  description: First Received header of the mail, in its RFC 5322 form.
  name: corelight.smtp.first_received
  type: keyword

corelight.smtp.fuids:
  description: Zeek file identifiers of the attachments carried by the message.
  name: corelight.smtp.fuids
  type: keyword

corelight.smtp.helo:
  description: Argument of the HELO or EHLO command sent by the client.
  name: corelight.smtp.helo
  type: keyword

corelight.smtp.in_reply_to:
  description: Message the mail replies to, from the In-Reply-To header.
  name: corelight.smtp.in_reply_to
  type: keyword

corelight.smtp.is_webmail:
  description: Whether the message was submitted through a webmail interface.
  name: corelight.smtp.is_webmail
  type: boolean

corelight.smtp.last_reply:
  description: Last server reply seen in the SMTP transaction.
  name: corelight.smtp.last_reply
  type: keyword

corelight.smtp.path:
  description: 'Chain of hosts the message transited through, read from the Received:
    headers.'
  name: corelight.smtp.path
  type: keyword

corelight.smtp.rcptto:
  description: Envelope recipients of the message, from the RCPT TO commands.
  name: corelight.smtp.rcptto
  type: keyword

corelight.smtp.second_received:
  description: Second Received header of the mail, in its RFC 5322 form.
  name: corelight.smtp.second_received
  type: keyword

corelight.smtp.trans_depth:
  description: Rank of the transaction inside the SMTP connection.
  name: corelight.smtp.trans_depth
  type: long

corelight.smtp.urls:
  description: URLs found in the message body.
  name: corelight.smtp.urls
  type: keyword

corelight.smtp.x_originating_ip:
  description: Address carried by the X-Originating-IP header.
  name: corelight.smtp.x_originating_ip
  type: ip

corelight.snmp.community:
  description: Community string used, which acts as the shared secret in SNMP v1 and
    v2c.
  name: corelight.snmp.community
  type: keyword

corelight.snmp.display_string:
  description: sysDescr string returned by the agent, which identifies the device.
  name: corelight.snmp.display_string
  type: keyword

corelight.snmp.get_bulk_requests:
  description: Number of GetBulk requests seen.
  name: corelight.snmp.get_bulk_requests
  type: long

corelight.snmp.get_requests:
  description: Number of Get requests seen.
  name: corelight.snmp.get_requests
  type: long

corelight.snmp.get_responses:
  description: Number of responses seen.
  name: corelight.snmp.get_responses
  type: long

corelight.snmp.set_requests:
  description: Number of Set requests seen, which write to the device.
  name: corelight.snmp.set_requests
  type: long

corelight.snmp.up_since:
  description: Time the agent reports having been up since.
  name: corelight.snmp.up_since
  type: date

corelight.snmp.version:
  description: 'SNMP version used: 1, 2c or 3.'
  name: corelight.snmp.version
  type: keyword

corelight.software.host:
  description: Host the software was observed on, as it appeared in the traffic.
  name: corelight.software.host
  type: keyword

corelight.software.port:
  description: Port the software was observed on.
  name: corelight.software.port
  type: long

corelight.software.type:
  description: Category Zeek assigned to the software, e.g. HTTP::SERVER, HTTP::BROWSER.
  name: corelight.software.type
  type: keyword

corelight.software.unparsed_version:
  description: Version banner as seen in the traffic, before parsing.
  name: corelight.software.unparsed_version
  type: keyword

corelight.software.version.addl:
  description: Additional version information, e.g. the distribution name.
  name: corelight.software.version.addl
  type: keyword

corelight.software.version.major:
  description: Major version number.
  name: corelight.software.version.major
  type: long

corelight.software.version.minor:
  description: Minor version number.
  name: corelight.software.version.minor
  type: long

corelight.software.version.minor2:
  description: Third version number.
  name: corelight.software.version.minor2
  type: long

corelight.software.version.minor3:
  description: Fourth version number.
  name: corelight.software.version.minor3
  type: long

corelight.ssh.auth_attempts:
  description: Number of authentication attempts Zeek observed on the SSH session.
  name: corelight.ssh.auth_attempts
  type: long

corelight.ssh.cipher_alg:
  description: Symmetric cipher negotiated for the SSH session, e.g. chacha20-poly1305@openssh.com.
  name: corelight.ssh.cipher_alg
  type: keyword

corelight.ssh.client:
  description: SSH client version string, e.g. SSH-2.0-OpenSSH_9.0.
  name: corelight.ssh.client
  type: keyword

corelight.ssh.client_host_key_algorithms:
  description: Host key algorithms the client accepts.
  name: corelight.ssh.client_host_key_algorithms
  type: keyword

corelight.ssh.compression_alg:
  description: Compression algorithm negotiated for the SSH session.
  name: corelight.ssh.compression_alg
  type: keyword

corelight.ssh.hassh:
  description: HASSH fingerprint of the SSH client, derived from its algorithm offer.
    Identifies the client implementation even when the version string is spoofed.
  name: corelight.ssh.hassh
  type: keyword

corelight.ssh.hassh_algorithms:
  description: Algorithm list the client offered, from which its HASSH is computed.
  name: corelight.ssh.hassh_algorithms
  type: keyword

corelight.ssh.hassh_server:
  description: HASSH fingerprint of the SSH server (hasshServer).
  name: corelight.ssh.hassh_server
  type: keyword

corelight.ssh.hassh_server_algorithms:
  description: Algorithm list the server offered, from which its HASSH is computed.
  name: corelight.ssh.hassh_server_algorithms
  type: keyword

corelight.ssh.hassh_version:
  description: Version of the HASSH algorithm used to compute the fingerprints.
  name: corelight.ssh.hassh_version
  type: keyword

corelight.ssh.host_key:
  description: Fingerprint of the SSH server host key. A change on a known server
    is a man-in-the-middle signal.
  name: corelight.ssh.host_key
  type: keyword

corelight.ssh.host_key_alg:
  description: Algorithm of the SSH server host key, e.g. ssh-ed25519, ssh-rsa.
  name: corelight.ssh.host_key_alg
  type: keyword

corelight.ssh.inferences:
  description: Behavioural inferences Corelight drew from the session.
  name: corelight.ssh.inferences
  type: keyword

corelight.ssh.kex_alg:
  description: Key exchange algorithm negotiated for the SSH session.
  name: corelight.ssh.kex_alg
  type: keyword

corelight.ssh.mac_alg:
  description: Message authentication algorithm negotiated for the SSH session.
  name: corelight.ssh.mac_alg
  type: keyword

corelight.ssh.server:
  description: SSH server version string, e.g. SSH-2.0-OpenSSH_8.9p1.
  name: corelight.ssh.server
  type: keyword

corelight.ssh.server_host_key_algorithms:
  description: Host key algorithms the server offers.
  name: corelight.ssh.server_host_key_algorithms
  type: keyword

corelight.ssh.version:
  description: SSH protocol version, 1 or 2.
  name: corelight.ssh.version
  type: long

corelight.ssl.validation_status:
  description: TLS certificate chain validation status (e.g. ok, self signed certificate,
    unable to get local issuer certificate).
  name: corelight.ssl.validation_status
  type: keyword

corelight.tunnel.action:
  description: What Zeek observed about the tunnel, e.g. Tunnel::DISCOVER, Tunnel::CLOSE.
  name: corelight.tunnel.action
  type: keyword

corelight.tunnel.tunnel_type:
  description: Encapsulation in use, e.g. Tunnel::TEREDO, Tunnel::GRE, Tunnel::IP.
  name: corelight.tunnel.tunnel_type
  type: keyword

corelight.uid:
  description: Zeek connection unique identifier (uid), used to pivot across logs.
  name: corelight.uid
  type: keyword

corelight.uids:
  description: Zeek connection identifiers the entry was observed on.
  name: corelight.uids
  type: keyword

corelight.weird.addl:
  description: Additional context about the anomaly.
  name: corelight.weird.addl
  type: keyword

corelight.weird.name:
  description: Identifier of the protocol anomaly Zeek detected, e.g. JA3_repeat_different.
  name: corelight.weird.name
  type: keyword

corelight.weird.notice:
  description: Whether the anomaly was also raised as a notice.
  name: corelight.weird.notice
  type: boolean

corelight.weird.peer:
  description: Zeek worker that reported the anomaly.
  name: corelight.weird.peer
  type: keyword

corelight.x509.basic_constraints_ca:
  description: Whether the basic constraints extension marks the certificate as a
    CA.
  name: corelight.x509.basic_constraints_ca
  type: boolean

corelight.x509.basic_constraints_path_length:
  description: Path length constraint carried by the certificate's basic constraints
    extension.
  name: corelight.x509.basic_constraints_path_length
  type: long

corelight.x509.client_cert:
  description: Whether the certificate was presented by the client.
  name: corelight.x509.client_cert
  type: boolean

corelight.x509.host_cert:
  description: Whether the certificate belongs to the host it was presented for.
  name: corelight.x509.host_cert
  type: boolean

corelight.x509.key_type:
  description: 'Family of the public key: rsa, dsa or ecdsa.'
  name: corelight.x509.key_type
  type: keyword

corelight.x509.san_email:
  description: Email addresses listed in the certificate's subject alternative names.
  name: corelight.x509.san_email
  type: keyword

corelight.x509.san_ip:
  description: Addresses listed in the certificate's subject alternative names.
  name: corelight.x509.san_ip
  type: ip

corelight.x509.san_uri:
  description: URIs listed in the certificate's subject alternative names.
  name: corelight.x509.san_uri
  type: keyword

x509.alternative_names:
  description: List of subject alternative names (SAN). Name types vary by certificate
    authority and certificate type but commonly contain IP addresses, DNS names (and
    wildcards), and email addresses.
  name: x509.alternative_names
  type: keyword

x509.issuer.distinguished_name:
  description: Distinguished name (DN) of issuing certificate authority.
  name: x509.issuer.distinguished_name
  type: keyword

x509.not_after:
  description: Time at which the certificate is no longer considered valid.
  name: x509.not_after
  type: date

x509.not_before:
  description: Time at which the certificate is first considered valid.
  name: x509.not_before
  type: date

x509.public_key_algorithm:
  description: Algorithm used to generate the public key.
  name: x509.public_key_algorithm
  type: keyword

x509.public_key_exponent:
  description: Exponent used to derive the public key. This is algorithm specific.
  name: x509.public_key_exponent
  type: long

x509.public_key_size:
  description: The size of the public key space in bits.
  name: x509.public_key_size
  type: long

x509.serial_number:
  description: Unique serial number issued by the certificate authority. For consistency,
    if this value is alphanumeric, it should be formatted without colons and uppercase
    characters.
  name: x509.serial_number
  type: keyword

x509.signature_algorithm:
  description: Identifier for certificate signature algorithm. We recommend using
    names found in Go Lang Crypto library. See https://github.com/golang/go/blob/go1.14/src/crypto/x509/x509.go#L337-L353.
  name: x509.signature_algorithm
  type: keyword

x509.subject.distinguished_name:
  description: Distinguished name (DN) of the certificate subject entity.
  name: x509.subject.distinguished_name
  type: keyword

x509.version_number:
  description: Version of x509 format.
  name: x509.version_number
  type: keyword
