name: corelight
pipeline:
  - name: json_event
    external:
      name: json.parse-json
      properties:
        input_field: "{{original.message}}"
        output_field: message

  - name: parsed_date
    external:
      name: date.parse
      properties:
        # Corelight Zeek logs carry the event time in "ts"; the export adds "_write_ts".
        input_field: '{{json_event.message.get("ts") or json_event.message.get("_write_ts")}}'
        output_field: datetime
        format: null
        timezone: UTC

  # ---- routing per Corelight log type (Zeek "_path") ----
  - name: set_common_fields
  - name: set_conn_fields
    filter: '{{json_event.message.get("_path") == "conn"}}'
  - name: set_dns_fields
    filter: '{{json_event.message.get("_path") == "dns"}}'
  - name: set_http_fields
    filter: '{{json_event.message.get("_path") == "http"}}'
  - name: set_ssl_fields
    filter: '{{json_event.message.get("_path") == "ssl"}}'
  - name: set_files_fields
    filter: '{{json_event.message.get("_path") == "files"}}'
  - name: set_suricata_fields
    filter: '{{json_event.message.get("_path") == "suricata_corelight"}}'
  - name: set_intel_fields
    filter: '{{json_event.message.get("_path") == "intel"}}'
  - name: set_notice_fields
    filter: '{{json_event.message.get("_path") == "notice"}}'
  - name: set_ssh_fields
    filter: '{{json_event.message.get("_path") == "ssh"}}'
  - name: set_kerberos_fields
    filter: '{{json_event.message.get("_path") == "kerberos"}}'
  - name: set_ntlm_fields
    filter: '{{json_event.message.get("_path") == "ntlm"}}'
  - name: set_ldap_fields
    filter: '{{json_event.message.get("_path") == "ldap"}}'
  - name: set_ldap_search_fields
    filter: '{{json_event.message.get("_path") == "ldap_search"}}'
  - name: set_dce_rpc_fields
    filter: '{{json_event.message.get("_path") == "dce_rpc"}}'
  - name: set_smtp_fields
    filter: '{{json_event.message.get("_path") == "smtp"}}'
  - name: set_smtp_links_fields
    filter: '{{json_event.message.get("_path") == "smtp_links"}}'
  - name: set_smb_files_fields
    filter: '{{json_event.message.get("_path") == "smb_files"}}'
  - name: set_smb_mapping_fields
    filter: '{{json_event.message.get("_path") == "smb_mapping"}}'
  - name: set_ftp_fields
    filter: '{{json_event.message.get("_path") == "ftp"}}'
  - name: set_x509_fields
    filter: '{{json_event.message.get("_path") == "x509"}}'
  - name: set_pe_fields
    filter: '{{json_event.message.get("_path") == "pe"}}'

stages:
  # ----------------------------------------------------------------
  # Fields common to every Corelight log
  # ----------------------------------------------------------------
  set_common_fields:
    actions:
      - set:
          "@timestamp": "{{parsed_date.datetime}}"
          observer.vendor: "Corelight"
          observer.product: "Open NDR"
          observer.type: "ndr"
          event.dataset: '{{json_event.message.get("_path")}}'
          event.module: "corelight"
          network.community_id: '{{json_event.message.get("community_id")}}'
          source.ip: '{{json_event.message.get("id.orig_h")}}'
          source.port: '{{json_event.message.get("id.orig_p")}}'
          destination.ip: '{{json_event.message.get("id.resp_h")}}'
          destination.port: '{{json_event.message.get("id.resp_p")}}'
          observer.name: '{{json_event.message.get("_system_name")}}'
      - set:
          event.category: ["network"]
          event.type: ["connection"]

  # ----------------------------------------------------------------
  # conn.log
  # ----------------------------------------------------------------
  set_conn_fields:
    actions:
      - set:
          network.transport: '{{json_event.message.get("proto")}}'
          network.protocol: '{{json_event.message.get("service")}}'
          source.bytes: '{{json_event.message.get("orig_bytes")}}'
          destination.bytes: '{{json_event.message.get("resp_bytes")}}'
          corelight.conn.state: '{{json_event.message.get("conn_state")}}'
          corelight.conn.history: '{{json_event.message.get("history")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      # Zeek duration is in seconds; ECS event.duration is in nanoseconds.
      # Guard: only set when present and numeric (Zeek may emit "-" or omit it).
      - set:
          event.duration: '{{(json_event.message.get("duration") | float * 1000000000) | int}}'
        filter: '{{json_event.message.get("duration") not in [None, "-"]}}'
      # Native Corelight entity enrichment (role / user / location)
      - set:
          source.user.name: '{{json_event.message.get("enrichment_orig.user")}}'
        filter: '{{json_event.message.get("enrichment_orig.user") != None}}'
      - set:
          source.user.roles: '["{{json_event.message.get("enrichment_orig.role")}}"]'
        filter: '{{json_event.message.get("enrichment_orig.role") != None}}'
      - set:
          source.geo.name: '{{json_event.message.get("enrichment_orig.city_location")}}'
        filter: '{{json_event.message.get("enrichment_orig.city_location") != None}}'

  # ----------------------------------------------------------------
  # dns.log
  # ----------------------------------------------------------------
  set_dns_fields:
    actions:
      - set:
          dns.question.name: '{{json_event.message.get("query")}}'
          dns.question.type: '{{json_event.message.get("qtype_name")}}'
          dns.response_code: '{{json_event.message.get("rcode_name")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          dns.answers: >
            [
                {% for item in json_event.message.get("answers") %}
                {"data": "{{item}}"},
                {% endfor %}
            ]
        filter: '{{json_event.message.get("answers") != None}}'

  # ----------------------------------------------------------------
  # http.log
  # ----------------------------------------------------------------
  set_http_fields:
    actions:
      - set:
          url.domain: '{{json_event.message.get("host")}}'
          url.path: '{{json_event.message.get("uri")}}'
          http.request.method: '{{json_event.message.get("method")}}'
          http.response.status_code: '{{json_event.message.get("status_code")}}'
          http.request.body.bytes: '{{json_event.message.get("request_body_len")}}'
          http.response.body.bytes: '{{json_event.message.get("response_body_len")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          user_agent.original: '{{json_event.message.get("user_agent")}}'
        filter: '{{json_event.message.get("user_agent") != None}}'

  # ----------------------------------------------------------------
  # ssl.log
  # ----------------------------------------------------------------
  set_ssl_fields:
    actions:
      - set:
          tls.version: '{{json_event.message.get("version")}}'
          tls.cipher: '{{json_event.message.get("cipher")}}'
          tls.curve: '{{json_event.message.get("curve")}}'
          tls.client.server_name: '{{json_event.message.get("server_name")}}'
          tls.client.ja3: '{{json_event.message.get("ja3")}}'
          tls.server.ja3s: '{{json_event.message.get("ja3s")}}'
          tls.established: '{{json_event.message.get("established")}}'
          corelight.ssl.validation_status: '{{json_event.message.get("validation_status")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'

  # ----------------------------------------------------------------
  # files.log
  # ----------------------------------------------------------------
  set_files_fields:
    actions:
      - set:
          file.hash.md5: '{{json_event.message.get("md5")}}'
          file.hash.sha1: '{{json_event.message.get("sha1")}}'
          file.hash.sha256: '{{json_event.message.get("sha256")}}'
          file.mime_type: '{{json_event.message.get("mime_type")}}'
          file.size: '{{json_event.message.get("seen_bytes")}}'
          corelight.files.source: '{{json_event.message.get("source")}}'
      - set:
          event.category: ["file"]
          event.type: ["info"]

  # ----------------------------------------------------------------
  # suricata_corelight (IDS alerts)
  # Note: alert fields are flat keys ("alert.signature", not nested).
  # ----------------------------------------------------------------
  set_suricata_fields:
    actions:
      - set:
          rule.name: '{{json_event.message.get("alert.signature")}}'
          rule.category: '{{json_event.message.get("alert.category")}}'
          rule.id: '{{json_event.message.get("alert.signature_id")}}'
          event.severity: '{{json_event.message.get("alert.severity")}}'
          action.name: '{{json_event.message.get("alert.action")}}'
          event.action: '{{json_event.message.get("alert.action")}}'
          network.protocol: '{{json_event.message.get("service")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.kind: "alert"
          event.category: ["intrusion_detection"]
          event.type: ["info"]

  # ----------------------------------------------------------------
  # intel.log (Zeek Intelligence Framework matches)
  # ----------------------------------------------------------------
  set_intel_fields:
    actions:
      - set:
          threat.indicator.name: '{{json_event.message.get("seen.indicator")}}'
          threat.indicator.type: '{{json_event.message.get("seen.indicator_type")}}'
          corelight.intel.where: '{{json_event.message.get("seen.where")}}'
          corelight.intel.sources: '{{json_event.message.get("sources")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.kind: "enrichment"
          event.category: ["threat"]
          event.type: ["indicator"]

  # ----------------------------------------------------------------
  # notice.log
  # ----------------------------------------------------------------
  set_notice_fields:
    actions:
      # Do NOT overwrite the top-level `message` field (the raw event is kept
      # for every other log type); expose the notice text as a dedicated field.
      - set:
          rule.name: '{{json_event.message.get("note")}}'
          corelight.notice.message: '{{json_event.message.get("msg")}}'
          corelight.notice.sub: '{{json_event.message.get("sub")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.kind: "alert"
          event.type: ["info"]

  # ----------------------------------------------------------------
  # ssh.log
  # ----------------------------------------------------------------
  set_ssh_fields:
    actions:
      - set:
          network.protocol: "ssh"
          corelight.ssh.client: '{{json_event.message.get("client")}}'
          corelight.ssh.server: '{{json_event.message.get("server")}}'
          corelight.ssh.version: '{{json_event.message.get("version")}}'
          corelight.ssh.cipher_alg: '{{json_event.message.get("cipher_alg")}}'
          corelight.ssh.kex_alg: '{{json_event.message.get("kex_alg")}}'
          corelight.ssh.mac_alg: '{{json_event.message.get("mac_alg")}}'
          corelight.ssh.compression_alg: '{{json_event.message.get("compression_alg")}}'
          corelight.ssh.host_key: '{{json_event.message.get("host_key")}}'
          corelight.ssh.host_key_alg: '{{json_event.message.get("host_key_alg")}}'
          corelight.ssh.hassh: '{{json_event.message.get("hassh")}}'
          corelight.ssh.hassh_server: '{{json_event.message.get("hasshServer")}}'
          corelight.ssh.auth_attempts: '{{json_event.message.get("auth_attempts")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]
      # Zeek reports the direction as INBOUND/OUTBOUND; ECS expects it lowercase.
      - set:
          network.direction: '{{json_event.message.get("direction") | lower}}'
        filter: '{{json_event.message.get("direction") != None}}'
      # auth_success is only present once the SSH authentication has been observed;
      # the log is also written for sessions where Zeek could not determine it.
      - set:
          event.category: ["network", "authentication"]
          event.outcome: "success"
        filter: '{{json_event.message.get("auth_success") == True}}'
      - set:
          event.category: ["network", "authentication"]
          event.outcome: "failure"
        filter: '{{json_event.message.get("auth_success") == False}}'

  # ----------------------------------------------------------------
  # kerberos.log
  # ----------------------------------------------------------------
  set_kerberos_fields:
    actions:
      - set:
          network.protocol: "kerberos"
          event.action: '{{json_event.message.get("request_type")}}'
          corelight.kerberos.request_type: '{{json_event.message.get("request_type")}}'
          corelight.kerberos.service: '{{json_event.message.get("service")}}'
          corelight.kerberos.cipher: '{{json_event.message.get("cipher")}}'
          corelight.kerberos.forwardable: '{{json_event.message.get("forwardable")}}'
          corelight.kerberos.renewable: '{{json_event.message.get("renewable")}}'
          corelight.kerberos.till: '{{json_event.message.get("till")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.category: ["network", "authentication"]
          event.type: ["connection", "protocol"]
      # Zeek reports the principal as "name/realm"; ECS keeps the two apart.
      - set:
          source.user.name: '{{json_event.message.get("client").split("/")[0]}}'
          source.user.domain: '{{json_event.message.get("client").split("/")[1]}}'
        filter: '{{json_event.message.get("client") != None and "/" in json_event.message.get("client")}}'
      - set:
          source.user.name: '{{json_event.message.get("client")}}'
        filter: '{{json_event.message.get("client") != None and "/" not in json_event.message.get("client")}}'
      - set:
          event.outcome: "success"
        filter: '{{json_event.message.get("success") == True}}'
      - set:
          event.outcome: "failure"
        filter: '{{json_event.message.get("success") == False}}'
      - set:
          corelight.kerberos.error_message: '{{json_event.message.get("error_msg")}}'
        filter: '{{json_event.message.get("error_msg") != None}}'

  # ----------------------------------------------------------------
  # ntlm.log
  # ----------------------------------------------------------------
  set_ntlm_fields:
    actions:
      - set:
          network.protocol: "ntlm"
          source.user.name: '{{json_event.message.get("username")}}'
          source.user.domain: '{{json_event.message.get("domainname")}}'
          source.domain: '{{json_event.message.get("hostname")}}'
          destination.domain: '{{json_event.message.get("server_nb_computer_name")}}'
          corelight.ntlm.server_dns_computer_name: '{{json_event.message.get("server_dns_computer_name")}}'
          corelight.ntlm.server_tree_name: '{{json_event.message.get("server_tree_name")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.category: ["network", "authentication"]
          event.type: ["connection", "protocol"]
      - set:
          event.outcome: "success"
        filter: '{{json_event.message.get("success") == True}}'
      - set:
          event.outcome: "failure"
        filter: '{{json_event.message.get("success") == False}}'

  # ----------------------------------------------------------------
  # ldap.log
  # ----------------------------------------------------------------
  set_ldap_fields:
    actions:
      - set:
          network.protocol: "ldap"
          event.action: '{{json_event.message.get("opcode")}}'
          corelight.ldap.opcode: '{{json_event.message.get("opcode")}}'
          corelight.ldap.result: '{{json_event.message.get("result")}}'
          corelight.ldap.object: '{{json_event.message.get("object")}}'
          corelight.ldap.argument: '{{json_event.message.get("argument")}}'
          corelight.ldap.message_id: '{{json_event.message.get("message_id")}}'
          corelight.ldap.version: '{{json_event.message.get("version")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]
      # Only a bind is an authentication attempt; searches, modifies and the rest
      # are directory operations.
      - set:
          event.category: ["network", "authentication"]
        filter: '{{json_event.message.get("opcode") != None and "bind" in json_event.message.get("opcode")}}'
      - set:
          event.outcome: "success"
        filter: '{{json_event.message.get("result") == "success"}}'
      - set:
          event.outcome: "failure"
        filter: '{{json_event.message.get("result") not in [None, "success"]}}'

  # ----------------------------------------------------------------
  # ldap_search.log
  # ----------------------------------------------------------------
  set_ldap_search_fields:
    actions:
      - set:
          network.protocol: "ldap"
          event.action: '{{json_event.message.get("opcode")}}'
          corelight.ldap.opcode: '{{json_event.message.get("opcode")}}'
          corelight.ldap.result: '{{json_event.message.get("result")}}'
          corelight.ldap.message_id: '{{json_event.message.get("message_id")}}'
          corelight.ldap_search.base_object: '{{json_event.message.get("base_object")}}'
          corelight.ldap_search.scope: '{{json_event.message.get("scope")}}'
          corelight.ldap_search.deref_aliases: '{{json_event.message.get("deref_aliases")}}'
          corelight.ldap_search.filter: '{{json_event.message.get("filter")}}'
          corelight.ldap_search.result_count: '{{json_event.message.get("result_count")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]

  # ----------------------------------------------------------------
  # dce_rpc.log
  # ----------------------------------------------------------------
  set_dce_rpc_fields:
    actions:
      - set:
          network.protocol: "dce_rpc"
          event.action: '{{json_event.message.get("operation")}}'
          corelight.dce_rpc.endpoint: '{{json_event.message.get("endpoint")}}'
          corelight.dce_rpc.operation: '{{json_event.message.get("operation")}}'
          corelight.dce_rpc.named_pipe: '{{json_event.message.get("named_pipe")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]

  # ----------------------------------------------------------------
  # smtp.log
  # ----------------------------------------------------------------
  set_smtp_fields:
    actions:
      - set:
          network.protocol: "smtp"
          # ECS models the email fieldset on the RFC 5322 headers: email.from
          # and email.to carry the From: and To: headers, while email.sender
          # carries the envelope MAIL FROM. The envelope recipients have no ECS
          # field of their own and stay namespaced.
          email.from.address: '{{json_event.message.get("from")}}'
          email.to.address: '{{json_event.message.get("to")}}'
          email.sender.address: '{{json_event.message.get("mailfrom")}}'
          email.subject: '{{json_event.message.get("subject")}}'
          corelight.smtp.rcptto: '{{json_event.message.get("rcptto")}}'
          tls.established: '{{json_event.message.get("tls")}}'
          # Zeek emits the Date header verbatim (RFC 5322), not an ISO timestamp,
          # so it is kept as text rather than mapped onto a date field.
          corelight.smtp.date: '{{json_event.message.get("date")}}'
          corelight.smtp.helo: '{{json_event.message.get("helo")}}'
          corelight.smtp.last_reply: '{{json_event.message.get("last_reply")}}'
          corelight.smtp.trans_depth: '{{json_event.message.get("trans_depth")}}'
          corelight.smtp.is_webmail: '{{json_event.message.get("is_webmail")}}'
          corelight.smtp.path: '{{json_event.message.get("path")}}'
          corelight.smtp.fuids: '{{json_event.message.get("fuids")}}'
          corelight.smtp.urls: '{{json_event.message.get("urls")}}'
          corelight.smtp.domains: '{{json_event.message.get("domains")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.category: ["email"]
          event.type: ["info"]

  # ----------------------------------------------------------------
  # smtp_links.log (one event per URL found in a message body)
  # ----------------------------------------------------------------
  set_smtp_links_fields:
    actions:
      - set:
          network.protocol: "smtp"
          url.original: '{{json_event.message.get("link")}}'
          url.domain: '{{json_event.message.get("domain")}}'
          corelight.fuid: '{{json_event.message.get("fuid")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.category: ["email"]
          event.type: ["info"]

  # ----------------------------------------------------------------
  # smb_files.log
  # ----------------------------------------------------------------
  set_smb_files_fields:
    actions:
      - set:
          network.protocol: "smb"
          # `object_path` is the share, `name` the path of the file inside it.
          file.directory: '{{json_event.message.get("object_path")}}'
          file.name: '{{json_event.message.get("name")}}'
          file.size: '{{json_event.message.get("size")}}'
          file.mtime: '{{json_event.message.get("times.modified")}}'
          file.accessed: '{{json_event.message.get("times.accessed")}}'
          file.created: '{{json_event.message.get("times.created")}}'
          file.ctime: '{{json_event.message.get("times.changed")}}'
          corelight.smb_files.data_offset_req: '{{json_event.message.get("data_offset_req")}}'
          corelight.smb_files.data_len_req: '{{json_event.message.get("data_len_req")}}'
          corelight.fuid: '{{json_event.message.get("fuid")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.category: ["file", "network"]
          event.type: ["info"]
      # Zeek qualifies the action as "SMB::FILE_WRITE"; ECS event.action is
      # lowercase and unprefixed.
      - set:
          event.action: '{{json_event.message.get("action").split("::")[-1] | lower}}'
        filter: '{{json_event.message.get("action") != None}}'
      - set:
          event.type: ["change"]
        filter: '{{json_event.message.get("action") in ["SMB::FILE_WRITE", "SMB::FILE_RENAME", "SMB::FILE_SET_ATTRIBUTE"]}}'
      - set:
          event.type: ["access"]
        filter: '{{json_event.message.get("action") in ["SMB::FILE_OPEN", "SMB::FILE_READ"]}}'
      - set:
          event.type: ["deletion"]
        filter: '{{json_event.message.get("action") == "SMB::FILE_DELETE"}}'

  # ----------------------------------------------------------------
  # smb_mapping.log (share tree connects)
  # ----------------------------------------------------------------
  set_smb_mapping_fields:
    actions:
      - set:
          network.protocol: "smb"
          corelight.smb_mapping.object_path: '{{json_event.message.get("object_path")}}'
          corelight.smb_mapping.service: '{{json_event.message.get("service")}}'
          corelight.smb_mapping.native_file_system: '{{json_event.message.get("native_file_system")}}'
          corelight.smb_mapping.share_type: '{{json_event.message.get("share_type")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]

  # ----------------------------------------------------------------
  # ftp.log
  # Note: Zeek also logs the plaintext password. It is deliberately not
  # mapped, to keep credentials out of the parsed event.
  # ----------------------------------------------------------------
  set_ftp_fields:
    actions:
      - set:
          network.protocol: "ftp"
          source.user.name: '{{json_event.message.get("user")}}'
          corelight.ftp.arg: '{{json_event.message.get("arg")}}'
          corelight.ftp.reply_code: '{{json_event.message.get("reply_code")}}'
          corelight.ftp.reply_msg: '{{json_event.message.get("reply_msg")}}'
          corelight.ftp.data_channel.passive: '{{json_event.message.get("data_channel.passive")}}'
          corelight.ftp.data_channel.orig_h: '{{json_event.message.get("data_channel.orig_h")}}'
          corelight.ftp.data_channel.resp_h: '{{json_event.message.get("data_channel.resp_h")}}'
          corelight.ftp.data_channel.resp_p: '{{json_event.message.get("data_channel.resp_p")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]
      - set:
          event.action: '{{json_event.message.get("command") | lower}}'
        filter: '{{json_event.message.get("command") != None}}'
      # FTP reply codes follow the SMTP convention: 4xx and 5xx are failures.
      - set:
          event.outcome: "success"
        filter: '{{json_event.message.get("reply_code") != None and json_event.message.get("reply_code") | int < 400}}'
      - set:
          event.outcome: "failure"
        filter: '{{json_event.message.get("reply_code") != None and json_event.message.get("reply_code") | int >= 400}}'

  # ----------------------------------------------------------------
  # x509.log
  # Note: this log carries no connection tuple; it is joined to ssl.log
  # through the certificate fingerprint.
  # ----------------------------------------------------------------
  set_x509_fields:
    actions:
      - set:
          x509.version_number: '{{json_event.message.get("certificate.version")}}'
          x509.serial_number: '{{json_event.message.get("certificate.serial")}}'
          x509.subject.distinguished_name: '{{json_event.message.get("certificate.subject")}}'
          x509.issuer.distinguished_name: '{{json_event.message.get("certificate.issuer")}}'
          x509.not_before: '{{json_event.message.get("certificate.not_valid_before")}}'
          x509.not_after: '{{json_event.message.get("certificate.not_valid_after")}}'
          x509.public_key_algorithm: '{{json_event.message.get("certificate.key_alg")}}'
          x509.public_key_size: '{{json_event.message.get("certificate.key_length")}}'
          x509.public_key_exponent: '{{json_event.message.get("certificate.exponent")}}'
          x509.signature_algorithm: '{{json_event.message.get("certificate.sig_alg")}}'
          x509.alternative_names: '{{json_event.message.get("san.dns")}}'
          file.hash.sha256: '{{json_event.message.get("fingerprint")}}'
          corelight.x509.key_type: '{{json_event.message.get("certificate.key_type")}}'
          corelight.x509.basic_constraints_ca: '{{json_event.message.get("basic_constraints.ca")}}'
          corelight.x509.client_cert: '{{json_event.message.get("client_cert")}}'
          corelight.x509.host_cert: '{{json_event.message.get("host_cert")}}'
      - set:
          event.type: ["info"]

  # ----------------------------------------------------------------
  # pe.log (portable executable metadata)
  # Note: Zeek exposes none of the fields ECS defines under file.pe
  # (imphash, company, product), so everything stays namespaced.
  # ----------------------------------------------------------------
  set_pe_fields:
    actions:
      - set:
          corelight.pe.machine: '{{json_event.message.get("machine")}}'
          corelight.pe.compile_ts: '{{json_event.message.get("compile_ts")}}'
          corelight.pe.os: '{{json_event.message.get("os")}}'
          corelight.pe.subsystem: '{{json_event.message.get("subsystem")}}'
          corelight.pe.is_exe: '{{json_event.message.get("is_exe")}}'
          corelight.pe.is_64bit: '{{json_event.message.get("is_64bit")}}'
          corelight.pe.uses_aslr: '{{json_event.message.get("uses_aslr")}}'
          corelight.pe.uses_dep: '{{json_event.message.get("uses_dep")}}'
          corelight.pe.uses_code_integrity: '{{json_event.message.get("uses_code_integrity")}}'
          corelight.pe.uses_seh: '{{json_event.message.get("uses_seh")}}'
          corelight.pe.has_import_table: '{{json_event.message.get("has_import_table")}}'
          corelight.pe.has_export_table: '{{json_event.message.get("has_export_table")}}'
          corelight.pe.has_cert_table: '{{json_event.message.get("has_cert_table")}}'
          corelight.pe.has_debug_data: '{{json_event.message.get("has_debug_data")}}'
          corelight.pe.section_names: '{{json_event.message.get("section_names")}}'
          corelight.fuid: '{{json_event.message.get("id")}}'
      - set:
          event.category: ["file"]
          event.type: ["info"]
