name: corelight
pipeline:
  - name: json_event
    external:
      name: json.parse-json
      properties:
        # Part of the exports wrap the event in a one-element JSON array. The
        # brackets are stripped before parsing so that the rest of the pipeline
        # always sees an object.
        input_field: '{{ original.message | trim | trim("[]") }}'
        output_field: message

  - name: parsed_date
    external:
      name: date.parse
      properties:
        # Corelight Zeek logs carry the event time in "ts"; the export adds "_write_ts".
        input_field: '{{json_event.message.get("ts") or json_event.message.get("_write_ts")}}'
        output_field: datetime
        format: null
        timezone: UTC

  # ---- routing per Corelight log type (Zeek "_path") ----
  - name: set_common_fields
  # conn_long.log has the same schema as conn.log: it is the periodic report
  # the sensor writes for a connection that is still open.
  - name: set_conn_fields
    filter: '{{json_event.message.get("_path") in ["conn", "conn_long"]}}'
  - name: set_dns_fields
    filter: '{{json_event.message.get("_path") == "dns"}}'
  - name: set_http_fields
    filter: '{{json_event.message.get("_path") == "http"}}'
  - name: set_ssl_fields
    filter: '{{json_event.message.get("_path") == "ssl"}}'
  - name: set_files_fields
    filter: '{{json_event.message.get("_path") == "files"}}'
  - name: set_suricata_fields
    filter: '{{json_event.message.get("_path") == "suricata_corelight"}}'
  - name: set_intel_fields
    filter: '{{json_event.message.get("_path") == "intel"}}'
  - name: set_notice_fields
    filter: '{{json_event.message.get("_path") == "notice"}}'
  - name: set_ssh_fields
    filter: '{{json_event.message.get("_path") == "ssh"}}'
  - name: set_kerberos_fields
    filter: '{{json_event.message.get("_path") == "kerberos"}}'
  - name: set_ntlm_fields
    filter: '{{json_event.message.get("_path") == "ntlm"}}'
  - name: set_ldap_fields
    filter: '{{json_event.message.get("_path") == "ldap"}}'
  - name: set_ldap_search_fields
    filter: '{{json_event.message.get("_path") == "ldap_search"}}'
  - name: set_dce_rpc_fields
    filter: '{{json_event.message.get("_path") == "dce_rpc"}}'
  - name: set_smtp_fields
    filter: '{{json_event.message.get("_path") == "smtp"}}'
  - name: set_smtp_links_fields
    filter: '{{json_event.message.get("_path") == "smtp_links"}}'
  - name: set_smb_files_fields
    filter: '{{json_event.message.get("_path") == "smb_files"}}'
  - name: set_smb_mapping_fields
    filter: '{{json_event.message.get("_path") == "smb_mapping"}}'
  - name: set_ftp_fields
    filter: '{{json_event.message.get("_path") == "ftp"}}'
  - name: set_x509_fields
    filter: '{{json_event.message.get("_path") == "x509"}}'
  - name: set_pe_fields
    filter: '{{json_event.message.get("_path") == "pe"}}'
  - name: set_dhcp_fields
    filter: '{{json_event.message.get("_path") == "dhcp"}}'
  - name: set_rdp_fields
    filter: '{{json_event.message.get("_path") == "rdp"}}'
  - name: set_quic_fields
    filter: '{{json_event.message.get("_path") == "quic"}}'
  - name: set_ntp_fields
    filter: '{{json_event.message.get("_path") == "ntp"}}'
  - name: set_snmp_fields
    filter: '{{json_event.message.get("_path") == "snmp"}}'
  - name: set_mysql_fields
    filter: '{{json_event.message.get("_path") == "mysql"}}'
  - name: set_tunnel_fields
    filter: '{{json_event.message.get("_path") == "tunnel"}}'
  - name: set_ipsec_fields
    filter: '{{json_event.message.get("_path") == "ipsec"}}'
  - name: set_ocsp_fields
    filter: '{{json_event.message.get("_path") == "ocsp"}}'
  - name: set_encrypted_dns_fields
    filter: '{{json_event.message.get("_path") == "encrypted_dns"}}'
  - name: set_software_fields
    filter: '{{json_event.message.get("_path") == "software"}}'
  - name: set_known_users_fields
    filter: '{{json_event.message.get("_path") == "known_users"}}'
  - name: set_weird_fields
    filter: '{{json_event.message.get("_path") == "weird"}}'
  - name: set_dnp3_fields
    filter: '{{json_event.message.get("_path") == "dnp3"}}'
  - name: set_modbus_fields
    filter: '{{json_event.message.get("_path") == "modbus"}}'
  - name: set_s7comm_fields
    filter: '{{json_event.message.get("_path") == "s7comm"}}'
  - name: set_known_hosts_fields
    filter: '{{json_event.message.get("_path") == "known_hosts"}}'
  - name: set_known_services_fields
    filter: '{{json_event.message.get("_path") == "known_services"}}'
  - name: set_known_certs_fields
    filter: '{{json_event.message.get("_path") == "known_certs"}}'
  - name: set_known_domains_fields
    filter: '{{json_event.message.get("_path") == "known_domains"}}'
  - name: set_known_names_fields
    filter: '{{json_event.message.get("_path") == "known_names"}}'
  - name: set_known_devices_fields
    filter: '{{json_event.message.get("_path") == "known_devices"}}'
  - name: set_modbus_detailed_fields
    filter: '{{json_event.message.get("_path") == "modbus_detailed"}}'
  - name: set_modbus_rdi_fields
    filter: '{{json_event.message.get("_path") == "modbus_read_device_identification"}}'
  - name: set_cotp_fields
    filter: '{{json_event.message.get("_path") == "cotp"}}'
  - name: set_s7comm_read_szl_fields
    filter: '{{json_event.message.get("_path") == "s7comm_read_szl"}}'
  - name: set_dnp3_objects_fields
    filter: '{{json_event.message.get("_path") == "dnp3_objects"}}'
  - name: set_dnp3_control_fields
    filter: '{{json_event.message.get("_path") == "dnp3_control"}}'
  - name: set_enip_fields
    filter: '{{json_event.message.get("_path") == "enip"}}'
  - name: set_etc_viz_fields
    filter: '{{json_event.message.get("_path") == "etc_viz"}}'
  - name: set_analyzer_fields
    filter: '{{json_event.message.get("_path") == "analyzer"}}'
  - name: set_unknown_protocols_fields
    filter: '{{json_event.message.get("_path") == "unknown_protocols"}}'
  - name: set_generic_dns_tunnels_fields
    filter: '{{json_event.message.get("_path") == "generic_dns_tunnels"}}'

stages:
  # ----------------------------------------------------------------
  # Fields common to every Corelight log
  # ----------------------------------------------------------------
  set_common_fields:
    actions:
      - set:
          "@timestamp": "{{parsed_date.datetime}}"
          observer.vendor: "Corelight"
          observer.product: "Open NDR"
          observer.type: "ndr"
          event.dataset: '{{json_event.message.get("_path")}}'
          event.module: "corelight"
          network.community_id: '{{json_event.message.get("community_id")}}'
          source.ip: '{{json_event.message.get("id.orig_h")}}'
          source.port: '{{json_event.message.get("id.orig_p")}}'
          destination.ip: '{{json_event.message.get("id.resp_h")}}'
          destination.port: '{{json_event.message.get("id.resp_p")}}'
          observer.name: '{{json_event.message.get("_system_name")}}'
          observer.hostname: '{{json_event.message.get("_system_name")}}'
      - set:
          event.category: ["network"]
          event.type: ["connection"]

  # ----------------------------------------------------------------
  # conn.log
  # ----------------------------------------------------------------
  set_conn_fields:
    actions:
      - set:
          network.transport: '{{json_event.message.get("proto")}}'
          network.protocol: '{{json_event.message.get("service")}}'
          network.iana_number: '{{json_event.message.get("ip_proto")}}'
          source.bytes: '{{json_event.message.get("orig_bytes")}}'
          destination.bytes: '{{json_event.message.get("resp_bytes")}}'
          source.packets: '{{json_event.message.get("orig_pkts")}}'
          destination.packets: '{{json_event.message.get("resp_pkts")}}'
          source.mac: '{{json_event.message.get("orig_l2_addr")}}'
          destination.mac: '{{json_event.message.get("resp_l2_addr")}}'
          corelight.conn.state: '{{json_event.message.get("conn_state")}}'
          corelight.conn.history: '{{json_event.message.get("history")}}'
          corelight.conn.local_orig: '{{json_event.message.get("local_orig")}}'
          corelight.conn.local_resp: '{{json_event.message.get("local_resp")}}'
          corelight.conn.missed_bytes: '{{json_event.message.get("missed_bytes")}}'
          corelight.conn.orig_ip_bytes: '{{json_event.message.get("orig_ip_bytes")}}'
          corelight.conn.resp_ip_bytes: '{{json_event.message.get("resp_ip_bytes")}}'
          corelight.conn.tunnel_parents: '{{json_event.message.get("tunnel_parents")}}'
          # Suricata alerts raised on this connection; the join key back to
          # suricata_corelight.log.
          corelight.conn.suri_ids: '{{json_event.message.get("suri_ids")}}'
          # Smart PCAP: where the packets for this connection were saved.
          corelight.conn.spcap_url: '{{json_event.message.get("spcap.url")}}'
          corelight.conn.spcap_rule: '{{json_event.message.get("spcap.rule")}}'
          corelight.conn.spcap_trigger: '{{json_event.message.get("spcap.trigger")}}'
          # Reverse names the sensor resolved for each endpoint, with where it
          # learned them from.
          corelight.conn.orig_names: '{{json_event.message.get("id.orig_h_name.vals")}}'
          corelight.conn.orig_names_source: '{{json_event.message.get("id.orig_h_name.src")}}'
          corelight.conn.resp_names: '{{json_event.message.get("id.resp_h_name.vals")}}'
          corelight.conn.resp_names_source: '{{json_event.message.get("id.resp_h_name.src")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      # Zeek duration is in seconds; ECS event.duration is in nanoseconds.
      # Guard: only set when present and numeric (Zeek may emit "-" or omit it).
      - set:
          event.duration: '{{(json_event.message.get("duration") | float * 1000000000) | int}}'
        filter: '{{json_event.message.get("duration") not in [None, "-"]}}'
      # resp_cc is the country the responder sits in, whichever side is local.
      - set:
          destination.geo.country_iso_code: '{{json_event.message.get("resp_cc")}}'
        filter: '{{json_event.message.get("resp_cc") != None}}'
      # remote_* geolocates the endpoint outside the monitored network;
      # local_orig / local_resp are what say which of the two that is.
      # remote_latitude / remote_longitude are deliberately left out: the sensor
      # serialises them with the bytes of the double in reverse order, so the
      # exported values are unusable (37.751 comes out as -1.04e+172). The city,
      # country and ASN of the same enrichment are unaffected.
      - set:
          destination.geo.city_name: '{{json_event.message.get("remote_city")}}'
          destination.geo.country_name: '{{json_event.message.get("remote_country")}}'
          destination.as.number: '{{json_event.message.get("remote_asn")}}'
          destination.as.organization.name: '{{json_event.message.get("remote_organization")}}'
        filter: '{{json_event.message.get("local_resp") == False and json_event.message.get("remote_country") != None}}'
      - set:
          source.geo.city_name: '{{json_event.message.get("remote_city")}}'
          source.geo.country_name: '{{json_event.message.get("remote_country")}}'
          source.as.number: '{{json_event.message.get("remote_asn")}}'
          source.as.organization.name: '{{json_event.message.get("remote_organization")}}'
        filter: '{{json_event.message.get("local_orig") == False and json_event.message.get("remote_country") != None}}'
      # Native Corelight entity enrichment (role / user / location)
      - set:
          source.user.name: '{{json_event.message.get("enrichment_orig.user")}}'
        filter: '{{json_event.message.get("enrichment_orig.user") != None}}'
      - set:
          source.user.roles: '["{{json_event.message.get("enrichment_orig.role")}}"]'
        filter: '{{json_event.message.get("enrichment_orig.role") != None}}'
      - set:
          source.geo.name: '{{json_event.message.get("enrichment_orig.city_location")}}'
        filter: '{{json_event.message.get("enrichment_orig.city_location") != None}}'

  # ----------------------------------------------------------------
  # dns.log
  # ----------------------------------------------------------------
  set_dns_fields:
    actions:
      - set:
          network.protocol: "dns"
          network.transport: '{{json_event.message.get("proto")}}'
          dns.id: '{{json_event.message.get("trans_id")}}'
          dns.question.name: '{{json_event.message.get("query")}}'
          dns.question.type: '{{json_event.message.get("qtype_name")}}'
          dns.question.class: '{{json_event.message.get("qclass_name")}}'
          dns.response_code: '{{json_event.message.get("rcode_name")}}'
          corelight.dns.qtype: '{{json_event.message.get("qtype")}}'
          corelight.dns.qclass: '{{json_event.message.get("qclass")}}'
          corelight.dns.rcode: '{{json_event.message.get("rcode")}}'
          corelight.dns.rejected: '{{json_event.message.get("rejected")}}'
          corelight.dns.z: '{{json_event.message.get("Z")}}'
          corelight.dns.ttls: '{{json_event.message.get("TTLs")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      # ECS models the DNS header bits as a list of the flags that are set.
      - set:
          dns.header_flags: >
            [
                {% if json_event.message.get("AA") %}"AA",{% endif %}
                {% if json_event.message.get("TC") %}"TC",{% endif %}
                {% if json_event.message.get("RD") %}"RD",{% endif %}
                {% if json_event.message.get("RA") %}"RA",{% endif %}
            ]
        filter: '{{json_event.message.get("AA") or json_event.message.get("TC") or json_event.message.get("RD") or json_event.message.get("RA")}}'
      - set:
          dns.answers: >
            [
                {% for item in json_event.message.get("answers") %}
                {"data": "{{item}}"},
                {% endfor %}
            ]
        filter: '{{json_event.message.get("answers") != None}}'
      # The resolver answered, so the outcome is the response code it returned.
      - set:
          event.outcome: "success"
        filter: '{{json_event.message.get("rcode_name") == "NOERROR"}}'
      - set:
          event.outcome: "failure"
        filter: '{{json_event.message.get("rcode_name") not in [None, "NOERROR"]}}'

  # ----------------------------------------------------------------
  # http.log
  # ----------------------------------------------------------------
  set_http_fields:
    actions:
      - set:
          network.transport: "tcp"
          url.path: '{{json_event.message.get("uri")}}'
          http.request.method: '{{json_event.message.get("method")}}'
          http.version: '{{json_event.message.get("version")}}'
          http.response.status_code: '{{json_event.message.get("status_code")}}'
          http.request.body.bytes: '{{json_event.message.get("request_body_len")}}'
          http.response.body.bytes: '{{json_event.message.get("response_body_len")}}'
          corelight.http.status_msg: '{{json_event.message.get("status_msg")}}'
          corelight.http.info_code: '{{json_event.message.get("info_code")}}'
          corelight.http.info_msg: '{{json_event.message.get("info_msg")}}'
          corelight.http.trans_depth: '{{json_event.message.get("trans_depth")}}'
          corelight.http.origin: '{{json_event.message.get("origin")}}'
          corelight.http.proxied: '{{json_event.message.get("proxied")}}'
          corelight.http.tags: '{{json_event.message.get("tags")}}'
          # The headers Corelight kept verbatim for each direction.
          corelight.http.client_headers: '{{json_event.message.get("client_headers")}}'
          corelight.http.server_headers: '{{json_event.message.get("server_headers")}}'
          # The files carried by the transaction; the join key back to files.log.
          corelight.http.orig_fuids: '{{json_event.message.get("orig_fuids")}}'
          corelight.http.orig_mime_types: '{{json_event.message.get("orig_mime_types")}}'
          corelight.http.orig_filenames: '{{json_event.message.get("orig_filenames")}}'
          corelight.http.resp_fuids: '{{json_event.message.get("resp_fuids")}}'
          corelight.http.resp_mime_types: '{{json_event.message.get("resp_mime_types")}}'
          corelight.http.resp_filenames: '{{json_event.message.get("resp_filenames")}}'
          corelight.http.post_body: '{{json_event.message.get("post_body")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      # The Host: header. Zeek names it "host"; the Corelight export renames it
      # "dest_host" and appends the port when it is not the default one.
      - set:
          url.domain: '{{json_event.message.get("host")}}'
          destination.domain: '{{json_event.message.get("host")}}'
        filter: '{{json_event.message.get("host") != None}}'
      - set:
          url.domain: '{{json_event.message.get("dest_host").split(":")[0]}}'
          destination.domain: '{{json_event.message.get("dest_host").split(":")[0]}}'
        filter: '{{json_event.message.get("host") == None and json_event.message.get("dest_host") != None}}'
      # Zeek reports the MIME types of the bodies as sets, one entry per file
      # carried; ECS holds a single type per direction.
      - set:
          http.request.mime_type: '{{json_event.message.get("orig_mime_types")[0]}}'
        filter: '{{json_event.message.get("orig_mime_types") is sequence and json_event.message.get("orig_mime_types") is not string and json_event.message.get("orig_mime_types") | length > 0}}'
      - set:
          http.response.mime_type: '{{json_event.message.get("resp_mime_types")[0]}}'
        filter: '{{json_event.message.get("resp_mime_types") is sequence and json_event.message.get("resp_mime_types") is not string and json_event.message.get("resp_mime_types") | length > 0}}'
      - set:
          user_agent.original: '{{json_event.message.get("user_agent")}}'
        filter: '{{json_event.message.get("user_agent") != None}}'
      - set:
          http.request.referrer: '{{json_event.message.get("referrer")}}'
        filter: '{{json_event.message.get("referrer") != None}}'
      # The Server: response header, i.e. the software answering.
      - set:
          corelight.http.server: '{{json_event.message.get("server")}}'
        filter: '{{json_event.message.get("server") != None}}'
      # Basic-auth account, when the client sent one.
      - set:
          source.user.name: '{{json_event.message.get("username")}}'
        filter: '{{json_event.message.get("username") != None}}'

  # ----------------------------------------------------------------
  # ssl.log
  # ----------------------------------------------------------------
  set_ssl_fields:
    actions:
      - set:
          network.transport: "tcp"
          tls.version: '{{json_event.message.get("version")}}'
          tls.cipher: '{{json_event.message.get("cipher")}}'
          tls.curve: '{{json_event.message.get("curve")}}'
          tls.client.server_name: '{{json_event.message.get("server_name")}}'
          tls.client.ja3: '{{json_event.message.get("ja3")}}'
          tls.server.ja3s: '{{json_event.message.get("ja3s")}}'
          tls.established: '{{json_event.message.get("established")}}'
          tls.resumed: '{{json_event.message.get("resumed")}}'
          tls.next_protocol: '{{json_event.message.get("next_protocol")}}'
          corelight.ssl.validation_status: '{{json_event.message.get("validation_status")}}'
          # The per-record letters Zeek uses to summarise the handshake.
          corelight.ssl.history: '{{json_event.message.get("ssl_history")}}'
          corelight.ssl.last_alert: '{{json_event.message.get("last_alert")}}'
          corelight.ssl.sni_matches_cert: '{{json_event.message.get("sni_matches_cert")}}'
          # Fingerprints of the presented chains; the join key back to x509.log.
          corelight.ssl.cert_chain_fps: '{{json_event.message.get("cert_chain_fps")}}'
          corelight.ssl.client_cert_chain_fps: '{{json_event.message.get("client_cert_chain_fps")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      # The certificate presented in this session belongs to the server; ECS
      # holds its subject and issuer under tls.server.
      - set:
          tls.server.subject: '{{json_event.message.get("subject")}}'
        filter: '{{json_event.message.get("subject") != None}}'
      - set:
          tls.server.issuer: '{{json_event.message.get("issuer")}}'
        filter: '{{json_event.message.get("issuer") != None}}'
      - set:
          tls.client.subject: '{{json_event.message.get("client_subject")}}'
        filter: '{{json_event.message.get("client_subject") != None}}'
      - set:
          tls.client.issuer: '{{json_event.message.get("client_issuer")}}'
        filter: '{{json_event.message.get("client_issuer") != None}}'
      - set:
          destination.domain: '{{json_event.message.get("server_name")}}'
        filter: '{{json_event.message.get("server_name") != None}}'
      # Zeek reports "ok" when the chain validated, and the OpenSSL error
      # otherwise.
      - set:
          event.outcome: "success"
        filter: '{{json_event.message.get("validation_status") == "ok"}}'
      - set:
          event.outcome: "failure"
        filter: '{{json_event.message.get("validation_status") not in [None, "ok"]}}'

  # ----------------------------------------------------------------
  # files.log
  # ----------------------------------------------------------------
  set_files_fields:
    actions:
      - set:
          file.hash.md5: '{{json_event.message.get("md5")}}'
          file.hash.sha1: '{{json_event.message.get("sha1")}}'
          file.hash.sha256: '{{json_event.message.get("sha256")}}'
          file.mime_type: '{{json_event.message.get("mime_type")}}'
          file.size: '{{json_event.message.get("seen_bytes")}}'
          file.name: '{{json_event.message.get("filename")}}'
          corelight.files.source: '{{json_event.message.get("source")}}'
          corelight.files.fuid: '{{json_event.message.get("fuid")}}'
          corelight.files.depth: '{{json_event.message.get("depth")}}'
          corelight.files.analyzers: '{{json_event.message.get("analyzers")}}'
          corelight.files.is_orig: '{{json_event.message.get("is_orig")}}'
          corelight.files.local_orig: '{{json_event.message.get("local_orig")}}'
          corelight.files.total_bytes: '{{json_event.message.get("total_bytes")}}'
          corelight.files.missing_bytes: '{{json_event.message.get("missing_bytes")}}'
          corelight.files.overflow_bytes: '{{json_event.message.get("overflow_bytes")}}'
          corelight.files.timedout: '{{json_event.message.get("timedout")}}'
          corelight.files.extracted: '{{json_event.message.get("extracted")}}'
          # The connections the file was seen on; the join key back to conn.log.
          corelight.files.conn_uids: '{{json_event.message.get("conn_uids")}}'
      - set:
          event.category: ["file"]
          event.type: ["info"]
      # The analyzer the file was carried by, e.g. "HTTP" or "SMTP".
      - set:
          network.protocol: '{{json_event.message.get("source") | lower}}'
        filter: '{{json_event.message.get("source") != None}}'
      - set:
          event.duration: '{{(json_event.message.get("duration") | float * 1000000000) | int}}'
        filter: '{{json_event.message.get("duration") not in [None, "-"]}}'
      # Some sensor generations write files.log without a connection tuple; the
      # endpoints are then only available as the tx_hosts / rx_hosts sets.
      - set:
          source.ip: '{{json_event.message.get("tx_hosts")[0]}}'
        filter: '{{json_event.message.get("id.orig_h") == None and json_event.message.get("tx_hosts") | length > 0}}'
      - set:
          destination.ip: '{{json_event.message.get("rx_hosts")[0]}}'
        filter: '{{json_event.message.get("id.resp_h") == None and json_event.message.get("rx_hosts") | length > 0}}'

  # ----------------------------------------------------------------
  # suricata_corelight (IDS alerts)
  # Note: alert fields are flat keys ("alert.signature", not nested).
  # ----------------------------------------------------------------
  set_suricata_fields:
    actions:
      - set:
          rule.name: '{{json_event.message.get("alert.signature")}}'
          rule.category: '{{json_event.message.get("alert.category")}}'
          rule.id: '{{json_event.message.get("alert.signature_id")}}'
          rule.version: '{{json_event.message.get("alert.rev")}}'
          event.severity: '{{json_event.message.get("alert.severity")}}'
          action.name: '{{json_event.message.get("alert.action")}}'
          event.action: '{{json_event.message.get("alert.action")}}'
          network.protocol: '{{json_event.message.get("service")}}'
          corelight.suricata.gid: '{{json_event.message.get("alert.gid")}}'
          corelight.suricata.metadata: '{{json_event.message.get("alert.metadata")}}'
          corelight.suricata.flow_metadata: '{{json_event.message.get("metadata")}}'
          # Identifiers that tie the alert back to conn.log (suri_ids) and to the
          # Suricata flow it was raised on.
          corelight.suricata.suri_id: '{{json_event.message.get("suri_id")}}'
          corelight.suricata.flow_id: '{{json_event.message.get("flow_id")}}'
          corelight.suricata.tx_id: '{{json_event.message.get("tx_id")}}'
          corelight.suricata.icmp_type: '{{json_event.message.get("icmp_type")}}'
          corelight.suricata.icmp_code: '{{json_event.message.get("icmp_code")}}'
          # The packet that triggered the rule, base64 and printable.
          corelight.suricata.payload: '{{json_event.message.get("payload")}}'
          corelight.suricata.payload_printable: '{{json_event.message.get("payload_printable")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.kind: "alert"
          event.category: ["intrusion_detection"]
          event.type: ["info"]

  # ----------------------------------------------------------------
  # intel.log (Zeek Intelligence Framework matches)
  # ----------------------------------------------------------------
  set_intel_fields:
    actions:
      - set:
          threat.indicator.name: '{{json_event.message.get("seen.indicator")}}'
          threat.indicator.type: '{{json_event.message.get("seen.indicator_type")}}'
          corelight.intel.where: '{{json_event.message.get("seen.where")}}'
          corelight.intel.node: '{{json_event.message.get("seen.node")}}'
          corelight.intel.sources: '{{json_event.message.get("sources")}}'
          # The intel item categories the indicator matched.
          corelight.intel.matched: '{{json_event.message.get("matched")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.kind: "enrichment"
          event.category: ["threat"]
          event.type: ["indicator"]

  # ----------------------------------------------------------------
  # notice.log
  # ----------------------------------------------------------------
  set_notice_fields:
    actions:
      # Do NOT overwrite the top-level `message` field (the raw event is kept
      # for every other log type); expose the notice text as a dedicated field.
      - set:
          rule.name: '{{json_event.message.get("note")}}'
          network.transport: '{{json_event.message.get("proto")}}'
          event.severity: '{{json_event.message.get("severity.level")}}'
          corelight.notice.message: '{{json_event.message.get("msg")}}'
          corelight.notice.sub: '{{json_event.message.get("sub")}}'
          corelight.notice.severity: '{{json_event.message.get("severity.name")}}'
          corelight.notice.actions: '{{json_event.message.get("actions")}}'
          corelight.notice.suppress_for: '{{json_event.message.get("suppress_for")}}'
          corelight.notice.peer_descr: '{{json_event.message.get("peer_descr")}}'
          corelight.notice.file_desc: '{{json_event.message.get("file_desc")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.kind: "alert"
          event.type: ["info"]
      - set:
          file.mime_type: '{{json_event.message.get("file_mime_type")}}'
          corelight.files.fuid: '{{json_event.message.get("fuid")}}'
        filter: '{{json_event.message.get("fuid") != None}}'
      # A notice is not always tied to a connection: when it is not, the
      # endpoints are reported as src / dst / p instead of the id.* tuple.
      - set:
          source.ip: '{{json_event.message.get("src")}}'
        filter: '{{json_event.message.get("id.orig_h") == None and json_event.message.get("src") != None}}'
      - set:
          destination.ip: '{{json_event.message.get("dst")}}'
        filter: '{{json_event.message.get("id.resp_h") == None and json_event.message.get("dst") != None}}'
      - set:
          destination.port: '{{json_event.message.get("p")}}'
        filter: '{{json_event.message.get("id.resp_p") == None and json_event.message.get("p") != None}}'

  # ----------------------------------------------------------------
  # ssh.log
  # ----------------------------------------------------------------
  set_ssh_fields:
    actions:
      - set:
          network.protocol: "ssh"
          network.transport: "tcp"
          corelight.ssh.client: '{{json_event.message.get("client")}}'
          corelight.ssh.server: '{{json_event.message.get("server")}}'
          corelight.ssh.version: '{{json_event.message.get("version")}}'
          corelight.ssh.cipher_alg: '{{json_event.message.get("cipher_alg")}}'
          corelight.ssh.kex_alg: '{{json_event.message.get("kex_alg")}}'
          corelight.ssh.mac_alg: '{{json_event.message.get("mac_alg")}}'
          corelight.ssh.compression_alg: '{{json_event.message.get("compression_alg")}}'
          corelight.ssh.host_key: '{{json_event.message.get("host_key")}}'
          corelight.ssh.host_key_alg: '{{json_event.message.get("host_key_alg")}}'
          corelight.ssh.hassh: '{{json_event.message.get("hassh")}}'
          corelight.ssh.hassh_server: '{{json_event.message.get("hasshServer")}}'
          corelight.ssh.hassh_version: '{{json_event.message.get("hasshVersion")}}'
          corelight.ssh.hassh_algorithms: '{{json_event.message.get("hasshAlgorithms")}}'
          corelight.ssh.hassh_server_algorithms: '{{json_event.message.get("hasshServerAlgorithms")}}'
          corelight.ssh.client_host_key_algorithms: '{{json_event.message.get("cshka")}}'
          corelight.ssh.server_host_key_algorithms: '{{json_event.message.get("sshka")}}'
          corelight.ssh.inferences: '{{json_event.message.get("inferences")}}'
          corelight.ssh.auth_attempts: '{{json_event.message.get("auth_attempts")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]
      # Zeek reports the direction as INBOUND/OUTBOUND; ECS expects it lowercase.
      - set:
          network.direction: '{{json_event.message.get("direction") | lower}}'
        filter: '{{json_event.message.get("direction") != None}}'
      # auth_success is only present once the SSH authentication has been observed;
      # the log is also written for sessions where Zeek could not determine it.
      - set:
          event.category: ["network", "authentication"]
          event.outcome: "success"
        filter: '{{json_event.message.get("auth_success") == True}}'
      - set:
          event.category: ["network", "authentication"]
          event.outcome: "failure"
        filter: '{{json_event.message.get("auth_success") == False}}'
      # remote_location.* geolocates the endpoint outside the monitored network;
      # "direction" is what says which of the two endpoints that is.
      # remote_location.latitude / .longitude are left out for the same reason as
      # in conn.log: the sensor reverses the bytes of the double when it
      # serialises them, so the coordinates cannot be used.
      - set:
          destination.geo.city_name: '{{json_event.message.get("remote_location.city")}}'
          destination.geo.region_name: '{{json_event.message.get("remote_location.region")}}'
          destination.geo.country_iso_code: '{{json_event.message.get("remote_location.country_code")}}'
        filter: '{{json_event.message.get("direction") == "OUTBOUND" and json_event.message.get("remote_location.country_code") != None}}'
      - set:
          source.geo.city_name: '{{json_event.message.get("remote_location.city")}}'
          source.geo.region_name: '{{json_event.message.get("remote_location.region")}}'
          source.geo.country_iso_code: '{{json_event.message.get("remote_location.country_code")}}'
        filter: '{{json_event.message.get("direction") == "INBOUND" and json_event.message.get("remote_location.country_code") != None}}'

  # ----------------------------------------------------------------
  # kerberos.log
  # ----------------------------------------------------------------
  set_kerberos_fields:
    actions:
      - set:
          network.protocol: "kerberos"
          event.action: '{{json_event.message.get("request_type")}}'
          corelight.kerberos.request_type: '{{json_event.message.get("request_type")}}'
          corelight.kerberos.service: '{{json_event.message.get("service")}}'
          corelight.kerberos.cipher: '{{json_event.message.get("cipher")}}'
          corelight.kerberos.forwardable: '{{json_event.message.get("forwardable")}}'
          corelight.kerberos.renewable: '{{json_event.message.get("renewable")}}'
          corelight.kerberos.till: '{{json_event.message.get("till")}}'
          corelight.kerberos.from: '{{json_event.message.get("from")}}'
          corelight.kerberos.auth_ticket: '{{json_event.message.get("auth_ticket")}}'
          corelight.kerberos.new_ticket: '{{json_event.message.get("new_ticket")}}'
          corelight.kerberos.client_cert_subject: '{{json_event.message.get("client_cert_subject")}}'
          corelight.kerberos.server_cert_subject: '{{json_event.message.get("server_cert_subject")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.category: ["network", "authentication"]
          event.type: ["connection", "protocol"]
      # Zeek reports the principal as "name/realm"; ECS keeps the two apart.
      - set:
          source.user.name: '{{json_event.message.get("client").split("/")[0]}}'
          source.user.domain: '{{json_event.message.get("client").split("/")[1]}}'
        filter: '{{json_event.message.get("client") != None and "/" in json_event.message.get("client")}}'
      - set:
          source.user.name: '{{json_event.message.get("client")}}'
        filter: '{{json_event.message.get("client") != None and "/" not in json_event.message.get("client")}}'
      - set:
          event.outcome: "success"
        filter: '{{json_event.message.get("success") == True}}'
      - set:
          event.outcome: "failure"
        filter: '{{json_event.message.get("success") == False}}'
      - set:
          corelight.kerberos.error_message: '{{json_event.message.get("error_msg")}}'
        filter: '{{json_event.message.get("error_msg") != None}}'
      - set:
          corelight.kerberos.error_code: '{{json_event.message.get("error_code")}}'
        filter: '{{json_event.message.get("error_code") != None}}'

  # ----------------------------------------------------------------
  # ntlm.log
  # ----------------------------------------------------------------
  set_ntlm_fields:
    actions:
      - set:
          network.protocol: "ntlm"
          source.user.name: '{{json_event.message.get("username")}}'
          source.user.domain: '{{json_event.message.get("domainname")}}'
          source.domain: '{{json_event.message.get("hostname")}}'
          network.transport: "tcp"
          destination.domain: '{{json_event.message.get("server_nb_computer_name")}}'
          corelight.ntlm.server_dns_computer_name: '{{json_event.message.get("server_dns_computer_name")}}'
          corelight.ntlm.server_tree_name: '{{json_event.message.get("server_tree_name")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.category: ["network", "authentication"]
          event.type: ["connection", "protocol"]
      - set:
          event.outcome: "success"
        filter: '{{json_event.message.get("success") == True}}'
      - set:
          event.outcome: "failure"
        filter: '{{json_event.message.get("success") == False}}'

  # ----------------------------------------------------------------
  # ldap.log
  # ----------------------------------------------------------------
  set_ldap_fields:
    actions:
      - set:
          network.protocol: "ldap"
          event.action: '{{json_event.message.get("opcode")}}'
          corelight.ldap.opcode: '{{json_event.message.get("opcode")}}'
          corelight.ldap.result: '{{json_event.message.get("result")}}'
          corelight.ldap.object: '{{json_event.message.get("object")}}'
          corelight.ldap.argument: '{{json_event.message.get("argument")}}'
          corelight.ldap.message_id: '{{json_event.message.get("message_id")}}'
          corelight.ldap.version: '{{json_event.message.get("version")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]
      # Only a bind is an authentication attempt; searches, modifies and the rest
      # are directory operations.
      - set:
          event.category: ["network", "authentication"]
        filter: '{{json_event.message.get("opcode") != None and "bind" in json_event.message.get("opcode")}}'
      - set:
          event.outcome: "success"
        filter: '{{json_event.message.get("result") == "success"}}'
      - set:
          event.outcome: "failure"
        filter: '{{json_event.message.get("result") not in [None, "success"]}}'

  # ----------------------------------------------------------------
  # ldap_search.log
  # ----------------------------------------------------------------
  set_ldap_search_fields:
    actions:
      - set:
          network.protocol: "ldap"
          event.action: '{{json_event.message.get("opcode")}}'
          corelight.ldap.opcode: '{{json_event.message.get("opcode")}}'
          corelight.ldap.result: '{{json_event.message.get("result")}}'
          corelight.ldap.message_id: '{{json_event.message.get("message_id")}}'
          corelight.ldap_search.base_object: '{{json_event.message.get("base_object")}}'
          corelight.ldap_search.scope: '{{json_event.message.get("scope")}}'
          corelight.ldap_search.deref_aliases: '{{json_event.message.get("deref_aliases")}}'
          corelight.ldap_search.filter: '{{json_event.message.get("filter")}}'
          corelight.ldap_search.result_count: '{{json_event.message.get("result_count")}}'
          corelight.ldap_search.attributes: '{{json_event.message.get("attributes")}}'
          corelight.ldap.diagnostic_message: '{{json_event.message.get("diagnostic_message")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]

  # ----------------------------------------------------------------
  # dce_rpc.log
  # ----------------------------------------------------------------
  set_dce_rpc_fields:
    actions:
      - set:
          network.protocol: "dce_rpc"
          event.action: '{{json_event.message.get("operation")}}'
          corelight.dce_rpc.endpoint: '{{json_event.message.get("endpoint")}}'
          corelight.dce_rpc.operation: '{{json_event.message.get("operation")}}'
          corelight.dce_rpc.named_pipe: '{{json_event.message.get("named_pipe")}}'
          corelight.dce_rpc.rtt: '{{json_event.message.get("rtt")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]

  # ----------------------------------------------------------------
  # smtp.log
  # ----------------------------------------------------------------
  set_smtp_fields:
    actions:
      - set:
          network.protocol: "smtp"
          # ECS models the email fieldset on the RFC 5322 headers: email.from
          # and email.to carry the From: and To: headers, while email.sender
          # carries the envelope MAIL FROM. The envelope recipients have no ECS
          # field of their own and stay namespaced.
          email.from.address: '{{json_event.message.get("from")}}'
          email.to.address: '{{json_event.message.get("to")}}'
          email.sender.address: '{{json_event.message.get("mailfrom")}}'
          email.subject: '{{json_event.message.get("subject")}}'
          email.cc.address: '{{json_event.message.get("cc")}}'
          email.reply_to.address: '{{json_event.message.get("reply_to")}}'
          email.message_id: '{{json_event.message.get("msg_id")}}'
          user_agent.original: '{{json_event.message.get("user_agent")}}'
          corelight.smtp.rcptto: '{{json_event.message.get("rcptto")}}'
          tls.established: '{{json_event.message.get("tls")}}'
          # Zeek emits the Date header verbatim (RFC 5322), not an ISO timestamp,
          # so it is kept as text rather than mapped onto a date field.
          corelight.smtp.date: '{{json_event.message.get("date")}}'
          corelight.smtp.helo: '{{json_event.message.get("helo")}}'
          corelight.smtp.last_reply: '{{json_event.message.get("last_reply")}}'
          corelight.smtp.trans_depth: '{{json_event.message.get("trans_depth")}}'
          corelight.smtp.is_webmail: '{{json_event.message.get("is_webmail")}}'
          corelight.smtp.path: '{{json_event.message.get("path")}}'
          corelight.smtp.fuids: '{{json_event.message.get("fuids")}}'
          corelight.smtp.urls: '{{json_event.message.get("urls")}}'
          corelight.smtp.domains: '{{json_event.message.get("domains")}}'
          corelight.smtp.in_reply_to: '{{json_event.message.get("in_reply_to")}}'
          corelight.smtp.x_originating_ip: '{{json_event.message.get("x_originating_ip")}}'
          corelight.smtp.first_received: '{{json_event.message.get("first_received")}}'
          corelight.smtp.second_received: '{{json_event.message.get("second_received")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.category: ["email"]
          event.type: ["info"]

  # ----------------------------------------------------------------
  # smtp_links.log (one event per URL found in a message body)
  # ----------------------------------------------------------------
  set_smtp_links_fields:
    actions:
      - set:
          network.protocol: "smtp"
          url.original: '{{json_event.message.get("link")}}'
          url.domain: '{{json_event.message.get("domain")}}'
          corelight.fuid: '{{json_event.message.get("fuid")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.category: ["email"]
          event.type: ["info"]

  # ----------------------------------------------------------------
  # smb_files.log
  # ----------------------------------------------------------------
  set_smb_files_fields:
    actions:
      - set:
          network.protocol: "smb"
          network.transport: "tcp"
          # `object_path` is the share, `name` the path of the file inside it.
          file.directory: '{{json_event.message.get("object_path")}}'
          file.name: '{{json_event.message.get("name")}}'
          file.size: '{{json_event.message.get("size")}}'
          file.mtime: '{{json_event.message.get("times.modified")}}'
          file.accessed: '{{json_event.message.get("times.accessed")}}'
          file.created: '{{json_event.message.get("times.created")}}'
          file.ctime: '{{json_event.message.get("times.changed")}}'
          corelight.smb_files.data_offset_req: '{{json_event.message.get("data_offset_req")}}'
          corelight.smb_files.data_len_req: '{{json_event.message.get("data_len_req")}}'
          corelight.smb_files.data_len_rsp: '{{json_event.message.get("data_len_rsp")}}'
          corelight.smb_files.previous_name: '{{json_event.message.get("prev_name")}}'
          corelight.fuid: '{{json_event.message.get("fuid")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.category: ["file", "network"]
          event.type: ["info"]
      # Zeek qualifies the action as "SMB::FILE_WRITE"; ECS event.action is
      # lowercase and unprefixed.
      - set:
          event.action: '{{json_event.message.get("action").split("::")[-1] | lower}}'
        filter: '{{json_event.message.get("action") != None}}'
      - set:
          event.type: ["change"]
        filter: '{{json_event.message.get("action") in ["SMB::FILE_WRITE", "SMB::FILE_RENAME", "SMB::FILE_SET_ATTRIBUTE"]}}'
      - set:
          event.type: ["access"]
        filter: '{{json_event.message.get("action") in ["SMB::FILE_OPEN", "SMB::FILE_READ"]}}'
      - set:
          event.type: ["deletion"]
        filter: '{{json_event.message.get("action") == "SMB::FILE_DELETE"}}'

  # ----------------------------------------------------------------
  # smb_mapping.log (share tree connects)
  # ----------------------------------------------------------------
  set_smb_mapping_fields:
    actions:
      - set:
          network.protocol: "smb"
          network.transport: "tcp"
          corelight.smb_mapping.object_path: '{{json_event.message.get("object_path")}}'
          corelight.smb_mapping.path: '{{json_event.message.get("path")}}'
          corelight.smb_mapping.service: '{{json_event.message.get("service")}}'
          corelight.smb_mapping.native_file_system: '{{json_event.message.get("native_file_system")}}'
          corelight.smb_mapping.share_type: '{{json_event.message.get("share_type")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]

  # ----------------------------------------------------------------
  # ftp.log
  # Note: Zeek also logs the plaintext password. It is deliberately not
  # mapped, to keep credentials out of the parsed event.
  # ----------------------------------------------------------------
  set_ftp_fields:
    actions:
      - set:
          network.protocol: "ftp"
          source.user.name: '{{json_event.message.get("user")}}'
          file.size: '{{json_event.message.get("file_size")}}'
          file.mime_type: '{{json_event.message.get("mime_type")}}'
          # "cwd" is the directory the session is in, not a path to the file.
          file.directory: '{{json_event.message.get("cwd")}}'
          corelight.ftp.arg: '{{json_event.message.get("arg")}}'
          corelight.ftp.reply_code: '{{json_event.message.get("reply_code")}}'
          corelight.ftp.reply_msg: '{{json_event.message.get("reply_msg")}}'
          corelight.ftp.data_channel.passive: '{{json_event.message.get("data_channel.passive")}}'
          corelight.ftp.data_channel.orig_h: '{{json_event.message.get("data_channel.orig_h")}}'
          corelight.ftp.data_channel.resp_h: '{{json_event.message.get("data_channel.resp_h")}}'
          corelight.ftp.data_channel.resp_p: '{{json_event.message.get("data_channel.resp_p")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]
      - set:
          event.action: '{{json_event.message.get("command") | lower}}'
        filter: '{{json_event.message.get("command") != None}}'
      # FTP reply codes follow the SMTP convention: 4xx and 5xx are failures.
      - set:
          event.outcome: "success"
        filter: '{{json_event.message.get("reply_code") != None and json_event.message.get("reply_code") | int < 400}}'
      - set:
          event.outcome: "failure"
        filter: '{{json_event.message.get("reply_code") != None and json_event.message.get("reply_code") | int >= 400}}'

  # ----------------------------------------------------------------
  # x509.log
  # Note: this log carries no connection tuple; it is joined to ssl.log
  # through the certificate fingerprint.
  # ----------------------------------------------------------------
  set_x509_fields:
    actions:
      - set:
          x509.version_number: '{{json_event.message.get("certificate.version")}}'
          x509.serial_number: '{{json_event.message.get("certificate.serial")}}'
          x509.subject.distinguished_name: '{{json_event.message.get("certificate.subject")}}'
          x509.issuer.distinguished_name: '{{json_event.message.get("certificate.issuer")}}'
          x509.not_before: '{{json_event.message.get("certificate.not_valid_before")}}'
          x509.not_after: '{{json_event.message.get("certificate.not_valid_after")}}'
          x509.public_key_algorithm: '{{json_event.message.get("certificate.key_alg")}}'
          x509.public_key_size: '{{json_event.message.get("certificate.key_length")}}'
          x509.public_key_exponent: '{{json_event.message.get("certificate.exponent")}}'
          x509.signature_algorithm: '{{json_event.message.get("certificate.sig_alg")}}'
          x509.alternative_names: '{{json_event.message.get("san.dns")}}'
          corelight.x509.san_email: '{{json_event.message.get("san.email")}}'
          corelight.x509.san_ip: '{{json_event.message.get("san.ip")}}'
          corelight.x509.san_uri: '{{json_event.message.get("san.uri")}}'
          corelight.x509.basic_constraints_path_length: '{{json_event.message.get("basic_constraints.path_length")}}'
          file.hash.sha256: '{{json_event.message.get("fingerprint")}}'
          corelight.x509.key_type: '{{json_event.message.get("certificate.key_type")}}'
          corelight.x509.curve: '{{json_event.message.get("certificate.curve")}}'
          corelight.x509.basic_constraints_ca: '{{json_event.message.get("basic_constraints.ca")}}'
          corelight.x509.client_cert: '{{json_event.message.get("client_cert")}}'
          corelight.x509.host_cert: '{{json_event.message.get("host_cert")}}'
      - set:
          event.type: ["info"]

  # ----------------------------------------------------------------
  # pe.log (portable executable metadata)
  # Note: Zeek exposes none of the fields ECS defines under file.pe
  # (imphash, company, product), so everything stays namespaced.
  # ----------------------------------------------------------------
  set_pe_fields:
    actions:
      - set:
          corelight.pe.machine: '{{json_event.message.get("machine")}}'
          corelight.pe.compile_ts: '{{json_event.message.get("compile_ts")}}'
          corelight.pe.os: '{{json_event.message.get("os")}}'
          corelight.pe.subsystem: '{{json_event.message.get("subsystem")}}'
          corelight.pe.is_exe: '{{json_event.message.get("is_exe")}}'
          corelight.pe.is_64bit: '{{json_event.message.get("is_64bit")}}'
          corelight.pe.uses_aslr: '{{json_event.message.get("uses_aslr")}}'
          corelight.pe.uses_dep: '{{json_event.message.get("uses_dep")}}'
          corelight.pe.uses_code_integrity: '{{json_event.message.get("uses_code_integrity")}}'
          corelight.pe.uses_seh: '{{json_event.message.get("uses_seh")}}'
          corelight.pe.has_import_table: '{{json_event.message.get("has_import_table")}}'
          corelight.pe.has_export_table: '{{json_event.message.get("has_export_table")}}'
          corelight.pe.has_cert_table: '{{json_event.message.get("has_cert_table")}}'
          corelight.pe.has_debug_data: '{{json_event.message.get("has_debug_data")}}'
          corelight.pe.section_names: '{{json_event.message.get("section_names")}}'
          corelight.fuid: '{{json_event.message.get("id")}}'
      - set:
          event.category: ["file"]
          event.type: ["info"]

  # ----------------------------------------------------------------
  # dhcp.log
  # Note: this log carries no connection tuple of its own; the addresses
  # come from the DHCP exchange itself, and "uids" lists the connections
  # the lease was observed on.
  # ----------------------------------------------------------------
  set_dhcp_fields:
    actions:
      - set:
          network.protocol: "dhcp"
          network.transport: "udp"
          source.ip: '{{json_event.message.get("client_addr")}}'
          source.mac: '{{json_event.message.get("mac")}}'
          destination.ip: '{{json_event.message.get("server_addr")}}'
          host.hostname: '{{json_event.message.get("host_name")}}'
          # "domain" is the domain name option offered in the lease, not the
          # client's own domain, so it is not mapped onto source.domain.
          corelight.dhcp.domain: '{{json_event.message.get("domain")}}'
          corelight.dhcp.assigned_addr: '{{json_event.message.get("assigned_addr")}}'
          corelight.dhcp.requested_addr: '{{json_event.message.get("requested_addr")}}'
          corelight.dhcp.lease_time: '{{json_event.message.get("lease_time")}}'
          corelight.dhcp.msg_types: '{{json_event.message.get("msg_types")}}'
          corelight.dhcp.client_fqdn: '{{json_event.message.get("client_fqdn")}}'
          corelight.dhcp.client_message: '{{json_event.message.get("client_message")}}'
          corelight.dhcp.server_message: '{{json_event.message.get("server_message")}}'
          corelight.dhcp.client_software: '{{json_event.message.get("client_software")}}'
          corelight.dhcp.server_software: '{{json_event.message.get("server_software")}}'
          corelight.dhcp.msg_orig: '{{json_event.message.get("msg_orig")}}'
          corelight.dhcp.agent_remote_id: '{{json_event.message.get("agent_remote_id")}}'
          corelight.dhcp.circuit_id: '{{json_event.message.get("circuit_id")}}'
          corelight.dhcp.subscriber_id: '{{json_event.message.get("subscriber_id")}}'
          corelight.uids: '{{json_event.message.get("uids")}}'
      - set:
          event.type: ["connection", "protocol"]
      - set:
          event.duration: '{{(json_event.message.get("duration") | float * 1000000000) | int}}'
        filter: '{{json_event.message.get("duration") not in [None, "-"]}}'

  # ----------------------------------------------------------------
  # rdp.log
  # ----------------------------------------------------------------
  set_rdp_fields:
    actions:
      - set:
          network.protocol: "rdp"
          corelight.rdp.cookie: '{{json_event.message.get("cookie")}}'
          corelight.rdp.result: '{{json_event.message.get("result")}}'
          corelight.rdp.security_protocol: '{{json_event.message.get("security_protocol")}}'
          corelight.rdp.cert_count: '{{json_event.message.get("cert_count")}}'
          corelight.rdp.cert_type: '{{json_event.message.get("cert_type")}}'
          corelight.rdp.channels_joined: '{{json_event.message.get("channels_joined")}}'
          corelight.rdp.keyboard_layout: '{{json_event.message.get("keyboard_layout")}}'
          corelight.rdp.client_name: '{{json_event.message.get("client_name")}}'
          corelight.rdp.client_build: '{{json_event.message.get("client_build")}}'
          corelight.rdp.desktop_width: '{{json_event.message.get("desktop_width")}}'
          corelight.rdp.desktop_height: '{{json_event.message.get("desktop_height")}}'
          corelight.rdp.encryption_level: '{{json_event.message.get("encryption_level")}}'
          corelight.rdp.encryption_method: '{{json_event.message.get("encryption_method")}}'
          corelight.rdp.inferences: '{{json_event.message.get("inferences")}}'
          corelight.rdp.rdfp_hash: '{{json_event.message.get("rdfp_hash")}}'
          corelight.rdp.rdfp_string: '{{json_event.message.get("rdfp_string")}}'
          corelight.rdp.requested_color_depth: '{{json_event.message.get("requested_color_depth")}}'
          corelight.rdp.cert_permanent: '{{json_event.message.get("cert_permanent")}}'
          corelight.rdp.client_dig_product_id: '{{json_event.message.get("client_dig_product_id")}}'
          tls.established: '{{json_event.message.get("ssl")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]
      - set:
          event.outcome: "success"
        filter: '{{json_event.message.get("auth_success") == True}}'
      - set:
          event.outcome: "failure"
        filter: '{{json_event.message.get("auth_success") == False}}'

  # ----------------------------------------------------------------
  # quic.log
  # ----------------------------------------------------------------
  set_quic_fields:
    actions:
      - set:
          network.protocol: "quic"
          network.transport: "udp"
          tls.client.server_name: '{{json_event.message.get("server_name")}}'
          corelight.quic.version: '{{json_event.message.get("version")}}'
          corelight.quic.client_protocol: '{{json_event.message.get("client_protocol")}}'
          corelight.quic.client_initial_dcid: '{{json_event.message.get("client_initial_dcid")}}'
          corelight.quic.client_scid: '{{json_event.message.get("client_scid")}}'
          corelight.quic.server_scid: '{{json_event.message.get("server_scid")}}'
          corelight.quic.history: '{{json_event.message.get("history")}}'
          user_agent.original: '{{json_event.message.get("user_agent")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]

  # ----------------------------------------------------------------
  # ntp.log
  # ----------------------------------------------------------------
  set_ntp_fields:
    actions:
      - set:
          network.protocol: "ntp"
          network.transport: "udp"
          corelight.ntp.version: '{{json_event.message.get("version")}}'
          corelight.ntp.mode: '{{json_event.message.get("mode")}}'
          corelight.ntp.stratum: '{{json_event.message.get("stratum")}}'
          corelight.ntp.poll: '{{json_event.message.get("poll")}}'
          corelight.ntp.precision: '{{json_event.message.get("precision")}}'
          corelight.ntp.root_delay: '{{json_event.message.get("root_delay")}}'
          corelight.ntp.root_disp: '{{json_event.message.get("root_disp")}}'
          corelight.ntp.ref_id: '{{json_event.message.get("ref_id")}}'
          corelight.ntp.ref_time: '{{json_event.message.get("ref_time")}}'
          corelight.ntp.org_time: '{{json_event.message.get("org_time")}}'
          corelight.ntp.rec_time: '{{json_event.message.get("rec_time")}}'
          corelight.ntp.xmt_time: '{{json_event.message.get("xmt_time")}}'
          corelight.ntp.num_exts: '{{json_event.message.get("num_exts")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]

  # ----------------------------------------------------------------
  # snmp.log
  # ----------------------------------------------------------------
  set_snmp_fields:
    actions:
      - set:
          network.protocol: "snmp"
          network.transport: "udp"
          corelight.snmp.version: '{{json_event.message.get("version")}}'
          corelight.snmp.community: '{{json_event.message.get("community")}}'
          corelight.snmp.display_string: '{{json_event.message.get("display_string")}}'
          corelight.snmp.get_requests: '{{json_event.message.get("get_requests")}}'
          corelight.snmp.get_bulk_requests: '{{json_event.message.get("get_bulk_requests")}}'
          corelight.snmp.get_responses: '{{json_event.message.get("get_responses")}}'
          corelight.snmp.set_requests: '{{json_event.message.get("set_requests")}}'
          corelight.snmp.up_since: '{{json_event.message.get("up_since")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]
      - set:
          event.duration: '{{(json_event.message.get("duration") | float * 1000000000) | int}}'
        filter: '{{json_event.message.get("duration") not in [None, "-"]}}'

  # ----------------------------------------------------------------
  # mysql.log
  # ----------------------------------------------------------------
  set_mysql_fields:
    actions:
      - set:
          network.protocol: "mysql"
          corelight.mysql.arg: '{{json_event.message.get("arg")}}'
          corelight.mysql.rows: '{{json_event.message.get("rows")}}'
          corelight.mysql.response: '{{json_event.message.get("response")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]
      - set:
          event.action: '{{json_event.message.get("cmd")}}'
        filter: '{{json_event.message.get("cmd") != None}}'
      - set:
          event.outcome: "success"
        filter: '{{json_event.message.get("success") == True}}'
      - set:
          event.outcome: "failure"
        filter: '{{json_event.message.get("success") == False}}'

  # ----------------------------------------------------------------
  # tunnel.log
  # ----------------------------------------------------------------
  set_tunnel_fields:
    actions:
      - set:
          corelight.tunnel.action: '{{json_event.message.get("action")}}'
          corelight.tunnel.tunnel_type: '{{json_event.message.get("tunnel_type")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]

  # ----------------------------------------------------------------
  # ipsec.log (IKE negotiation)
  # ----------------------------------------------------------------
  set_ipsec_fields:
    actions:
      - set:
          network.protocol: "ipsec"
          network.transport: "udp"
          corelight.ipsec.exchange_type: '{{json_event.message.get("exchange_type")}}'
          corelight.ipsec.initiator_spi: '{{json_event.message.get("initiator_spi")}}'
          corelight.ipsec.responder_spi: '{{json_event.message.get("responder_spi")}}'
          corelight.ipsec.message_id: '{{json_event.message.get("message_id")}}'
          corelight.ipsec.maj_ver: '{{json_event.message.get("maj_ver")}}'
          corelight.ipsec.min_ver: '{{json_event.message.get("min_ver")}}'
          corelight.ipsec.length: '{{json_event.message.get("length")}}'
          corelight.ipsec.is_orig: '{{json_event.message.get("is_orig")}}'
          corelight.ipsec.hash: '{{json_event.message.get("hash")}}'
          corelight.ipsec.certificates: '{{json_event.message.get("certificates")}}'
          corelight.ipsec.ke_dh_groups: '{{json_event.message.get("ke_dh_groups")}}'
          corelight.ipsec.notify_messages: '{{json_event.message.get("notify_messages")}}'
          corelight.ipsec.proposals: '{{json_event.message.get("proposals")}}'
          corelight.ipsec.transforms: '{{json_event.message.get("transforms")}}'
          corelight.ipsec.transform_attributes: '{{json_event.message.get("transform_attributes")}}'
          corelight.ipsec.vendor_ids: '{{json_event.message.get("vendor_ids")}}'
          corelight.ipsec.doi: '{{json_event.message.get("doi")}}'
          corelight.ipsec.situation: '{{json_event.message.get("situation")}}'
          corelight.ipsec.protocol_id: '{{json_event.message.get("protocol_id")}}'
          corelight.ipsec.flag_a: '{{json_event.message.get("flag_a")}}'
          corelight.ipsec.flag_c: '{{json_event.message.get("flag_c")}}'
          corelight.ipsec.flag_e: '{{json_event.message.get("flag_e")}}'
          corelight.ipsec.flag_i: '{{json_event.message.get("flag_i")}}'
          corelight.ipsec.flag_r: '{{json_event.message.get("flag_r")}}'
          corelight.ipsec.flag_v: '{{json_event.message.get("flag_v")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]

  # ----------------------------------------------------------------
  # ocsp.log (certificate revocation responses)
  # Note: like x509.log, this log carries no connection tuple; "id" is the
  # Zeek file identifier of the OCSP response.
  # ----------------------------------------------------------------
  set_ocsp_fields:
    actions:
      - set:
          corelight.ocsp.cert_status: '{{json_event.message.get("certStatus")}}'
          corelight.ocsp.hash_algorithm: '{{json_event.message.get("hashAlgorithm")}}'
          corelight.ocsp.issuer_key_hash: '{{json_event.message.get("issuerKeyHash")}}'
          corelight.ocsp.issuer_name_hash: '{{json_event.message.get("issuerNameHash")}}'
          corelight.ocsp.serial_number: '{{json_event.message.get("serialNumber")}}'
          corelight.ocsp.this_update: '{{json_event.message.get("thisUpdate")}}'
          corelight.ocsp.next_update: '{{json_event.message.get("nextUpdate")}}'
          corelight.ocsp.revoke_reason: '{{json_event.message.get("revokereason")}}'
          corelight.ocsp.revoke_time: '{{json_event.message.get("revoketime")}}'
          corelight.fuid: '{{json_event.message.get("id")}}'
      - set:
          event.category: ["file"]
          event.type: ["info"]

  # ----------------------------------------------------------------
  # encrypted_dns.log
  # This log flags DNS resolution hidden inside TLS (DoH, DoT), which is
  # why it is reported as a detection and not as a plain protocol event.
  # ----------------------------------------------------------------
  set_encrypted_dns_fields:
    actions:
      - set:
          network.protocol: "dns"
          destination.ip: '{{json_event.message.get("resp_h")}}'
          tls.client.server_name: '{{json_event.message.get("sni")}}'
          corelight.encrypted_dns.match: '{{json_event.message.get("match")}}'
          corelight.encrypted_dns.cert_cn: '{{json_event.message.get("cert.cn")}}'
          corelight.encrypted_dns.cert_sans: '{{json_event.message.get("cert.sans")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.category: ["network", "intrusion_detection"]
          event.type: ["info"]

  # ----------------------------------------------------------------
  # software.log
  # Note: Zeek reports the version as separate components. They are kept
  # as such rather than recomposed into a single version string.
  # ----------------------------------------------------------------
  set_software_fields:
    actions:
      - set:
          package.name: '{{json_event.message.get("name")}}'
          corelight.software.type: '{{json_event.message.get("software_type")}}'
          corelight.software.unparsed_version: '{{json_event.message.get("unparsed_version")}}'
          host.ip: '{{json_event.message.get("host_header")}}'
          corelight.software.host: '{{json_event.message.get("host_header")}}'
          corelight.software.port: '{{json_event.message.get("host_p")}}'
          corelight.software.version.major: '{{json_event.message.get("version.major")}}'
          corelight.software.version.minor: '{{json_event.message.get("version.minor")}}'
          corelight.software.version.minor2: '{{json_event.message.get("version.minor2")}}'
          corelight.software.version.minor3: '{{json_event.message.get("version.minor3")}}'
          corelight.software.version.addl: '{{json_event.message.get("version.addl")}}'
      - set:
          event.type: ["info"]
      - set:
          url.original: '{{json_event.message.get("url")}}'
        filter: '{{json_event.message.get("url") != None}}'

  # ----------------------------------------------------------------
  # known_users.log
  # ----------------------------------------------------------------
  set_known_users_fields:
    actions:
      - set:
          user.name: '{{json_event.message.get("user")}}'
          host.ip: '{{json_event.message.get("host_ip")}}'
          destination.ip: '{{json_event.message.get("server_ip")}}'
          corelight.known.num_instances: '{{json_event.message.get("num_instances")}}'
          corelight.known.num_conns: '{{json_event.message.get("num_conns")}}'
          corelight.known.annotations: '{{json_event.message.get("annotations")}}'
          corelight.known.last_active_interval: '{{json_event.message.get("last_active_interval")}}'
          corelight.known.last_active_session: '{{json_event.message.get("last_active_session")}}'
          corelight.kuid: '{{json_event.message.get("kuid")}}'
      - set:
          event.type: ["info"]
      - set:
          network.protocol: '{{json_event.message.get("protocol") | lower}}'
        filter: '{{json_event.message.get("protocol") != None}}'
      - set:
          event.duration: '{{(json_event.message.get("duration") | float * 1000000000) | int}}'
        filter: '{{json_event.message.get("duration") not in [None, "-"]}}'

  # ----------------------------------------------------------------
  # weird.log (protocol anomalies)
  # ----------------------------------------------------------------
  set_weird_fields:
    actions:
      - set:
          corelight.weird.name: '{{json_event.message.get("name")}}'
          corelight.weird.addl: '{{json_event.message.get("addl")}}'
          corelight.weird.notice: '{{json_event.message.get("notice")}}'
          corelight.weird.peer: '{{json_event.message.get("peer")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["info"]
      - set:
          event.action: '{{json_event.message.get("name")}}'
        filter: '{{json_event.message.get("name") != None}}'

  # ----------------------------------------------------------------
  # dnp3.log (industrial control)
  # ----------------------------------------------------------------
  set_dnp3_fields:
    actions:
      - set:
          network.protocol: "dnp3"
          network.transport: '{{json_event.message.get("proto")}}'
          corelight.dnp3.fc_request: '{{json_event.message.get("fc_request")}}'
          corelight.dnp3.fc_reply: '{{json_event.message.get("fc_reply")}}'
          corelight.dnp3.iin: '{{json_event.message.get("iin")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]

  # ----------------------------------------------------------------
  # modbus.log (industrial control)
  # Note: Corelight renamed Zeek's "func" to "function" along the way, so
  # both spellings are read.
  # ----------------------------------------------------------------
  set_modbus_fields:
    actions:
      - set:
          network.protocol: "modbus"
          network.transport: '{{json_event.message.get("proto")}}'
          corelight.modbus.exception: '{{json_event.message.get("exception")}}'
          # Transaction identifier, unit (slave) address and whether the record
          # is the request or the response.
          corelight.modbus.tid: '{{json_event.message.get("tid")}}'
          corelight.modbus.unit: '{{json_event.message.get("unit")}}'
          corelight.modbus.pdu_type: '{{json_event.message.get("pdu_type")}}'
          corelight.modbus.register: '{{json_event.message.get("register")}}'
          corelight.modbus.track_address: '{{json_event.message.get("track_address")}}'
          corelight.modbus.old_value: '{{json_event.message.get("old_val")}}'
          corelight.modbus.new_value: '{{json_event.message.get("new_val")}}'
          corelight.modbus.delta: '{{json_event.message.get("delta")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]
      # Depending on the sensor version the function is reported either as
      # "func" or as "function".
      - set:
          corelight.modbus.function: '{{json_event.message.get("func")}}'
          event.action: '{{json_event.message.get("func")}}'
        filter: '{{json_event.message.get("func") != None}}'
      - set:
          corelight.modbus.function: '{{json_event.message.get("function")}}'
          event.action: '{{json_event.message.get("function")}}'
        filter: '{{json_event.message.get("function") != None}}'

  # ----------------------------------------------------------------
  # s7comm.log (industrial control)
  # ----------------------------------------------------------------
  set_s7comm_fields:
    actions:
      - set:
          network.protocol: "s7comm"
          corelight.s7comm.is_orig: '{{json_event.message.get("is_orig")}}'
          corelight.s7comm.rosctr_code: '{{json_event.message.get("rosctr_code")}}'
          corelight.s7comm.rosctr_name: '{{json_event.message.get("rosctr_name")}}'
          corelight.s7comm.pdu_reference: '{{json_event.message.get("pdu_reference")}}'
          corelight.s7comm.function_code: '{{json_event.message.get("function_code")}}'
          corelight.s7comm.function_name: '{{json_event.message.get("function_name")}}'
          corelight.s7comm.subfunction_code: '{{json_event.message.get("subfunction_code")}}'
          corelight.s7comm.subfunction_name: '{{json_event.message.get("subfunction_name")}}'
          corelight.s7comm.error_class: '{{json_event.message.get("error_class")}}'
          corelight.s7comm.error_code: '{{json_event.message.get("error_code")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]

  # ----------------------------------------------------------------
  # known_hosts.log
  # Note: the known_* logs are periodic inventories, not connection
  # events; they carry a "kuid" instead of a connection tuple.
  # ----------------------------------------------------------------
  set_known_hosts_fields:
    actions:
      - set:
          host.ip: '{{json_event.message.get("host_ip")}}'
          corelight.known.host_type: '{{json_event.message.get("host_type")}}'
          corelight.known.num_conns: '{{json_event.message.get("num_conns")}}'
          corelight.known.long_conns: '{{json_event.message.get("long_conns")}}'
          corelight.known.annotations: '{{json_event.message.get("annotations")}}'
          corelight.known.last_active_interval: '{{json_event.message.get("last_active_interval")}}'
          corelight.known.last_active_session: '{{json_event.message.get("last_active_session")}}'
          corelight.known.criticality: '{{json_event.message.get("ep.criticality")}}'
          corelight.known.description: '{{json_event.message.get("ep.desc")}}'
          corelight.known.source: '{{json_event.message.get("ep.source")}}'
          corelight.known.status: '{{json_event.message.get("ep.status")}}'
          corelight.kuid: '{{json_event.message.get("kuid")}}'
      - set:
          event.category: ["network", "host"]
          event.type: ["info"]
      # The connection counters are spelled n_* by the sensor and conns_* by
      # older builds; both are read into the same fields.
      - set:
          corelight.known.conns_opened: '{{json_event.message.get("n_opened")}}'
          corelight.known.conns_closed: '{{json_event.message.get("n_closed")}}'
          corelight.known.conns_pending: '{{json_event.message.get("n_pending")}}'
        filter: '{{json_event.message.get("n_opened") != None}}'
      - set:
          corelight.known.conns_opened: '{{json_event.message.get("conns_opened")}}'
          corelight.known.conns_closed: '{{json_event.message.get("conns_closed")}}'
          corelight.known.conns_pending: '{{json_event.message.get("conns_pending")}}'
        filter: '{{json_event.message.get("conns_opened") != None}}'
      # The known_* logs report how long the entity was observed over the
      # interval the record covers.
      - set:
          event.duration: '{{(json_event.message.get("duration") | float * 1000000000) | int}}'
        filter: '{{json_event.message.get("duration") not in [None, "-"]}}'

  # ----------------------------------------------------------------
  # known_services.log
  # ----------------------------------------------------------------
  set_known_services_fields:
    actions:
      - set:
          host.ip: '{{json_event.message.get("host_ip")}}'
          # The service is reachable at host_ip:port_num, so the pair is also
          # exposed as the destination of a would-be connection.
          destination.ip: '{{json_event.message.get("host_ip")}}'
          destination.port: '{{json_event.message.get("port_num")}}'
          # The transport is spelled "protocol" by the sensor and "port_proto"
          # by older builds.
          network.transport: '{{json_event.message.get("port_proto")}}'
          corelight.known.service: '{{json_event.message.get("service")}}'
          corelight.known.application: '{{json_event.message.get("app")}}'
          corelight.known.software: '{{json_event.message.get("software")}}'
          corelight.known.num_conns: '{{json_event.message.get("num_conns")}}'
          corelight.known.num_conns_complete: '{{json_event.message.get("num_conns_complete")}}'
          corelight.known.num_conns_pending: '{{json_event.message.get("num_conns_pending")}}'
          corelight.known.annotations: '{{json_event.message.get("annotations")}}'
          corelight.known.last_active_interval: '{{json_event.message.get("last_active_interval")}}'
          corelight.known.last_active_session: '{{json_event.message.get("last_active_session")}}'
          corelight.kuid: '{{json_event.message.get("kuid")}}'
      - set:
          event.type: ["info"]
      - set:
          network.transport: '{{json_event.message.get("protocol")}}'
        filter: '{{json_event.message.get("port_proto") == None and json_event.message.get("protocol") != None}}'
      # "service" is the set of application protocols Zeek recognised on the
      # port; ECS network.protocol holds a single one.
      - set:
          network.protocol: '{{json_event.message.get("service")[0] | lower}}'
        filter: '{{json_event.message.get("service") is sequence and json_event.message.get("service") is not string and json_event.message.get("service") | length > 0}}'
      - set:
          network.protocol: '{{json_event.message.get("service")}}'
        filter: '{{json_event.message.get("service") is string}}'
      - set:
          event.duration: '{{(json_event.message.get("duration") | float * 1000000000) | int}}'
        filter: '{{json_event.message.get("duration") not in [None, "-"]}}'

  # ----------------------------------------------------------------
  # known_certs.log
  # ----------------------------------------------------------------
  set_known_certs_fields:
    actions:
      - set:
          host.ip: '{{json_event.message.get("host_ip")}}'
          # The certificate was seen being served on host_ip:port.
          destination.ip: '{{json_event.message.get("host_ip")}}'
          destination.port: '{{json_event.message.get("port")}}'
          network.transport: '{{json_event.message.get("protocol")}}'
          file.hash.sha1: '{{json_event.message.get("hash")}}'
          x509.subject.distinguished_name: '{{json_event.message.get("subject")}}'
          x509.issuer.distinguished_name: '{{json_event.message.get("issuer_subject")}}'
          x509.serial_number: '{{json_event.message.get("serial")}}'
          corelight.known.num_conns: '{{json_event.message.get("num_conns")}}'
          corelight.known.num_instances: '{{json_event.message.get("num_instances")}}'
          corelight.known.annotations: '{{json_event.message.get("annotations")}}'
          corelight.known.last_active_interval: '{{json_event.message.get("last_active_interval")}}'
          corelight.known.last_active_session: '{{json_event.message.get("last_active_session")}}'
          corelight.kuid: '{{json_event.message.get("kuid")}}'
      - set:
          event.category: ["network", "file"]
          event.type: ["info"]
      - set:
          event.duration: '{{(json_event.message.get("duration") | float * 1000000000) | int}}'
        filter: '{{json_event.message.get("duration") not in [None, "-"]}}'

  # ----------------------------------------------------------------
  # known_domains.log
  # ----------------------------------------------------------------
  set_known_domains_fields:
    actions:
      - set:
          host.ip: '{{json_event.message.get("host_ip")}}'
          destination.domain: '{{json_event.message.get("domain")}}'
          corelight.known.domain: '{{json_event.message.get("domain")}}'
          corelight.known.protocols: '{{json_event.message.get("protocols")}}'
          corelight.known.num_instances: '{{json_event.message.get("num_instances")}}'
          corelight.known.annotations: '{{json_event.message.get("annotations")}}'
          corelight.kuid: '{{json_event.message.get("kuid")}}'
      # The application protocols the entity was seen using; ECS
      # network.protocol holds a single one.
      - set:
          network.protocol: '{{json_event.message.get("protocols")[0] | lower}}'
        filter: '{{json_event.message.get("protocols") is sequence and json_event.message.get("protocols") is not string and json_event.message.get("protocols") | length > 0}}'
      - set:
          event.category: ["network", "host"]
          event.type: ["info"]
      - set:
          event.duration: '{{(json_event.message.get("duration") | float * 1000000000) | int}}'
        filter: '{{json_event.message.get("duration") not in [None, "-"]}}'

  # ----------------------------------------------------------------
  # known_names.log
  # ----------------------------------------------------------------
  set_known_names_fields:
    actions:
      - set:
          host.ip: '{{json_event.message.get("host_ip")}}'
          host.hostname: '{{json_event.message.get("hostname")}}'
          host.name: '{{json_event.message.get("hostname")}}'
          corelight.known.protocols: '{{json_event.message.get("protocols")}}'
          corelight.known.num_instances: '{{json_event.message.get("num_instances")}}'
          corelight.known.annotations: '{{json_event.message.get("annotations")}}'
          corelight.kuid: '{{json_event.message.get("kuid")}}'
      # The application protocols the entity was seen using; ECS
      # network.protocol holds a single one.
      - set:
          network.protocol: '{{json_event.message.get("protocols")[0] | lower}}'
        filter: '{{json_event.message.get("protocols") is sequence and json_event.message.get("protocols") is not string and json_event.message.get("protocols") | length > 0}}'
      - set:
          event.category: ["network", "host"]
          event.type: ["info"]
      - set:
          event.duration: '{{(json_event.message.get("duration") | float * 1000000000) | int}}'
        filter: '{{json_event.message.get("duration") not in [None, "-"]}}'

  # ----------------------------------------------------------------
  # known_devices.log
  # ----------------------------------------------------------------
  set_known_devices_fields:
    actions:
      - set:
          host.ip: '{{json_event.message.get("host_ip")}}'
          host.mac: '{{json_event.message.get("mac")}}'
          # The organisation the MAC prefix belongs to, or "Randomized" when the
          # device rotates its address.
          corelight.known.vendor_mac: '{{json_event.message.get("vendor_mac")}}'
          corelight.known.protocols: '{{json_event.message.get("protocols")}}'
          corelight.known.num_instances: '{{json_event.message.get("num_instances")}}'
          corelight.known.annotations: '{{json_event.message.get("annotations")}}'
          corelight.kuid: '{{json_event.message.get("kuid")}}'
      # The application protocols the entity was seen using; ECS
      # network.protocol holds a single one.
      - set:
          network.protocol: '{{json_event.message.get("protocols")[0] | lower}}'
        filter: '{{json_event.message.get("protocols") is sequence and json_event.message.get("protocols") is not string and json_event.message.get("protocols") | length > 0}}'
      - set:
          event.category: ["network", "host"]
          event.type: ["info"]
      - set:
          event.duration: '{{(json_event.message.get("duration") | float * 1000000000) | int}}'
        filter: '{{json_event.message.get("duration") not in [None, "-"]}}'

  # ----------------------------------------------------------------
  # modbus_detailed.log
  # The Modbus header fields (tid, unit, function) are shared with
  # modbus.log so that one search matches both.
  # ----------------------------------------------------------------
  set_modbus_detailed_fields:
    actions:
      - set:
          network.protocol: "modbus"
          event.action: '{{json_event.message.get("func")}}'
          corelight.modbus.function: '{{json_event.message.get("func")}}'
          corelight.modbus.tid: '{{json_event.message.get("tid")}}'
          corelight.modbus.unit: '{{json_event.message.get("unit")}}'
          corelight.modbus.is_orig: '{{json_event.message.get("is_orig")}}'
          corelight.modbus.request_response: '{{json_event.message.get("request_response")}}'
          # The register range the operation addresses, and the data it carries.
          corelight.modbus.address: '{{json_event.message.get("address")}}'
          corelight.modbus.quantity: '{{json_event.message.get("quantity")}}'
          corelight.modbus.values: '{{json_event.message.get("values")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]

  # ----------------------------------------------------------------
  # modbus_read_device_identification.log
  # ----------------------------------------------------------------
  set_modbus_rdi_fields:
    actions:
      - set:
          network.protocol: "modbus"
          event.action: '{{json_event.message.get("func")}}'
          corelight.modbus.function: '{{json_event.message.get("func")}}'
          corelight.modbus.tid: '{{json_event.message.get("tid")}}'
          corelight.modbus.unit: '{{json_event.message.get("unit")}}'
          corelight.modbus.is_orig: '{{json_event.message.get("is_orig")}}'
          corelight.modbus.request_response: '{{json_event.message.get("request_response")}}'
          # Which identification object of the device is being read; this is how
          # OT asset discovery over Modbus becomes visible.
          corelight.modbus.mei_type: '{{json_event.message.get("mei_type")}}'
          corelight.modbus.device_id_code: '{{json_event.message.get("device_id_code")}}'
          corelight.modbus.object_id_code: '{{json_event.message.get("object_id_code")}}'
          corelight.modbus.object_id: '{{json_event.message.get("object_id")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]

  # ----------------------------------------------------------------
  # cotp.log (ISO 8073 transport, the layer S7comm rides on)
  # ----------------------------------------------------------------
  set_cotp_fields:
    actions:
      - set:
          network.protocol: "cotp"
          event.action: '{{json_event.message.get("pdu_name")}}'
          corelight.cotp.pdu_code: '{{json_event.message.get("pdu_code")}}'
          corelight.cotp.pdu_name: '{{json_event.message.get("pdu_name")}}'
          corelight.cotp.is_orig: '{{json_event.message.get("is_orig")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]

  # ----------------------------------------------------------------
  # s7comm_read_szl.log (reading a PLC's system status list)
  # ----------------------------------------------------------------
  set_s7comm_read_szl_fields:
    actions:
      - set:
          network.protocol: "s7comm"
          event.action: '{{json_event.message.get("method")}}'
          corelight.s7comm.is_orig: '{{json_event.message.get("is_orig")}}'
          corelight.s7comm.pdu_reference: '{{json_event.message.get("pdu_reference")}}'
          corelight.s7comm.method: '{{json_event.message.get("method")}}'
          # Which system status list is read; "Component Identification" is how a
          # PLC inventory scan shows up.
          corelight.s7comm.szl_id: '{{json_event.message.get("szl_id")}}'
          corelight.s7comm.szl_id_name: '{{json_event.message.get("szl_id_name")}}'
          corelight.s7comm.szl_index: '{{json_event.message.get("szl_index")}}'
          corelight.s7comm.return_code: '{{json_event.message.get("return_code")}}'
          corelight.s7comm.return_code_name: '{{json_event.message.get("return_code_name")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]
      - set:
          event.outcome: "success"
        filter: '{{json_event.message.get("return_code_name") == "Success"}}'
      - set:
          event.outcome: "failure"
        filter: '{{json_event.message.get("return_code_name") not in [None, "Success"]}}'

  # ----------------------------------------------------------------
  # dnp3_objects.log
  # ----------------------------------------------------------------
  set_dnp3_objects_fields:
    actions:
      - set:
          network.protocol: "dnp3"
          event.action: '{{json_event.message.get("function_code")}}'
          corelight.dnp3.function_code: '{{json_event.message.get("function_code")}}'
          corelight.dnp3.object_type: '{{json_event.message.get("object_type")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]

  # ----------------------------------------------------------------
  # dnp3_control.log
  # This is the log that shows an outstation being commanded: a
  # SELECT / OPERATE pair on a control relay output block.
  # ----------------------------------------------------------------
  set_dnp3_control_fields:
    actions:
      - set:
          network.protocol: "dnp3"
          event.action: '{{json_event.message.get("function_code")}}'
          corelight.dnp3.function_code: '{{json_event.message.get("function_code")}}'
          corelight.dnp3.block_type: '{{json_event.message.get("block_type")}}'
          corelight.dnp3.index_number: '{{json_event.message.get("index_number")}}'
          corelight.dnp3.trip_control_code: '{{json_event.message.get("trip_control_code")}}'
          corelight.dnp3.operation_type: '{{json_event.message.get("operation_type")}}'
          corelight.dnp3.execute_count: '{{json_event.message.get("execute_count")}}'
          corelight.dnp3.on_time: '{{json_event.message.get("on_time")}}'
          corelight.dnp3.off_time: '{{json_event.message.get("off_time")}}'
          corelight.dnp3.status_code: '{{json_event.message.get("status_code")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]
      - set:
          event.outcome: "success"
        filter: '{{json_event.message.get("status_code") == "Success"}}'
      - set:
          event.outcome: "failure"
        filter: '{{json_event.message.get("status_code") not in [None, "Success"]}}'

  # ----------------------------------------------------------------
  # enip.log (EtherNet/IP)
  # ----------------------------------------------------------------
  set_enip_fields:
    actions:
      - set:
          network.protocol: "enip"
          event.action: '{{json_event.message.get("enip_command")}}'
          corelight.enip.command: '{{json_event.message.get("enip_command")}}'
          corelight.enip.command_code: '{{json_event.message.get("enip_command_code")}}'
          corelight.enip.status: '{{json_event.message.get("enip_status")}}'
          corelight.enip.length: '{{json_event.message.get("length")}}'
          corelight.enip.session_handle: '{{json_event.message.get("session_handle")}}'
          corelight.enip.sender_context: '{{json_event.message.get("sender_context")}}'
          corelight.enip.options: '{{json_event.message.get("options")}}'
          corelight.enip.is_orig: '{{json_event.message.get("is_orig")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "protocol"]
      - set:
          event.outcome: "success"
        filter: '{{json_event.message.get("enip_status") == "Success"}}'
      - set:
          event.outcome: "failure"
        filter: '{{json_event.message.get("enip_status") not in [None, "Success"]}}'

  # ----------------------------------------------------------------
  # etc_viz.log (Encrypted Traffic Collection visibility)
  # Reports how much of each direction of a session was actually
  # encrypted. This log carries no connection tuple: the server side is
  # reported as server_a / server_p.
  # ----------------------------------------------------------------
  set_etc_viz_fields:
    actions:
      - set:
          destination.ip: '{{json_event.message.get("server_a")}}'
          destination.port: '{{json_event.message.get("server_p")}}'
          # Two letters, one per direction, saying whether it looked clear (c/C)
          # or encrypted (e/E).
          corelight.etc_viz.viz_stat: '{{json_event.message.get("viz_stat")}}'
          corelight.etc_viz.c2s_size: '{{json_event.message.get("c2s_viz.size")}}'
          corelight.etc_viz.c2s_enc_dev: '{{json_event.message.get("c2s_viz.enc_dev")}}'
          corelight.etc_viz.c2s_enc_frac: '{{json_event.message.get("c2s_viz.enc_frac")}}'
          corelight.etc_viz.c2s_clr_frac: '{{json_event.message.get("c2s_viz.clr_frac")}}'
          corelight.etc_viz.c2s_pdu1_enc: '{{json_event.message.get("c2s_viz.pdu1_enc")}}'
          corelight.etc_viz.c2s_clr_ex: '{{json_event.message.get("c2s_viz.clr_ex")}}'
          corelight.etc_viz.s2c_size: '{{json_event.message.get("s2c_viz.size")}}'
          corelight.etc_viz.s2c_enc_dev: '{{json_event.message.get("s2c_viz.enc_dev")}}'
          corelight.etc_viz.s2c_enc_frac: '{{json_event.message.get("s2c_viz.enc_frac")}}'
          corelight.etc_viz.s2c_clr_frac: '{{json_event.message.get("s2c_viz.clr_frac")}}'
          corelight.etc_viz.s2c_pdu1_enc: '{{json_event.message.get("s2c_viz.pdu1_enc")}}'
          corelight.etc_viz.s2c_clr_ex: '{{json_event.message.get("s2c_viz.clr_ex")}}'
          corelight.etc_viz.service: '{{json_event.message.get("service")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["connection", "info"]

  # ----------------------------------------------------------------
  # analyzer.log
  # Reports a protocol analyzer that was disabled or that failed on a
  # connection — useful both for tuning and for spotting traffic
  # deliberately shaped to confuse the sensor.
  # ----------------------------------------------------------------
  set_analyzer_fields:
    actions:
      - set:
          network.transport: '{{json_event.message.get("proto")}}'
          corelight.analyzer.kind: '{{json_event.message.get("analyzer_kind")}}'
          corelight.analyzer.name: '{{json_event.message.get("analyzer_name")}}'
          corelight.analyzer.failure_reason: '{{json_event.message.get("failure_reason")}}'
          corelight.analyzer.failure_data: '{{json_event.message.get("failure_data")}}'
          corelight.uid: '{{json_event.message.get("uid")}}'
      - set:
          event.type: ["info"]
      - set:
          network.protocol: '{{json_event.message.get("analyzer_name") | lower}}'
        filter: '{{json_event.message.get("analyzer_kind") == "protocol" and json_event.message.get("analyzer_name") != None}}'
      - set:
          event.outcome: "failure"
        filter: '{{json_event.message.get("failure_reason") != None}}'

  # ----------------------------------------------------------------
  # unknown_protocols.log
  # A payload the sensor could not attribute to any analyzer. There is
  # no connection tuple: only the analyzer stack and the first bytes.
  # ----------------------------------------------------------------
  set_unknown_protocols_fields:
    actions:
      - set:
          corelight.unknown_protocols.analyzer: '{{json_event.message.get("analyzer")}}'
          corelight.unknown_protocols.analyzer_history: '{{json_event.message.get("analyzer_history")}}'
          corelight.unknown_protocols.protocol_id: '{{json_event.message.get("protocol_id")}}'
          corelight.unknown_protocols.protocol_name: '{{json_event.message.get("protocol_name")}}'
          corelight.unknown_protocols.first_bytes: '{{json_event.message.get("first_bytes")}}'
      - set:
          event.type: ["info"]

  # ----------------------------------------------------------------
  # generic_dns_tunnels.log
  # A detection: a domain carrying more DNS payload than a resolver
  # ever would, i.e. tunnelling or exfiltration over DNS.
  # ----------------------------------------------------------------
  set_generic_dns_tunnels_fields:
    actions:
      - set:
          source.ip: '{{json_event.message.get("dns_client")}}'
          network.protocol: "dns"
          dns.question.registered_domain: '{{json_event.message.get("domain")}}'
          # Volume seen for that domain over the window the sensor measured.
          corelight.generic_dns_tunnels.bytes: '{{json_event.message.get("bytes")}}'
          corelight.generic_dns_tunnels.capture_secs: '{{json_event.message.get("capture_secs")}}'
      - set:
          event.kind: "alert"
          event.category: ["network", "intrusion_detection"]
          event.type: ["info"]
