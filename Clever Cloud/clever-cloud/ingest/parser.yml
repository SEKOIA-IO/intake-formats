name: clever-cloud
ignored_values: []
pipeline:
  - name: parsed_header
    external:
      name: json.parse-json
      properties:
        input_field: "{{original.message}}"
        output_field: message
  - name: parsed_event
    filter: >-
      {{parsed_header.message.message is defined and
      parsed_header.message.message.startswith('{')}}
    external:
      name: json.parse-json
      properties:
        input_field: "{{parsed_header.message.message}}"
        output_field: message
  - name: parsed_event
    filter: >-
      {{parsed_header.message.message is not defined or not
      parsed_header.message.message.startswith('{')}}
    external:
      name: grok.match
      properties:
        input_field: "{{parsed_header.message.message}}"
        output_field: message
        pattern: (%{CLF_Format}|%{System_log_Format}|%{INFO_Format}|%{FALLBACK})
        custom_patterns:
          CLF_Format: >-
            %{IP:source_ip}(:%{INT:source_port})? (-|%{DATA}) (-|%{DATA})
            (-|%{DATA}) (-|%{DATA:user_email}) \[%{DATA}\]
            (%{IPORHOST:url_domain}(:%{INT:destination_port})?)
            %{WORD:http_method} (-|%{DATA}) \"%{DATA:url_path}\"
            (%{WORD:http_scheme}/(?<http_version>[\[0-9\]\.]+))
            \"%{DATA:user_agent}\" %{INT:response_status_code}
            %{INT:destination_bytes} %{GREEDYDATA}
          System_log_Format: >-
            \[%{YEAR}\/%{MONTHNUM2}\/%{MONTHDAY} %{TIME}\] \[(?<caller>[^\]]+)\]
            %{GREEDYDATA:msg}
          INFO_Format: >-
            (%{YEAR}\-%{MONTHNUM2}\-%{MONTHDAY} %{TIME},%{INT})? INFO\:?
            %{GREEDYDATA:msg}
          FALLBACK: "%{GREEDYDATA:msg}"
  - name: parsed_date
    external:
      name: date.parse
      properties:
        input_field: "{{parsed_header.message.date}}"
        output_field: timestamp
        format: null
        timezone: UTC
  - name: ecs_observer_mapping
  - name: ecs_event_mapping
  - name: ecs_error_mapping
  - name: ecs_log_mapping
  - name: ecs_cloud_mapping
  - name: ecs_process_mapping
  - name: ecs_http_mapping
  - name: ecs_url_mapping
  - name: ecs_network_mapping
  - name: ecs_source_mapping
  - name: ecs_destination_mapping
  - name: ecs_user_mapping
  - name: ecs_user_agent_mapping
  - name: ecs_email_mapping
  - name: custom_fields_mapping
  - name: ecs_kind_categorization
  - name: ecs_web_categorization
    filter: >-
      {{not final.event.category is defined and (final.http is defined or
      final.url is defined)}}
  - name: ecs_email_categorization
    filter: "{{final.email is defined}}"
  - name: ecs_network_categorization
    filter: >-
      {{not final.event.category is defined and (final.source is defined or
      final.destination is defined)}}
  - name: ecs_host_categorization
    filter: "{{not final.event.category is defined}}"
  - name: ecs_outcome_categorization
    filter: '{{final.event.type != "info"}}'
stages:
  ecs_observer_mapping:
    actions:
      - set:
          observer.type: cloud
          observer.vendor: Clever Cloud
  ecs_event_mapping:
    actions:
      - set:
          "@timestamp": "{{parsed_date.timestamp}}"
          event.action: "{{parsed_event.message.msg}}"
          event.reason: "{{parsed_event.message.reason}}"
  ecs_error_mapping:
    actions:
      - set:
          error.type: "{{parsed_event.message.err_where}}"
          error.message: "{{parsed_event.message.error}}"
  ecs_log_mapping:
    actions:
      - set:
          log.priority: "{{parsed_header.message.priority}}"
          log.syslog.facility.name: "{{parsed_header.message.facility}}"
          log.syslog.severity.name: "{{parsed_header.message.severity}}"
  ecs_cloud_mapping:
    actions:
      - set:
          cloud.region: "{{parsed_header.message.region}}"
          cloud.instance.id: "{{parsed_header.message.instanceId}}"
          cloud.service.name: "{{parsed_header.message.service}}"
          cloud.availability_zone: "{{parsed_header.message.zone}}"
  ecs_process_mapping:
    actions:
      - set:
          process.pid: "{{parsed_header.message.pid}}"
  ecs_http_mapping:
    actions:
      - set:
          http.request.method: "{{parsed_header.message.http.request.method}}"
          http.response.status_code: "{{parsed_header.message.http.response.statusCode}}"
        filter: "{{parsed_header.message.http is defined}}"
      - set:
          http.request.method: "{{parsed_event.message.http_method or parsed_event.message.method}}"
          http.response.status_code: >-
            {{parsed_event.message.response_status_code or
            parsed_event.message.status_code or parsed_event.message.http_code}}
          http.request.id: "{{parsed_event.message.request_id}}"
        filter: "{{parsed_event.message is defined and parsed_event.message != None}}"
  ecs_url_mapping:
    actions:
      - set:
          url.path: "{{parsed_header.message.http.request.path}}"
          url.domain: "{{parsed_header.message.http.request.host}}"
          url.scheme: "{{parsed_header.message.http.request.scheme}}"
        filter: "{{parsed_header.message.http is defined}}"
      - set:
          url.original: "{{parsed_event.message.url}}"
          url.path: "{{parsed_event.message.url_path or parsed_event.message.path}}"
          url.domain: "{{parsed_event.message.url_domain}}"
        filter: "{{parsed_event.message is defined and parsed_event.message != None}}"
      - set:
          url.scheme: "{{parsed_event.message.http_scheme|lower}}"
        filter: >-
          {{parsed_event.message is defined and parsed_event.message != None and
          parsed_event.message.http_scheme != None}}
      - set:
          url.full: "{{final.url.scheme}}://{{final.url.domain + final.url.path}}"
  ecs_network_mapping:
    actions:
      - set:
          network.direction: inbound
        filter: >-
          {{parsed_header.message.http is defined or
          parsed_header.message.source is defined or
          parsed_header.message.destination is defined}}
  ecs_source_mapping:
    actions:
      - set:
          source.ip: "{{parsed_header.message.source.ip}}"
          source.port: "{{parsed_header.message.source.port}}"
          source.geo.city_name: "{{parsed_header.message.source.city}}"
          source.geo.location.lat: "{{parsed_header.message.source.geoLocation.latitude}}"
          source.geo.location.lon: "{{parsed_header.message.source.geoLocation.longitude}}"
          source.geo.country_iso_code: "{{parsed_header.message.source.countryCode}}"
      - set:
          source.ip: "{{parsed_event.message.ip_addr}}"
        filter: "{{parsed_event.message is defined and parsed_event.message != None}}"
      - set:
          source.bytes: "{{parsed_header.message.source.bytesOut}}"
        filter: '{{final.network.direction == "outbound"}}'
      - set:
          source.bytes: "{{parsed_header.message.source.bytesIn}}"
        filter: '{{final.network.direction == "inbound"}}'
      - set:
          source.ip: "{{parsed_event.message.source_ip}}"
          source.port: "{{parsed_event.message.source_port}}"
        filter: "{{parsed_event.message is defined and parsed_event.message != None}}"
  ecs_destination_mapping:
    actions:
      - set:
          destination.ip: "{{parsed_header.message.destination.ip}}"
          destination.port: "{{parsed_header.message.destination.port}}"
          destination.geo.city_name: "{{parsed_header.message.destination.city}}"
          destination.geo.location.lat: "{{parsed_header.message.destination.geoLocation.latitude}}"
          destination.geo.location.lon: "{{parsed_header.message.destination.geoLocation.longitude}}"
          destination.geo.country_iso_code: "{{parsed_header.message.destination.countryCode}}"
      - set:
          destination.bytes: "{{parsed_header.message.source.bytesOut}}"
        filter: '{{final.network.direction == "inbound"}}'
      - set:
          destination.bytes: "{{parsed_header.message.source.bytesIn}}"
        filter: '{{final.network.direction == "outbound"}}'
      - set:
          destination.port: "{{parsed_event.message.destination_port}}"
          destination.bytes: "{{parsed_event.message.destination_bytes}}"
        filter: "{{parsed_event.message is defined and parsed_event.message != None}}"
  ecs_user_mapping:
    actions:
      - set:
          user.id: "{{parsed_event.message.user_id}}"
          user.email: "{{parsed_event.message.user_email}}"
  ecs_user_agent_mapping:
    actions:
      - set:
          user_agent.original: "{{parsed_event.message.user_agent}}"
  ecs_email_mapping:
    actions:
      - set:
          email.to.address: "{{parsed_event.message.to}}"
        filter: "{{'sending mail' in final.event.action}}"
  custom_fields_mapping:
    actions:
      - set:
          clever_cloud.commit.id: "{{parsed_header.message.commitId}}"
          clever_cloud.zone.name: "{{parsed_header.message.zone}}"
          clever_cloud.request.id: "{{parsed_header.message.requestId}}"
          clever_cloud.deployment.id: "{{parsed_header.message.deploymentId}}"
          clever_cloud.application.id: "{{parsed_header.message.applicationId}}"
          clever_cloud.id: "{{parsed_header.message.id}}"
      - set:
          clever_cloud.action.status: "{{parsed_event.message.status}}"
          clever_cloud.action.caller: "{{parsed_event.message.caller}}"
  ecs_kind_categorization:
    actions:
      - set:
          event.kind: event
  ecs_web_categorization:
    actions:
      - set:
          event.category: "{{(final.event.category|default([])) + ['web']}}"
      - set:
          event.type: "{{(final.event.type|default([])) + ['access']}}"
        filter: >-
          {{'web' in final.event.category and not 'access' in final.event.type
          and (final.http.response.status_code > 199 and
          final.http.response.status_code < 400 )}}
      - set:
          event.type: "{{(final.event.type|default([])) + ['error']}}"
        filter: >-
          {{'web' in final.event.category and not 'error' in final.event.type
          and (final.http.response.status_code > 399 and
          final.http.response.status_code < 600 )}}
      - set:
          event.type: "{{(final.event.type|default([])) + ['info']}}"
        filter: >-
          {{'web' in final.event.category and not ('access' in
          final.event.type           or 'error' in final.event.type)}}
  ecs_email_categorization:
    actions:
      - set:
          event.category: "{{(final.event.category|default([])) + ['email']}}"
      - set:
          event.type: "{{(final.event.type|default([])) + ['info']}}"
  ecs_network_categorization:
    actions:
      - set:
          event.type: connection
          event.category: network
  ecs_host_categorization:
    actions:
      - set:
          event.type: info
          event.category: host
  ecs_outcome_categorization:
    actions:
      - set:
          event.outcome: failure
        filter: >-
          {{(final.http is defined and final.http.response is defined and
          final.http.response.status_code  is defined and
          final.http.response.status_code >= 400) or (final.clever_cloud is
          defined and final.clever_cloud.action is defined and
          final.clever_cloud.action.status is defined and
          final.clever_cloud.action.status != 'success') or final.error is
          defined or 'fail' in final.event.action}}
      - set:
          event.outcome: success
        filter: >-
          {{(final.http.response.status_code >= 200 and
          final.http.response.status_code < 400) or ('success' in
          final.clever_cloud.action.status)}}
      - set:
          event.outcome: unknown
        filter: "{{not final.event.outcome is defined}}"
