name: Teleport Audit Logs
slug: "teleport-audit-logs"
description: >-
  Teleport audit logs record all access activity across the cluster: user logins,
  database sessions, Kubernetes command execution, certificate issuance and role changes.

data_sources:
  Authentication logs: User logins to the Teleport cluster (SSO/SAML and local authentication)
  Digital certificate logs: User and host certificate issuance events
  Process command-line parameters: Commands executed through Teleport (Kubernetes exec, SSM run)
  Process monitoring: Interactive SSH session lifecycle on Teleport nodes (start, join, leave, end and transferred data)
  Application logs: Database sessions, user, role and lock lifecycle, and other Teleport audit events