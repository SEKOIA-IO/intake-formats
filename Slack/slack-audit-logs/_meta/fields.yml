slack.audit_logs.actor.account_type:
  description: The membership class of the actor, such as `FULL_MEMBER` or `GUEST`.
  name: slack.audit_logs.actor.account_type
  type: text

slack.audit_logs.actor.type:
  description: The type of principal that performed the action, such as `user` or
    `app`.
  name: slack.audit_logs.actor.type
  type: text

slack.audit_logs.app.id:
  description: The identifier of the application the action was performed through.
  name: slack.audit_logs.app.id
  type: text

slack.audit_logs.app.name:
  description: The name of the application the action was performed through.
  name: slack.audit_logs.app.name
  type: text

slack.audit_logs.app.scopes:
  description: The user-token OAuth scopes granted to the application the action was
    performed through.
  name: slack.audit_logs.app.scopes
  type: text

slack.audit_logs.app.scopes_bot:
  description: The bot-token OAuth scopes granted to the application the action was
    performed through.
  name: slack.audit_logs.app.scopes_bot
  type: text

slack.audit_logs.details:
  description: The action-specific payload Slack attaches to the event, kept whole.
    Its keys differ from one action to the next, so the object itself is declared
    rather than its individual members.
  name: slack.audit_logs.details
  type: object

slack.audit_logs.details.arguments.channel_id:
  description: The channel an agent asked a tool to read, list or post to.
  name: slack.audit_logs.details.arguments.channel_id
  type: text

slack.audit_logs.details.authentication_method:
  description: The mechanism a sign-in was performed with, such as `magic_link`, `password`
    or `saml`.
  name: slack.audit_logs.details.authentication_method
  type: text

slack.audit_logs.details.authentication_mode:
  description: The authentication mode an authentication policy applies, such as `EMAIL_PASSWORD`.
  name: slack.audit_logs.details.authentication_mode
  type: text

slack.audit_logs.details.destination_channel.id:
  description: The identifier of the conversation a message was forwarded into.
  name: slack.audit_logs.details.destination_channel.id
  type: text

slack.audit_logs.details.destination_channel.privacy:
  description: The visibility of the conversation a message was forwarded into, such
    as `DM`, `MPDM`, `public` or `private`.
  name: slack.audit_logs.details.destination_channel.privacy
  type: text

slack.audit_logs.details.entity_ids:
  description: The identifiers of the entities an authentication policy was applied
    to or removed from.
  name: slack.audit_logs.details.entity_ids
  type: text

slack.audit_logs.details.ip_address_details:
  description: What Slack found notable about the address, such as new-asn.
  name: slack.audit_logs.details.ip_address_details
  type: text

slack.audit_logs.details.is_ext_shared:
  description: Whether the file was shared outside the organization.
  name: slack.audit_logs.details.is_ext_shared
  type: boolean

slack.audit_logs.details.location:
  description: The location Slack attributes to an anomalous session.
  name: slack.audit_logs.details.location
  type: text

slack.audit_logs.details.policy_name:
  description: The name of the authentication policy the action was performed on.
  name: slack.audit_logs.details.policy_name
  type: text

slack.audit_logs.details.previous_ip_address:
  description: The address the previous session was seen from, for an anomaly. Slack
    leaves it blank when it has none, so it is not typed as an address.
  name: slack.audit_logs.details.previous_ip_address
  type: text

slack.audit_logs.details.previous_ua:
  description: The user agent the previous session was seen with, for an anomaly.
  name: slack.audit_logs.details.previous_ua
  type: text

slack.audit_logs.details.reason:
  description: The signals that made Slack flag the session, for an anomaly.
  name: slack.audit_logs.details.reason
  type: text

slack.audit_logs.details.shared_with.channel_id:
  description: The identifier of the channel a file was shared into.
  name: slack.audit_logs.details.shared_with.channel_id
  type: text

slack.audit_logs.details.source_channel.id:
  description: The identifier of the conversation a message was forwarded out of.
  name: slack.audit_logs.details.source_channel.id
  type: text

slack.audit_logs.details.source_channel.privacy:
  description: The visibility of the conversation a message was forwarded out of,
    such as `DM`, `MPDM`, `public` or `private`.
  name: slack.audit_logs.details.source_channel.privacy
  type: text

slack.audit_logs.details.source_message.author_id:
  description: The identifier of the user who wrote the message that was forwarded.
  name: slack.audit_logs.details.source_message.author_id
  type: text

slack.audit_logs.details.target_entity:
  description: The object a role was granted on or revoked from.
  name: slack.audit_logs.details.target_entity
  type: text

slack.audit_logs.details.tool:
  description: The name of the tool an agent invoked through MCP, such as `slack_send_message`.
  name: slack.audit_logs.details.tool
  type: text

slack.audit_logs.entity.channel:
  description: The channel holding the object, when the object is a message.
  name: slack.audit_logs.entity.channel
  type: text

slack.audit_logs.entity.id:
  description: The identifier of the object the action was performed on.
  name: slack.audit_logs.entity.id
  type: text

slack.audit_logs.entity.name:
  description: The name of the object the action was performed on. Unset for files,
    whose name is in `file.name`.
  name: slack.audit_logs.entity.name
  type: text

slack.audit_logs.entity.privacy:
  description: The visibility of the channel, either `public` or `private`.
  name: slack.audit_logs.entity.privacy
  type: text

slack.audit_logs.entity.provider:
  description: The external integration an OAuth token belongs to, such as confluence.
  name: slack.audit_logs.entity.provider
  type: text

slack.audit_logs.entity.scopes:
  description: The permissions granted to the application or token the action was
    performed on.
  name: slack.audit_logs.entity.scopes
  type: text

slack.audit_logs.entity.timestamp:
  description: The Slack timestamp identifying the object, when the object is a message.
  name: slack.audit_logs.entity.timestamp
  type: text

slack.audit_logs.entity.type:
  description: The type of object the action was performed on, such as `user`, `channel`,
    `file`, `usergroup`, `role`, `message`, `huddle` or `enterprise`.
  name: slack.audit_logs.entity.type
  type: text

slack.audit_logs.id:
  description: The unique identifier Slack assigns to the audit event.
  name: slack.audit_logs.id
  type: text

slack.audit_logs.location.type:
  description: Whether the action took place in a `workspace` or in an `enterprise`
    organization.
  name: slack.audit_logs.location.type
  type: text

slack.audit_logs.session_id:
  description: The identifier of the Slack session the action was performed from.
  name: slack.audit_logs.session_id
  type: text
