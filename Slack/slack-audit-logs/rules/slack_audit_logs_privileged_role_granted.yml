version: 2.0
uuid: 0cbac0e3-6fb8-4a77-bd5a-3f74f62e11d8
format_uuid: b3aa9d39-7bbe-46fe-bdc8-f91f0d1ce2ac
rule: Slack Audit Logs Privileged Role Granted
description: >-
  A member was promoted to admin or owner, or the ownership was transferred.
sources: https://docs.slack.dev/reference/audit-logs-api/methods-actions-reference
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: 'b3aa9d39-7bbe-46fe-bdc8-f91f0d1ce2ac' # Slack Audit Logs
    event.action:
      - 'owner_transferred'
      - 'role_change_to_admin'
      - 'role_change_to_owner'
  condition: selection
alert_category: intrusions
alert_type: privilege-escalation
alert_severity: 60
attack:
  - T1098
data_sources:
  - Third-party application logs
similarity_strategy:
  - sekoiaio.entity.uuid
  - user.name
  - user.target.id
tags:
  - Slack Audit Logs
changelog:
  - date: 30/09/2026
    level: minor
    change: Initial rule
