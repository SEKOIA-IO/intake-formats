version: 2.0
uuid: 9730545f-414b-457b-8cbf-09ab68a4e75e
format_uuid: b3aa9d39-7bbe-46fe-bdc8-f91f0d1ce2ac
rule: Slack Audit Logs Login Without SSO
description: >-
  A member signed in with a password or a magic link, bypassing the organization's SSO identity provider.
sources: https://docs.slack.dev/reference/audit-logs-api/methods-actions-reference
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: 'b3aa9d39-7bbe-46fe-bdc8-f91f0d1ce2ac' # Slack Audit Logs
    event.action: 'user_login'
    slack.audit_logs.details.authentication_method:
      - '2fa'
      - 'magic_link'
      - 'password'
  condition: selection
alert_category: intrusions
alert_type: unprivileged-account-compromise
alert_severity: 50
attack:
  - T1078.004
data_sources:
  - Third-party application logs
similarity_strategy:
  - sekoiaio.entity.uuid
  - user.name
  - source.ip
tags:
  - Slack Audit Logs
changelog:
  - date: 30/09/2026
    level: minor
    change: Initial rule
