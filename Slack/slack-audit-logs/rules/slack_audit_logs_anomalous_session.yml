version: 2.0
uuid: 116005f4-f16b-4e14-baa6-c24f39a252f6
format_uuid: b3aa9d39-7bbe-46fe-bdc8-f91f0d1ce2ac
rule: Slack Audit Logs Anomalous Session
description: >-
  Slack flagged a session as anomalous beyond a mere network change, or signed a user out because their device was compromised.
sources: https://docs.slack.dev/reference/audit-logs-api/methods-actions-reference
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: 'b3aa9d39-7bbe-46fe-bdc8-f91f0d1ce2ac' # Slack Audit Logs
    event.action:
      - 'anomaly'
      - 'user_logout_compromised'
  filter_network_change:
    event.reason:
      - 'ip_address'
      - 'asn, ip_address'
  condition: selection and not filter_network_change
alert_category: intrusions
alert_type: unprivileged-account-compromise
alert_severity: 50
attack:
  - T1078.004
data_sources:
  - Third-party application logs
similarity_strategy:
  - sekoiaio.entity.uuid
  - user.name
  - event.action
tags:
  - Slack Audit Logs
changelog:
  - date: 30/09/2026
    level: minor
    change: Initial rule
