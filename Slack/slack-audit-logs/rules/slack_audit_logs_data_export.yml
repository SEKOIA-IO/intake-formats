format_uuid: b3aa9d39-7bbe-46fe-bdc8-f91f0d1ce2ac
rule: Slack Audit Logs Data Export
description: >-
  A workspace or channel export was started, or corporate exports were approved.
sources: https://docs.slack.dev/reference/audit-logs-api/methods-actions-reference
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: 'b3aa9d39-7bbe-46fe-bdc8-f91f0d1ce2ac' # Slack Audit Logs
    event.action:
      - 'channels_export_started'
      - 'corporate_exports_approved'
      - 'manual_export_started'
  condition: selection
alert_category: malicious-traffic
alert_type: exfiltration
alert_severity: 50
attack:
  - T1530
data_sources:
  - Third-party application logs
similarity_strategy:
  - sekoiaio.entity.uuid
  - user.name
  - event.action
tags:
  - Slack Audit Logs
changelog:
  - date: 30/09/2026
    level: minor
    change: Initial rule
