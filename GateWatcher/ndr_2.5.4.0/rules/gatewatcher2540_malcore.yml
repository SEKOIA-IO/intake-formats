rule: Gatewatcher 2.5.4.0 Malcore
description: >-
  Detects a malcore alert by Gatewatcher 2.5.4.0 related to documents with passwords.
sources: Sekoia.io
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: "2f1c1e9b-7b8e-4150-879e-62a2a146c3c5"
    event.module: "malcore"
  filter:
    gatewatcher.malcore.state:
      - "No Threat Detected"
      - "Exceeded Archive File Number"
      - "File is lost"
      - "Exceeded Archive Size"
      - "file name: whitelist"
      - "File size exceeded the maximum size"
  condition: selection and not filter
