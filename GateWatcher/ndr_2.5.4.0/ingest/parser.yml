stages:
  parsed_date:
    actions:
      - set:
          '@timestamp': '{{json_load.message["@timestamp"]}}'
        filter: ''
        name: set
  ad_guardian:
    actions:
      - set:
          gatewatcher.ad_guardian.behavior: '{{json_load.message.ad_guardian.behavior}}'
          gatewatcher.ad_guardian.category: '{{json_load.message.ad_guardian.category}}'
          gatewatcher.ad_guardian.flow_direction: '{{json_load.message.ad_guardian.flow_direction}}'
          gatewatcher.ad_guardian.packet: '{{json_load.message.ad_guardian.packet}}'
          gatewatcher.ad_guardian.packet_info.linktype: '{{json_load.message.ad_guardian.packet_info.linktype}}'
          gatewatcher.ad_guardian.payload: '{{json_load.message.ad_guardian.payload}}'
          gatewatcher.ad_guardian.payload_printable: '{{json_load.message.ad_guardian.payload_printable}}'
          gatewatcher.ad_guardian.severity: '{{json_load.message.ad_guardian.severity}}'
        filter: ''
        name: set
  bittorrent_dht:
    actions:
      - set:
          gatewatcher.bittorrent_dht.request: '{{json_load.message.bittorrent_dht.request}}'
          gatewatcher.bittorrent_dht.request_type: '{{json_load.message.bittorrent_dht.request_type}}'
          gatewatcher.bittorrent_dht.response: '{{json_load.message.bittorrent_dht.response}}'
          gatewatcher.bittorrent_dht.transaction_id: '{{json_load.message.bittorrent_dht.transaction_id}}'
        filter: ''
        name: set
  event:
    actions:
      - set:
          event.module: '{{json_load.message.event.module}}'
          event.dataset: '{{json_load.message.event.dataset}}'
          event.category: '{{json_load.message.event.category}}'
          event.severity: '{{json_load.message.event.severity}}'
          event.risk_score: '{{json_load.message.event.risk_score}}'
          event.start: '{{json_load.message.event.start}}'
          event.end: '{{json_load.message.event.end}}'
          gatewatcher.event.id: '{{json_load.message.event.id}}'
          gatewatcher.event.created: '{{json_load.message.event.created}}'
          gatewatcher.event.version: '{{json_load.message.event.version}}'
        filter: ''
        name: set
      - set:
          event.kind: '{{json_load.message.event.kind}}'
        filter: '{{json_load.message.event.kind != "event"}}'
        name: set
      - set:
          event.type: ["indicator"] 
        filter: '{{json_load.message.event.kind == "alert"}}'
        name: set
      - set:
          event.type: ["protocol"] 
        filter: '{{json_load.message.event.kind == "event"}}'
        name: set
      - set:
          event.type: ["info"] 
        filter: '{{json_load.message.event.kind == "metric"}}'
        name: set
  source:
    actions:
      - set:
          source.address: '{{json_load.message.source.ip}}'
          source.ip: '{{json_load.message.source.ip}}'
          source.mac: '{{json_load.message.source.mac}}'
          source.port: '{{json_load.message.source.port}}'
        filter: ''
        name: set
  destination:
    actions:
      - set:
          destination.address: '{{json_load.message.destination.ip}}'
          destination.ip: '{{json_load.message.destination.ip}}'
          destination.mac: '{{json_load.message.destination.mac}}'
          destination.port: '{{json_load.message.destination.port}}'
        filter: ''
        name: set
  observer:
    actions:
      - set:
          observer.vendor: '{{json_load.message.observer.vendor}}'
          observer.product: '{{json_load.message.observer.product}}'
          observer.version: '{{json_load.message.observer.version}}'
          observer.hostname: '{{json_load.message.observer.hostname}}'
          gatewatcher.observer.uuid: '{{json_load.message.observer.uuid}}'
          gatewatcher.observer.gcap.version: '{{json_load.message.observer.gcap.version}}'
          gatewatcher.observer.gcap.hostname: '{{json_load.message.observer.gcap.hostname}}'
          gatewatcher.observer.log_format_version: '{{json_load.message.observer.log_format_version}}'
          gatewatcher.observer.gcap.ingress.interface.name: '{{json_load.message.observer.gcap.ingress.interface.name}}'
        filter: ''
        name: set
  opcua:
    actions:
      - set:
          gatewatcher.opcua.request: '{{json_load.message.opcua.request}}'
          gatewatcher.opcua.response: '{{json_load.message.opcua.response}}'
        filter: ''
        name: set
  pgsql:
    actions:
      - set:
          gatewatcher.pgsql.request: '{{json_load.message.pgsql.request}}'
          gatewatcher.pgsql.response: '{{json_load.message.pgsql.response}}'
          gatewatcher.pgsql.tx_id: '{{json_load.message.pgsql.tx_id}}'
        filter: ''
        name: set
  quic:
    actions:
