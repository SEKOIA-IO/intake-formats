version: 2.0
uuid: 5ffe9ddd-6a9c-4eec-b379-cc59ce5d3987
format_uuid: 2f28e4f9-a4f3-40a6-9909-b69f3df32535
rule: Gatewatcher AionIQ V103 Malcore
description: >-
  Detects a malcore alert by Gatewatcher AionIQ V103 related to documents with passwords.
sources: Sekoia.io
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: '2f28e4f9-a4f3-40a6-9909-b69f3df32535' # Gatewatcher AionIQ V103
    event.module: 'malcore'
  filter:
    gatewatcher.malcore.state:
      - 'No Threat Detected'
      - 'Exceeded Archive File Number'
      - 'File is lost'
      - 'Exceeded Archive Size'
      - 'file name: whitelist'
      - 'File size exceeded the maximum size'
  condition: selection and not filter
alert_category: intrusion-attempts
alert_type: ids-alert
similarity_strategy:
  - gatewatcher.malcore.detail_threat_found
alert_severity: 30
attack:
  - T1204.002
data_sources:
  - Network intrusion detection system
tags:
  - Gatewatcher AionIQ V103
changelog:
  - date: 24/01/2025
    level: minor
    change: Adding filter to reduce false positives.
  - date: 27/01/2025
    level: minor
    change: Changing field and adding filter to reduce false positives.
  - date: 05/03/2026
    level: minor
    change: Update rule type to integration
