version: 2.0
uuid: 7e720331-c710-4062-a8b7-c0ebd385818c
format_uuid: 2f28e4f9-a4f3-40a6-9909-b69f3df32535
rule: Gatewatcher AionIQ V103 Malcore Low
description: >-
  Detects a malcore alert by Gatewatcher AionIQ V103 with a low severity related to documents with passwords.
sources: Sekoia.io
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: '2f28e4f9-a4f3-40a6-9909-b69f3df32535' # Gatewatcher AionIQ V103
    event.module: 'malcore'
    event.severity: 1
  filter:
    gatewatcher.malcore.state:
      - 'No Threat Detected'
      - 'Exceeded Archive File Number'
      - 'File is lost'
      - 'Exceeded Archive Size'
      - 'file name: whitelist'
      - 'File size exceeded the maximum size'
  condition: selection and not filter
alert_category: intrusion-attempts
alert_type: ids-alert
similarity_strategy:
  - gatewatcher.malcore.detail_threat_found
alert_severity: 20
attack:
  - T1204.002
data_sources:
  - Network intrusion detection system
tags:
  - Gatewatcher AionIQ V103
