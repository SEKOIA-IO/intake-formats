name: gatewatcher-aioniq-v2-5
ignored_values: null
pipeline:
  - name: json_load
    description: Parse the JSON event
    external:
      name: json.parse-json
      properties:
        input_field: "{{original.message}}"
        output_field: message
  - name: parsed_date
    description: Parse the event date
  - name: event
    description: Map the event object
    filter: "{{json_load.message.event is defined}}"
  - name: source
    description: Map the source object
    filter: "{{json_load.message.source is defined}}"
  - name: destination
    description: Map the destination object
    filter: "{{json_load.message.destination is defined}}"
  - name: observer
    description: Map the observer object
    filter: "{{json_load.message.observer is defined}}"
  - name: ad_guardian
    description: Map the ad_guardian object
    filter: "{{json_load.message.ad_guardian is defined}}"
  - name: opcua
    description: Map the opcua object
    filter: "{{json_load.message.opcua is defined}}"
  - name: pgsql
    description: Map the pgsql object
    filter: "{{json_load.message.pgsql is defined}}"
  - name: quic
    description: Map the quic object
    filter: "{{json_load.message.quic is defined}}"
  - name: network
    description: Map the network object
    filter: "{{json_load.message.network is defined}}"
  - name: http
    description: Map the http object
    filter: "{{json_load.message.http is defined}}"
  - name: tags
    description: Map the tags
    filter: "{{json_load.message.tags is defined}}"
  - name: file
    description: Map the file object
    filter: "{{json_load.message.file is defined}}"
  - name: dns
    description: Map the dns object
    filter: "{{json_load.message.dns is defined}}"
  - name: url
    description: Map the url object
    filter: "{{json_load.message.url is defined}}"
  - name: user_agent
    description: Map the user_agent object
    filter: "{{json_load.message.user_agent is defined}}"
  - name: version
    description: Map the @version field
    filter: '{{json_load.message["@version"] is defined}}'
  - name: tls
    description: Map the tls object
    filter: "{{json_load.message.tls is defined}}"
  - name: metadata-flowbits
    description: Map the metadata flowbits
    filter: "{{json_load.message.metadata is defined}}"
  - name: modbus
    description: Map the modbus object
    filter: "{{json_load.message.modbus is defined}}"
  - name: smtp
    description: Map the smtp object
    filter: "{{json_load.message.smtp is defined}}"
  - name: email
    description: Map the email object
    filter: "{{json_load.message.email is defined}}"
  - name: smb
    description: Map the smb object
    filter: "{{json_load.message.smb is defined}}"
  - name: nfs
    description: Map the nfs object
    filter: "{{json_load.message.nfs is defined}}"
  - name: ftp
    description: Map the ftp object
    filter: "{{json_load.message.ftp is defined}}"
  - name: tftp
    description: Map the tftp object
    filter: "{{json_load.message.tftp is defined}}"
  - name: ssh
    description: Map the ssh object
    filter: "{{json_load.message.ssh is defined}}"
  - name: krb5
    description: Map the krb5 object
    filter: "{{json_load.message.krb5 is defined}}"
  - name: dhcp
    description: Map the dhcp object
    filter: "{{json_load.message.dhcp is defined}}"
  - name: dicom
    description: Map the dicom object
    filter: "{{json_load.message.dicom is defined}}"
  - name: ftp_data
    description: Map the ftp_data object
    filter: "{{json_load.message.ftp_data is defined}}"
  - name: snmp
    description: Map the snmp object
    filter: "{{json_load.message.snmp is defined}}"
  - name: rdp
    description: Map the rdp object
    filter: "{{json_load.message.rdp is defined}}"
  - name: rfb
    description: Map the rfb object
    filter: "{{json_load.message.rfb is defined}}"
  - name: rpc
    description: Map the rpc object
    filter: "{{json_load.message.rpc is defined}}"
  - name: ike
    description: Map the ike object
    filter: "{{json_load.message.ike is defined}}"
  - name: sip
    description: Map the sip object
    filter: "{{json_load.message.sip is defined}}"
  - name: cotp
    description: Map the cotp object
    filter: "{{json_load.message.cotp is defined}}"
  - name: dnp3
    description: Map the dnp3 object
    filter: "{{json_load.message.dnp3 is defined}}"
  - name: dcerpc
    description: Map the dcerpc object
    filter: "{{json_load.message.dcerpc is defined}}"
  - name: mqtt
    description: Map the mqtt object
    filter: "{{json_load.message.mqtt is defined}}"
  - name: malcore
    description: Map the malcore object
    filter: "{{json_load.message.malcore is defined}}"
  - name: sigflow
    description: Map the sigflow object
    filter: "{{json_load.message.sigflow is defined}}"
  - name: flow
    description: Map the flow object
    filter: "{{json_load.message.flow is defined}}"
  - name: s7
    description: Map the s7 object
    filter: "{{json_load.message.s7 is defined}}"
  - name: shellcode
    description: Map the shellcode object
    filter: "{{json_load.message.shellcode is defined}}"
  - name: malicious_powershell
    description: Map the malicious_powershell object
    filter: "{{json_load.message.malicious_powershell is defined}}"
  - name: files
    description: Map the files object
    filter: "{{json_load.message.files is defined}}"
  - name: history
    description: Map the history object
    filter: "{{json_load.message.history is defined}}"
  - name: hl7
    description: Map the hl7 object
    filter: "{{json_load.message.hl7 is defined}}"
  - name: syslog
    description: Map the syslog fields
    filter: "{{json_load.message.log is defined or json_load.message.syslog is defined}}"
  - name: notification
    description: Map the notification object
    filter: "{{json_load.message.notification is defined}}"
  - name: beacon
    description: Map the beacon object
    filter: "{{json_load.message.beacon is defined}}"
  - name: retrohunt
    description: Map the retrohunt matched_event object
    filter: "{{json_load.message.matched_event is defined}}"
  - name: ransomware_detect
    description: Map the ransomware object
    filter: "{{json_load.message.ransomware is defined}}"
  - name: dga_detect
    description: Map the dga object
    filter: "{{json_load.message.dga is defined}}"
  - name: network_behavior_analytics
    description: Map the network_behavior_analytics object
    filter: "{{json_load.message.network_behavior_analytics is defined}}"
  - name: ioc
    description: Map the ioc object
    filter: "{{json_load.message.ioc is defined}}"
  - name: rule
    description: Map the rule object
    filter: "{{json_load.message.rule is defined}}"
  - name: threat
    description: Map the MITRE ATT&CK techniques
    filter: "{{json_load.message.threat is defined}}"
  - name: bittorrent_dht
    description: Map the bittorrent_dht object
    filter: "{{json_load.message.bittorrent_dht is defined}}"
stages:
  parsed_date:
    actions:
      - set:
          "@timestamp": '{{json_load.message["@timestamp"]}}'
  event:
    actions:
      - set:
          event.kind: "{{json_load.message.event.kind or 'event'}}"
          event.module: "{{json_load.message.event.module}}"
          event.dataset: "{{json_load.message.event.dataset}}"
          event.category: "{{json_load.message.event.category}}"
          event.severity: "{{json_load.message.event.severity}}"
          event.risk_score: "{{json_load.message.event.risk_score}}"
          event.start: "{{json_load.message.event.start}}"
          event.end: "{{json_load.message.event.end}}"
          event.type: ["info"]
          gatewatcher.event.id: "{{json_load.message.event.id}}"
          gatewatcher.event.created: "{{json_load.message.event.created}}"
          gatewatcher.event.version: "{{json_load.message.event.version}}"
      - set:
          event.type: ["protocol"]
        filter: '{{json_load.message.event.kind == "event" and "network" in (json_load.message.event.category or [])}}'
      - set:
          event.type: ["indicator"]
        filter: '{{"threat" in (json_load.message.event.category or [])}}'
  source:
    actions:
      - set:
          source.address: "{{json_load.message.source.ip}}"
          source.ip: "{{json_load.message.source.ip}}"
          source.mac: "{{json_load.message.source.mac}}"
          source.port: "{{json_load.message.source.port}}"
  destination:
    actions:
      - set:
          destination.address: "{{json_load.message.destination.ip}}"
          destination.ip: "{{json_load.message.destination.ip}}"
          destination.mac: "{{json_load.message.destination.mac}}"
          destination.port: "{{json_load.message.destination.port}}"
  observer:
    actions:
      - set:
          observer.hostname: "{{json_load.message.observer.hostname}}"
          observer.product: "{{json_load.message.observer.product}}"
          observer.type: "ndr"
          observer.vendor: "{{json_load.message.observer.vendor}}"
          observer.version: "{{json_load.message.observer.version}}"
          gatewatcher.observer.uuid: "{{json_load.message.observer.uuid}}"
          gatewatcher.observer.gcap.version: "{{json_load.message.observer.gcap.version}}"
          gatewatcher.observer.gcap.hostname: "{{json_load.message.observer.gcap.hostname}}"
          gatewatcher.observer.log_format_version: "{{json_load.message.observer.log_format_version}}"
          gatewatcher.observer.gcap.ingress.interface.name: "{{json_load.message.observer.gcap.ingress.interface.name}}"
  ad_guardian:
    actions:
      - set:
          gatewatcher.ad_guardian.behavior: "{{json_load.message.ad_guardian.behavior}}"
          gatewatcher.ad_guardian.category: "{{json_load.message.ad_guardian.category}}"
          gatewatcher.ad_guardian.flow_direction: "{{json_load.message.ad_guardian.flow_direction}}"
          gatewatcher.ad_guardian.packet: "{{json_load.message.ad_guardian.packet}}"
          gatewatcher.ad_guardian.packet_info.linktype: "{{json_load.message.ad_guardian.packet_info.linktype}}"
          gatewatcher.ad_guardian.payload: "{{json_load.message.ad_guardian.payload}}"
          gatewatcher.ad_guardian.payload_printable: "{{json_load.message.ad_guardian.payload_printable}}"
          gatewatcher.ad_guardian.severity: "{{json_load.message.ad_guardian.severity}}"
  opcua:
    actions:
      - set:
          gatewatcher.opcua.request: "{{json_load.message.opcua.request}}"
          gatewatcher.opcua.response: "{{json_load.message.opcua.response}}"
  pgsql:
    actions:
      - set:
          gatewatcher.pgsql.request: "{{json_load.message.pgsql.request}}"
          gatewatcher.pgsql.response: "{{json_load.message.pgsql.response}}"
          gatewatcher.pgsql.tx_id: "{{json_load.message.pgsql.tx_id}}"
  quic:
    actions:
      - set:
          gatewatcher.quic.extensions: "{{json_load.message.quic.extensions}}"
          gatewatcher.quic.ja3: "{{json_load.message.quic.ja3}}"
          gatewatcher.quic.ja3s: "{{json_load.message.quic.ja3s}}"
          gatewatcher.quic.ja4: "{{json_load.message.quic.ja4}}"
          gatewatcher.quic.sni: "{{json_load.message.quic.sni}}"
          gatewatcher.quic.version: "{{json_load.message.quic.version}}"
  network:
    actions:
      - set:
          network.vlan.id: "{{json_load.message.network.vlan.id}}"
          network.protocol: "{{json_load.message.network.protocol}}"
          network.transport: "{{json_load.message.network.transport}}"
          network.vlan.name: "{{json_load.message.network.vlan.name}}"
          network.community_id: "{{json_load.message.network.community_id}}"
          gatewatcher.network.flow_id: "{{json_load.message.network.flow_id}}"
          gatewatcher.network.pkt_src: "{{json_load.message.network.pkt_src}}"
          gatewatcher.network.tx_id: "{{json_load.message.network.tx_id}}"
          gatewatcher.network.timestamp: "{{json_load.message.network.timestamp}}"
  http:
    actions:
      - set:
          http.request.method: "{{json_load.message.http.request.method}}"
          http.request.mime_type: "{{json_load.message.http.request.mime_type}}"
          http.request.referrer: "{{json_load.message.http.http_refer}}"
          http.response.body.content: "{{json_load.message.http.http_response_body_printable}}"
          http.response.bytes: "{{json_load.message.http.response.bytes}}"
          http.response.mime_type: "{{json_load.message.http.response.mime_type}}"
          http.response.status_code: "{{json_load.message.http.response.status}}"
          http.version: "{{json_load.message.http.version}}"
          gatewatcher.http.accept: "{{json_load.message.http.accept}}"
          gatewatcher.http.accept_language: "{{json_load.message.http.accept_language}}"
          gatewatcher.http.hostname: "{{json_load.message.http.hostname}}"
          gatewatcher.http.http_response_body: "{{json_load.message.http.http_response_body}}"
          gatewatcher.http.http2.request.priority: "{{json_load.message.http.http2.request.priority}}"
          gatewatcher.http.http2.stream_id: "{{json_load.message.http.http2.stream_id}}"
          gatewatcher.http.request.headers: "{{json_load.message.http.request.headers}}"
          gatewatcher.http.response.headers: "{{json_load.message.http.response.headers}}"
  tags:
    actions:
      - set:
          tags: "{{json_load.message.tags}}"
  file:
    actions:
      - set:
          file.name: "{{json_load.message.file.name}}"
          file.size: "{{json_load.message.file.size}}"
          file.hash.md5: "{{json_load.message.file.hash.md5}}"
          file.hash.sha1: "{{json_load.message.file.hash.sha1}}"
          file.hash.sha256: "{{json_load.message.file.hash.sha256}}"
          gatewatcher.file.file_id: "{{json_load.message.file.file_id}}"
          gatewatcher.file.gaps: "{{json_load.message.file.gaps}}"
          gatewatcher.file.magic: "{{json_load.message.file.magic}}"
          gatewatcher.file.sid: "{{json_load.message.file.sid}}"
          gatewatcher.file.state: "{{json_load.message.file.state}}"
          gatewatcher.file.stored: "{{json_load.message.file.stored}}"
          gatewatcher.file.tx_id: "{{json_load.message.file.tx_id}}"
  dns:
    actions:
      - set:
          dns.id: "{{json_load.message.dns.id}}"
          dns.type: "{{json_load.message.dns.type}}"
          dns.op_code: "{{json_load.message.dns.opcode}}"
          dns.response_code: "{{json_load.message.dns.response_code}}"
          gatewatcher.dns.query: "{{json_load.message.dns.query}}"
          gatewatcher.dns.version: "{{json_load.message.dns.version}}"

      # Query records: the question and the transaction header are in the first query item
      - set:
          dns.question.name: "{{json_load.message.dns.query[0].rrname}}"
          dns.question.type: "{{json_load.message.dns.query[0].rrtype}}"
        filter: "{{json_load.message.dns.query is defined and json_load.message.dns.query|length > 0}}"
      - set:
          dns.id: "{{json_load.message.dns.query[0].id}}"
        filter: "{{json_load.message.dns.id is not defined and json_load.message.dns.query is defined and json_load.message.dns.query|length > 0 and json_load.message.dns.query[0].id is defined}}"
      - set:
          dns.op_code: "{{json_load.message.dns.query[0].opcode}}"
        filter: "{{json_load.message.dns.opcode is not defined and json_load.message.dns.query is defined and json_load.message.dns.query|length > 0 and json_load.message.dns.query[0].opcode is defined}}"
      - set:
          dns.type: "{{json_load.message.dns.query[0].type}}"
        filter: "{{json_load.message.dns.type is not defined and json_load.message.dns.query is defined and json_load.message.dns.query|length > 0 and json_load.message.dns.query[0].type is defined}}"

      # Answer records: the question is in dns.answers.name / dns.answers.type
      - set:
          dns.question.name: "{{json_load.message.dns.answers.name}}"
          dns.question.type: "{{json_load.message.dns.answers.type}}"
        filter: "{{json_load.message.dns.query is not defined and json_load.message.dns.answers.name is defined}}"
      - set:
          dns.answers: >-
            {%- set answers = [] -%}
            {%- for answer in json_load.message.dns.answers.data -%}
              {%- set item = {"name": answer.rrname, "type": answer.rrtype, "ttl": answer.ttl} -%}
              {%- if answer.rdata is defined and answer.rdata -%}
                {%- set item = {"name": answer.rrname, "type": answer.rrtype, "ttl": answer.ttl, "data": answer.rdata} -%}
              {%- endif -%}
              {%- set _ = answers.append(item) -%}
            {%- endfor -%}
            {{ answers }}
        filter: "{{json_load.message.dns.answers.data is defined and json_load.message.dns.answers.data|length > 0}}"
  url:
    actions:
      - set:
          url.full: "{{json_load.message.url.full}}"
          url.path: "{{json_load.message.url.path}}"
          url.domain: "{{json_load.message.url.domain}}"
  user_agent:
    actions:
      - set:
          user_agent.name: "{{json_load.message.user_agent.name}}"
          user_agent.version: "{{json_load.message.user_agent.version}}"
          user_agent.original: "{{json_load.message.user_agent.original}}"
          user_agent.device.name: "{{json_load.message.user_agent.device.name}}"
          user_agent.os.family: "{{json_load.message.user_agent.os.family}}"
          user_agent.os.full: "{{json_load.message.user_agent.os.full}}"
          user_agent.os.name: "{{json_load.message.user_agent.os.name}}"
          user_agent.os.version: "{{json_load.message.user_agent.os.version}}"
          gatewatcher.user_agent.major: "{{json_load.message.user_agent.major}}"
          gatewatcher.user_agent.minor: "{{json_load.message.user_agent.minor}}"
          gatewatcher.user_agent.patch: "{{json_load.message.user_agent.patch}}"
          gatewatcher.user_agent.os.major: "{{json_load.message.user_agent.os.major}}"
  version:
    actions:
      - set:
          gatewatcher.version: '{{json_load.message["@version"]}}'
  tls:
    actions:
      - set:
          tls.client.server_name: "{{json_load.message.tls.client.server_name}}"
          tls.client.ja3: "{{json_load.message.tls.ja3.hash}}"
          tls.server.ja3s: "{{json_load.message.tls.ja3s.hash}}"
          tls.server.certificate_chain: "{{json_load.message.tls.server.certificate_chain}}"
          tls.server.issuer: "{{json_load.message.tls.server.issuer}}"
          tls.server.not_after: "{{json_load.message.tls.server.not_after}}"
          tls.server.not_before: "{{json_load.message.tls.server.not_before}}"
          tls.server.subject: "{{json_load.message.tls.server.subject}}"
          tls.version: "{{json_load.message.tls.version}}"
          gatewatcher.tls.ja3.string: "{{json_load.message.tls.ja3.string}}"
          gatewatcher.tls.ja3s.string: "{{json_load.message.tls.ja3s.string}}"

      # ECS expects certificate fingerprints and serial numbers in uppercase, without colons
      - set:
          tls.server.hash.md5: '{{json_load.message.tls.server.hash.md5 | replace(":", "") | upper}}'
        filter: "{{json_load.message.tls.server.hash.md5 is defined}}"
      - set:
          tls.server.hash.sha1: '{{json_load.message.tls.server.hash.sha1 | replace(":", "") | upper}}'
        filter: "{{json_load.message.tls.server.hash.sha1 is defined}}"
      - set:
          tls.server.hash.sha256: '{{json_load.message.tls.server.hash.sha256 | replace(":", "") | upper}}'
        filter: "{{json_load.message.tls.server.hash.sha256 is defined}}"
      - set:
          tls.server.x509.serial_number: '{{json_load.message.tls.serial | replace(":", "") | upper}}'
        filter: "{{json_load.message.tls.serial is defined}}"
  metadata-flowbits:
    actions:
      - set:
          gatewatcher.metadata.flowbits: "{{json_load.message.metadata.flowbits}}"
  modbus:
    actions:
      - set:
          gatewatcher.modbus.id: "{{json_load.message.modbus.id}}"
          gatewatcher.modbus.request: "{{json_load.message.modbus.request}}"
          gatewatcher.modbus.response: "{{json_load.message.modbus.response}}"
  smtp:
    actions:
      - set:
          gatewatcher.smtp.helo: "{{json_load.message.smtp.helo}}"
          gatewatcher.smtp.rcpt_to: "{{json_load.message.smtp.rcpt_to}}"
          gatewatcher.smtp.mail_from: "{{json_load.message.smtp.mail_from}}"

      # Use the SMTP envelope when the parsed email headers are absent
      - set:
          email.from.address: >-
            {%- set address = json_load.message.smtp.mail_from.split()[-1] | trim("<") | trim(">") -%}
            {{ [address] if address else [] }}
        filter: >-
          {{(json_load.message.email is not defined or json_load.message.email.from is not defined)
          and json_load.message.smtp.mail_from is string and json_load.message.smtp.mail_from|length > 0}}
      - set:
          email.to.address: >-
            {%- set addresses = [] -%}
            {%- set recipients = json_load.message.smtp.rcpt_to -%}
            {%- if recipients is string -%}{%- set recipients = [recipients] -%}{%- endif -%}
            {%- for recipient in recipients if recipient -%}
              {%- set _ = addresses.append(recipient.split()[-1] | trim("<") | trim(">")) -%}
            {%- endfor -%}
            {{ addresses }}
        filter: >-
          {{(json_load.message.email is not defined or json_load.message.email.to is not defined)
          and json_load.message.smtp.rcpt_to is defined and json_load.message.smtp.rcpt_to|length > 0}}
  email:
    actions:
      - set:
          email.message_id: "{{json_load.message.email.message_id}}"
          email.subject: "{{json_load.message.email.subject}}"
          gatewatcher.email.body_md5: "{{json_load.message.email.body_md5}}"
          gatewatcher.email.delivery_timestamp: "{{json_load.message.email.delivery_timestamp}}"
          gatewatcher.email.received: "{{json_load.message.email.received}}"
          gatewatcher.email.status: "{{json_load.message.email.status}}"
          gatewatcher.email.subject_md5: "{{json_load.message.email.subject_md5}}"
          gatewatcher.email.user_agent: "{{json_load.message.email.user_agent}}"

      # Addresses may be written as "Display Name <user@example.com>": keep only the address
      - set:
          email.from.address: >-
            {%- set addresses = [] -%}
            {%- set values = json_load.message.email.from.address -%}
            {%- if values is string -%}{%- set values = [values] -%}{%- endif -%}
            {%- for value in values if value -%}
              {%- set _ = addresses.append(value.split()[-1] | trim("<") | trim(">")) -%}
            {%- endfor -%}
            {{ addresses }}
        filter: "{{json_load.message.email.from.address is defined and json_load.message.email.from.address|length > 0}}"
      - set:
          email.to.address: >-
            {%- set addresses = [] -%}
            {%- set values = json_load.message.email.to.address -%}
            {%- if values is string -%}{%- set values = [values] -%}{%- endif -%}
            {%- for value in values if value -%}
              {%- set _ = addresses.append(value.split()[-1] | trim("<") | trim(">")) -%}
            {%- endfor -%}
            {{ addresses }}
        filter: "{{json_load.message.email.to.address is defined and json_load.message.email.to.address|length > 0}}"
      - set:
          email.reply_to.address: >-
            {%- set addresses = [] -%}
            {%- set values = json_load.message.email.reply_to.address -%}
            {%- if values is string -%}{%- set values = [values] -%}{%- endif -%}
            {%- for value in values if value -%}
