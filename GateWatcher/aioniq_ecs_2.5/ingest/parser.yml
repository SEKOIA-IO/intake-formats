          gatewatcher.malcore.yara_info.verdict: "{{json_load.message.malcore.yara_info.verdict}}"

      # engine_id is an object indexed by "0", "1", ...: convert it into a list ordered by index
      - set:
          gatewatcher.malcore.engines: >-
            {%- set engines = json_load.message.malcore.engine_id -%}
            {%- if engines is mapping -%}
              {%- set result = [] -%}
              {%- for index in engines.keys() | map("int") | sort -%}
                {%- set _ = result.append(engines[index | string]) -%}
              {%- endfor -%}
              {{ result }}
            {%- else -%}
              {{ engines }}
            {%- endif -%}
