          gatewatcher.ioc.targeted_platforms: "{{json_load.message.ioc.targeted_platforms}}"
          gatewatcher.ioc.meta_data.usageMode: "{{json_load.message.ioc.meta_data.usageMode}}"
          gatewatcher.ioc.meta_data.descriptions: "{{json_load.message.ioc.meta_data.descriptions}}"
          gatewatcher.ioc.targeted_organizations: "{{json_load.message.ioc.targeted_organizations}}"

      # Normalize the indicator type to the ECS expected values; leave it unset when unknown
      - set:
          threat.indicator.type: >-
            {%- set mapping = {
              "ip": "ipv4-addr", "ipv4": "ipv4-addr", "ipv4-addr": "ipv4-addr", "ip-src": "ipv4-addr", "ip-dst": "ipv4-addr",
              "ipv6": "ipv6-addr", "ipv6-addr": "ipv6-addr",
              "domain": "domain-name", "domain-name": "domain-name", "hostname": "domain-name", "host": "domain-name", "fqdn": "domain-name",
              "url": "url", "uri": "url",
              "md5": "file", "sha1": "file", "sha256": "file", "sha512": "file", "file": "file", "filehash": "file",
              "email": "email-addr", "email-addr": "email-addr",
              "mutex": "mutex", "autonomous-system": "autonomous-system", "asn": "autonomous-system"
            } -%}
            {{ mapping.get(json_load.message.ioc.type | string | lower | trim, "") }}
        filter: "{{json_load.message.ioc.type is string}}"

      # Normalize the TLP marking to the ECS expected values; leave it unset when unknown
      - set:
          threat.indicator.marking.tlp: >-
            {%- set tlp = json_load.message.ioc.tlp | string | upper | replace("TLP:", "") | trim -%}
            {%- set tlp = "CLEAR" if tlp == "WHITE" else tlp -%}
            {{ tlp if tlp in ["CLEAR", "GREEN", "AMBER", "AMBER+STRICT", "RED"] else "" }}
        filter: "{{json_load.message.ioc.tlp is string}}"
  rule:
    actions:
      - set:
          rule.name: "{{json_load.message.rule.name}}"
  threat:
    actions:
      - set:
          threat.framework: "MITRE ATT&CK"
          threat.technique.id: >-
            {%- set values = [] -%}
            {%- for technique in json_load.message.threat.techniques if technique.id -%}
              {%- set _ = values.append(technique.id) -%}
            {%- endfor -%}
            {{ values }}
          threat.technique.name: >-
            {%- set values = [] -%}
            {%- for technique in json_load.message.threat.techniques if technique.name -%}
              {%- set _ = values.append(technique.name) -%}
            {%- endfor -%}
            {{ values }}
          threat.tactic.id: >-
            {%- set values = [] -%}
            {%- for technique in json_load.message.threat.techniques -%}
              {%- for tactic in technique.tactics or [] if tactic.id and tactic.id not in values -%}
                {%- set _ = values.append(tactic.id) -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ values }}
          threat.tactic.name: >-
            {%- set values = [] -%}
            {%- for technique in json_load.message.threat.techniques -%}
              {%- for tactic in technique.tactics or [] if tactic.name and tactic.name not in values -%}
                {%- set _ = values.append(tactic.name) -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ values }}
        filter: "{{json_load.message.threat.techniques is defined and json_load.message.threat.techniques|length > 0}}"
