        filter: "{{json_load.message.flow.start is defined and json_load.message.event.start is not defined}}"

      # The flow counters are expressed from the flow initiator (to_server) point of view
      - set:
          source.bytes: "{{json_load.message.flow.bytes_toserver}}"
          source.packets: "{{json_load.message.flow.pkts_toserver}}"
          destination.bytes: "{{json_load.message.flow.bytes_toclient}}"
          destination.packets: "{{json_load.message.flow.pkts_toclient}}"
        filter: >-
          {{json_load.message.flow.src_ip is not defined or json_load.message.source.ip is not defined
          or json_load.message.flow.src_ip == json_load.message.source.ip}}
      - set:
          source.bytes: "{{json_load.message.flow.bytes_toclient}}"
          source.packets: "{{json_load.message.flow.pkts_toclient}}"
          destination.bytes: "{{json_load.message.flow.bytes_toserver}}"
          destination.packets: "{{json_load.message.flow.pkts_toserver}}"
        filter: >-
          {{json_load.message.flow.src_ip is defined and json_load.message.source.ip is defined
          and json_load.message.flow.src_ip != json_load.message.source.ip
          and json_load.message.flow.src_ip == json_load.message.destination.ip}}
      - set:
          network.bytes: "{{json_load.message.flow.bytes_toserver + json_load.message.flow.bytes_toclient}}"
        filter: "{{json_load.message.flow.bytes_toserver is number and json_load.message.flow.bytes_toclient is number}}"
      - set:
          network.packets: "{{json_load.message.flow.pkts_toserver + json_load.message.flow.pkts_toclient}}"
        filter: "{{json_load.message.flow.pkts_toserver is number and json_load.message.flow.pkts_toclient is number}}"
