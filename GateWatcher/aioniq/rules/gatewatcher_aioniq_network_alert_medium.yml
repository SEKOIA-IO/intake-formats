version: 2.0
uuid: 85a5671e-9e9f-4576-bee1-a98b2c9ff1a9
format_uuid: bba2bed2-d925-440f-a0ce-dbcae04eaf26
rule: Gatewatcher AionIQ Network Alert Medium
description: >-
  Forward network alerts reported by Gatewatcher AionIQ with a medium severity.
sources: https://docs.sekoia.io/xdr/features/collect/integrations/network/gatewatcher_aioniq/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid : 'bba2bed2-d925-440f-a0ce-dbcae04eaf26'  # Gatewatcher AionIQ
    event.kind: alert
    event.category: network
    event.severity: 2
  filters:
    gatewatcher.payload_printable|startswith:
      - 'PING'
      - 'PONG'
  condition: selection and not filters
alert_category: malicious-traffic
alert_type: other
alert_severity: 50
attack:
  - T1041
data_sources:
  - Network intrusion detection system
similarity_strategy:
  - rule.name
tags:
  - Gatewatcher AionIQ
