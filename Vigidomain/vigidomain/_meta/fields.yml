vigidomain.status:
  description: The alert current status, it covers the full lifecycle. Can be one
    of "CREATED", "UPDATED" and "CLOSED".
  name: vigidomain.status
  type: text

vigidomain.subject:
  description: The alert's subject, could be a domain, a sub-domain, a server IP or
    even a brand name.
  name: vigidomain.subject
  type: text

vigidomain.typosquatting.detection_strategies:
  description: The list of Vigidomain detection methods that found the suspected domain
  name: vigidomain.typosquatting.detection_strategies
  type: text

vigidomain.typosquatting.domain_age_days:
  description: The number of days since the domain was registered
  name: vigidomain.typosquatting.domain_age_days
  type: number

vigidomain.typosquatting.has_mx_record:
  description: Indicates whether the suspected domain has any MX records
  name: vigidomain.typosquatting.has_mx_record
  type: boolean

vigidomain.typosquatting.has_txt_record:
  description: Indicates whether the suspected domain has any TXT records
  name: vigidomain.typosquatting.has_txt_record
  type: boolean

vigidomain.typosquatting.name_servers:
  description: The suspected domain's name servers from DNS
  name: vigidomain.typosquatting.name_servers
  type: text

vigidomain.typosquatting.registered_at:
  description: The suspected typosquatting registration date
  name: vigidomain.typosquatting.registered_at
  type: datetime

vigidomain.typosquatting.registrar:
  description: The suspected domain registrar
  name: vigidomain.typosquatting.registrar
  type: text

vigidomain.typosquatting.similarity_percentage:
  description: The similarity in percentage between the suspected domain and the original
    domain. Using "World's Best Algorithms by Oliver" (ISBN 0-131-00413-1)
  name: vigidomain.typosquatting.similarity_percentage
  type: number
