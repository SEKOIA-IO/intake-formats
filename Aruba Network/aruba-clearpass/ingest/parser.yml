name: aruba-clearpass
pipeline:
  - name: parsed_event
    external:
      name: cef.parse-cef

  - name: set_common_fields

  - name: set_session_fields
    filter: "{{parsed_event.message.cat == 'Session Logs'}}"

  - name: set_insight_fields
    filter: "{{parsed_event.message.cat == 'Insight Logs'}}"

  - name: set_audit_records_fields
    filter: "{{parsed_event.message.cat == 'Audit Records'}}"

  - name: set_system_fields
    filter: "{{parsed_event.message.cat == 'ClearPassSystemEvents'}}"

stages:
  set_common_fields:
    actions:
      - set:
          observer.vendor: "Aruba Networks"
          observer.product: "ClearPass"
          event.dataset: "aruba-clearpass"

          "@timestamp": "{{parsed_event.message.rt | to_rfc3339}}"
          error.code: "{{parsed_event.message.ArubaClearpassCppmErrorCodeErrorCode}}"
          event.action: "{{parsed_event.message.act or parsed_event.message.ArubaClearpassTacacsAuthenAction}}"
          event.code: "{{parsed_event.message.DeviceEventClassID}}"
          event.severity: "{{parsed_event.message.Severity}}"
          destination.ip: "{{parsed_event.message.dst}}"
          destination.mac: "{{parsed_event.message.dmac | to_mac_address}}"
          observer.ip: "{{parsed_event.message.dvc}}"
          source.ip: "{{parsed_event.message.src}}"
          observer.version: "{{parsed_event.message.DeviceVersion}}"
          user.name: "{{parsed_event.message.duser or parsed_event.message.ArubaClearpassUserUsername}}"

          aruba.clearpass.name: "{{parsed_event.message.Name}}"
          aruba.clearpass.category: "{{parsed_event.message.cat}}"

      - set:
          error.code: "{{parsed_event.message.cn3}}"
        filter: "{{parsed_event.message.cn3 not in [None, '0'] and parsed_event.message.cn3Label == 'CPPM Error Code'}}"

      - set:
          destination.ip: "{{parsed_event.message.cs1}}"
        filter: "{{parsed_event.message.cs1 | is_ipaddress and parsed_event.message.cs1Label == 'Remote IP'}}"

      - set:
          error.message: "{{parsed_event.message.ArubaClearpassCppmErrorCodeErrorCodeDetails}}"
        filter: "{{parsed_event.message.ArubaClearpassCppmErrorCodeErrorCodeDetails | lower not in [None, '', 'success']}}"

      - set:
          user.roles: ["{{parsed_event.message.dpriv.strip('[]')}}"]
        filter: "{{parsed_event.message.dpriv | length > 0}}"

      - set:
          service.name: "{{parsed_event.message.destinationServiceName}}"
        filter: "{{parsed_event.message.destinationServiceName != None}}"

  set_session_fields:
    actions:
      - set:
          event.category: ["authentication"]
          event.type: ["info"]
          event.dataset: "aruba-clearpass.session"

      - set:
          aruba.clearpass.system_posture_token: "{{parsed_event.message.get('System Posture Token')}}"
          aruba.clearpass.enforcement_profile: "{{parsed_event.message.outcome}}"

  set_insight_fields:
    actions:
      - set:
          event.category: ["host"]
          event.type: ["info"]
          event.dataset: "aruba-clearpass.insight"

      - set:
          event.category: ["authentication"]
        filter: "{{'Authentication' in parsed_event.message.get('Name', '')}}"

      - set:
          event.type: ["start"]
          event.outcome: >
            {%- if parsed_event.message.get('cs4') == '1' -%}
              success
            {%- elif parsed_event.message.get('cs4') == '0' -%}
              failure
            {%- else -%}
              unknown
            {%- endif -%}
        filter: "{{parsed_event.message.cs4Label == 'Login Status'}}"

      - set:
          host.os.family: "{{parsed_event.message.get('Endpoint.Device-Family')}}"

      - set:
          aruba.clearpass.enforcement_profile: "{{parsed_event.message.cs5}}"
        filter: "{{parsed_event.message.cs5 != None and parsed_event.message.cs5Label == 'Enforcement Profiles'}}"

      - set:
          aruba.clearpass.privilege_level: "{{parsed_event.message.cs4}}"
        filter: "{{parsed_event.message.cs4 != None and parsed_event.message.cs4Label == 'Privilege Level'}}"

      - set:
          aruba.clearpass.login_status: "{{parsed_event.message.cs4}}"
        filter: "{{parsed_event.message.cs4 != None and parsed_event.message.cs4Label == 'Login Status'}}"

      - set:
          aruba.clearpass.user.authentication.source: "{{parsed_event.message.ArubaClearpassUserAuthenticationSource}}"
          network.vlan.id: "{{parsed_event.message.ArubaClearpassAuthVLAN}}"
          observer.hostname: "{{parsed_event.message.ArubaClearpassCppmNodeCPPM}}"

      - set:
          aruba.clearpass.authentication.protocol: "{{parsed_event.message.cs2}}"
        filter: "{{parsed_event.message.cs2 != None and parsed_event.message.cs2Label == 'Authentication Protocol'}}"

      - set:
          aruba.clearpass.authentication.source: "{{parsed_event.message.cs3}}"
        filter: "{{parsed_event.message.cs3 != None and parsed_event.message.cs3Label == 'Authentication Source'}}"

      - set:
          aruba.clearpass.tacacs.command: "{{parsed_event.message.ArubaClearpassTacacsCommand}}"
        filter: "{{parsed_event.message.ArubaClearpassTacacsCommand != None}}"

      - set:
          aruba.clearpass.tacacs.service: "{{parsed_event.message.cs6}}"
        filter: "{{parsed_event.message.cs6 != None and parsed_event.message.cs6Label == 'Tacacs Service'}}"

      - set:
          aruba.clearpass.tacacs.authentication.action: "{{parsed_event.message.ArubaClearpassTacacsAuthenAction}}"
        filter: "{{parsed_event.message.ArubaClearpassTacacsAuthenAction != None}}"

      - set:
          aruba.clearpass.endpoint.mac_vendor: "{{parsed_event.message.get('Endpoint.MAC-Vendor')}}"
          aruba.clearpass.endpoint.device_name: "{{parsed_event.message.get('Endpoint.Device-Name')}}"
          aruba.clearpass.endpoint.device_category: "{{parsed_event.message.get('Endpoint.Device-Category')}}"
          aruba.clearpass.endpoint.status: "{{parsed_event.message.ArubaClearpassEndpointStatus}}"
          aruba.clearpass.endpoint.added_at: "{{parsed_event.message.get('Endpoint.Added-At') | to_rfc3339}}"
          host.hostname: "{{parsed_event.message.get('ArubaClearpassEndpointHostname') or parsed_event.message.get('Endpoint.Hostname')}}"
          aruba.clearpass.nad.network_device: "{{parsed_event.message.get('ArubaClearpassNadNetworkDevice')}}"
          aruba.clearpass.nad.name: "{{parsed_event.message.get('ArubaClearpassNadName')}}"
          aruba.clearpass.radius.user_name: "{{parsed_event.message.get('ArubaClearpassRadiusUsername')}}"
          aruba.clearpass.radius.calling_station_id: "{{parsed_event.message.get('ArubaClearpassRadiusCallingStationId')}}"
          aruba.clearpass.radius.termination_cause: "{{parsed_event.message.get('ArubaClearpassRadiusTerminationCause')}}"

      - set:
          host.ip:
            [
              "{{parsed_event.message.get('ArubaClearpassEndpointIPAddress') or parsed_event.message.get('Endpoint.IPAddress')}}",
            ]
        filter: "{{(parsed_event.message.get('ArubaClearpassEndpointIPAddress') or parsed_event.message.get('Endpoint.IPAddress')) | is_ipaddress}}"

      - set:
          aruba.clearpass.radius.nas_ip_address: "{{parsed_event.message.get('ArubaClearpassRadiusNASIPAddress')}}"
        filter: "{{parsed_event.message.get('ArubaClearpassRadiusNASIPAddress') | is_ipaddress}}"

      - set:
          aruba.clearpass.radius.framed_ip_address: "{{parsed_event.message.get('ArubaClearpassRadiusFramedIPAddress')}}"
        filter: "{{parsed_event.message.get('ArubaClearpassRadiusFramedIPAddress') | is_ipaddress}}"

      - set:
          host.mac:
            [
              "{{(parsed_event.message.get('ArubaClearpassEndpointMACAddress') or parsed_event.message.get('Endpoint.MACAddress')) | to_mac_address}}",
            ]
        filter: "{{(parsed_event.message.get('ArubaClearpassEndpointMACAddress') or parsed_event.message.get('Endpoint.MACAddress')) not in [None, '']}}"

      - translate:
        dictionary:
          "t": "true"
          "f": "false"
        mapping:
          parsed_event.message.ArubaClearpassEndpointConflict: aruba.clearpass.endpoint.conflict

  set_audit_records_fields:
    actions:
      - set:
          event.category: ["configuration"]
          event.type: ["change"]
          event.dataset: "aruba-clearpass.audit"

      - set:
          event.type: ["creation"]
        filter: "{{parsed_event.message.get('act', '') | lower == 'add'}}"

      - set:
          event.type: ["deletion"]
        filter: "{{parsed_event.message.get('act', '') | lower == 'remove'}}"

      - set:
          aruba.clearpass.object_name: "{{parsed_event.message.fname}}"

  set_system_fields:
    actions:
      - set:
          event.category: ["process"]
          event.type: ["info"]
          event.dataset: "aruba-clearpass.system"

      - set:
          event.outcome: "{{parsed_event.message.outcome | lower}}"
          process.name: "{{parsed_event.message.deviceProcessName}}"
