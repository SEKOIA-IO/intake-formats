zscaler.zpa.AccessPolicyName:
  description: The access policy rule name
  name: zscaler.zpa.AccessPolicyName
  type: text

zscaler.zpa.AppConnectorGroupName:
  description: The App Connector group name
  name: zscaler.zpa.AppConnectorGroupName
  type: text

zscaler.zpa.AppConnectorIP:
  description: The source IP address of the App Connector
  name: zscaler.zpa.AppConnectorIP
  type: ip

zscaler.zpa.AppConnectorName:
  description: The App Connector name
  name: zscaler.zpa.AppConnectorName
  type: text

zscaler.zpa.AppConnectorPort:
  description: The source port of the App Connector
  name: zscaler.zpa.AppConnectorPort
  type: number

zscaler.zpa.AppConnectorVersion:
  description: The App Connector package version
  name: zscaler.zpa.AppConnectorVersion
  type: text

zscaler.zpa.AppGroupName:
  description: The application group name
  name: zscaler.zpa.AppGroupName
  type: text

zscaler.zpa.AppMicroTenantID:
  description: The Microtenant ID of the application
  name: zscaler.zpa.AppMicroTenantID
  type: text

zscaler.zpa.ClientConnectorVersion:
  description: The Zscaler Client Connector version
  name: zscaler.zpa.ClientConnectorVersion
  type: text

zscaler.zpa.ClientType:
  description:
    The client type for the request (i.e., Zscaler Client Connector, ZPA
    LSS, or Web Browser)
  name: zscaler.zpa.ClientType
  type: text

zscaler.zpa.ConnectorZEN:
  description: The ZPA Public Service Edge that sent the request from the App Connector
  name: zscaler.zpa.ConnectorZEN
  type: text

zscaler.zpa.InspectionControlsHitCount:
  description: The number of AppProtection control hits
  name: zscaler.zpa.InspectionControlsHitCount
  type: number

zscaler.zpa.InspectionPolicy:
  description: The AppProtection policy
  name: zscaler.zpa.InspectionPolicy
  type: text

zscaler.zpa.InspectionProfile:
  description: The AppProtection profile
  name: zscaler.zpa.InspectionProfile
  type: text

zscaler.zpa.Microtenant_id:
  description: The Microtenant ID of the user or App Connector accessing the application
  name: zscaler.zpa.Microtenant_id
  type: text

zscaler.zpa.ParanoiaLevel:
  description: The OWASP Predefined Paranoia Level
  name: zscaler.zpa.ParanoiaLevel
  type: text

zscaler.zpa.PostureHit:
  description:
    The posture profiles that the Zscaler Client Connector verified for
    this device
  name: zscaler.zpa.PostureHit
  type: text

zscaler.zpa.PostureMiss:
  description:
    The posture profiles that the Zscaler Client Connector failed to verify
    for this device
  name: zscaler.zpa.PostureMiss
  type: text

zscaler.zpa.TrustedNetworksID:
  description:
    The unique IDs for the trusted networks that the Zscaler Client Connector
    has determined for this device
  name: zscaler.zpa.TrustedNetworksID
  type: text

zscaler.zpa.TrustedNetworksNames:
  description:
    The names for the trusted networks that the Zscaler Client Connector
    has determined for this device
  name: zscaler.zpa.TrustedNetworksNames
  type: text

zscaler.zpa.auditNewValue:
  description:
    "The new value that was changed if the action type is create, sign
    in, or update. If the modified object is policy related, the value depends on
    the policy type. "
  name: zscaler.zpa.auditNewValue
  type: text

zscaler.zpa.auditOldValue:
  description:
    The previous value that was changed if the action type is delete, sign
    out, or update. If the modified object is policy related, the value depends on
    the policy type.
  name: zscaler.zpa.auditOldValue
  type: text

zscaler.zpa.auditOperationType:
  description: "The action performed.

    The expected values for this field:

    Create

    Client Session Revoked

    Delete

    Download

    Sign In

    Sign In Failure

    Sign Out

    Update

    "
  name: zscaler.zpa.auditOperationType
  type: text

zscaler.zpa.objectID:
  description: The ID associated with the object name
  name: zscaler.zpa.objectID
  type: text

zscaler.zpa.objectName:
  description:
    The name of the object. This corresponds to the Resource Name in the
    Audit Log page.
  name: zscaler.zpa.objectName
  type: text

zscaler.zpa.objectType:
  description:
    The location within the ZPA Admin Portal where the Action was performed.
    This corresponds to the Resource Type on the Audit Log page.
  name: zscaler.zpa.objectType
  type: text
