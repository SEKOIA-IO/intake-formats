upwind.console_link:
  description: Direct link to the detection in the Upwind console
  name: upwind.console_link
  type: keyword

upwind.detection.category:
  description: Category of the detection (e.g. API_SECURITY)
  name: upwind.detection.category
  type: keyword

upwind.detection.initiator.id:
  description: Id(s) of the initiator(s) of the detected event
  name: upwind.detection.initiator.id
  type: keyword

upwind.detection.initiator.name:
  description: Name(s) of the initiator(s) of the detected event
  name: upwind.detection.initiator.name
  type: keyword

upwind.detection.occurrences:
  description: Number of times this detection has been observed
  name: upwind.detection.occurrences
  type: long

upwind.detection.status:
  description: Detection status (e.g. OPEN, CLOSED)
  name: upwind.detection.status
  type: keyword

upwind.detection.title:
  description: Human-readable detection title
  name: upwind.detection.title
  type: keyword

upwind.detection.type:
  description: Machine-readable detection type identifier (e.g. aws_cloudtrail_security_group_allow_traffic_to_all_ports)
  name: upwind.detection.type
  type: keyword

upwind.detection.resource.type:
  description: Detection resource type (e.g. KUBERNETES_DEPLOYMENT)
  name: upwind.detection.resource.type
  type: keyword

