version: 2.0
uuid: 942970ca-8d67-4730-b625-5370d4a3fcb2
format_uuid: 46ca6fc8-3d30-434c-92ff-0e1cde564161
rule: Proofpoint TAP Email Classified As Phishing But Allowed
description: >-
  An email was classified as phishing with a threat score greater than 50 by Proofpoint TAP but was not blocked. The threshold on the Threat Score has been defined to avoid a high amount of false positives.
sources: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/SIEM_API
effort: master
detection:
    selection_threat_scores:
      proofpoint.tap.threat.classifications: 'phish'
      proofpoint.tap.threat.scores.phish|gt: 50
      event.action: '*'
    selection_click:
      proofpoint.tap.threat.classifications: 'phish'
      event.dataset: 'click'
      event.action: '*'
    filter:
      event.action: 'blocked'
    condition: (selection_threat_scores or selection_click) and not filter
alert_category: abusive-content
alert_type: spam
alert_severity: 50
attack:
  - T1566
data_sources:
  - Anti-virus
  - Email gateway
event_fields:
  - field: email.from.address
    description: email sender
  - field: email.to.address
    description: email recipient
  - field: email.subject
    description: email subject
  - field: source.ip
    description: IP source
  - field: proofpoint.tap.threat.scores.phish
    description: ProofPoint threat score
similarity_strategy:
  - sekoiaio.entity.uuid
  - email.from.address
tags:
  - Proofpoint TAP
changelog:
  - date: 01/06/2026
    level: major
    change: Adding a new selection for "click" events as they do not have a threat score. Effort level adapted as well since this is now an integration rule.
