  type: keyword

bitdefender.gravityzone.incident.main_action:
  description: Action taken by GravityZone on the incident (e.g. blocked, detected).
  name: bitdefender.gravityzone.incident.main_action
  type: keyword

bitdefender.gravityzone.incident.number:
  description: Human-readable incident number assigned by GravityZone.
  name: bitdefender.gravityzone.incident.number
  type: keyword

bitdefender.gravityzone.incident.severity_score:
  description: Numeric severity score assigned by GravityZone (0-100).
  name: bitdefender.gravityzone.incident.severity_score
