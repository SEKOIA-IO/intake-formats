bitdefender.gravityzone.incident.detection_name:
  description: Detection signature name that flagged the incident.
  name: bitdefender.gravityzone.incident.detection_name
  type: keyword

bitdefender.gravityzone.incident.id:
  description: Identifier of the GravityZone incident.
