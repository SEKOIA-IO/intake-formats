hodeishield.alert.acknowledged_at:
  description: Time at which the alert was acknowledged, in RFC 3339 format.
  name: hodeishield.alert.acknowledged_at
  type: keyword

hodeishield.alert.details.confidence:
  description: Confidence of the discovery of the dependency (high, medium or low).
  name: hodeishield.alert.details.confidence
  type: keyword

hodeishield.alert.details.dependency_id:
  description: Identifier of the nth-party dependency the alert is about.
  name: hodeishield.alert.details.dependency_id
  type: keyword

hodeishield.alert.details.detection_date:
  description: Time at which the ICT incident was detected, in RFC 3339 format.
  name: hodeishield.alert.details.detection_date
  type: keyword

hodeishield.alert.details.discovered_at:
  description: Time at which the dependency was discovered, in RFC 3339 format.
  name: hodeishield.alert.details.discovered_at
  type: keyword

hodeishield.alert.details.expected_version:
  description: Version of the endpoint agent that the update should install.
  name: hodeishield.alert.details.expected_version
  type: keyword

hodeishield.alert.details.incident_id:
  description: Identifier of the ICT incident in the DORA register.
  name: hodeishield.alert.details.incident_id
  type: keyword

hodeishield.alert.details.incident_severity:
  description: Severity of the ICT incident in the DORA register (major, possible_major,
    significant or minor).
  name: hodeishield.alert.details.incident_severity
  type: keyword

hodeishield.alert.details.incident_status:
  description: Status of the ICT incident (open or resolved).
  name: hodeishield.alert.details.incident_status
  type: keyword

hodeishield.alert.details.reporting_endpoints:
  description: Number of endpoints that reported their agent version.
  name: hodeishield.alert.details.reporting_endpoints
  type: long

hodeishield.alert.details.reporting_status:
  description: Whether the ICT incident was reported to the authority (not_reported).
  name: hodeishield.alert.details.reporting_status
  type: keyword

hodeishield.alert.details.scan_id:
  description: Identifier of the vendor scan that raised the alert.
  name: hodeishield.alert.details.scan_id
  type: keyword

hodeishield.alert.details.scanned_at:
  description: Time of the scan that raised the alert, in RFC 3339 format.
  name: hodeishield.alert.details.scanned_at
  type: keyword

hodeishield.alert.details.score_current:
  description: Risk score of the vendor at the scan that raised the alert, from 0
    to 100 where a higher score is worse.
  name: hodeishield.alert.details.score_current
  type: long

hodeishield.alert.details.score_delta:
  description: Increase of the risk score since the previous scan.
  name: hodeishield.alert.details.score_delta
  type: long

hodeishield.alert.details.score_delta_threshold:
  description: Increase of the risk score above which a degradation is reported.
  name: hodeishield.alert.details.score_delta_threshold
  type: long

hodeishield.alert.details.score_previous:
  description: Risk score of the vendor at the previous scan, from 0 to 100 where
    a higher score is worse. Absent on the first scan.
  name: hodeishield.alert.details.score_previous
  type: long

hodeishield.alert.details.score_threshold:
  description: Risk score at or above which the vendor is critical.
  name: hodeishield.alert.details.score_threshold
  type: long

hodeishield.alert.details.since:
  description: Time since which the agent update problem exists, in RFC 3339 format.
  name: hodeishield.alert.details.since
  type: keyword

hodeishield.alert.details.stall_kind:
  description: Kind of endpoint agent update problem (version_trailing, silent_after_allow
    or reported_failure).
  name: hodeishield.alert.details.stall_kind
  type: keyword

hodeishield.alert.details.third_party_name:
  description: Name of the organization the vendor depends on.
  name: hodeishield.alert.details.third_party_name
  type: keyword

hodeishield.alert.details.third_party_type:
  description: Category of the organization the vendor depends on, for example cloud.
  name: hodeishield.alert.details.third_party_type
  type: keyword

hodeishield.alert.details.trailing_endpoints:
  description: Number of endpoints that have not reached the expected agent version.
  name: hodeishield.alert.details.trailing_endpoints
  type: long

hodeishield.alert.details.update_outcome:
  description: Outcome reported by the endpoint for a failed agent update, for example
    rollback_failed.
  name: hodeishield.alert.details.update_outcome
  type: keyword

hodeishield.alert.details.vendor_name:
  description: Name of the vendor the alert is about.
  name: hodeishield.alert.details.vendor_name
  type: keyword

hodeishield.alert.economic_impact:
  description: Estimated economic impact of the alert.
  name: hodeishield.alert.economic_impact
  type: float

hodeishield.alert.id:
  description: Identifier of the alert in HodeiShield.
  name: hodeishield.alert.id
  type: keyword

hodeishield.alert.previous_status:
  description: Status the alert had before a status-change event (open, acknowledged
    or resolved).
  name: hodeishield.alert.previous_status
  type: keyword

hodeishield.alert.resolution_reason:
  description: Why the alert was closed.
  name: hodeishield.alert.resolution_reason
  type: keyword

hodeishield.alert.resolved_at:
  description: Time at which the alert was resolved, in RFC 3339 format.
  name: hodeishield.alert.resolved_at
  type: keyword

hodeishield.alert.status:
  description: Status of the alert (open, acknowledged or resolved).
  name: hodeishield.alert.status
  type: keyword

hodeishield.alert.type:
  description: Family of the alert, for example breach, cve_critical, rating_drop,
    rating_critical, nth_party_risk, dora_incident_reportable, dora_incident_possible_major
    or agent_update_stalled.
  name: hodeishield.alert.type
  type: keyword

hodeishield.alert.updated_at:
  description: Time of the last change of the alert, in RFC 3339 format.
  name: hodeishield.alert.updated_at
  type: keyword

hodeishield.alert.vendor_id:
  description: Identifier of the vendor the alert is about.
  name: hodeishield.alert.vendor_id
  type: keyword

hodeishield.event_id:
  description: Stable delivery identifier of the event, identical across retries of
    the same alert; can be used to drop duplicates.
  name: hodeishield.event_id
  type: keyword
