name: sonicwall-sma-1000
pipeline:
  - name: parsed_event
    external:
      name: grok.match
      properties:
        input_field: "{{ original.message }}"
        output_field: result
        pattern: "%{MANAGEMENT_MESSAGE}|%{NETWORK_TUNNEL_AUDIT_BRACKETED}|%{SYSTEM_MESSAGE}|%{MANAGEMENT_AUDIT}|%{MANAGEMENT_ACCESS}|%{NETWORK_TUNNEL}|%{NETWORK_FLOW}|%{WEB_PROXY}|%{WORKPLACE_SERVICE}|%{WORKPLACE_CLIENT}|%{MANAGEMENT_PLAIN}|%{MANAGEMENT_PLAIN_SERVICE}|%{UNREGISTERED_DEVICE}|%{UNIX_AUTH}|%{RESOURCE_ACCESS}|%{CRON_CMD}"
        custom_patterns:
          MANAGEMENT_MESSAGE: "^(?P<management_datestamp>\\S+) (?P<management_service>[^@\\s]+)@(?P<management_hostname>\\S+) (?P<management_facility>[^.\\s]+)\\.(?P<management_syslog_level>\\S+) AMC: (?P<management_internal_date>\\d{4}-\\d{2}-\\d{2}) (?P<management_internal_time>\\d{2}:\\d{2}:\\d{2}) (?P<management_timezone>[+-]\\d{4}) (?P<management_level>\\S+) (?P<management_message>.*)$"
          NETWORK_TUNNEL_AUDIT_BRACKETED: "^\\[(?P<audit_flow_datestamp>[^\\]]+)\\]\\s+(?P<audit_flow_hostname>\\S+)\\s+(?P<audit_flow_pid>\\d+)\\s+(?P<audit_flow_app_id>\\S+)\\s+(?P<audit_flow_source_id>\\S+)\\s+(?P<audit_flow_level>\\S+)\\s+(?P<audit_flow_type>\\S+)\\s+Src='(?P<audit_flow_src>[^']+)'\\s+User='(?P<audit_flow_user>[^']+)'\\s+TunnelVersion='(?P<audit_flow_tunnel_version>[^']+)'\\s+Command='(?P<audit_flow_command>[^']+)'\\s+Dest='(?P<audit_flow_dest>[^']+)'\\s+Error='(?P<audit_flow_error>[^']+)'\\s+SrcBytes='(?P<audit_flow_src_bytes>\\d+)'\\s+DstBytes='(?P<audit_flow_dst_bytes>\\d+)'\\s+Duration='(?P<audit_flow_duration>\\d+)'\\s+PlatformPrefix='(?P<audit_flow_platform_prefix>[^']+)'\\s+EquipmentId='(?P<audit_flow_equipment_id>[^']+)'(?:\\s+SessionKey='(?P<audit_flow_session_key>[^']+)')?$"
          SYSTEM_MESSAGE: "^\\[(?P<system_datestamp>[^\\]]+)\\]\\s+(?P<system_hostname>\\S+)\\s+(?:(?P<system_node>\\S+)\\s+)?(?P<system_pid>\\d+)\\s+(?P<system_app_id>\\S+)\\s+(?P<system_source_id>\\S+)\\s+(?P<system_level>\\S+)\\s+(?P<system_type>\\S+)\\s+(?P<system_message>.*)$"
          MANAGEMENT_AUDIT: "^(?P<audit_level>Error|Warning|Info|Verbose) (?P<audit_date>\\d{1,2}/\\d{1,2}/\\d{4}) (?P<audit_time>\\d{2}:\\d{2}:\\d{2}) (?P<audit_username>\\S+) (?P<audit_message>.*)$"
          MANAGEMENT_ACCESS: "^(?P<mgmt_source_ip>\\S+) \\- (?P<mgmt_username>[^\\s(][^\\s]*) \\[(?P<mgmt_datestamp>[^\\]]+)\\] \"(?P<mgmt_http_method>[A-Z]+) (?P<mgmt_url_path>\\S+) HTTP/(?P<mgmt_http_version>[^\"]+)\" (?P<mgmt_status>\\d{3}) (?P<mgmt_bytesout>\\d+)$"
          NETWORK_TUNNEL: "^\\[(?P<tunnel_source_ip>[^\\]]+)\\]:(?P<tunnel_source_port>\\d+) \\- \"(?P<tunnel_user_realm>[^\"]+)\" \"(?P<tunnel_datestamp>[^\"]+)\" (?P<tunnel_version>\\S+) tunnel (?P<tunnel_client_ip>\\S+) (?P<tunnel_error_code>-?\\d+) (?P<tunnel_client_bytes>\\d+) (?P<tunnel_server_bytes>\\d+) (?P<tunnel_duration>\\d+) (?P<tunnel_platform_prefix>\\S+)\\\"(?P<tunnel_equipment_id>[^\"]*)\"$"
          NETWORK_FLOW: "^(?P<flow_source_ip>\\S+):(?P<flow_source_port>\\d+) \\- \"(?P<flow_user_realm>[^\"]+)\" \"(?P<flow_datestamp>[^\"]+)\" (?P<flow_version>\\S+) flow:(?P<flow_protocol>[^\\s]+) (?P<flow_destination>\\S+) (?P<flow_error_code>-?\\d+) (?P<flow_client_bytes>\\d+) (?P<flow_server_bytes>\\d+) (?P<flow_duration>\\d+) (?P<flow_platform_prefix>\\S+)\\\"(?P<flow_equipment_id>[^\"]*)\"$"
          WEB_PROXY: "^(?P<web_source_ip>\\S+) \\- \\((?P<web_username>[^)]*)\\)@\\((?P<web_realm>[^)]*)\\) \\[(?P<web_datestamp>[^\\]]+)\\] \"(?P<web_http_method>[A-Z]+) (?P<web_url_path>\\S+) HTTP/(?P<web_http_version>[^\"]+)\" (?P<web_status>\\d{3}) (?P<web_bytes_sent>\\d+)$"
          WORKPLACE_SERVICE: "^(?P<workplace_datestamp>\\S+) (?P<workplace_service>[^@\\s]+)@(?P<workplace_hostname>\\S+) (?P<workplace_facility>[^.\\s]+)\\.(?P<workplace_syslog_level>\\S+) (?P<workplace_provider>WP:) (?P<workplace_message>.*)$"
          WORKPLACE_CLIENT: "^(?P<workplace_datestamp>\\S+) (?P<workplace_client_pair>\\S+/\\S+) (?P<workplace_facility>[^.\\s]+)\\.(?P<workplace_syslog_level>\\S+) (?P<workplace_level>\\S+) (?P<workplace_message>.*)$"
          MANAGEMENT_PLAIN: "^(?P<plain_date>\\d{4}-\\d{2}-\\d{2}) (?P<plain_time>\\d{2}:\\d{2}:\\d{2}) (?P<plain_timezone>[+-]\\d{4}) (?P<plain_level>\\S+)\\s+\\[(?P<plain_username>[^\\]]+)\\]: (?P<plain_message>.*)\\n?$"
          MANAGEMENT_PLAIN_SERVICE: "^(?P<plain_service_date>\\d{4}-\\d{2}-\\d{2}) (?P<plain_service_time>\\d{2}:\\d{2}:\\d{2}) (?P<plain_service_timezone>[+-]\\d{4}) (?P<plain_service_level>\\S+)\\s+(?P<plain_service_class>[^\\s]+) - (?P<plain_service_message>.*)\\n?$"
          UNREGISTERED_DEVICE: "^https?://(?P<unreg_target>[^/]+)/UnregisteredDevices\\.xml(?:\\?(?P<unreg_query_params>.*))?$"
          UNIX_AUTH: "^pam_unix\\((?P<unix_auth_context>[^)]*)\\): (?P<unix_auth_message>.*)$"
          RESOURCE_ACCESS: "^EventMessage: Resource Access - User='(?P<resource_user>[^']+)', Src='(?P<resource_src>[^']+)', Dest_IP='(?P<resource_dest_ip>[^']+)', Rule Info='(?P<resource_rule_info>[^']+)', Full Destination='(?P<resource_full_destination>[^']+)', Access Agent='(?P<resource_access_agent>[^']+)', Allowed='(?P<resource_allowed>[^']+)'$"
          CRON_CMD: "^\\((?P<cron_user>[^)]+)\\) CMD \\((?P<cron_command>.*)\\)$"

  - name: parse_unregistered_query
    filter: "{{ parsed_event.result != None and 'unreg_target' in parsed_event.result and parsed_event.result.unreg_target != None and 'unreg_query_params' in parsed_event.result and parsed_event.result.unreg_query_params != None and 'UnregisteredDevices.xml' in original.message }}"
    external:
      name: kv.parse-kv
      properties:
        input_field: "{{ parsed_event.result.unreg_query_params }}"
        output_field: query
        item_sep: "&"
        value_sep: "="

  - name: parse_system_datetime_textual
    filter: "{{ parsed_event.result != None and 'system_datestamp' in parsed_event.result and parsed_event.result.system_datestamp != None and parsed_event.result.system_datestamp.lower() != parsed_event.result.system_datestamp.upper() }}"
    external:
      name: date.parse
      properties:
        input_field: "{{ parsed_event.result.system_datestamp.replace(':', ' ', 1) }}"
        format: "%d/%b/%Y %H:%M:%S.%f %z"
        output_field: date

  - name: parse_system_datetime_numeric_tz
    filter: "{{ parsed_event.result != None and 'system_datestamp' in parsed_event.result and parsed_event.result.system_datestamp != None and parsed_event.result.system_datestamp.lower() == parsed_event.result.system_datestamp.upper() and (' +' in parsed_event.result.system_datestamp or ' -' in parsed_event.result.system_datestamp) }}"
    external:
      name: date.parse
      properties:
        input_field: "{{ parsed_event.result.system_datestamp }}"
        format: "%m/%d/%Y %H:%M:%S.%f %z"
        output_field: date

  - name: parse_system_datetime_numeric
    filter: "{{ parsed_event.result != None and 'system_datestamp' in parsed_event.result and parsed_event.result.system_datestamp != None and parsed_event.result.system_datestamp.lower() == parsed_event.result.system_datestamp.upper() and ' +' not in parsed_event.result.system_datestamp and ' -' not in parsed_event.result.system_datestamp }}"
    external:
      name: date.parse
      properties:
        input_field: "{{ parsed_event.result.system_datestamp }}"
        format: "%m/%d/%Y %H:%M:%S.%f"
        output_field: date

  - name: parse_management_datetime
    filter: "{{ parsed_event.result != None and 'management_datestamp' in parsed_event.result and parsed_event.result.management_datestamp != None }}"
    external:
      name: date.parse
      properties:
        input_field: "{{ parsed_event.result.management_datestamp }}"
        format: "%Y-%m-%dT%H:%M:%S%z"
        output_field: date

  - name: parse_management_start_datetime
    filter: "{{ parsed_event.result != None and 'management_internal_date' in parsed_event.result and 'management_internal_time' in parsed_event.result and 'management_timezone' in parsed_event.result and parsed_event.result.management_internal_date != None and parsed_event.result.management_internal_time != None and parsed_event.result.management_timezone != None }}"
    external:
      name: date.parse
      properties:
        input_field: "{{ parsed_event.result.management_internal_date }} {{ parsed_event.result.management_internal_time }} {{ parsed_event.result.management_timezone }}"
        format: "%Y-%m-%d %H:%M:%S %z"
        output_field: date

  - name: parse_management_audit_datetime
    filter: "{{ parsed_event.result != None and 'audit_date' in parsed_event.result and 'audit_time' in parsed_event.result and parsed_event.result.audit_date != None and parsed_event.result.audit_time != None and '/' in parsed_event.result.audit_date }}"
    external:
      name: date.parse
      properties:
        input_field: "{{ parsed_event.result.audit_date }} {{ parsed_event.result.audit_time }}"
        format: "%m/%d/%Y %H:%M:%S"
        output_field: date

  - name: parse_network_tunnel_audit_bracketed_datetime
    filter: "{{ parsed_event.result != None and 'audit_flow_datestamp' in parsed_event.result and parsed_event.result.audit_flow_datestamp != None }}"
    external:
      name: date.parse
      properties:
        input_field: "{{ parsed_event.result.audit_flow_datestamp.replace(':', ' ', 1) }}"
        format: "%d/%b/%Y %H:%M:%S.%f %z"
        output_field: date

  - name: parse_management_access_datetime
    filter: "{{ parsed_event.result != None and 'mgmt_datestamp' in parsed_event.result and parsed_event.result.mgmt_datestamp != None }}"
    external:
      name: date.parse
      properties:
        input_field: "{{ parsed_event.result.mgmt_datestamp.replace(':', ' ', 1) }}"
        format: "%d/%b/%Y %H:%M:%S %z"
        output_field: date

  - name: parse_network_tunnel_audit_datetime
    filter: "{{ parsed_event.result != None and 'tunnel_datestamp' in parsed_event.result and parsed_event.result.tunnel_datestamp != None }}"
    external:
      name: date.parse
      properties:
        input_field: "{{ parsed_event.result.tunnel_datestamp.replace(':', ' ', 1) }}"
        format: "%d/%b/%Y %H:%M:%S.%f %z"
        output_field: date

  - name: parse_network_tunnel_audit_flow_datetime
    filter: "{{ parsed_event.result != None and 'flow_datestamp' in parsed_event.result and parsed_event.result.flow_datestamp != None }}"
    external:
      name: date.parse
      properties:
        input_field: "{{ parsed_event.result.flow_datestamp.replace(':', ' ', 1) }}"
        format: "%d/%b/%Y %H:%M:%S.%f %z"
        output_field: date

  - name: parse_web_proxy_datetime
    filter: "{{ parsed_event.result != None and 'web_datestamp' in parsed_event.result and parsed_event.result.web_datestamp != None }}"
    external:
      name: date.parse
      properties:
        input_field: "{{ parsed_event.result.web_datestamp }}"
        format: "%m/%d/%Y %H:%M:%S.%f %z"
        output_field: date

  - name: parse_workplace_datetime
    filter: "{{ parsed_event.result != None and 'workplace_datestamp' in parsed_event.result and parsed_event.result.workplace_datestamp != None and (('workplace_service' in parsed_event.result and parsed_event.result.workplace_service != None) or ('workplace_client_pair' in parsed_event.result and parsed_event.result.workplace_client_pair != None and '/' in parsed_event.result.workplace_client_pair)) }}"
    external:
      name: date.parse
      properties:
        input_field: "{{ parsed_event.result.workplace_datestamp }}"
        format: "%Y-%m-%dT%H:%M:%S%z"
        output_field: date

  - name: parse_plain_datetime
    filter: "{{ parsed_event.result != None and 'plain_date' in parsed_event.result and 'plain_time' in parsed_event.result and 'plain_timezone' in parsed_event.result and parsed_event.result.plain_date != None and parsed_event.result.plain_time != None and parsed_event.result.plain_timezone != None }}"
    external:
      name: date.parse
      properties:
        input_field: "{{ parsed_event.result.plain_date }} {{ parsed_event.result.plain_time }} {{ parsed_event.result.plain_timezone }}"
        format: "%Y-%m-%d %H:%M:%S %z"
        output_field: date

  - name: parse_plain_service_datetime
    filter: "{{ parsed_event.result != None and 'plain_service_date' in parsed_event.result and 'plain_service_time' in parsed_event.result and 'plain_service_timezone' in parsed_event.result and parsed_event.result.plain_service_date != None and parsed_event.result.plain_service_time != None and parsed_event.result.plain_service_timezone != None }}"
    external:
      name: date.parse
      properties:
        input_field: "{{ parsed_event.result.plain_service_date }} {{ parsed_event.result.plain_service_time }} {{ parsed_event.result.plain_service_timezone }}"
        format: "%Y-%m-%d %H:%M:%S %z"
        output_field: date

  - name: set_common_fields
  - name: set_resource_access_fields
    filter: "{{ parsed_event.result != None and 'resource_user' in parsed_event.result and parsed_event.result.resource_user != None }}"
  - name: set_system_message_fields
    filter: "{{ parsed_event.result != None and 'system_datestamp' in parsed_event.result and parsed_event.result.system_datestamp != None }}"
  - name: set_network_tunnel_audit_bracketed_fields
    filter: "{{ parsed_event.result != None and 'audit_flow_datestamp' in parsed_event.result and parsed_event.result.audit_flow_datestamp != None }}"
  - name: set_management_message_fields
    filter: "{{ parsed_event.result != None and (('management_datestamp' in parsed_event.result and parsed_event.result.management_datestamp != None) or ('plain_date' in parsed_event.result and parsed_event.result.plain_date != None) or ('plain_service_date' in parsed_event.result and parsed_event.result.plain_service_date != None)) }}"
  - name: set_unix_auth_fields
    filter: "{{ parsed_event.result != None and 'unix_auth_context' in parsed_event.result and parsed_event.result.unix_auth_context != None }}"
  - name: set_cron_cmd_fields
    filter: "{{ parsed_event.result != None and 'cron_user' in parsed_event.result and parsed_event.result.cron_user != None }}"
  - name: set_management_audit_fields
    filter: "{{ parsed_event.result != None and 'audit_date' in parsed_event.result and 'audit_time' in parsed_event.result and parsed_event.result.audit_date != None and parsed_event.result.audit_time != None and '/' in parsed_event.result.audit_date }}"
  - name: set_management_access_fields
    filter: "{{ parsed_event.result != None and 'mgmt_datestamp' in parsed_event.result and parsed_event.result.mgmt_datestamp != None }}"
  - name: set_network_tunnel_audit_fields
    filter: "{{ parsed_event.result != None and (('tunnel_datestamp' in parsed_event.result and parsed_event.result.tunnel_datestamp != None) or ('flow_datestamp' in parsed_event.result and parsed_event.result.flow_datestamp != None)) }}"
  - name: set_web_proxy_fields
    filter: "{{ parsed_event.result != None and 'web_datestamp' in parsed_event.result and parsed_event.result.web_datestamp != None }}"
  - name: set_unregistered_device_fields
    filter: "{{ parsed_event.result != None and 'unreg_target' in parsed_event.result and parsed_event.result.unreg_target != None and 'UnregisteredDevices.xml' in original.message }}"
  - name: set_workplace_fields
    filter: "{{ parsed_event.result != None and 'workplace_datestamp' in parsed_event.result and parsed_event.result.workplace_datestamp != None and (('workplace_service' in parsed_event.result and parsed_event.result.workplace_service != None) or ('workplace_client_pair' in parsed_event.result and parsed_event.result.workplace_client_pair != None and '/' in parsed_event.result.workplace_client_pair)) }}"

stages:
  set_common_fields:
    actions:
      - set:
          event.kind: event
          observer.product: Secure Mobile Access
          observer.type: firewall
          observer.vendor: SonicWall

  set_resource_access_fields:
    actions:
      - set:
          event.action: resource-access
          event.category: ["network"]
          event.dataset: sonicwall.sma.1000.resource_access
          event.type: ["connection"]
          message: "{{ original.message }}"
          source.ip: "{{ parsed_event.result.resource_src.rsplit(':', 1)[0] }}"
          source.port: "{{ parsed_event.result.resource_src.rsplit(':', 1)[1] | int }}"
          source.user.name: "{{ parsed_event.result.resource_user.split(')@(')[0].strip('(').strip() }}"
          source.user.domain: "{{ parsed_event.result.resource_user.split(')@(')[1].split(')')[0].strip() }}"
          destination.ip: "{{ parsed_event.result.resource_dest_ip.rsplit(':', 1)[0] }}"
          destination.port: "{{ parsed_event.result.resource_dest_ip.rsplit(':', 1)[1] | int }}"
          user.name: "{{ parsed_event.result.resource_user.split(')@(')[0].strip('(').strip() }}"
          user.domain: "{{ parsed_event.result.resource_user.split(')@(')[1].split(')')[0].strip() }}"
        filter: "{{ parsed_event.result.resource_src != None and ':' in parsed_event.result.resource_src and parsed_event.result.resource_dest_ip != None and ':' in parsed_event.result.resource_dest_ip and parsed_event.result.resource_user != None and ')@(' in parsed_event.result.resource_user }}"

      - set:
          source.user.email: "{{ parsed_event.result.resource_user.split(')@(')[0].strip('(').strip() }}"
          user.email: "{{ parsed_event.result.resource_user.split(')@(')[0].strip('(').strip() }}"
        filter: "{{ parsed_event.result.resource_user != None and ')@(' in parsed_event.result.resource_user and '@' in parsed_event.result.resource_user.split(')@(')[0].strip('(').strip() }}"

      - set:
          rule.name: "{{ parsed_event.result.resource_rule_info }}"
        filter: "{{ parsed_event.result.resource_rule_info != None and parsed_event.result.resource_rule_info != '-' }}"

      - set:
          destination.domain: "{{ parsed_event.result.resource_full_destination.rsplit(':', 1)[0] }}"
        filter: "{{ parsed_event.result.resource_full_destination != None and ':' in parsed_event.result.resource_full_destination and parsed_event.result.resource_full_destination.rsplit(':', 1)[0].lower() != parsed_event.result.resource_full_destination.rsplit(':', 1)[0].upper() }}"

      - set:
          event.outcome: success
        filter: "{{ parsed_event.result.resource_allowed != None and parsed_event.result.resource_allowed == '1' }}"

      - set:
          event.outcome: failure
        filter: "{{ parsed_event.result.resource_allowed != None and parsed_event.result.resource_allowed == '0' }}"

  set_system_message_fields:
    actions:
      - set:
          event.category: ["host"]
          event.dataset: sonicwall.sma.1000.system
          event.severity: 6
          event.type: ["info"]
          message: "{{ original.message }}"
          observer.hostname: "{{ parsed_event.result.system_hostname }}"
          process.name: "{{ parsed_event.result.system_app_id }}"

      - set:
          "@timestamp": "{{ parse_system_datetime_textual.date }}"
        filter: "{{ parse_system_datetime_textual != None and parse_system_datetime_textual.date != None }}"

      - set:
          "@timestamp": "{{ parse_system_datetime_numeric_tz.date }}"
        filter: "{{ parse_system_datetime_numeric_tz != None and parse_system_datetime_numeric_tz.date != None }}"

      - set:
          "@timestamp": "{{ parse_system_datetime_numeric.date }}"
        filter: "{{ parse_system_datetime_numeric != None and parse_system_datetime_numeric.date != None }}"

      - set:
          process.pid: "{{ parsed_event.result.system_pid | int }}"
        filter: "{{ parsed_event.result.system_pid != None and parsed_event.result.system_pid | int > 0 }}"

      - set:
          process.pid: "{{ parsed_event.result.system_message.split('(pid=')[1].split(')')[0] | int }}"
        filter: "{{ parsed_event.result.system_message != None and '(pid=' in parsed_event.result.system_message and ')' in parsed_event.result.system_message.split('(pid=')[1] }}"

      - set:
          observer.hostname: "{{ parsed_event.result.system_hostname ~ ' ' ~ parsed_event.result.system_node }}"
        filter: "{{ parsed_event.result != None and 'system_node' in parsed_event.result and parsed_event.result.system_node != None }}"

      - set:
          event.severity: 3
        filter: "{{ parsed_event.result.system_level != None and parsed_event.result.system_level.lower() == 'error' }}"

      - set:
          event.severity: 4
        filter: "{{ parsed_event.result.system_level != None and parsed_event.result.system_level.lower() == 'warning' }}"

      - set:
          event.severity: 7
        filter: "{{ parsed_event.result.system_level != None and parsed_event.result.system_level.lower() == 'verbose' }}"

      - set:
          event.severity: 0
        filter: "{{ parsed_event.result.system_level != None and parsed_event.result.system_level.lower() == 'internal' }}"

      - set:
          sonicwall.sma.1000.app_id: "{{ parsed_event.result.system_app_id }}"

      - set:
          sonicwall.sma.1000.source_id: "{{ parsed_event.result.system_source_id }}"

      - set:
          sonicwall.sma.1000.policy.log_type: EWACL
        filter: "{{ ' EWACL ' in original.message }}"

      - set:
          sonicwall.sma.1000.policy.log_type: CSACL
        filter: "{{ ' CSACL ' in original.message }}"

      - set:
          sonicwall.sma.1000.policy.log_type: WPACL
        filter: "{{ ' WPACL ' in original.message }}"

      - set:
          sonicwall.sma.1000.policy.log_type: NEACL
        filter: "{{ ' NEACL ' in original.message }}"

      - set:
          sonicwall.sma.1000.epc.query_result: "{{ parsed_event.result.system_message.split('results:')[-1].strip() }}"
        filter: "{{ parsed_event.result.system_message != None and 'results:' in parsed_event.result.system_message }}"

      - set:
          sonicwall.sma.1000.certificate.error_code: "{{ parsed_event.result.system_message.split('err = ')[1].split(',')[0].strip() | int }}"
          sonicwall.sma.1000.certificate.error_reason: '{{ parsed_event.result.system_message.split("reason = ''")[1].split("''")[0] }}'
        filter: '{{ parsed_event.result.system_message != None and ''err ='' in parsed_event.result.system_message and "reason = ''" in parsed_event.result.system_message }}'

      - set:
          destination.ip: '{{ parsed_event.result.system_message.split(''access to '')[1].split('' '')[0].replace("''", '''').rsplit('':'', 1)[0] }}'
          destination.port: '{{ parsed_event.result.system_message.split(''access to '')[1].split('' '')[0].replace("''", '''').rsplit('':'', 1)[1] | int }}'
          source.ip: '{{ parsed_event.result.system_message.split(''connecting from '')[1].split('' '')[0].replace("''", '''').rsplit('':'', 1)[0] }}'
