      - set:
          sonicwall.sma.1000.workplace.policy_status: "{{ parsed_event.result.workplace_message.split('status=')[1].split(' ')[0] }}"
        filter: "{{ parsed_event.result.workplace_message != None and 'status=' in parsed_event.result.workplace_message }}"

      - set:
          sonicwall.sma.1000.workplace.shortcut_type: "{{ 'network' if 'uri=smb://' in parsed_event.result.workplace_message else 'web' }}"
        filter: "{{ parsed_event.result.workplace_message != None and ('uri=http' in parsed_event.result.workplace_message or 'uri=smb://' in parsed_event.result.workplace_message) }}"

      - set:
          sonicwall.sma.1000.workplace.team_session_id: "{{ parsed_event.result.workplace_message.split('teamSessionId=')[1].split(',')[0] }}"
        filter: "{{ parsed_event.result.workplace_message != None and 'teamSessionId=' in parsed_event.result.workplace_message }}"

  set_unix_auth_fields:
    actions:
      - set:
          event.category: ["host"]
          event.dataset: sonicwall.sma.1000.management_message
          event.severity: 6
          event.type: ["info"]
          message: "{{ original.message }}"

      - set:
          event.provider: "{{ parsed_event.result.unix_auth_context.split(':', 1)[0] }}"
        filter: "{{ parsed_event.result.unix_auth_context != None and ':' in parsed_event.result.unix_auth_context }}"

      - set:
          user.name: "{{ parsed_event.result.unix_auth_message.split('for user ')[1] }}"
        filter: "{{ parsed_event.result.unix_auth_message != None and 'for user ' in parsed_event.result.unix_auth_message }}"

      - set:
          sonicwall.sma.1000.unix_auth.context_type: "{{ parsed_event.result.unix_auth_context.split(':', 1)[1] }}"
        filter: "{{ parsed_event.result.unix_auth_context != None and ':' in parsed_event.result.unix_auth_context }}"

  set_cron_cmd_fields:
    actions:
      - set:
          event.action: scheduled-command
          event.category: ["host"]
          event.dataset: sonicwall.sma.1000.management_message
          event.provider: cron
          event.severity: 6
          event.type: ["info"]
          message: "{{ original.message }}"
          process.command_line: "{{ parsed_event.result.cron_command }}"
          user.name: "{{ parsed_event.result.cron_user }}"
