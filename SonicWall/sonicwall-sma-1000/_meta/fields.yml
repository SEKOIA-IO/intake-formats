sonicwall.sma.1000.api_endpoint:
  description: Extracted HTTP endpoint path for proxy requests
  name: sonicwall.sma.1000.api_endpoint
  type: keyword

sonicwall.sma.1000.app_id:
  description: Application or service identifier found in system message logs
  name: sonicwall.sma.1000.app_id
  type: keyword

sonicwall.sma.1000.certificate.error_code:
  description: Certificate verification error code from client certificate checks
  name: sonicwall.sma.1000.certificate.error_code
  type: long

sonicwall.sma.1000.certificate.error_reason:
  description: Certificate verification error reason from client certificate checks
  name: sonicwall.sma.1000.certificate.error_reason
  type: keyword

sonicwall.sma.1000.change_type:
  description: Derived category of management audit change
  name: sonicwall.sma.1000.change_type
  type: keyword

sonicwall.sma.1000.connection_type:
  description: Connection family for network tunnel logs such as tunnel or flow protocol
  name: sonicwall.sma.1000.connection_type
  type: keyword

sonicwall.sma.1000.console_action:
  description: Derived management console action from requested URL path
  name: sonicwall.sma.1000.console_action
  type: keyword

sonicwall.sma.1000.epc.query_result:
  description: Endpoint control interrogation evaluation result
  name: sonicwall.sma.1000.epc.query_result
  type: keyword

sonicwall.sma.1000.equipment_id:
  description: Equipment identifier emitted in network tunnel audit logs
  name: sonicwall.sma.1000.equipment_id
  type: keyword

sonicwall.sma.1000.export_state:
  description: Exported or unexported selector from unregistered device URL parameters
  name: sonicwall.sma.1000.export_state
  type: keyword

sonicwall.sma.1000.http_status_class:
  description: Derived HTTP response class such as 2xx, 3xx, 4xx, or 5xx
  name: sonicwall.sma.1000.http_status_class
  type: keyword

sonicwall.sma.1000.management.address_pool.id:
  description: Address pool identifier extracted from management plain messages
  name: sonicwall.sma.1000.management.address_pool.id
  type: keyword

sonicwall.sma.1000.management.address_pool.name:
  description: Address pool name extracted from management plain messages
  name: sonicwall.sma.1000.management.address_pool.name
  type: keyword

sonicwall.sma.1000.management.class_name:
  description: Java class name extracted from management service messages
  name: sonicwall.sma.1000.management.class_name
  type: keyword

sonicwall.sma.1000.policy.log_type:
  description: Access policy log family indicator such as CSACL, EWACL, WPACL, or
    NEACL
  name: sonicwall.sma.1000.policy.log_type
  type: keyword

sonicwall.sma.1000.registered_device_count:
  description: Registered device count filter from unregistered device URL parameters
  name: sonicwall.sma.1000.registered_device_count
  type: long

sonicwall.sma.1000.source_id:
  description: Internal system source identifier token extracted from system message
    logs
  name: sonicwall.sma.1000.source_id
  type: keyword

sonicwall.sma.1000.syslog_facility:
  description: Syslog facility extracted from management and workplace local facility
    labels
  name: sonicwall.sma.1000.syslog_facility
  type: keyword

sonicwall.sma.1000.tunnel_version:
  description: Tunnel protocol version from network tunnel audit logs
  name: sonicwall.sma.1000.tunnel_version
  type: keyword

sonicwall.sma.1000.unix_auth.context_type:
  description: PAM unix authentication context subtype extracted after the provider
  name: sonicwall.sma.1000.unix_auth.context_type
  type: keyword

sonicwall.sma.1000.unregistered_device.limit:
  description: Maximum unregistered device entries requested in export URL
  name: sonicwall.sma.1000.unregistered_device.limit
  type: long

sonicwall.sma.1000.workplace.policy_status:
  description: Raw policy status value observed in workplace authorization logs
  name: sonicwall.sma.1000.workplace.policy_status
  type: keyword

sonicwall.sma.1000.workplace.shortcut_type:
  description: Derived workplace shortcut type based on URI scheme
  name: sonicwall.sma.1000.workplace.shortcut_type
  type: keyword

sonicwall.sma.1000.workplace.team_session_id:
  description: Team session identifier extracted from workplace credential manager
    messages
  name: sonicwall.sma.1000.workplace.team_session_id
  type: keyword
