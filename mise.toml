[tools]
node = '24'
python = '3.14'
uv = '0.11.8'
prettier = '3.8.3'
pre-commit = '4.6.0'

[env]
UV_PROJECT = "utils"
_.python.venv = { path = "utils/.venv" }

[tasks.create-module]
description = "Create a new intake format module"
usage = '''
flag "--overwrite-if-exists" help="Overwrite the format if it already exists"
'''
run = "uv run utils/generate.py new-module ${usage_overwrite_if_exists}"

[tasks.create-format]
description = "Create a new intake format"
usage = '''
arg "<module>" help="Path to the module to create the format in"
flag "--overwrite-if-exists" help="Overwrite the format if it already exists"
'''
run = "uv run utils/generate.py new-format ${usage_module} ${usage_overwrite_if_exists}"

[tasks.create-test]
description = "Create a new test file for a format"
run = "uv run utils/create_test.py"

[tasks.test]
description = "Run tests"
run = "uv run pytest utils/test_formats.py"

[tasks.fix]
description = "Fix lint and formatting of the formats changed against origin/develop"
run = [
    "uv run python utils/linter.py fix --changes",
    "files=$(git diff --name-only --diff-filter=d origin/develop -- '*/ingest/parser.yml') && if [ -n \"$files\" ]; then prettier --write $files; fi",
]

[tasks.validate]
description = "Run the CI checks on the formats changed against origin/develop"
run = [
    "uv run python utils/linter.py check --changes",
    "files=$(git diff --name-only --diff-filter=d origin/develop -- '*/ingest/parser.yml') && if [ -n \"$files\" ]; then prettier --check $files; fi",
    "uv run pytest utils/test_formats.py --changes -q",
    "uv run python utils/checks --changes --ignore_event_fieldset_errors --ignore_missing_parsers --ignore_missing_tests --ignore_empty_descriptions",
]

[tasks.anonymize-tests]
description = "Anonymize test fixtures"
run = "uv run utils/anonymize.py"
