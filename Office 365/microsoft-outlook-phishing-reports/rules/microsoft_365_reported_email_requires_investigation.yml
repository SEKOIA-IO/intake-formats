version: 2.0
uuid: 9fa31e29-7c42-4651-b675-69966bcb48ab
format_uuid: bf9b4d59-b31d-5778-82d9-d7b7663343e1
rule: Microsoft 365 — Reported Email Requires Investigation
description: >-
  A user reported an email to the Microsoft 365 reporting mailbox. Review the reported
  message to determine whether it is malicious. Reports with incomplete or failed
  extraction are included.
effort: intermediate
detection:
  selection:
    event.dataset: microsoft_outlook.phishing_report
    event.action: user_reported_email
  condition: selection
alert_category: intrusions
alert_type: application-compromise
alert_severity: 30
data_sources:
  - Mail server
event_fields:
  - field: microsoft_outlook.report.reporter.address
    description: Email address of the user who submitted the report
  - field: email.from.address
    description: Sender address of the original message
  - field: email.subject
    description: Subject of the original message
  - field: microsoft_outlook.extraction.status
    description: Outcome of extracting evidence from the report
tags:
  - Microsoft 365 / Office 365
changelog:
  - date: 20/11/2026
    level: major
    change: Initial rule for triaging user-reported email
