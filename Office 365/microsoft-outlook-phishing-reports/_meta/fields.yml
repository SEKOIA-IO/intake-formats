microsoft_outlook.extraction.content_truncated:
  description: Whether event-size limits required omitting evidence. Retrieve the
    source through Graph.
  name: microsoft_outlook.extraction.content_truncated
  type: boolean

microsoft_outlook.extraction.errors:
  description: Extraction errors and source references. Empty does not mean the email
    is benign.
  name: microsoft_outlook.extraction.errors
  type: array

microsoft_outlook.extraction.status:
  description: 'Evidence extraction state: complete, partial, failed or no_embedded_email.
    unsupported_schema indicates an incompatible connector event schema.'
  name: microsoft_outlook.extraction.status
  type: keyword

microsoft_outlook.original.authentication.dkim:
  description: DKIM result claimed by the original Authentication-Results header.
  name: microsoft_outlook.original.authentication.dkim
  type: keyword

microsoft_outlook.original.authentication.dmarc:
  description: DMARC result claimed by the original Authentication-Results header.
  name: microsoft_outlook.original.authentication.dmarc
  type: keyword

microsoft_outlook.original.authentication.raw:
  description: Authentication-Results header copied from the original; not a new cryptographic
    validation.
  name: microsoft_outlook.original.authentication.raw
  type: keyword

microsoft_outlook.original.authentication.spf:
  description: SPF result claimed by the original Authentication-Results header.
  name: microsoft_outlook.original.authentication.spf
  type: keyword

microsoft_outlook.original.date:
  description: Original Date header, retained even when its timestamp cannot be parsed.
  name: microsoft_outlook.original.date
  type: keyword

microsoft_outlook.original.from:
  description: Original From header, retaining the display name.
  name: microsoft_outlook.original.from
  type: keyword

microsoft_outlook.original.received_headers:
  description: Received headers as extracted from the original; array indexing order
    is not guaranteed, consult the raw event for hop order.
  name: microsoft_outlook.original.received_headers
  type: array

microsoft_outlook.original.source_attachment_id:
  description: Graph attachment ID of this original, scoped to report.mailbox and
    report.id.
  name: microsoft_outlook.original.source_attachment_id
  type: keyword

microsoft_outlook.original.source_attachment_name:
  description: Attachment filename supplied by Graph, when available.
  name: microsoft_outlook.original.source_attachment_name
  type: keyword

microsoft_outlook.original.source_detected_format:
  description: 'Parsing route detected in downloaded bytes: eml for recognizable MIME
    headers, msg for an OLE signature. A successful extraction is required to confirm
    readable email content; the filename is not used.'
  name: microsoft_outlook.original.source_detected_format
  type: keyword

microsoft_outlook.original.source_graph_attachment_type:
  description: Graph @odata.type of the attachment containing this original (itemAttachment,
    fileAttachment or referenceAttachment). Not inferred from its filename.
  name: microsoft_outlook.original.source_graph_attachment_type
  type: keyword

microsoft_outlook.original.x_originating_ip:
  description: Unverified X-Originating-IP header copied from the original message.
  name: microsoft_outlook.original.x_originating_ip
  type: keyword

microsoft_outlook.report.event_id:
  description: Retry-stable identifier of this original within the report. Replays
    can reuse this value.
  name: microsoft_outlook.report.event_id
  type: keyword

microsoft_outlook.report.id:
  description: Immutable Microsoft Graph ID of the report envelope; use with report.mailbox,
    never as the original message ID.
  name: microsoft_outlook.report.id
  type: keyword

microsoft_outlook.report.internet_message_id:
  description: Internet Message-ID of the report envelope, including its original
    delimiters.
  name: microsoft_outlook.report.internet_message_id
  type: keyword

microsoft_outlook.report.mailbox:
  description: Mailbox where the report envelope was collected.
  name: microsoft_outlook.report.mailbox
  type: keyword

microsoft_outlook.report.original_count:
  description: Number of successfully extracted originals in this report, not the
    number of all attachments.
  name: microsoft_outlook.report.original_count
  type: long

microsoft_outlook.report.original_index:
  description: Zero-based position of this original among successfully extracted originals.
  name: microsoft_outlook.report.original_index
  type: long

microsoft_outlook.report.parent_folder_id:
  description: Microsoft Graph folder ID of the report envelope.
  name: microsoft_outlook.report.parent_folder_id
  type: keyword

microsoft_outlook.report.received_datetime:
  description: Time when the report reached the collection mailbox.
  name: microsoft_outlook.report.received_datetime
  type: date

microsoft_outlook.report.reporter.address:
  description: From address of the report envelope; not independently verified as
    the reporting user.
  name: microsoft_outlook.report.reporter.address
  type: keyword

microsoft_outlook.report.reporter.name:
  description: Display name on the report envelope.
  name: microsoft_outlook.report.reporter.name
  type: keyword

microsoft_outlook.report.subject:
  description: Subject of the report envelope, distinct from the reported original.
  name: microsoft_outlook.report.subject
  type: keyword

microsoft_outlook.schema_version:
  description: Version of the connector event contract.
  name: microsoft_outlook.schema_version
  type: long

microsoft_outlook.urls.destinations:
  description: Observed URLs with recognized Microsoft Safe Links decoded locally;
    no remote redirection or reachability check is performed.
  name: microsoft_outlook.urls.destinations
  type: array

microsoft_outlook.urls.observed:
  description: HTTP(S) URLs extracted from the original, including rewritten links;
    these are observed values, not threat intelligence matches.
  name: microsoft_outlook.urls.observed
  type: array
