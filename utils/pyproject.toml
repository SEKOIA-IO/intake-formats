[project]
name = "intake-formats"
version = "0.1.0"
description = "Sekoia.io Intake Formats"
authors = []
requires-python = ">=3.14"
dependencies = [
    "pytest>=8.4.2,<10.0.0",
    "requests>=2.32.5,<3.0.0",
    "PyYAML>=6.0.2,<7.0.0",
    "pytest-clarity>=1.0.1,<2.0.0",
    "cookiecutter>=2.6.0,<3.0.0",
    "typer>=0.9.4,<1.0.0",
    "orjson>=3.11.3,<4.0.0",
    "pydantic>=2.11.7,<3.0.0",
    "pillow>=12.3.0,<13.0",
    "rich>=14.1.0,<15.0.0",
    "structlog>=25.4.0,<26.0.0",
    "poethepoet>=0.26.1,<1.0.0",
    "numpy>=1.24.2,<2.0.0",
]

[dependency-groups]
dev = [
    "autoflake>=1.4,<2.0",
    "ruff>=0.9.0,<1.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["I"]

[tool.poe.tasks.lint]
sequence = [
    { cmd = "find . -type f -name '*.py' ! -name '__init__.py' ! -name '__main__.py' -exec uv run autoflake --in-place --remove-all-unused-imports --remove-duplicate-keys --remove-unused-variables {} +" },
    { cmd = "uv run ruff check --fix ." },
    { cmd = "uv run ruff format ." },
]
help = "Make code linting and formatting."
