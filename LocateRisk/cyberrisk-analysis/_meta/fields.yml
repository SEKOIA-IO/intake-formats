locaterisk.comment:
  description: User-added comment for the finding
  name: locaterisk.comment
  type: keyword

locaterisk.contact:
  description: Contact information associated with the finding
  name: locaterisk.contact
  type: keyword

locaterisk.measures:
  description: Recommended remediation measures to address the finding
  name: locaterisk.measures
  type: keyword

locaterisk.problem:
  description: Detailed description of the security problem associated with the finding
  name: locaterisk.problem
  type: keyword

locaterisk.risks:
  description: Description of the potential risks if the finding is not remediated
  name: locaterisk.risks
  type: keyword

locaterisk.score:
  description: The risk score delta computed by LocateRisk for this finding
  name: locaterisk.score
  type: keyword

locaterisk.tags:
  description: Tags associated with the finding
  name: locaterisk.tags
  type: keyword

vulnerability.cves:
  description: List of associated CVE identifiers with CVSS and EPSS scores
  name: vulnerability.cves
  type: keyword

vulnerability.epss:
  description: Exploit Prediction Scoring System (EPSS) score for the finding
  name: vulnerability.epss
  type: keyword

vulnerability.false_positive:
  description: Indicates whether the finding has been marked as a false positive
  name: vulnerability.false_positive
  type: boolean
