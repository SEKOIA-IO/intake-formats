locaterisk.comment:
  description: User-added comment for the finding
  name: locaterisk.comment
  type: keyword

locaterisk.contact:
  description: Contact information associated with the finding
  name: locaterisk.contact
  type: keyword

locaterisk.cyberrisk_analysis.cves:
  description: List of associated CVE identifiers with CVSS and EPSS scores
  name: locaterisk.cyberrisk_analysis.cves
  type: keyword

locaterisk.cyberrisk_analysis.epss:
  description: Exploit Prediction Scoring System (EPSS) probability (0-1) for the
    finding
  name: locaterisk.cyberrisk_analysis.epss
  type: scaled_float

locaterisk.cyberrisk_analysis.false_positive:
  description: Indicates whether the finding has been marked as a false positive
  name: locaterisk.cyberrisk_analysis.false_positive
  type: boolean

locaterisk.location:
  description: Scanned locations (URLs or host:port) associated with the finding
  name: locaterisk.location
  type: keyword

locaterisk.measures:
  description: Recommended remediation measures to address the finding
  name: locaterisk.measures
  type: keyword

locaterisk.problem:
  description: Detailed description of the security problem associated with the finding
  name: locaterisk.problem
  type: keyword

locaterisk.risks:
  description: Description of the potential risks if the finding is not remediated
  name: locaterisk.risks
  type: keyword

locaterisk.scan_date:
  description: Represents the datetime of the scan by LocateRisk
  name: locaterisk.scan_date
  type: datetime

locaterisk.score:
  description: The risk score delta computed by LocateRisk for this finding
  name: locaterisk.score
  type: scaled_float

locaterisk.tags:
  description: Tags associated with the finding
  name: locaterisk.tags
  type: keyword
