cloudflare.ActionDescription:
  description: Description of the action performed.
  name: cloudflare.ActionDescription
  type: keyword

cloudflare.ActionResult:
  description: Whether the action was successful.
  name: cloudflare.ActionResult
  type: boolean

cloudflare.ActorContext:
  description: Additional information about the actor that performed the action.
  name: cloudflare.ActorContext
  type: keyword

cloudflare.ActorType:
  description: Type of user that started the audit trail.
  name: cloudflare.ActorType
  type: keyword

cloudflare.ID:
  description: Unique identifier of an audit log (v1 ID, v2 AuditLogID).
  name: cloudflare.ID
  type: keyword

cloudflare.Interface:
  description: Entry point or interface of the audit log.
  name: cloudflare.Interface
  type: keyword

cloudflare.ResourceID:
  description: "Unique identifier of the resource within Cloudflare\u2019s system."
  name: cloudflare.ResourceID
  type: keyword

cloudflare.ResourceType:
  description: The type of resource that was changed.
  name: cloudflare.ResourceType
  type: keyword

cloudflare.request_client_default:
  description: Additional audit log-specific information.
  name: cloudflare.request_client_default
  type: boolean

cloudflare.request_name:
  description: Additional audit log-specific information.
  name: cloudflare.request_name
  type: keyword

cloudflare.request_networks:
  description: Additional audit log-specific information.
  name: cloudflare.request_networks
  type: array

cloudflare.zone_name:
  description: Name of the zone affected by the action (v1 Metadata.zone_name, v2
    ZoneName).
  name: cloudflare.zone_name
  type: keyword

cloudflare.zone_tag:
  description: Identifier of the zone affected by the action (v1 Metadata.zone_tag,
    v2 ZoneID).
  name: cloudflare.zone_tag
  type: keyword
