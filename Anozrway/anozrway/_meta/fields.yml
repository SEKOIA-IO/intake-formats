anozrway.event_id:
  description: Anozr Way identifier of the event, unique per event (event.id is reserved
    by Sekoia.io).
  name: anozrway.event_id
  type: keyword

anozrway.exposed_data_types:
  description: Distinct types of the data exposed by the leak, without their values,
    e.g. ["name", "email", "phone_number", "password"]. name and location group their
    parts (first_name, city, ...).
  name: anozrway.exposed_data_types
  type: array

anozrway.leak_date:
  description: Date the data was leaked, when known.
  name: anozrway.leak_date
  type: date

anozrway.leak_type:
  description: Leak type as classified by Anozr Way, sent as one of the literal values
    LEAK, COMBO, SCRAPPING, INFOSTEALER or RANSOMWARE.
  name: anozrway.leak_type
  type: keyword

anozrway.source_key:
  description: Name of the leak source as known by Anozr Way, e.g. the breach name.
  name: anozrway.source_key
  type: keyword

anozrway.threat_scores.account_takeover:
  description: Account takeover risk score of the individual, from 0 to 10 (low below
    4, medium from 4, high from 6, very high from 8).
  name: anozrway.threat_scores.account_takeover
  type: float

anozrway.threat_scores.coercion:
  description: Coercion risk score of the individual, from 0 to 10 (low below 4, medium
    from 4, high from 6, very high from 8).
  name: anozrway.threat_scores.coercion
  type: float

anozrway.threat_scores.identity_theft:
  description: Identity theft risk score of the individual, from 0 to 10 (low below
    4, medium from 4, high from 6, very high from 8).
  name: anozrway.threat_scores.identity_theft
  type: float

anozrway.threat_scores.phishing:
  description: Phishing risk score of the individual, from 0 to 10 (low below 4, medium
    from 4, high from 6, very high from 8).
  name: anozrway.threat_scores.phishing
  type: float
