version: 2.0
uuid: ab264f03-47af-4463-b0b4-a189e0452cab
format_uuid: 519c7378-7fbb-4008-870a-535675f50cdc
rule: Individual Reaching A High Risk
description: >-
  Detects an individual whose Anozr Way risk score becomes high: the data exposed about the
  individual makes account takeover, phishing, identity theft or coercion likely. The
  per-threat scores tell which.
sources: https://docs.sekoia.io/integration/categories/threat_intelligence/anozrway/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: '519c7378-7fbb-4008-870a-535675f50cdc'
    event.action: new_high_risk_individual
  condition: selection
alert_category: intrusions
alert_type: system-compromise
alert_severity: 50
attack:
  - T1589
  - T1598
event_fields:
  - field: user.email
    description: Professional email of the individual
  - field: event.risk_score
    description: Risk score of the individual
  - field: anozrway.threat_scores.account_takeover
    description: Account takeover risk score
  - field: anozrway.threat_scores.phishing
    description: Phishing risk score
  - field: anozrway.threat_scores.identity_theft
    description: Identity theft risk score
  - field: anozrway.threat_scores.coercion
    description: Coercion risk score
similarity_strategy:
  - sekoiaio.entity.uuid
  - user.email
  - user.id
data_sources:
  - Application logs
tags:
  - Anozr Way
changelog:
  - date: 25/11/2026
    level: major
    change: Initial version
