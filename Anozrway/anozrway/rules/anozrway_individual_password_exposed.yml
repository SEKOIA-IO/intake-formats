version: 2.0
uuid: 7accbdde-eeb7-4936-8bfb-2d8ce5718fda
format_uuid: 519c7378-7fbb-4008-870a-535675f50cdc
rule: Individual Password Exposed
description: >-
  Detects a new leak exposing the professional identity of an individual together with a
  password, which may still be valid on corporate accounts of the individual.
sources: https://docs.sekoia.io/integration/categories/threat_intelligence/anozrway/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: '519c7378-7fbb-4008-870a-535675f50cdc'
    event.action: new_pro_leaks
    anozrway.exposed_data_types: password
  condition: selection
alert_category: intrusions
alert_type: system-compromise
alert_severity: 85
attack:
  - T1078
  - T1589
event_fields:
  - field: user.email
    description: Professional email of the exposed individual
  - field: threat.indicator.provider
    description: Leak database the password comes from
  - field: anozrway.leak_type
    description: Leak type
  - field: anozrway.leak_date
    description: Date the data was leaked
similarity_strategy:
  - sekoiaio.entity.uuid
  - user.email
data_sources:
  - Application logs
tags:
  - Anozr Way
changelog:
  - date: 25/11/2026
    level: major
    change: Initial version
