name: Akamai Guardicore On-Prem [BETA]
slug: akamai-guardicore-on-prem

description: >-
  Akamai Guardicore delivers application-centric microsegmentation and breach detection to prevent lateral movement across on-premises and cloud environments.
  With process-level visibility, dynamic policy orchestration and automated workflows, it enforces Zero Trust controls at scale.
  Simplify network segmentation, accelerate threat response and maintain continuous compliance for critical assets.
  This integration will ingest events from an on-premises instance.

