akamai.guardicore.incident.affected_assets:
  description: List of asset IDs affected by the security incident, as reported
    by akamai.guardicore.
  name: akamai.guardicore.incident.affected_assets
  type: array

akamai.guardicore.incident.environment:
  description: Environment label associated with the source asset involved in the
    incident (e.g., Development, Production, Staging).
  name: akamai.guardicore.incident.environment
  type: keyword

akamai.guardicore.incident.id:
  description: Unique identifier of the security incident reported by akamai.guardicore.
  name: akamai.guardicore.incident.id
  type: keyword

akamai.guardicore.incident.severity:
  description: Severity level of the security incident as reported by akamai.guardicore
    (e.g., low, medium, high, critical).
  name: akamai.guardicore.incident.severity
  type: keyword

akamai.guardicore.incident.tags:
  description: Tags associated to the security incident.
  name: akamai.guardicore.incident.tags
  type: array

akamai.guardicore.network.connection_verdict:
  description: Final verdict of the network connection as determined by akamai.guardicore
    policy enforcement (e.g., blocked_by_destination, allowed_by_policy).
  name: akamai.guardicore.network.connection_verdict
  type: keyword

akamai.guardicore.network.destination.process.name:
  description: Name of the process running on the destination asset that received
    the network connection.
  name: akamai.guardicore.network.destination.process.name
  type: keyword

akamai.guardicore.network.destination.process.path:
  description: Full file system path of the process running on the destination asset
    that received the network connection.
  name: akamai.guardicore.network.destination.process.path
  type: keyword

akamai.guardicore.network.id:
  description: Unique identifier of the network connection event reported by akamai.guardicore.
  name: akamai.guardicore.network.id
  type: keyword

akamai.guardicore.network.incidents:
  description: Identifiers of security incidents related to this network connection
    event, as reported by akamai.guardicore.
  name: akamai.guardicore.network.incidents
  type: array

akamai.guardicore.signature_id:
  description: The signature ID of the event
  name: akamai.guardicore.signature_id
  type: keyword
