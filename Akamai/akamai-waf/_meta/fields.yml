akamai.bot.response_segment:
  description: Bot response segment as reported by Akamai WAF in botData.responseSegment.
  name: akamai.bot.response_segment
  type: keyword

akamai.bot.score:
  description: Bot score as reported by Akamai WAF in botData.botScore.
  name: akamai.bot.score
  type: keyword

akamai.configuration.id:
  description: Configuration identifier associated with the Akamai WAF event.
  name: akamai.configuration.id
  type: keyword

akamai.http.request.headers.content_type:
  description: Declared HTTP request Content-Type header value as reported by Akamai
    WAF.
  name: akamai.http.request.headers.content_type
  type: keyword

akamai.rules:
  description: List of triggered Akamai WAF rules with normalized id, action, message,
    and optional version or data context.
  name: akamai.rules
  type: array
