name: blue41-detections

# Maps the Blue41 exported event JSON onto ECS.
pipeline:
  - name: parsed_event
    external:
      name: json.parse-json
      properties:
        input_field: "{{original.message}}"
        output_field: message

  - name: common

stages:
  common:
    actions:
      - set:
          "@timestamp": "{{parsed_event.message.occurred_at}}"
          event.dataset: "{{parsed_event.message.ecs.dataset}}"
          event.module: blue41
          event.kind: "{{parsed_event.message.ecs.kind}}"
          event.category: ["{{parsed_event.message.ecs.category}}"]
          event.type: ["{{parsed_event.message.ecs.type}}"]
          event.severity: "{{parsed_event.message.ecs.severity}}"
          event.action: "{{parsed_event.message.event_action}}"
          event.outcome: "{{parsed_event.message.ecs.outcome}}"
          event.reason: "{{parsed_event.message.reason}}"
          log.level: "{{parsed_event.message.severity}}"
          message: "{{parsed_event.message.short_message}}"
          observer.vendor: Blue41
          observer.product: Blue41
          observer.type: sensor
          organization.id: "{{parsed_event.message.org_id}}"
          service.name: "{{parsed_event.message.service_name}}"
          host.name: "{{parsed_event.message.observables.host_name}}"
          process.name: "{{parsed_event.message.observables.process_name}}"
          destination.domain: "{{parsed_event.message.observables.destination_domain}}"
          trace.id: "{{parsed_event.message.trace_id}}"
          span.id: "{{parsed_event.message.span_id}}"
          event.url: "{{parsed_event.message.deeplink}}"
          user.id: "{{parsed_event.message.actor.id}}"
          user.email: "{{parsed_event.message.actor.email}}"
          user.name: "{{parsed_event.message.actor.email}}"
          http.request.method: "{{parsed_event.message.http.method}}"
          http.response.status_code: "{{parsed_event.message.http.status_code}}"
          url.path: "{{parsed_event.message.http.path}}"
          source.address: "{{parsed_event.message.client.address}}"
          source.ip: "{{parsed_event.message.client.ip}}"
          user_agent.original: "{{parsed_event.message.client.user_agent}}"
          rule.id: "{{parsed_event.message.alert.rule_id}}"
          rule.name: "{{parsed_event.message.alert.rule_name}}"
          rule.description: "{{parsed_event.message.long_message}}"
          rule.ruleset: "{{parsed_event.message.alert.template_id}}"
          blue41.event_id: "{{parsed_event.message.event_id}}"
          blue41.alert.fingerprint: "{{parsed_event.message.alert.fingerprint}}"
          blue41.actor.type: "{{parsed_event.message.actor.type}}"
          blue41.audit.resource_kind: "{{parsed_event.message.audit.resource_kind}}"
          blue41.audit.resource_id: "{{parsed_event.message.audit.resource_id}}"
