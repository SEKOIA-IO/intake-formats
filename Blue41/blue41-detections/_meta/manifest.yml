name: Blue41 Detections and Audit
slug: blue41-detections
automation_module_uuid: 342289a5-e615-406f-898b-83697a890b59
description: >-
  Blue41 detects threats to AI agents at runtime: guardrail violations, PII and secrets in tool
  responses, and unexpected outbound links. This intake receives Blue41 detections, as firing and
  resolve transitions, and the audit trail of configuration and access-control changes on the
  Blue41 platform. Every event links back to the Blue41 trace that raised it.
data_sources:
  API monitoring: Detections raised on AI agent tool calls and responses observed by Blue41.
  Application logs: Configuration, access-control and data-access actions performed on the Blue41 platform.
