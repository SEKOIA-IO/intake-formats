blue41.actor.type:
  description: Principal class that performed an audited action. One of user, service_account,
    system, anonymous.
  name: blue41.actor.type
  type: keyword

blue41.alert.fingerprint:
  description: "Hash of the alert's query-result labels, as a decimal string. Not\
    \ unique on its own \u2014 two rules matching the same span share a fingerprint\
    \ \u2014 so alert similarity must pair it with rule.id."
  name: blue41.alert.fingerprint
  type: keyword

blue41.audit.resource_id:
  description: Identifier of the resource the audited action targeted.
  name: blue41.audit.resource_id
  type: keyword

blue41.audit.resource_kind:
  description: Kind of resource the audited action targeted, e.g. rule, dashboard,
    session.
  name: blue41.audit.resource_kind
  type: keyword

blue41.event_id:
  description: Identifier Blue41 assigns to the exported event, stable across redeliveries.
  name: blue41.event_id
  type: keyword
