version: 2.0
uuid: 3965d9c0-627d-4d6f-923c-7c141c617c98
format_uuid: 033cd098-b21b-4c9b-85c4-c8174c307e48
rule: WithSecure Elements Warning Severity
description: >-
  Detects when WithSecure Elements raised an event with a warning (and is not blocked or quarantined).
sources: Sekoia.io
effort: master
detection:
  selection:
     withsecure.severity: 'warning'
  filter:
    event.action:
         - 'blocked'
         - 'quarantined'
  condition: selection and not filter
alert_category: intrusions
alert_type: system-compromise
alert_severity: 50
similarity_strategy:
  - sekoiaio.entity.uuid
  - host.name
attack:
  - T1204
  - T1059
  - T1569
data_sources:
  - Anti-virus
tags:
  - WithSecure Elements
changelog:
  - date: 07/04/2025
    level: minor
    change: Similarity strategy changed to avoid too much grouping
  - date: 18/03/2026
    level: minor
    change: Update rule type to integration
