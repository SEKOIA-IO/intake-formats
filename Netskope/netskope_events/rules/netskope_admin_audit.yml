version: 2.0
uuid: 2ccba683-f116-439e-81d5-204a7e374c7d
format_uuid: de9ca004-991e-4f5c-89c5-e075f3fb3216
rule: Netskope Admin Audit High Severity
description: >-
  Audit events detection for admin activites that differ from authentications, with high severity level according to Netskope.
sources: https://docs.sekoia.io/integration/categories/network_security/netskope_events/
effort: master
detection:
  selection:
    event.dataset: admin_audit_logs
    netskope.audit.severity_level: High
    sekoiaio.intake.dialect_uuid: "de9ca004-991e-4f5c-89c5-e075f3fb3216" # Netskope
  filter:
    event.category: authentication
  condition: selection and not filter
alert_category: intrusions
alert_type: privileged-account-compromise
alert_severity: 60
attack:
  - T1078.004
data_sources:
  - Web application firewall logs
  - Web logs
  - Web proxy
tags:
  - Netskope
similarity_strategy:
  - user.name
  - event.reason
changelog:
  - date: 29/01/2025
    level: minor
    change: Rework pattern for high severity events only and filter out authentication events.
  - date: 28/03/2024
    level: minor
    change: Rule effort was updated to master
  - date: 27/02/2026
    level: minor
    change: Update rule type to integration
