version: 2.0
uuid: 438c4d73-45fd-43e6-94c7-1f3f9e6935df
format_uuid: de9ca004-991e-4f5c-89c5-e075f3fb3216
rule: Netskope Alerts Compliance
description: >-
  Forward alerts reported by Netskope related to compliance issues.
sources: https://docs.sekoia.io/integration/categories/network_security/netskope_events/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: "de9ca004-991e-4f5c-89c5-e075f3fb3216" # Netskope
    netskope.alerts.type: "*"
  filter_fallback:
    netskope.alerts.name: "Fallback Action"
  filter_malware:
    netskope.alerts.type: "Malware"
  filter_dlp:
    event.dataset:
      - "dlp_incident"
      - "dlp_alert"
  condition: selection and not 1 of filter*
alert_category: malicious-traffic
alert_type: other
alert_severity: 20
attack:
  - T1041
data_sources:
  - Web application firewall logs
  - Web logs
  - Web proxy
similarity_strategy:
  - rule.name
tags:
  - Netskope
changelog:
  - date: 29/01/2024
    level: minor
    change: Rework detection pattern to focus on compliance issues
  - date: 28/03/2024
    level: minor
    change: Rule effort was updated to master
  - date: 27/02/2026
    level: minor
    change: Update rule type to integration
