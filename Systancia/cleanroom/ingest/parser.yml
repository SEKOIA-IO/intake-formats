name: systancia-cleanroom
pipeline:
  - name: event
    external:
      name: grok.match
      properties:
        input_field: "original.message"
        output_field: result
        pattern: "%{USER_FIRST}|%{FALLBACK}|%{RECORDING_PROGRESS}|%{IDLE_TIME}"
        custom_patterns:
          USER_FIRST: "%{EMAILADDRESS:user_email} %{DATA:event_reason}"
          BASE_INFO: '(\s*(org:%{DATA:organization_name}),?)?(\s*(user:%{DATA:user_email})( %{DATA})?,?)(\s*(ip:%{IP:source_ip})).*'
          FALLBACK: "%{DATA:event_reason}%{BASE_INFO}"
          RECORDING_PROGRESS: "%{WORD:event_action} in progress %{WORD:user_name}@%{WORD:user_domain}"
          IDLE_TIME: "%{WORD:user_name}@%{WORD:user_domain} received:%{INT:idle_time_seconds}"

  - name: event_reason
    filter: "{{event.result.get('event_reason') != None}}"
    external:
      name: grok.match
      properties:
        raise_errors: false
        input_field: "{{event.result.event_reason}}"
        output_field: result
        pattern: "%{SESSION_SUCCESS}|%{SESSION_FAILURE}|%{SESSION_FAILURE_2}|%{PROCESS}|%{NEW_PROCESS}|%{END_PROCESS}"
        custom_patterns:
          PROCESS: "%{WORD:process_event} %{DATA} application%{GREEDYDATA}"
          SESSION_FAILURE: "%{WORD:session_event} de la connexion au portail web%{GREEDYDATA}"
          SESSION_FAILURE_2: "%{DATA:session_event} du portail web%{GREEDYDATA}"

          SESSION_SUCCESS: '%{WORD:session_event} (%{DATA})?(\s*(plugin utilisateur)|\s*(portail web))%{GREEDYDATA}'

          NEW_PROCESS: 'New process: "%{DATA:process_path}"'
          END_PROCESS: 'Process end: "%{DATA:process_path}"'

  - name: set_default_fields

stages:
  set_default_fields:
    actions:
      - set:
          event.category: ["session"]
          event.type: ["info"]
          #event.outcome: "success"

      - set:
          event.reason: "{{event.result.event_reason}}"
          observer.vendor: "Systancia"
          observer.product: "Systancia Cleanroom"
          organization.name: "{{event.result.organization_name}}"
          source.ip: "{{event.result.source_ip}}"

          process.executable: "{{event_reason.result.process_path}}"

      - set:
          user.name: "{{event.result.user_email.split('@')[0]}}"
          user.domain: "{{event.result.user_email.split('@')[1]}}"
        filter: "{{event.result.user_email != None and '@' in event.result.user_email and not event.result.user_email.startswith('@')}}"

      - set:
          event.category: ["session"]
          event.type: ["end"]
          event.outcome: "success"
        filter: "{{'Echec de la connexion' in event.result.get('event_reason', '') or 'Déconnexion' in event.result.get('event_reason', '') or 'D&#233;connexion' in event.result.get('event_reason', '')}}"

      - set:
          event.category: ["process"]
          event.type: ["start"]
          event.outcome: "success"
        filter: "{{event_reason.result.get('process_event', '').lower() == 'lancement'}}"

      - set:
          event.category: ["process"]
          event.type: ["start"]
          event.outcome: "success"
        filter: "{{event.result.get('event_reason', '').startswith('New process')}}"

      - set:
          event.category: ["process"]
          event.type: ["end"]
          event.outcome: "success"
        filter: "{{event_reason.result.get('process_event', '').lower() == 'fermeture'}}"

      - set:
          event.category: ["process"]
          event.type: ["end"]
          event.outcome: "success"
        filter: "{{event.result.get('event_reason', '').startswith('Process end')}}"

      - set:
          event.category: ["session"]
          event.type: ["start"]
          event.outcome: "failure"
        filter: "{{event_reason.result.get('session_event', '').lower() == 'echec'}}"

      - set:
          event.category: ["session"]
          event.type: ["start"]
          event.outcome: "success"
        filter: "{{event_reason.result.get('session_event', '').lower() == 'connexion'}}"

      - set:
          event.category: ["session"]
          event.type: ["info"]
          event.action: "{{event.result.get('event_action', '').lower()}}"
          user.name: "{{event.result.user_name}}"
          user.domain: "{{event.result.user_domain}}"
        filter: "{{event.result.get('event_action', '') == 'Recording'}}"

      - set:
          event.category: ["session"]
          event.type: ["info"]
          event.action: "idle"
          user.name: "{{event.result.user_name}}"
        filter: "{{event.result.get('idle_time_seconds') != None}}"
