seckiot.alert.id:
  description: Unique ID of the alert
  name: seckiot.alert.id
  type: keyword

seckiot.assets.category:
  description: Category of the assets involved in the alert (IT/OT/IOT)
  name: seckiot.assets.category
  type: keyword

seckiot.assets.description:
  description: Description of the assets involved in the alert
  name: seckiot.assets.description
  type: keyword

seckiot.assets.entity:
  description: (deprecated) use `host.type` - Entity of the assets involved in the
    alert
  name: seckiot.assets.entity
  type: text

seckiot.assets.id:
  description: (deprecated) use `host.id` - Unique ID of the assets involved in the
    alert
  name: seckiot.assets.id
  type: text

seckiot.assets.localisation:
  description: (deprecated) use `host.geo.name` - Localisation of the assets involved
    in the alert
  name: seckiot.assets.localisation
  type: text

seckiot.assets.name:
  description: (deprecated) use `host.name` - Name of the assets involved in the alert
  name: seckiot.assets.name
  type: text

seckiot.assets.perdue_level:
  description: (deprecated) use `seckiot.assets.purdue_level` - Purdue level (0 to
    6) of the assets involved in the alert
  name: seckiot.assets.perdue_level
  type: text

seckiot.assets.purdue_level:
  description: Purdue level (0 to 6) of the assets involved in the alert
  name: seckiot.assets.purdue_level
  type: long

seckiot.assets.system:
  description: (deprecated) use `host.os.name` - Operating system name of the assets
    involved in the alert
  name: seckiot.assets.system
  type: text

seckiot.assets.version:
  description: (deprecated) use `host.os.version` - Operating system version of the
    assets involved in the alert
  name: seckiot.assets.version
  type: text

seckiot.capture_zone.id:
  description: Identifier (UUID) of the capture zone where the traffic was observed
  name: seckiot.capture_zone.id
  type: keyword

seckiot.catch_area.name:
  description: (deprecated) use `observer.ingress.zone` or `seckiot.capture_zone.id`
    - Name or UUID of the capture zone where the traffic was observed
  name: seckiot.catch_area.name
  type: text

seckiot.module:
  description: (deprecated) use `event.provider` - Seckiot module that raised the
    alert
  name: seckiot.module
  type: text

seckiot.sensor.name:
  description: (deprecated) use `observer.name` - Name of the sensor that captured
    the traffic
  name: seckiot.sensor.name
  type: text

seckiot.session.id:
  description: Identifier of the network session that triggered the alert
  name: seckiot.session.id
  type: keyword

seckiot.sniffer.name:
  description: (deprecated) use `observer.ingress.interface.name` or `observer.ingress.interface.id`
    - Name or UUID of the sniffer that captured the traffic
  name: seckiot.sniffer.name
  type: text
