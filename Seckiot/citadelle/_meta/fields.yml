seckiot.alert.id:
  description: Unique ID of the alert
  name: seckiot.alert.id
  type: keyword

seckiot.assets.category:
  description: Category of the assets involved in the alert (IT/OT/IOT)
  name: seckiot.assets.category
  type: keyword

seckiot.assets.description:
  description: Description of the assets involved in the alert
  name: seckiot.assets.description
  type: keyword

seckiot.assets.purdue_level:
  description: Purdue level (0 to 6) of the assets involved in the alert
  name: seckiot.assets.purdue_level
  type: long

seckiot.capture_zone.id:
  description: Identifier (UUID) of the capture zone where the traffic was observed
  name: seckiot.capture_zone.id
  type: keyword

seckiot.session.id:
  description: Identifier of the network session that triggered the alert
  name: seckiot.session.id
  type: keyword
