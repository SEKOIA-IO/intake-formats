name: citadelle
ignored_values:
  - ""
  - unknown
pipeline:
  - name: json_event
    external:
      name: json.parse-json
      properties:
        input_field: "{{original.message}}"
        output_field: message
  - name: parse_timestamp
    filter: "{{json_event.message['@timestamp'] | length > 0}}"
    external:
      name: date.parse
      properties:
        # a bare path is required: date.parse does not resolve `['@timestamp']` subscripts
        input_field: json_event.message.@timestamp
        output_field: datetime
        timezone: UTC
  - name: set_ecs_fields
  - name: set_custom_fields
    description: Seckiot fields
  - name: event
    description: event field
  - name: observer
    description: observer field
  - name: network
    description: network field
  - name: rule
    description: rule field
  - name: source
    description: source field
  - name: destination
    description: destination field
  - name: assets
    description: assets involved in the alert
  - name: vulnerability
    description: vulnerability field
stages:
  set_ecs_fields:
    actions:
      - set:
          "@timestamp": "{{parse_timestamp.datetime}}"
  set_custom_fields:
    actions:
      - set:
          seckiot.alert.id: "{{json_event.message.skt.alert_id}}"
          seckiot.session.id: "{{json_event.message.skt.session}}"
  event:
    actions:
      - set:
          event.kind: "{{json_event.message.event.kind}}"
          event.type: "{{json_event.message.event.type}}"
          event.outcome: "{{json_event.message.event.outcome}}"
          event.severity: "{{json_event.message.event.severity}}"
          event.provider: "{{json_event.message.skt.module}}"
          event.action: "{{json_event.message.rule.name}}"
      # the vendor sends `event.category: ["info"]`, which is not an ECS category
      - dictionary:
          Detection Engine: ["intrusion_detection"]
          Cartography: ["network"]
          CVE: ["vulnerability"]
        mapping:
          json_event.message.skt.module: event.category
  observer:
    actions:
      - set:
          observer.name: "{{json_event.message.observer.name or json_event.message.skt.sensor}}"
          observer.type: "{{json_event.message.observer._type}}"
          observer.vendor: "{{json_event.message.observer.vendor}}"
          observer.product: "{{json_event.message.observer.product}}"
          observer.version: "{{json_event.message.observer.version}}"
      # the sniffer and the capture zone are either a name (e.g. `br0`, `default`) or a UUID
      - set:
          observer.ingress.interface.id: "{{json_event.message.skt.sniffer}}"
        filter: "{{json_event.message.skt.sniffer | length == 36 and json_event.message.skt.sniffer.count('-') == 4}}"
      - set:
          observer.ingress.interface.name: "{{json_event.message.skt.sniffer}}"
        filter: "{{json_event.message.skt.sniffer | length > 0 and not (json_event.message.skt.sniffer | length == 36 and json_event.message.skt.sniffer.count('-') == 4)}}"
      - set:
          seckiot.capture_zone.id: "{{json_event.message.skt.capture_zone}}"
        filter: "{{json_event.message.skt.capture_zone | length == 36 and json_event.message.skt.capture_zone.count('-') == 4}}"
      - set:
          observer.ingress.zone: "{{json_event.message.skt.capture_zone}}"
        filter: "{{json_event.message.skt.capture_zone | length > 0 and not (json_event.message.skt.capture_zone | length == 36 and json_event.message.skt.capture_zone.count('-') == 4)}}"
  network:
    actions:
      - set:
          network.protocol: "{{json_event.message.network.protocol | lower}}"
          network.transport: "{{json_event.message.network.transport | lower}}"
  rule:
    actions:
      - set:
          rule.id: "{{json_event.message.rule.uuid}}"
          rule.name: "{{json_event.message.rule.name}}"
          rule.author: "{{json_event.message.rule.author}}"
          rule.version: "{{json_event.message.rule.version}}"
          rule.description: "{{json_event.message.rule.description}}"
  source:
    actions:
      - set:
          source.ip: "{{json_event.message.source.ip}}"
          source.mac: "{{json_event.message.source.mac}}"
          source.port: "{{json_event.message.source.port}}"
  destination:
    actions:
      - set:
          destination.ip: "{{json_event.message.destination.ip}}"
          destination.mac: "{{json_event.message.destination.mac}}"
          destination.port: "{{json_event.message.destination.port}}"
  assets:
    # one value per asset involved in the alert; empty attributes are skipped
    actions:
      - set:
          host.id: "{{json_event.message.skt.assets | map(attribute='id') | select | list or ''}}"
          host.name: "{{json_event.message.skt.assets | map(attribute='name') | select | list or ''}}"
          host.type: "{{json_event.message.skt.assets | map(attribute='entity') | select | list or ''}}"
          host.os.name: "{{json_event.message.skt.assets | map(attribute='system') | select | list or ''}}"
          host.os.version: "{{json_event.message.skt.assets | map(attribute='version') | select | list or ''}}"
          host.geo.name: "{{json_event.message.skt.assets | map(attribute='localisation') | select | list or ''}}"
          device.manufacturer: "{{json_event.message.skt.assets | map(attribute='hardware_vendor') | select | list or ''}}"
          device.model.identifier: "{{json_event.message.skt.assets | map(attribute='modele') | select | list or ''}}"
          seckiot.assets.category: "{{json_event.message.skt.assets | map(attribute='category') | select | list or ''}}"
          seckiot.assets.description: "{{json_event.message.skt.assets | map(attribute='description') | select | list or ''}}"
          seckiot.assets.purdue_level: "{{json_event.message.skt.assets | map(attribute='level', default=-1) | map('int', -1) | select('ge', 0) | list or ''}}"
  vulnerability:
    actions:
      - set:
          vulnerability.id: "{{json_event.message.vulnerability.id}}"
          vulnerability.category: "{{json_event.message.vulnerability.category}}"
          vulnerability.severity: "{{json_event.message.vulnerability.severity}}"
          vulnerability.reference: "{{json_event.message.vulnerability.reference}}"
          vulnerability.report_id: "{{json_event.message.vulnerability.report_id}}"
          vulnerability.score.base: "{{json_event.message.vulnerability.score.base}}"
          vulnerability.description: "{{json_event.message.vulnerability.description}}"
          vulnerability.enumeration: "{{json_event.message.vulnerability.enumeration}}"
          vulnerability.score.version: "{{json_event.message.vulnerability.score.version}}"
          vulnerability.classification: "{{json_event.message.vulnerability.classification}}"
          vulnerability.scanner.vendor: "{{json_event.message.vulnerability.scanner.vendor}}"
          vulnerability.score.temporal: "{{json_event.message.vulnerability.score.temporal}}"
          vulnerability.score.environmental: "{{json_event.message.vulnerability.score.environmental}}"
