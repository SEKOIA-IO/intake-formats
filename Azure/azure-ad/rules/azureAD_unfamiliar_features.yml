rule: Microsoft Entra ID (Azure AD) Unfamiliar Features
description: >-
  Detects when Microsoft Entra ID (Azure AD) identifies sign-ins with characteristics that deviate from past sign-in properties. To use this feature, you must have an Microsoft Entra ID (Azure AD) Premium P2 license (https://docs.microsoft.com/en-us/azure/active-directory/identity-protection/overview-identity-protection).
sources: https://docs.microsoft.com/en-us/graph/api/resources/riskdetection?view=graph-rest-1.0
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: '19cd2ed6-f90c-47f7-a46b-974354a107bb'
    azuread.operationName: 'User Risk Detection'
    azuread.properties.riskEventType: 'unfamiliarFeatures' 
  condition: selection
alert_category: intrusions
alert_type: application-compromise
alert_severity: 60
attack:
  - T1583
  - T1584
data_sources:
  - Azure activity logs
similarity_strategy:
  - user.email
event_fields:
  - field: client.user.full_name
    description: Related user
  - field: azuread.properties.riskEventType
    description: Risk type
tags:
  - Microsoft Entra ID / Azure AD
