version: 2.0
uuid: dfaadb61-a377-49df-a6bc-51e7b6c8bf86
format_uuid: 19cd2ed6-f90c-47f7-a46b-974354a107bb
authors: rse
rule: Microsoft Entra ID (Azure AD) Suspicious IP
description: >-
  Detects when Microsoft Entra ID (Azure AD) identifies a suspicious IP address. An IP address is considered suspicious based on high failure rates because of invalid credentials received from the IP address or other IP reputation sources. To use this feature, you must have an Microsoft Entra ID (Azure AD) Premium P2 license (https://docs.microsoft.com/en-us/azure/active-directory/identity-protection/overview-identity-protection).
sources: https://docs.microsoft.com/en-us/graph/api/resources/riskdetection?view=graph-rest-1.0
effort: intermediate
detection:
  selection:
    sekoiaio.intake.dialect_uuid: '19cd2ed6-f90c-47f7-a46b-974354a107bb'
    azuread.operationName: 'User Risk Detection'
    azuread.properties.riskEventType: 'suspiciousIPAddress' 
  condition: selection
alert_category: malicious-traffic
alert_type: blacklist
alert_severity: 50
attack:
  - T1583
  - T1584
data_sources:
  - Azure activity logs
event_fields:
  - field: client.user.full_name
    description: Related user
  - field: azuread.properties.riskEventType
    description: Risk type
tags:
  - Microsoft Entra ID / Azure AD
changelog:
  - date: 09/09/2026
    level: minor
    change: Update rule type to integration
