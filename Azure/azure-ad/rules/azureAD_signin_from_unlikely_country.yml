version: 2.0
uuid: 2c86166a-31ba-430b-8d7f-671bb9009a95
format_uuid: 19cd2ed6-f90c-47f7-a46b-974354a107bb
authors: rse
rule: Microsoft Entra ID (Azure AD) Sign-in From Unlikely Country
description: >-
  Detects when Microsoft Entra ID (Azure AD) identifies sign-ins originating from geographically distant locations, where at least one of the locations may also be atypical for the user, given past behavior. To use this feature, you must have an Microsoft Entra ID (Azure AD) Premium P2 license (https://docs.microsoft.com/en-us/azure/active-directory/identity-protection/overview-identity-protection).
sources: https://docs.microsoft.com/en-us/graph/api/resources/riskdetection?view=graph-rest-1.0
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: '19cd2ed6-f90c-47f7-a46b-974354a107bb'
    azuread.operationName: 'User Risk Detection'
  selection2:
    - azuread.properties.riskEventType: 'unlikelyTravel'
  selection3:
    - azuread.properties.riskEventType: 'newCountry'
  condition: selection and (selection2 or selection3)
alert_category: intrusions
alert_type: application-compromise
alert_severity: 40
attack:
  - T1583
  - T1584
data_sources:
  - Azure activity logs
event_fields:
  - field: client.user.full_name
    description: Related user
  - field: azuread.properties.riskEventType
    description: Risk type
tags:
  - Microsoft Entra ID / Azure AD
changelog:
  - date: 09/09/2026
    level: minor
    change: Update rule type to integration
