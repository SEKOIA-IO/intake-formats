version: 2.0
uuid: bd6d36e7-71eb-45f0-a5a7-888d882510fc
format_uuid: 19cd2ed6-f90c-47f7-a46b-974354a107bb
authors: rse
rule: Microsoft Entra ID (Azure AD) Threat Intelligence
description: >-
  Detects when Microsoft Entra ID (Azure AD) identifies a sign-in activity that is unusual for the given user or is consistent with known attack patterns based on Microsoft's internal and external threat intelligence sources. To use this feature, you must have an Microsoft Entra ID (Azure AD) Premium P2 license (https://docs.microsoft.com/en-us/azure/active-directory/identity-protection/overview-identity-protection).
sources: https://docs.microsoft.com/en-us/graph/api/resources/riskdetection?view=graph-rest-1.0
effort: intermediate
detection:
  selection:
    sekoiaio.intake.dialect_uuid: '19cd2ed6-f90c-47f7-a46b-974354a107bb'
    azuread.operationName: 'User Risk Detection'
    azuread.properties.riskEventType: 'investigationsThreatIntelligence' 
  condition: selection
alert_category: intrusions
alert_type: application-compromise
alert_severity: 60
attack:
  - T1583
  - T1584
data_sources:
  - Azure activity logs
event_fields:
  - field: client.user.full_name
    description: Related user
  - field: azuread.properties.riskEventType
    description: Risk type
tags:
  - Microsoft Entra ID / Azure AD
changelog:
  - date: 09/09/2026
    level: minor
    change: Update rule type to integration
