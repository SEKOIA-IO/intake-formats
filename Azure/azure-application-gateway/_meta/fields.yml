azure.application_gateway.details.data:
  description: The request data that matched the WAF rule, with the request location
    where it was found (for example ARGS, REQUEST_HEADERS or REQUEST_COOKIES). May
    contain fragments of user-supplied input.
  name: azure.application_gateway.details.data
  type: keyword

azure.application_gateway.details.message:
  description: The details message.
  name: azure.application_gateway.details.message
  type: keyword

azure.application_gateway.error_info:
  description: The error information.
  name: azure.application_gateway.error_info
  type: keyword

azure.application_gateway.ja4_fingerprint:
  description: The JA4 TLS client fingerprint computed by the Application Gateway
    from the client TLS handshake.
  name: azure.application_gateway.ja4_fingerprint
  type: keyword

azure.application_gateway.listener:
  description: The application gateway listener name.
  name: azure.application_gateway.listener
  type: keyword

azure.application_gateway.message:
  description: The application gateway message.
  name: azure.application_gateway.message
  type: keyword

azure.application_gateway.metric.average:
  description: The average value for the reported metric interval
  name: azure.application_gateway.metric.average
  type: float

azure.application_gateway.metric.count:
  description: The number of samples used for the reported metric
  name: azure.application_gateway.metric.count
  type: long

azure.application_gateway.metric.maximum:
  description: The maximum value for the reported metric interval
  name: azure.application_gateway.metric.maximum
  type: float

azure.application_gateway.metric.minimum:
  description: The minimum value for the reported metric interval
  name: azure.application_gateway.metric.minimum
  type: float

azure.application_gateway.metric.name:
  description: The performance metric name reported by Azure
  name: azure.application_gateway.metric.name
  type: keyword

azure.application_gateway.metric.time_grain:
  description: The aggregation interval for the metric values
  name: azure.application_gateway.metric.time_grain
  type: keyword

azure.application_gateway.metric.total:
  description: The total value for the reported metric interval
  name: azure.application_gateway.metric.total
  type: float

azure.application_gateway.paranoia_level:
  description: The OWASP CRS paranoia level (1-4) of the WAF rule that matched the
    request. Higher levels enable stricter rules with more false positives; this is
    not an event severity.
  name: azure.application_gateway.paranoia_level
  type: long

azure.application_gateway.routing_rule:
  description: The application gateway routing rule name.
  name: azure.application_gateway.routing_rule
  type: keyword

azure.application_gateway.serverStatus:
  description: The status of the server.
  name: azure.application_gateway.serverStatus
  type: keyword

azure.application_gateway.sslClientVerify:
  description: The SSL client verification status.
  name: azure.application_gateway.sslClientVerify
  type: keyword

azure.application_gateway.transactionId:
  description: The unique identifier for the transaction.
  name: azure.application_gateway.transactionId
  type: keyword

azure.application_gateway.waf_mode:
  description: The mode of the WAF policy applied to the request (Prevention blocks
    matching requests, Detection only logs them).
  name: azure.application_gateway.waf_mode
  type: keyword

azure.application_gateway.waf_policy.id:
  description: The identifier of the WAF policy evaluated for the request. Access
    logs report the Azure resource ID of the policy; firewall logs report the policy
    ID as a numeric prefix followed by the resource ID with underscores as separators.
  name: azure.application_gateway.waf_policy.id
  type: keyword

azure.application_gateway.waf_policy.scope:
  description: The scope of the WAF policy that matched the request (Global, Listener
    or Location).
  name: azure.application_gateway.waf_policy.scope
  type: keyword

azure.application_gateway.waf_policy.scope_name:
  description: The name of the scope of the WAF policy that matched the request (Global,
    or the listener or path name).
  name: azure.application_gateway.waf_policy.scope_name
  type: keyword
