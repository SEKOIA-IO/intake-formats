    sekoiaio.intake.dialect_uuid: "3c7057d3-4689-4fae-8033-6f1f887a70f2" # HarfangLab EDR
    rule.category: hlai
    harfanglab.execution|gt: 0
  condition: selection
alert_category: malicious-code
alert_type: malware
alert_severity: 80
attack:
  - T1204.002
data_sources:
  - Process monitoring
  - File monitoring
  - Windows event logs
event_fields:
  - field: rule.name
    description: EDR rule name
  - field: process.command_line
    description: Process name and parameters
  - field: process.parent.executable
    description: Process parent name
  - field: user.name
    description: Performed by
similarity_strategy:
  - sekoiaio.entity.uuid
  - host.name
  - rule.name
tags:
  - HarfangLab EDR
