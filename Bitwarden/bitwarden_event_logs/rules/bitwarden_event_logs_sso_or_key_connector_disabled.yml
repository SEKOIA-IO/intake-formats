version: 2.0
uuid: 6d605be6-0ce9-49e5-b4c8-02ba3568f3e2
format_uuid: c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8
rule: Bitwarden SSO Or Key Connector Disabled
description: >-
  Detects an organization disabling single sign-on (EventType 1605) or Key
  Connector (EventType 1607). Disabling these features changes how members
  authenticate and decrypt their vault, and may be used to bypass the identity
  provider controls (MFA, conditional access). False positives are possible
  during planned identity provider migrations.
sources: https://bitwarden.com/help/event-logs/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: 'c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8'
    event.dataset: bitwarden.event_logs
    event.code:
      - '1605'
      - '1607'
  condition: selection
alert_category: intrusions
alert_type: application-compromise
alert_severity: 70
attack:
  - T1556
data_sources:
  - Application logs
event_fields:
  - field: user.email
    description: User who changed the configuration
  - field: event.action
    description: Bitwarden event type
  - field: organization.name
    description: Organization
  - field: source.ip
    description: Source IP
similarity_strategy:
  - organization.id
tags:
  - Bitwarden Event Logs
changelog:
  - date: 29/10/2026
    level: minor
    change: Initial rule
