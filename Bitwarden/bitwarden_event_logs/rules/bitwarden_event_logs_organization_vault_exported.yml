version: 2.0
uuid: 6db2dc18-cf4f-46b6-93ec-2e6e7a9dbd30
format_uuid: c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8
rule: Bitwarden Organization Vault Exported
description: >-
  Detects an export of the organization vault (EventType 1602). An export writes
  every shared credential the user can access to a local file, which is a common
  way to steal passwords at scale before leaving the company or after an account
  takeover. False positives are possible when administrators make planned
  backups or migrations; check the user and the source IP.
sources: https://bitwarden.com/help/event-logs/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: 'c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8'
    event.dataset: bitwarden.event_logs
    event.code: '1602'
  condition: selection
alert_category: malicious-traffic
alert_type: exfiltration
alert_severity: 70
attack:
  - T1555.005
  - T1213
data_sources:
  - Application logs
event_fields:
  - field: user.email
    description: Exporting user
  - field: source.ip
    description: Source IP
  - field: organization.name
    description: Organization
  - field: bitwarden.password_manager.device.type_name
    description: Client used for the export
similarity_strategy:
  - organization.id
  - user.id
tags:
  - Bitwarden Event Logs
changelog:
  - date: 29/10/2026
    level: minor
    change: Initial rule
