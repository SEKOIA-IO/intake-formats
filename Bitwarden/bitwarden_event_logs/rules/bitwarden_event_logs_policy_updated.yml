version: 2.0
uuid: 19f0eab8-28ac-4048-b474-af83bbf6cb88
format_uuid: c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8
rule: Bitwarden Organization Policy Updated
description: >-
  Detects a change of an organization policy (EventType 1700), such as two-step
  login enforcement, master password requirements, vault export restriction or
  single organization. Weakening these policies is a way to lower the security
  of the whole organization. The event does not say which policy changed; check
  it in the Bitwarden admin console. False positives are expected during
  legitimate administration.
sources: https://bitwarden.com/help/event-logs/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: 'c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8'
    event.dataset: bitwarden.event_logs
    event.code: '1700'
  condition: selection
alert_category: intrusions
alert_type: application-compromise
alert_severity: 40
attack:
  - T1556
data_sources:
  - Application logs
event_fields:
  - field: user.email
    description: User who changed the policy
  - field: bitwarden.password_manager.policy.id
    description: Policy identifier
  - field: organization.name
    description: Organization
  - field: source.ip
    description: Source IP
similarity_strategy:
  - organization.id
  - bitwarden.password_manager.policy.id
tags:
  - Bitwarden Event Logs
changelog:
  - date: 29/10/2026
    level: minor
    change: Initial rule
