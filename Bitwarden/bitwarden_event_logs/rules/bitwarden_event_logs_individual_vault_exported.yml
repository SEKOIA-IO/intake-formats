version: 2.0
uuid: cdb287ad-81c7-46e4-ae5a-d96ad58934a5
format_uuid: c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8
rule: Bitwarden Individual Vault Exported
description: >-
  Detects a member of the organization exporting their individual vault
  (EventType 1007). The export file contains all of the user's credentials in a
  readable or password-protected form and can be used to take credentials
  outside of Bitwarden. False positives are possible when a user makes a
  personal backup or migrates to another client.
sources: https://bitwarden.com/help/event-logs/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: 'c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8'
    event.dataset: bitwarden.event_logs
    event.code: '1007'
  condition: selection
alert_category: malicious-traffic
alert_type: exfiltration
alert_severity: 50
attack:
  - T1555.005
data_sources:
  - Application logs
event_fields:
  - field: user.email
    description: Exporting user
  - field: source.ip
    description: Source IP
  - field: bitwarden.password_manager.device.type_name
    description: Client used for the export
similarity_strategy:
  - user.id
tags:
  - Bitwarden Event Logs
changelog:
  - date: 29/10/2026
    level: minor
    change: Initial rule
