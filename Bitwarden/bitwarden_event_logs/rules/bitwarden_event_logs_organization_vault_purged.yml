version: 2.0
uuid: d0805852-510a-4e2e-8a8f-04c6cf7f4c94
format_uuid: c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8
rule: Bitwarden Organization Vault Purged
description: >-
  Detects a purge of the organization vault (EventType 1601), which permanently
  deletes all items and collections owned by the organization. This is a
  destructive action that is very rarely legitimate in production and may
  indicate sabotage by a compromised or malicious owner.
sources: https://bitwarden.com/help/event-logs/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: 'c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8'
    event.dataset: bitwarden.event_logs
    event.code: '1601'
  condition: selection
alert_category: intrusions
alert_type: system-compromise
alert_severity: 85
attack:
  - T1485
data_sources:
  - Application logs
event_fields:
  - field: user.email
    description: User who purged the vault
  - field: source.ip
    description: Source IP
  - field: organization.name
    description: Organization
similarity_strategy:
  - organization.id
  - user.id
tags:
  - Bitwarden Event Logs
changelog:
  - date: 29/10/2026
    level: minor
    change: Initial rule
