rule: Bitwarden Phishing Blocker Bypassed
description: >-
  Detects a user bypassing the Bitwarden phishing blocker warning to continue to
  a site flagged as phishing (EventType 2402). The user may then enter
  credentials on a malicious site. False positives are possible when the site is
  wrongly flagged.
