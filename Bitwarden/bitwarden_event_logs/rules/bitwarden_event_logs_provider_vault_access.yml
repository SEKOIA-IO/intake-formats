version: 2.0
uuid: 7a2e3495-4178-4bad-a370-06c8973f6f3d
format_uuid: c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8
rule: Bitwarden Provider Accessed Organization Vault
description: >-
  Detects a provider (managed service provider) accessing the vault of a client
  organization (EventType 1603 or 1903). Provider access goes through a trusted
  relationship and gives access to the client's shared credentials. False
  positives are expected when the provider performs agreed support tasks.
sources: https://bitwarden.com/help/event-logs/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: 'c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8'
    event.dataset: bitwarden.event_logs
    event.code:
      - '1603'
      - '1903'
  condition: selection
alert_category: intrusions
alert_type: privileged-account-compromise
alert_severity: 50
attack:
  - T1199
data_sources:
  - Application logs
event_fields:
  - field: user.email
    description: Provider user
  - field: organization.name
    description: Organization
  - field: source.ip
    description: Source IP
similarity_strategy:
  - organization.id
  - user.id
tags:
  - Bitwarden Event Logs
changelog:
  - date: 29/10/2026
    level: minor
    change: Initial rule
