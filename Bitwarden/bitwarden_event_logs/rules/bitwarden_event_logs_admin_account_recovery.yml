version: 2.0
uuid: 7102e977-0b60-4701-8aea-b75796cac12e
format_uuid: c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8
rule: Bitwarden Admin Account Recovery Of A Member
description: >-
  Detects an administrator using account recovery on a member: master password
  reset (EventType 1508) or two-step login reset (EventType 1519). These actions
  give the administrator control over another user's vault and can be abused by
  a compromised administrator account to take over members. False positives are
  expected when the helpdesk handles a lost master password or a lost
  authenticator.
sources: https://bitwarden.com/help/event-logs/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: 'c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8'
    event.dataset: bitwarden.event_logs
    event.code:
      - '1508'
      - '1519'
  condition: selection
alert_category: intrusions
alert_type: privileged-account-compromise
alert_severity: 70
attack:
  - T1098
data_sources:
  - Application logs
event_fields:
  - field: user.email
    description: Administrator
  - field: user.target.email
    description: Recovered member
  - field: event.action
    description: Bitwarden event type
  - field: source.ip
    description: Source IP
similarity_strategy:
  - user.id
  - user.target.id
tags:
  - Bitwarden Event Logs
changelog:
  - date: 29/10/2026
    level: minor
    change: Initial rule
