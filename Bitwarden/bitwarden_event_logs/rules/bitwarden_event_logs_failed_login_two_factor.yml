version: 2.0
uuid: 99899744-4dc7-49ed-bd6c-9048b5a05607
format_uuid: c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8
rule: Bitwarden Failed Two-Step Login
description: >-
  Detects a login that failed at the two-step login step (EventType 1006). The
  master password was correct, so the password may be known by an attacker who
  is now blocked by the second factor. False positives are possible when a user
  mistypes a code or uses an expired one.
sources: https://bitwarden.com/help/event-logs/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: 'c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8'
    event.dataset: bitwarden.event_logs
    event.code: '1006'
  condition: selection
alert_category: intrusion-attempts
alert_type: brute-force
alert_severity: 40
attack:
  - T1078
  - T1110
data_sources:
  - Authentication logs
event_fields:
  - field: user.email
    description: User
  - field: source.ip
    description: Source IP
  - field: bitwarden.password_manager.device.type_name
    description: Client
similarity_strategy:
  - user.id
  - source.ip
tags:
  - Bitwarden Event Logs
changelog:
  - date: 29/10/2026
    level: minor
    change: Initial rule
