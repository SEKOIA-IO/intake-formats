version: 2.0
uuid: 1ebec573-229c-4c3e-84a6-016e907d0d1d
format_uuid: c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8
rule: Bitwarden User Two-Factor Authentication Disabled Or Recovered
description: >-
  Detects a user disabling two-step login (EventType 1003) or recovering their
  account with a two-step login recovery code (EventType 1004). Both remove the
  second factor from the account and are typical of an attacker who obtained the
  master password and wants persistent access. False positives are possible when
  a user loses their authenticator device.
sources: https://bitwarden.com/help/event-logs/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: 'c9aba2bc-245e-4c66-b3fd-9bf1546bb1e8'
    event.dataset: bitwarden.event_logs
    event.code:
      - '1003'
      - '1004'
  condition: selection
alert_category: intrusions
alert_type: privileged-account-compromise
alert_severity: 60
attack:
  - T1556.006
data_sources:
  - Authentication logs
event_fields:
  - field: user.email
    description: User
  - field: event.action
    description: Bitwarden event type
  - field: source.ip
    description: Source IP
similarity_strategy:
  - user.id
tags:
  - Bitwarden Event Logs
changelog:
  - date: 29/10/2026
    level: minor
    change: Initial rule
