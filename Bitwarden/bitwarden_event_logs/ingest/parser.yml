name: bitwarden_event_logs
pipeline:
  - name: parsed_event
    external:
      name: json.parse-json
      properties:
        input_field: "{{original.message}}"
        output_field: message

  # HEC wraps the event; public API events are also accepted at the root.
  - name: event_payload
    external:
      name: json.parse-json
      properties:
        input_field: "{{(parsed_event.message.event if parsed_event.message.event is mapping else parsed_event.message) | to_json}}"
        output_field: message

  - name: parsed_date
    filter: '{{event_payload.message.date not in [none, ""]}}'
    external:
      name: date.parse
      properties:
        input_field: "{{event_payload.message.date}}"
        output_field: timestamp

  - name: set_common_fields

  - name: set_action_from_type

  - name: set_taxonomy_and_product

  - name: set_outcome

stages:
  set_common_fields:
    actions:
      - set:
          observer.vendor: Bitwarden
          observer.product: Password Manager
          event.dataset: bitwarden.event_logs
          event.kind: event
          event.category: ["iam"]
          event.type: ["info"]

      - set:
          "@timestamp": "{{parsed_date.timestamp}}"
        filter: "{{parsed_date.timestamp != null}}"

      - set:
          event.code: "{{((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) | string}}"
        filter: >-
          {{((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | string).isdigit()}}

      - set:
          event.reason: "{{event_payload.message.message}}"
        filter: '{{event_payload.message.message not in [none, ""]}}'

      - set:
          user.id: "{{event_payload.message.actingUserId}}"
        filter: '{{event_payload.message.actingUserId not in [none, ""]}}'

      - set:
          user.name: "{{event_payload.message.actingUserName}}"
          user.full_name: "{{event_payload.message.actingUserName}}"
        filter: '{{event_payload.message.actingUserName not in [none, ""]}}'

      - set:
          user.email: "{{event_payload.message.actingUserEmail}}"
        filter: '{{event_payload.message.actingUserEmail not in [none, ""]}}'

      - set:
          bitwarden.password_manager.acting_user.type: "{{event_payload.message.actingUserType}}"
        filter: '{{event_payload.message.actingUserType not in [none, ""]}}'

      - set:
          bitwarden.password_manager.organization_user.id: "{{event_payload.message.organizationUserId}}"
        filter: '{{event_payload.message.organizationUserId not in [none, ""]}}'

      - set:
          user.target.id: "{{event_payload.message.userId}}"
        filter: '{{event_payload.message.userId not in [none, ""]}}'

      - set:
          user.target.name: "{{event_payload.message.userName}}"
        filter: '{{event_payload.message.userName not in [none, ""]}}'

      - set:
          user.target.email: "{{event_payload.message.userEmail}}"
        filter: '{{event_payload.message.userEmail not in [none, ""]}}'

      - set:
          bitwarden.password_manager.user.type: "{{event_payload.message.userType}}"
        filter: '{{event_payload.message.userType not in [none, ""]}}'

      - set:
          user.target.id: "{{event_payload.message.memberId}}"
        filter: '{{event_payload.message.memberId not in [none, ""]}}'

      - set:
          source.ip: "{{event_payload.message.ipAddress}}"
          source.address: "{{event_payload.message.ipAddress}}"
        filter: "{{event_payload.message.ipAddress | is_ipaddress}}"

      - set:
          bitwarden.password_manager.device.type_id: "{{event_payload.message.device}}"
        filter: '{{event_payload.message.device not in [none, ""]}}'

      - set:
          bitwarden.password_manager.device.type_id: "{{event_payload.message.deviceTypeId}}"
        filter: '{{event_payload.message.deviceTypeId not in [none, ""]}}'

      - set:
          bitwarden.password_manager.device.type_name: "{{event_payload.message.deviceType}}"
        filter: '{{event_payload.message.deviceType not in [none, ""]}}'

      - set:
          bitwarden.password_manager.item.id: "{{event_payload.message.itemId}}"
        filter: '{{event_payload.message.itemId not in [none, ""]}}'

      - set:
          bitwarden.password_manager.collection.id: "{{event_payload.message.collectionId}}"
        filter: '{{event_payload.message.collectionId not in [none, ""]}}'

      - set:
          group.id: "{{event_payload.message.groupId}}"
        filter: '{{event_payload.message.groupId not in [none, ""]}}'

      - set:
          group.name: "{{event_payload.message.groupName}}"
        filter: '{{event_payload.message.groupName not in [none, ""]}}'

      - set:
          bitwarden.password_manager.policy.id: "{{event_payload.message.policyId}}"
        filter: '{{event_payload.message.policyId not in [none, ""]}}'

      - set:
          organization.id: "{{event_payload.message.organizationId}}"
        filter: '{{event_payload.message.organizationId not in [none, ""]}}'

      - set:
          organization.name: "{{event_payload.message.organizationName}}"
        filter: '{{event_payload.message.organizationName not in [none, ""]}}'

      - set:
          bitwarden.password_manager.domain.name: "{{event_payload.message.domainName}}"
        filter: '{{event_payload.message.domainName not in [none, ""]}}'

      - set:
          bitwarden.password_manager.secret.id: "{{event_payload.message.secretId}}"
        filter: '{{event_payload.message.secretId not in [none, ""]}}'

      - set:
          bitwarden.password_manager.project.id: "{{event_payload.message.projectId}}"
        filter: '{{event_payload.message.projectId not in [none, ""]}}'

      - set:
          bitwarden.password_manager.service_account.id: "{{event_payload.message.serviceAccountId}}"
        filter: '{{event_payload.message.serviceAccountId not in [none, ""]}}'

      - set:
          user.name: "{{((event_payload.message.get('enrichment_details') or {}).get('actingUser') or {}).get('name')}}"
        filter: '{{((event_payload.message.get(''enrichment_details'') or {}).get(''actingUser'') or {}).get(''name'') not in [none, ""]}}'

      - set:
          user.full_name: "{{((event_payload.message.get('enrichment_details') or {}).get('actingUser') or {}).get('name')}}"
        filter: '{{((event_payload.message.get(''enrichment_details'') or {}).get(''actingUser'') or {}).get(''name'') not in [none, ""]}}'

      - set:
          user.email: "{{((event_payload.message.get('enrichment_details') or {}).get('actingUser') or {}).get('email')}}"
        filter: '{{((event_payload.message.get(''enrichment_details'') or {}).get(''actingUser'') or {}).get(''email'') not in [none, ""]}}'

      - set:
          bitwarden.password_manager.acting_user.type: "{{((event_payload.message.get('enrichment_details') or {}).get('actingUser') or {}).get('type')}}"
        filter: '{{((event_payload.message.get(''enrichment_details'') or {}).get(''actingUser'') or {}).get(''type'') not in [none, ""]}}'

      - set:
          user.target.name: "{{((event_payload.message.get('enrichment_details') or {}).get('member') or {}).get('name')}}"
        filter: '{{((event_payload.message.get(''enrichment_details'') or {}).get(''member'') or {}).get(''name'') not in [none, ""]}}'

      - set:
          user.target.email: "{{((event_payload.message.get('enrichment_details') or {}).get('member') or {}).get('email')}}"
        filter: '{{((event_payload.message.get(''enrichment_details'') or {}).get(''member'') or {}).get(''email'') not in [none, ""]}}'

      - set:
          bitwarden.password_manager.user.type: "{{((event_payload.message.get('enrichment_details') or {}).get('member') or {}).get('type')}}"
        filter: '{{((event_payload.message.get(''enrichment_details'') or {}).get(''member'') or {}).get(''type'') not in [none, ""]}}'

      - set:
          group.name: "{{((event_payload.message.get('enrichment_details') or {}).get('group') or {}).get('name')}}"
        filter: '{{((event_payload.message.get(''enrichment_details'') or {}).get(''group'') or {}).get(''name'') not in [none, ""]}}'

      - set:
          organization.name: "{{((event_payload.message.get('enrichment_details') or {}).get('organization') or {}).get('name')}}"
        filter: '{{((event_payload.message.get(''enrichment_details'') or {}).get(''organization'') or {}).get(''name'') not in [none, ""]}}'

      - set:
          bitwarden.password_manager.device.type_name: "{{event_payload.message.deviceName}}"
        filter: '{{event_payload.message.deviceName not in [none, ""]}}'

  set_action_from_type:
    actions:
      - set:
          event.action: >-
            {%- set action_map = {
              1000: 'user_logged_in',
              1001: 'user_changed_account_password',
              1002: 'user_saved_two_step_login',
              1003: 'user_disabled_two_step_login',
              1004: 'user_recovered_account_from_two_step_login',
              1005: 'user_login_failed_password',
              1006: 'user_login_failed_two_step_login',
              1007: 'user_exported_individual_vault',
              1008: 'user_reset_master_password_recovery',
              1009: 'user_migrated_key_connector_key',
              1010: 'user_requested_device_approval',
              1011: 'user_set_master_password_tde_offboarding',
              1100: 'cipher_created',
              1101: 'cipher_edited',
              1102: 'cipher_deleted_permanently',
              1103: 'cipher_attachment_created',
              1104: 'cipher_attachment_deleted',
              1105: 'cipher_moved_to_organization',
              1106: 'cipher_collections_edited',
              1107: 'cipher_viewed',
              1108: 'cipher_viewed_password',
              1109: 'cipher_viewed_hidden_field',
              1110: 'cipher_viewed_card_code',
              1111: 'cipher_copied_password',
              1112: 'cipher_copied_hidden_field',
              1113: 'cipher_copied_card_code',
              1114: 'cipher_autofilled',
              1115: 'cipher_sent_to_trash',
              1116: 'cipher_restored',
              1117: 'cipher_viewed_card_number',
              1118: 'cipher_viewed_totp_seed',
              1300: 'collection_created',
              1301: 'collection_edited',
              1302: 'collection_deleted',
              1400: 'group_created',
              1401: 'group_edited',
              1402: 'group_deleted',
              1500: 'organization_user_invited',
              1501: 'organization_user_confirmed',
              1502: 'organization_user_edited',
              1503: 'organization_user_removed',
              1504: 'organization_user_groups_edited',
              1505: 'organization_user_sso_unlinked',
              1506: 'organization_user_account_recovery_enrolled',
              1507: 'organization_user_account_recovery_withdrew',
              1508: 'organization_user_account_recovery_master_password_initiated',
              1509: 'organization_user_sso_link_reset',
              1510: 'organization_user_logged_in_sso_first_time',
              1511: 'organization_user_access_revoked',
              1512: 'organization_user_access_restored',
              1513: 'organization_user_device_approved',
              1514: 'organization_user_device_denied',
              1515: 'organization_user_deleted',
              1516: 'organization_user_left',
              1517: 'organization_user_automatically_confirmed',
              1518: 'organization_user_self_revoked',
              1519: 'organization_user_two_step_reset_by_admin',
              1520: 'organization_user_revoked_two_step_non_compliance',
              1521: 'organization_user_revoked_single_org_non_compliance',
              1522: 'organization_vault_banner_clicked',
              1523: 'organization_staged_user_added',
              1524: 'organization_member_accepted_invite_link',
              1525: 'organization_user_email_updated',
              1600: 'organization_settings_edited',
              1601: 'organization_vault_purged',
              1602: 'organization_vault_exported',
              1603: 'organization_vault_accessed_by_provider',
              1604: 'organization_enabled_sso',
              1605: 'organization_disabled_sso',
              1606: 'organization_enabled_key_connector',
              1607: 'organization_disabled_key_connector',
              1608: 'organization_families_sponsorships_synced',
              1609: 'organization_collection_management_setting_modified',
              1610: 'Organization_CollectionManagement_LimitCollectionCreationEnabled',
              1611: 'Organization_CollectionManagement_LimitCollectionCreationDisabled',
              1612: 'Organization_CollectionManagement_LimitCollectionDeletionEnabled',
              1613: 'Organization_CollectionManagement_LimitCollectionDeletionDisabled',
              1614: 'Organization_CollectionManagement_LimitItemDeletionEnabled',
              1615: 'Organization_CollectionManagement_LimitItemDeletionDisabled',
              1616: 'Organization_CollectionManagement_AllowAdminAccessToAllCollectionItemsEnabled',
              1617: 'Organization_CollectionManagement_AllowAdminAccessToAllCollectionItemsDisabled',
              1618: 'Organization_ItemOrganization_Accepted',
              1619: 'Organization_ItemOrganization_Declined',
              1620: 'Organization_AutoConfirmEnabled_Admin',
              1621: 'Organization_AutoConfirmDisabled_Admin',
              1622: 'Organization_AutoConfirmEnabled_Portal',
              1623: 'Organization_AutoConfirmDisabled_Portal',
              1624: 'Organization_InviteLinkCreated',
              1625: 'Organization_InviteLinkDomainsEdited',
              1626: 'Organization_InviteLinkDeleted',
              1627: 'Organization_InviteLinkClientCopied',
              1628: 'Organization_InviteLinkRefreshed',
              1700: 'policy_modified',
              2000: 'domain_added',
              2001: 'domain_removed',
              2002: 'domain_verified',
              2003: 'domain_not_verified',
              2100: 'secret_accessed',
              2101: 'secret_created',
              2102: 'secret_edited',
              2103: 'secret_deleted',
              2104: 'secret_permanently_deleted',
              2200: 'project_accessed',
              2201: 'project_created',
              2202: 'project_edited',
              2203: 'project_deleted',
              2300: 'service_account_user_added',
              2301: 'service_account_user_removed',
              2302: 'service_account_group_added',
              2303: 'service_account_group_removed',
              2304: 'service_account_created',
              2305: 'service_account_deleted',
              2500: 'send_text_created',
              2501: 'send_text_created_with_email_verification',
              2502: 'send_text_created_with_password',
              2503: 'send_file_created',
              2504: 'send_file_created_with_email_verification',
              2505: 'send_file_created_with_password',
              2506: 'send_text_edited',
              2507: 'send_file_edited',
              2508: 'send_text_deleted',
              2509: 'send_file_deleted',
              2510: 'send_text_accessed',
              2511: 'send_file_accessed'
            } -%}
            {%- set raw_type = event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId') -%}
            {%- if not (raw_type | string).isdigit() -%}
            bitwarden_event_unknown
            {%- else -%}
            {%- set event_type = raw_type | int -%}
            {{ action_map.get(event_type, 'bitwarden_event_' ~ (event_type | string)) }}
            {%- endif -%}

      - set:
          event.action: "{{event_payload.message.typeName}}"
        filter: '{{event_payload.message.typeName not in [none, ""]}}'

  set_taxonomy_and_product:
    actions:
      - set:
          event.category: ["file"]
          event.type: ["info"]
        filter: >-
          {{1100 <= ((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) < 1200 or 2500 <= ((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) <= 2511}}

      - set:
          event.type: ["change"]
        filter: >-
          {{((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) in [1101, 1105, 1106, 1116, 2506, 2507]}}

      - set:
          event.category: ["authentication"]
          event.type: ["start"]
        filter: >-
          {{((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) in [1000, 1004, 1005, 1006, 1010]}}

      - set:
          event.category: ["iam"]
          event.type: ["change"]
        filter: >-
          {{((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) in [1001, 1002, 1003, 1008, 1009, 1011]}}

      - set:
          event.category: ["file"]
          event.type: ["info"]
        filter: >-
          {{((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) in [1007, 1602, 1603]}}

      - set:
          event.type: ["deletion"]
        filter: >-
          {{((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) in [1102, 1104, 1115, 1302, 1402, 1503, 1515, 1516, 1601, 2103, 2104, 2203, 2305, 2508, 2509]}}

      - set:
          event.type: ["creation"]
        filter: >-
          {{((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) in [1100, 1103, 1300, 1400, 1500, 1523, 2101, 2201, 2304, 2500, 2501, 2502, 2503, 2504, 2505]}}

      - set:
          event.category: ["iam"]
          event.type: ["group", "creation"]
        filter: "{{((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) == 1400}}"

      - set:
          event.category: ["iam"]
          event.type: ["group", "change"]
        filter: "{{((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) == 1401}}"

      - set:
          event.category: ["iam"]
          event.type: ["group", "deletion"]
        filter: "{{((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) == 1402}}"

      - set:
          event.category: ["iam"]
          event.type: ["user", "creation"]
        filter: >-
          {{((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) in [1500, 1523, 1524]}}

      - set:
          event.category: ["iam"]
          event.type: ["user", "change"]
        filter: >-
          {{((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) in [1501, 1502, 1504, 1505, 1506, 1507, 1508, 1509, 1510, 1511, 1512, 1513, 1514, 1517, 1518, 1519, 1520, 1521, 1525]}}

      - set:
          event.category: ["iam"]
          event.type: ["user", "deletion"]
        filter: >-
          {{((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) in [1503, 1515, 1516]}}

      - set:
          event.category: ["configuration"]
          event.type: ["change"]
        filter: >-
          {{((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) in [1600, 1604, 1605, 1606, 1607, 1608, 1609, 1610, 1611, 1612, 1613, 1614, 1615, 1616, 1617, 1618, 1619, 1620, 1621, 1622, 1623, 1624, 1625, 1626, 1627, 1628, 1700, 2000, 2001, 2002, 2003]}}

  set_outcome:
    actions:
      - set:
          event.outcome: success

      - set:
          event.outcome: failure
        filter: "{{((event_payload.message.get('type') if event_payload.message.get('type') not in [none, ''] else event_payload.message.get('typeId')) | int) in [1005, 1006, 2003]}}"
