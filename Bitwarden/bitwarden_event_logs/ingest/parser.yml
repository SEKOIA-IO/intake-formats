name: bitwarden_event_logs
pipeline:
  - name: parsed_event
    external:
      name: json.parse-json
      properties:
        input_field: "{{original.message}}"
        output_field: message

  - name: parsed_date
    filter: "{{parsed_event.message.date != null}}"
    external:
      name: date.parse
      properties:
        input_field: "{{parsed_event.message.date}}"
        output_field: timestamp

  - name: set_common_fields

  - name: set_action_from_type

  - name: set_taxonomy_and_product

  - name: set_outcome

stages:
  set_common_fields:
    actions:
      - set:
          observer.vendor: Bitwarden
          observer.product: Password Manager
          event.dataset: bitwarden.event_logs
          event.kind: event
          event.category: ["iam"]
          event.type: ["info"]

      - set:
          "@timestamp": "{{parsed_date.timestamp}}"
        filter: "{{parsed_date.timestamp != null}}"

      - set:
          event.code: "{{(parsed_event.message.type | default(parsed_event.message.typeId)) | string}}"

      - set:
          event.reason: "{{parsed_event.message.message}}"
          bitwarden.password_manager.title: "{{parsed_event.message.message}}"
        filter: "{{parsed_event.message.message != null}}"

      - set:
          user.id: "{{parsed_event.message.actingUserId}}"
          user.name: "{{parsed_event.message.actingUserName}}"
          user.full_name: "{{parsed_event.message.actingUserName}}"
          user.email: "{{parsed_event.message.actingUserEmail}}"
          bitwarden.password_manager.acting_user.type: "{{parsed_event.message.actingUserType}}"

      - set:
          user.target.id: "{{parsed_event.message.memberId}}"
        filter: "{{parsed_event.message.memberId != null}}"

      - set:
          user.target.id: "{{parsed_event.message.organizationUserId}}"
        filter: "{{parsed_event.message.organizationUserId != null}}"

      - set:
          user.target.id: "{{parsed_event.message.userId}}"
          user.target.name: "{{parsed_event.message.userName}}"
          user.target.email: "{{parsed_event.message.userEmail}}"
          bitwarden.password_manager.user.type: "{{parsed_event.message.userType}}"
        filter: "{{parsed_event.message.userId != null or parsed_event.message.userName != null or parsed_event.message.userEmail != null or parsed_event.message.userType != null}}"

      - set:
          source.ip: "{{parsed_event.message.ipAddress}}"
          source.address: "{{parsed_event.message.ipAddress}}"
          client.ip: "{{parsed_event.message.ipAddress}}"
          client.address: "{{parsed_event.message.ipAddress}}"
        filter: "{{parsed_event.message.ipAddress | is_ipaddress}}"

      - set:
          bitwarden.password_manager.device.type_id: "{{parsed_event.message.device}}"
        filter: "{{parsed_event.message.device != null}}"

      - set:
          bitwarden.password_manager.device.type_id: "{{parsed_event.message.deviceTypeId}}"
        filter: "{{parsed_event.message.deviceTypeId != null}}"

      - set:
          bitwarden.password_manager.device.type_name: "{{parsed_event.message.deviceType}}"
        filter: "{{parsed_event.message.deviceType != null}}"

      - set:
          bitwarden.password_manager.item.id: "{{parsed_event.message.itemId}}"
        filter: "{{parsed_event.message.itemId != null}}"

      - set:
          bitwarden.password_manager.item.id: "{{parsed_event.message.cipherId}}"
        filter: "{{parsed_event.message.cipherId != null}}"

      - set:
          bitwarden.password_manager.collection.id: "{{parsed_event.message.collectionId}}"
          group.id: "{{parsed_event.message.groupId}}"
          group.name: "{{parsed_event.message.groupName}}"
          bitwarden.password_manager.policy.id: "{{parsed_event.message.policyId}}"
          cloud.account.id: "{{parsed_event.message.organizationId}}"
          cloud.account.name: "{{parsed_event.message.organizationName}}"
          bitwarden.password_manager.organization.id: "{{parsed_event.message.organizationId}}"
          destination.domain: "{{parsed_event.message.domainName}}"
          bitwarden.password_manager.secret.id: "{{parsed_event.message.secretId}}"
          bitwarden.password_manager.project.id: "{{parsed_event.message.projectId}}"
          bitwarden.password_manager.service_account.id: "{{parsed_event.message.serviceAccountId}}"

  set_action_from_type:
    actions:
      - set:
          event.action: >-
            {%- set action_map = {
              1000: 'user_logged_in',
              1001: 'user_changed_account_password',
              1002: 'user_saved_two_step_login',
              1003: 'user_disabled_two_step_login',
              1004: 'user_recovered_account_from_two_step_login',
              1005: 'user_login_failed_password',
              1006: 'user_login_failed_two_step_login',
              1007: 'user_exported_individual_vault',
              1008: 'user_reset_master_password_recovery',
              1009: 'user_migrated_key_connector_key',
              1010: 'user_requested_device_approval',
              1011: 'user_set_master_password_tde_offboarding',
              1100: 'cipher_created',
              1101: 'cipher_edited',
              1102: 'cipher_deleted_permanently',
              1103: 'cipher_attachment_created',
              1104: 'cipher_attachment_deleted',
              1105: 'cipher_moved_to_organization',
              1106: 'cipher_collections_edited',
              1107: 'cipher_viewed',
              1108: 'cipher_viewed_password',
              1109: 'cipher_viewed_hidden_field',
              1110: 'cipher_viewed_totp',
              1111: 'cipher_copied_password',
              1112: 'cipher_copied_hidden_field',
              1113: 'cipher_copied_totp',
              1114: 'cipher_autofilled',
              1115: 'cipher_sent_to_trash',
              1116: 'cipher_restored',
              1117: 'cipher_viewed_card_number',
              1118: 'cipher_viewed_card_security_code',
              1300: 'collection_created',
              1301: 'collection_edited',
              1302: 'collection_deleted',
              1400: 'group_created',
              1401: 'group_edited',
              1402: 'group_deleted',
              1500: 'organization_user_invited',
              1501: 'organization_user_confirmed',
              1502: 'organization_user_edited',
              1503: 'organization_user_removed',
              1504: 'organization_user_groups_edited',
              1505: 'organization_user_sso_unlinked',
              1506: 'organization_user_account_recovery_enrolled',
              1507: 'organization_user_account_recovery_withdrew',
              1508: 'organization_user_account_recovery_master_password_initiated',
              1509: 'organization_user_sso_link_reset',
              1510: 'organization_user_logged_in_sso_first_time',
              1511: 'organization_user_access_revoked',
              1512: 'organization_user_access_restored',
              1513: 'organization_user_device_approved',
              1514: 'organization_user_device_denied',
              1515: 'organization_user_deleted',
              1516: 'organization_user_left',
              1517: 'organization_user_automatically_confirmed',
              1518: 'organization_user_self_revoked',
              1519: 'organization_user_account_recovery_two_step_initiated',
              1522: 'organization_vault_banner_clicked',
              1523: 'organization_staged_user_added',
              1524: 'organization_member_accepted_invite_link',
              1525: 'organization_user_email_updated',
              1600: 'organization_settings_edited',
              1601: 'organization_vault_purged',
              1602: 'organization_vault_exported',
              1603: 'organization_vault_accessed_by_provider',
              1604: 'organization_enabled_sso',
              1605: 'organization_disabled_sso',
              1606: 'organization_enabled_key_connector',
              1607: 'organization_disabled_key_connector',
              1608: 'organization_families_sponsorships_synced',
              1609: 'organization_collection_management_setting_modified',
              1700: 'policy_modified',
              2000: 'domain_added',
              2001: 'domain_removed',
              2002: 'domain_verified',
              2003: 'domain_not_verified',
              2100: 'secret_accessed',
              2101: 'secret_created',
              2102: 'secret_edited',
              2103: 'secret_deleted',
              2104: 'secret_permanently_deleted',
              2200: 'project_accessed',
              2201: 'project_created',
              2202: 'project_edited',
              2203: 'project_deleted',
              2300: 'service_account_user_added',
              2301: 'service_account_user_removed',
              2302: 'service_account_group_added',
              2303: 'service_account_group_removed',
              2304: 'service_account_created',
              2305: 'service_account_deleted',
              2500: 'send_text_created',
              2501: 'send_text_created_with_email_verification',
              2502: 'send_text_created_with_password',
              2503: 'send_file_created',
              2504: 'send_file_created_with_email_verification',
              2505: 'send_file_created_with_password',
              2506: 'send_text_edited',
              2507: 'send_file_edited',
              2508: 'send_text_deleted',
              2509: 'send_file_deleted',
              2510: 'send_text_accessed',
              2511: 'send_file_accessed'
            } -%}
            {%- set event_type = parsed_event.message.type | default(parsed_event.message.typeId) -%}
            {{ action_map.get(event_type, 'bitwarden_event_' ~ (event_type | string)) }}

  set_taxonomy_and_product:
    actions:
      - set:
          event.category: ["authentication"]
          event.type: ["info"]
        filter: >-
          {{(parsed_event.message.type | default(parsed_event.message.typeId)) in [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011]}}

      - set:
          event.category: ["configuration"]
          event.type: ["change"]
        filter: >-
          {{(parsed_event.message.type | default(parsed_event.message.typeId)) in [1600, 1601, 1602, 1603, 1604, 1605, 1606, 1607, 1608, 1609, 1610, 1611, 1612, 1613, 1614, 1615, 1616, 1617, 1618, 1619, 1620, 1621, 1622, 1623, 1624, 1625, 1626, 1627, 1628, 1700, 2000, 2001, 2002, 2003]}}

      - set:
          observer.product: Secrets Manager
        filter: >-
          {{(parsed_event.message.type | default(parsed_event.message.typeId)) >= 2100 and (parsed_event.message.type | default(parsed_event.message.typeId)) <= 2305}}

  set_outcome:
    actions:
      - set:
          event.outcome: success

      - set:
          event.outcome: failure
        filter: "{{(parsed_event.message.type | default(parsed_event.message.typeId)) in [1005, 1006, 2003]}}"
