bitwarden.password_manager.collection.id:
  description: Unique identifier of the organization collection.
  name: bitwarden.password_manager.collection.id
  type: keyword

bitwarden.password_manager.device.type_id:
  description: Numeric identifier of the client device type (Bitwarden DeviceType
    enum).
  name: bitwarden.password_manager.device.type_id
  type: long

bitwarden.password_manager.device.type_name:
  description: Display name of the client device type (e.g. Chrome Extension, iOS,
    Windows CLI).
  name: bitwarden.password_manager.device.type_name
  type: keyword

bitwarden.password_manager.domain.name:
  description: Claimed or verified domain name associated with the organization.
  name: bitwarden.password_manager.domain.name
  type: keyword

bitwarden.password_manager.installation.id:
  description: Unique identifier of the self-hosted Bitwarden installation.
  name: bitwarden.password_manager.installation.id
  type: keyword

bitwarden.password_manager.item.id:
  description: Unique identifier of the Bitwarden vault item (cipher).
  name: bitwarden.password_manager.item.id
  type: keyword

bitwarden.password_manager.organization_user.id:
  description: Unique identifier of the organization membership (OrganizationUser)
    concerned by the event.
  name: bitwarden.password_manager.organization_user.id
  type: keyword

bitwarden.password_manager.policy.id:
  description: Unique identifier of the Bitwarden enterprise policy.
  name: bitwarden.password_manager.policy.id
  type: keyword

bitwarden.password_manager.project.id:
  description: Unique identifier of the Bitwarden Secrets Manager project.
  name: bitwarden.password_manager.project.id
  type: keyword

bitwarden.password_manager.provider.id:
  description: Unique identifier of the Bitwarden provider (MSP).
  name: bitwarden.password_manager.provider.id
  type: keyword

bitwarden.password_manager.secret.id:
  description: Unique identifier of the Bitwarden Secrets Manager secret.
  name: bitwarden.password_manager.secret.id
  type: keyword

bitwarden.password_manager.service_account.id:
  description: Unique identifier of the Bitwarden Secrets Manager service account
    (machine account).
  name: bitwarden.password_manager.service_account.id
  type: keyword

bitwarden.password_manager.system_user.id:
  description: 'Numeric identifier of the system actor (EventSystemUser enum: 0 Unknown,
    1 SCIM, 2 DomainVerification, 3 PublicApi, 4 TwoFactorDisabled, 5 BitwardenPortal,
    6 Pam).'
  name: bitwarden.password_manager.system_user.id
  type: long

bitwarden.password_manager.system_user.name:
  description: Name of the system actor that performed the event (EventSystemUser
    enum).
  name: bitwarden.password_manager.system_user.name
  type: keyword
