name: Bitwarden Event Logs
slug: bitwarden_event_logs
description: >-
  Bitwarden Event Logs provide an audit trail of authentication, vault usage, organization administration, policy changes, and secrets management activity.

data_sources:
  Authentication logs: User sign-in attempts, password changes, and two-factor authentication events.
  Identity and access management: Organization member lifecycle and access control changes.
  Application logs: Vault item and Bitwarden Send interactions.
  Asset management: Secrets Manager project and machine account management events.