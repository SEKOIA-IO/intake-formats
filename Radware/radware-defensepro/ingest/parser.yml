name: radware-defensepro
pipeline:
  - name: grok_event_parser
    external:
      name: grok.match
      properties:
        input_field: "{{original.message}}"
        output_field: message
        pattern: "%{RADWARE_ATTACK}|%{RADWARE_LOGIN}|%{RADWARE_BDOS}"
        custom_patterns:
          RADWARE_DATE: "%{MONTHDAY}-%{MONTHNUM}-%{YEAR} %{TIME}"
          RADWARE_ATTACK: >-
            %{RADWARE_DATE:date}
            %{WORD:DefensePro_severity} %{INT:Radware_id}
            %{DATA:DefensePro_category} "%{DATA:Radware_attack_name}"
            %{DATA:Radware_protocol} %{IP:source_ip} %{INT:source_port}
            %{IP:destination_ip} %{INT:destination_port}
            %{INT:DefensePro_physical_port} %{DATA:Radware_context}
            "%{DATA:DefensePro_policy_name}" %{DATA:DefensePro_attack_status}
            %{INT:DefensePro_packet_count} %{INT:DefensePro_volume}
            %{DATA:DefensePro_VLAN_tag} %{DATA:DefensePro_MPLS_RD}
            %{DATA:DefensePro_MPLS_tag} %{WORD:DefensePro_risk}
            %{DATA:DefensePro_action_name} %{DATA:DefensePro_UniqueID}
          RADWARE_LOGIN: >-
            %{RADWARE_DATE:date} %{WORD:DefensePro_severity} User radware (logged in|successfully authenticated) via (%{DATA:Radware_protocol} %{IP:source_ip}|%{DATA:login_type} \(IP:%{IP:source_ip}\))
          RADWARE_BDOS: >-
            %{RADWARE_DATE:date}
            %{WORD:DefensePro_severity} %{GREEDYDATA:event_reason}

  - name: bdos_parser
    external:
      name: grok.match
      properties:
        input_field: "{{grok_event_parser.message.event_reason}}"
        output_field: bdos
        pattern: "%{RADWARE_BDOS_DETAIL}"
        custom_patterns:
          RADWARE_BDOS_DETAIL: >-
            BDoS baseline learning is being %{WORD:DefensePro_baseline_status} now on inbound IPv4 traffic for policy "%{DATA:DefensePro_policy_name}".
    filter: "{{grok_event_parser.message.get('event_reason') != None}}"

  - name: date_parser
    external:
      name: date.parse
      properties:
        input_field: "{{grok_event_parser.message.date}}"
        output_field: datetime
        format: "%d-%m-%Y %H:%M:%S"

  - name: set_radware_fields

stages:
  set_radware_fields:
    actions:
      - set:
          "@timestamp": "{{date_parser.datetime}}"
          observer.vendor: "Radware"
          observer.product: "DefensePro"
          event.code: "{{grok_event_parser.message.Radware_id}}"
          event.action: "{{grok_event_parser.message.DefensePro_action_name}}"

          source.port: "{{grok_event_parser.message.source_port}}"
          source.ip: "{{grok_event_parser.message.source_ip}}"
          destination.ip: "{{grok_event_parser.message.destination_ip}}"
          destination.port: "{{grok_event_parser.message.destination_port}}"

          network.packets: "{{grok_event_parser.message.DefensePro_packet_count}}"

          threat.feed.name: "{{grok_event_parser.message.DefensePro_category}}"
          threat.technique.name: "{{grok_event_parser.message.Radware_attack_name}}"

          log.level: "{{grok_event_parser.message.DefensePro_severity}}"

          radware.defensepro.risk: "{{grok_event_parser.message.DefensePro_risk}}"
          radware.defensepro.context: "{{grok_event_parser.message.Radware_context}}"
          radware.defensepro.volume: "{{grok_event_parser.message.DefensePro_volume}}"
          radware.defensepro.mpls.rd: "{{grok_event_parser.message.DefensePro_MPLS_RD}}"
          radware.defensepro.mpls.tag: "{{grok_event_parser.message.DefensePro_MPLS_tag}}"
          radware.defensepro.vlan.tag: "{{grok_event_parser.message.DefensePro_VLAN_tag}}"
          radware.defensepro.unique_id: "{{grok_event_parser.message.DefensePro_UniqueID}}"
          radware.defensepro.policy.name: "{{grok_event_parser.message.DefensePro_policy_name}}"
          radware.defensepro.attack.status: "{{grok_event_parser.message.DefensePro_attack_status}}"
          radware.defensepro.physical.port: "{{grok_event_parser.message.DefensePro_physical_port}}"
          radware.defensepro.baseline.status: "{{grok_event_parser.message.DefensePro_baseline_status}}"

      - set:
          network.protocol: "{{grok_event_parser.message.Radware_protocol | lower}}"
        filter: "{{grok_event_parser.message.get('Radware_protocol') != None}}"

      - set:
          event.kind: "alert"
          event.category: ["network", "intrusion_detection"]
          event.type: "denied"
        filter: "{{grok_event_parser.message.get('Radware_attack_name') != None}}"

      - set:
          event.kind: "event"
          event.category: ["network"]
          event.type: "start"
          event.reason: "{{grok_event_parser.message.event_reason}}"
          radware.defensepro.baseline.status: "{{bdos_parser.bdos.DefensePro_baseline_status}}"
        filter: "{{grok_event_parser.message.get('event_reason') != None }}"

      - set:
          radware.defensepro.baseline.status: "{{bdos_parser.bdos.DefensePro_baseline_status}}"
        filter: "{{bdos_parser.bdos.get('DefensePro_baseline_status') != None}}"

      - set:
          radware.defensepro.policy.name: "{{bdos_parser.bdos.DefensePro_policy_name}}"
        filter: "{{bdos_parser.bdos.get('DefensePro_policy_name') != None}}"

      - set:
          event.kind: "event"
          event.category: ["authentication"]
          event.type: "info"
        filter: "{{grok_event_parser.message.get('login_type') != None or ( grok_event_parser.message.get('Radware_attack_name') == None and grok_event_parser.message.get('event_reason') == None )}}"
