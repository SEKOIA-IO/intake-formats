radware.defensepro.mpls.rd:
  description: MPLS Route Distinguisher value associated with the reported event
  name: radware.defensepro.mpls.rd
  type: keyword

radware.defensepro.mpls.tag:
  description: MPLS label/tag associated with the reported event
  name: radware.defensepro.mpls.tag
  type: keyword

radware.defensepro.uniqueid:
  description: Unique ID, identifying the specific security event, and added to all
    messages that relate to it. The unique ID is presented in GUID format
  name: radware.defensepro.uniqueid
  type: keyword

radware.defensepro.vlan.tag:
  description: VLAN tag associated with the reported event
  name: radware.defensepro.vlan.tag
  type: keyword

radware.defensepro.attack.status:
  description: Attack status values indicate whether an event is per packet (occur),
    marks the start or end of a continuous event (start/term), is an ongoing report
    for continuous events (ongoing), or is a sampled report for continuous events
    (sampled).
  name: radware.defensepro.attack.status
  type: keyword

radware.defensepro.baseline.status:
  description: Baseline status (e.g., active, suppressed)
  name: radware.defensepro.baseline.status
  type: keyword

radware.defensepro.context:
  description: 'Context, relevant only when SSL/TLS is used. Values: Reassembly, Regular,
    Decrypted HTTPS and Regular-and-Decrypted-HTTPS'
  name: radware.defensepro.context
  type: keyword

radware.defensepro.physical.port:
  description: Identified DefensePro physical port
  name: radware.defensepro.physical.port
  type: number

radware.defensepro.policy.name:
  description: The DefensePro policy that triggered the event
  name: radware.defensepro.policy.name
  type: keyword

radware.defensepro.risk:
  description: Risk level of the attack, as calculated by DefensePro
  name: radware.defensepro.risk
  type: keyword

radware.defensepro.volume:
  description: Total kilobits used by the attack, rounded down
  name: radware.defensepro.volume
  type: number
