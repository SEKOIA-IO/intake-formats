version: 2.0
uuid: bfacc76a-5b7a-419e-bc30-8c61da4365db
format_uuid: 491233f5-5491-4690-9344-fdfcf77a29f1
rule: AUBE Confirmed Anomaly - Critical
description: >-
  An analyst confirmed in AUBE Portal that a unit period AUBE Core flagged as
  singular on a server is an operational deviation (Confirmed Operational
  Deviation). The highest severity among the period's commands, in the AUBE
  severity map (aubecore/CS.txt), is critical.
sources: https://docs.sekoia.io/integration/categories/threat_intelligence/aube_security/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: "491233f5-5491-4690-9344-fdfcf77a29f1" # AUBE Core anomalies
    event.action: confirmed_anomaly
    aube.severity: critical
  condition: selection
alert_category: intrusions
alert_type: system-compromise
alert_severity: 90
attack:
  - T1078
data_sources:
  - Process monitoring
  - Process command-line parameters
event_fields:
  - field: host.name
    description: Server the unit period belongs to
  - field: user.name
    description: User who ran the most singular command
  - field: process.command_line
    description: Most singular command of the period
  - field: aube.period.label
    description: AUBE Core unit period
  - field: aube.evaluation.reviewed_by
    description: Analyst who confirmed the anomaly
  - field: event.url
    description: Evaluation page of the period in AUBE Portal
similarity_strategy:
  - sekoiaio.entity.uuid
  - aube.event_uid
tags:
  - AUBE Security
changelog:
  - date: 22/10/2026
    level: major
    change: Initial version
