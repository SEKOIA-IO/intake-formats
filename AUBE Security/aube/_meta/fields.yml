aube.evaluation.classification:
  description: Analyst classification of the period in AUBE Portal
  name: aube.evaluation.classification
  type: keyword

aube.evaluation.history_id:
  description: AUBE Portal evaluation history record of the confirmation or withdrawal
  name: aube.evaluation.history_id
  type: long

aube.evaluation.previous_status:
  description: Evaluation status before the change that produced the event
  name: aube.evaluation.previous_status
  type: keyword

aube.evaluation.reviewed_at:
  description: Time of the last evaluation in AUBE Portal
  name: aube.evaluation.reviewed_at
  type: date

aube.evaluation.reviewed_by:
  description: AUBE Portal user who confirmed the period, or withdrew the confirmation
  name: aube.evaluation.reviewed_by
  type: keyword

aube.evaluation.status:
  description: Analyst evaluation status in AUBE Portal (new, under_investigation,
    confirmed_operational_deviation, false_positive, resolved, accepted, approved)
  name: aube.evaluation.status
  type: keyword

aube.event_counts.irregular:
  description: Number of irregular events AUBE Core counted in the period
  name: aube.event_counts.irregular
  type: long

aube.event_counts.total:
  description: Total number of events in the period
  name: aube.event_counts.total
  type: long

aube.event_uid:
  description: Stable identifier of the unit period in AUBE Portal, shared by a confirmation
    and its withdrawal (Sekoia sets event.id itself)
  name: aube.event_uid
  type: keyword

aube.group:
  description: AUBE Portal server group the report belongs to
  name: aube.group
  type: keyword

aube.job_run.id:
  description: AUBE Portal analysis run that produced the report
  name: aube.job_run.id
  type: long

aube.period.id:
  description: AUBE Portal identifier of the unit period
  name: aube.period.id
  type: long

aube.period.label:
  description: AUBE Core unit period label, e.g. Y2026M10D21h08/h4 (start date and
    hour, then length in hours)
  name: aube.period.label
  type: keyword

aube.period.length_hours:
  description: Length of the unit period in hours
  name: aube.period.length_hours
  type: long

aube.portal.version:
  description: AUBE Portal version that exported the event
  name: aube.portal.version
  type: keyword

aube.redaction:
  description: Command-line redaction applied by AUBE Portal (none, or executable_only
    when arguments were removed)
  name: aube.redaction
  type: keyword

aube.report.created_at:
  description: Time the AUBE Portal report holding the period was created
  name: aube.report.created_at
  type: date

aube.report.id:
  description: AUBE Portal report identifier (one report per server per analysis run)
  name: aube.report.id
  type: long

aube.schema_version:
  description: Version of the AUBE Portal event schema (Sekoia event schema) the event
    follows
  name: aube.schema_version
  type: keyword

aube.score.periods_flagged:
  description: Number of unit periods AUBE Core flagged in the same report
  name: aube.score.periods_flagged
  type: long

aube.score.rank:
  description: Rank of the period by singularity score among the flagged periods of
    its report (1 = most singular)
  name: aube.score.rank
  type: long

aube.score.selection_ratio:
  description: AUBE Core lists a period's events whose score is at least this fraction
    of the period's top score
  name: aube.score.selection_ratio
  type: float

aube.server.name:
  description: Name of the server in AUBE Portal, chosen by the operator; it may differ
    from the server's hostname (host.hostname) or address (host.ip)
  name: aube.server.name
  type: keyword

aube.severity:
  description: Highest severity among the period's commands (critical, high, medium,
    low, info, or none when no command is in the severity map)
  name: aube.severity
  type: keyword

aube.top_events.command_line:
  description: Command lines of the period's most singular commands (empty when the
    portal sends executables only)
  name: aube.top_events.command_line
  type: array

aube.top_events.executable:
  description: Executables of the period's most singular commands
  name: aube.top_events.executable
  type: array

aube.users:
  description: Every user active in the unit period
  name: aube.users
  type: array
