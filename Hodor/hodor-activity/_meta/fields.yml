hodor.agent.description:
  description: Description of the AI agent at the time of the call.
  name: hodor.agent.description
  type: keyword

hodor.agent.id:
  description: Identifier of the AI agent identity in Hodor.
  name: hodor.agent.id
  type: keyword

hodor.agent.name:
  description: Name of the AI agent at the time of the call.
  name: hodor.agent.name
  type: keyword

hodor.catalog_provider.id:
  description: Identifier of the Hodor catalog provider used for the call.
  name: hodor.catalog_provider.id
  type: keyword

hodor.connector.id:
  description: Identifier of the Hodor workspace connector slot used for the call.
  name: hodor.connector.id
  type: keyword

hodor.contract.description:
  description: Description of the Hodor contract at the time of the call.
  name: hodor.contract.description
  type: keyword

hodor.contract.id:
  description: Identifier of the Hodor contract governing the agent's access.
  name: hodor.contract.id
  type: keyword

hodor.contract.label:
  description: Name of the Hodor contract at the time of the call.
  name: hodor.contract.label
  type: keyword

hodor.event_id:
  description: Original Hodor event identifier, preserved across delivery retries
    and replays.
  name: hodor.event_id
  type: keyword

hodor.kind:
  description: Hodor activity kind, such as mcp_tool_call.
  name: hodor.kind
  type: keyword

hodor.payload_mode:
  description: 'External payload mode: metadata, truncated or full.'
  name: hodor.payload_mode
  type: keyword

hodor.payload_visibility:
  description: Internal payload visibility selected in Hodor.
  name: hodor.payload_visibility
  type: keyword

hodor.request:
  description: Tool request forwarded according to the configured Hodor payload mode
    and visibility.
  name: hodor.request
  type: object

hodor.response:
  description: Tool response forwarded according to the configured Hodor payload mode
    and visibility.
  name: hodor.response
  type: object

hodor.schema_version:
  description: Version of the Hodor delivery envelope.
  name: hodor.schema_version
  type: long

hodor.source_activity_id:
  description: Source activity identifier for a historical import; absent on live
    events.
  name: hodor.source_activity_id
  type: keyword

hodor.status_code:
  description: Fault-attributing status recorded by Hodor; this can differ from the
    upstream HTTP status.
  name: hodor.status_code
  type: long
