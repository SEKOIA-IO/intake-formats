mokn.attacker_reputation:
  description: Reputation associated with the attacker
  name: mokn.attacker_reputation
  type: keyword

mokn.attacker_total_attempts:
  description: Total number of attempts attributed to the attacker
  name: mokn.attacker_total_attempts
  type: long

mokn.attacker_total_targeted_attempts:
  description: Total number of targeted attempts attributed to the attacker
  name: mokn.attacker_total_targeted_attempts
  type: long

mokn.first_leak_date:
  description: Date when the credential was first seen leaked
  name: mokn.first_leak_date
  type: date

mokn.first_leak_site:
  description: Site name where the credential was first seen leaked
  name: mokn.first_leak_site
  type: keyword

mokn.id:
  description: MokN attempt identifier
  name: mokn.id
  type: long

mokn.identification:
  description: MokN identification associated with the bait login attempt
  name: mokn.identification
  type: keyword

mokn.is_targeted:
  description: Whether MokN classified the bait login attempt as targeted
  name: mokn.is_targeted
  type: boolean

mokn.ja4h:
  description: JA4H fingerprint observed for the bait login attempt
  name: mokn.ja4h
  type: keyword

mokn.leaks:
  description: Leak records associated with the bait login attempt
  name: mokn.leaks
  type: object

mokn.opportunistic_pattern_names:
  description: Human-readable list of opportunistic pattern names detected by MokN
  name: mokn.opportunistic_pattern_names
  type: keyword

mokn.opportunistic_patterns:
  description: Opportunistic patterns detected by MokN for the attacker
  name: mokn.opportunistic_patterns
  type: object

mokn.status:
  description: MokN status code for the bait login attempt
  name: mokn.status
  type: long

mokn.threat_level:
  description: MokN threat level associated with the bait login attempt
  name: mokn.threat_level
  type: keyword
