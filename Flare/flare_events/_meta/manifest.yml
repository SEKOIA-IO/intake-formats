name: Flare Events
slug: flare-events
description: >-
  Flare Events provides exposure intelligence from clear, deep and dark web sources,
  including chat channels, forums, marketplaces, leaks, stealer logs, and lookalike domains.
  The intake normalizes Flare tenant feed events into ECS for correlation and detection in SEKOIA.io.

data_sources:
  Application logs: Flare tenant feed events and alerts.
  Web logs: Exposures observed from clear/deep/dark web sources.
  Third-party application logs: Events collected from third-party platforms (chats, forums, marketplaces).
