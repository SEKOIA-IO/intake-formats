version: 2.0
uuid: 490217f8-2f9b-4a75-b244-b29c46379151
format_uuid: 75153d22-df06-4d8e-b18e-c5f5f287d3ac
rule: Flare Events Ransom Leaks Publication
description: >-
  Detects a Flare document event from a ransomware and/or extortion leak site,
  indicating a named victim organization has had data published as proof
  of compromise or extortion leverage.
sources: https://flare.io/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: '75153d22-df06-4d8e-b18e-c5f5f287d3ac'
    event.dataset: flare.events
    event.kind: alert
    flare.events.type: document
    flare.events.ransomleak.victim_name: '*'
  condition: selection
alert_category: malicious-code
alert_type: ransomware
alert_severity: 90
attack:
  - T1486
  - T1657
data_sources:
  - Application logs
  - Third-party application logs
similarity_strategy:
  - flare.events.uid
  - flare.events.ransomleak.victim_name
tags:
  - Flare Events
