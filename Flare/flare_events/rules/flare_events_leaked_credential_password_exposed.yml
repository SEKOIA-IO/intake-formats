version: 2.0
uuid: 1a437cbb-637d-4dea-9686-2659af258dbb
format_uuid: 75153d22-df06-4d8e-b18e-c5f5f287d3ac
rule: Flare Events Leaked Credential With Password Exposure
description: >-
  Detects leaked credential events where a password is explicitly present in the
  exposure record, indicating elevated risk of account takeover.
sources: https://flare.io/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: '75153d22-df06-4d8e-b18e-c5f5f287d3ac'
    event.dataset: flare.events
    event.kind: alert
    flare.events.type: leaked_credential
    flare.events.leaked_credential.password_present: true
  condition: selection
alert_category: intrusions
alert_type: system-compromise
alert_severity: 85
attack:
  - T1078
  - T1589
data_sources:
  - Application logs
  - Third-party application logs
similarity_strategy:
  - flare.events.uid
  - user.email
tags:
  - Flare Events
