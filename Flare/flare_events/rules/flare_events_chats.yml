format_uuid: 75153d22-df06-4d8e-b18e-c5f5f287d3ac
rule: Flare Events Suspicious Phishing Dark Web Chatter
description: >-
  Detects a Flare chat message event flagged with a sensitive content classification,
  indicating threat actor chatter on illicit channels referencing phishing material tied to the monitored organization.
sources: https://flare.io/
effort: master
detection:
  selection:
    sekoiaio.intake.dialect_uuid: '75153d22-df06-4d8e-b18e-c5f5f287d3ac'
    event.dataset: flare.events
    event.kind: alert
    flare.events.type: chat_message
    flare.events.chat_message.sensitive_content: phishing
  condition: selection
alert_category: fraud
alert_type: phishing
alert_severity: 60
attack:
  - T1591
  - T1598
similarity_strategy:
  - flare.events.uid
  - flare.events.chat_message.conversation_id
data_sources:
  - Application logs
  - Third-party application logs
tags:
  - Flare Events
