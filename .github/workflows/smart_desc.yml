name: Show Smart Descriptions

on:
  pull_request:
    branches: [main, develop]

  workflow_dispatch:

defaults:
  run:
    working-directory: utils

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          uv sync --no-dev

      - name: Generate smart descriptions
        id: smartdesc
        run: |
          uv run python show_smart_descriptions.py --changes --prsha=$GITHUB_SHA >> /tmp/pr_comment.md
      
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pr_comment.md
          path: /tmp/pr_comment.md
