name: Check linting
on: push

defaults:
  run:
    working-directory: utils

jobs:
  test_linting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          uv sync --no-dev

      - name: Execute tests
        run: |
          uv run python linter.py check --changes

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install
        run: npm install -g prettier
      - name: Run
        working-directory: .
        run: |
          npx prettier --check ./**/parser.yml
