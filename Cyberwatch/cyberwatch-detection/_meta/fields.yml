cyberwatch.vas.active:
  description: Indicates the current presence of the vulnerability on the asset
  name: cyberwatch.vas.active
  type: boolean

cyberwatch.vas.computer.criticality:
  description: Criticality of the asset as defined in Cyberwatch
  name: cyberwatch.vas.computer.criticality
  type: keyword

cyberwatch.vas.cve.published_at:
  description: CVE Publication Date
  name: cyberwatch.vas.cve.published_at
  type: datetime

cyberwatch.vas.cve.status:
  description: Vulnerability status on the affected asset
  name: cyberwatch.vas.cve.status
  type: keyword

cyberwatch.vas.cvss.attack_authentication:
  description: 'Vulnerability exploitability metric: authentication'
  name: cyberwatch.vas.cvss.attack_authentication
  type: keyword

cyberwatch.vas.cvss.attack_complexity:
  description: 'Vulnerability exploitability metric: access complexity'
  name: cyberwatch.vas.cvss.attack_complexity
  type: keyword

cyberwatch.vas.cvss.attack_vector:
  description: 'Vulnerability exploitability metric: access vector'
  name: cyberwatch.vas.cvss.attack_vector
  type: keyword

cyberwatch.vas.cvss.availability:
  description: 'Vulnerability impact metric: availability'
  name: cyberwatch.vas.cvss.availability
  type: keyword

cyberwatch.vas.cvss.confidentiality:
  description: 'Vulnerability impact metric: confidentiality'
  name: cyberwatch.vas.cvss.confidentiality
  type: keyword

cyberwatch.vas.cvss.integrity:
  description: 'Vulnerability impact metric: integrity'
  name: cyberwatch.vas.cvss.integrity
  type: keyword

cyberwatch.vas.epss.score:
  description: Exploit Prediction Scoring System
  name: cyberwatch.vas.epss.score
  type: float

cyberwatch.vas.exploit.active:
  description: Indicates whether active exploitation is observed for the vulnerability
  name: cyberwatch.vas.exploit.active
  type: boolean

cyberwatch.vas.exploit.public:
  description: Indicates whether a public exploit exists for the vulnerability
  name: cyberwatch.vas.exploit.public
  type: boolean

cyberwatch.vas.fixed_at:
  description: Vulnerability corrected on the asset on
  name: cyberwatch.vas.fixed_at
  type: datetime

cyberwatch.vas.groups:
  description: Lists of groups
  name: cyberwatch.vas.groups
  type: array

cyberwatch.vas.ignored:
  description: Indicates whether the vulnerability has been ignored on the asset or
    not
  name: cyberwatch.vas.ignored
  type: boolean

cyberwatch.vas.kev:
  description: Indicates whether the vulnerability is in the Known Exploited Vulnerabilities
    catalog
  name: cyberwatch.vas.kev
  type: boolean

cyberwatch.vas.remediation:
  description: Remediation guidance associated with the vulnerability
  name: cyberwatch.vas.remediation
  type: keyword

cyberwatch.vas.updated_at:
  description: Timestamp of the last vulnerability status update in Cyberwatch
  name: cyberwatch.vas.updated_at
  type: datetime
