cisco_secure_access.web.ai_model_name:
  description: Indicates the name of the AI model involved in the transaction or event.
  name: cisco_secure_access.web.ai_model_name
  type: keyword

cisco_secure_access.web.ai_supply_chain_categories:
  description: The list of AI supply chain categories associated with the event.
  name: cisco_secure_access.web.ai_supply_chain_categories
  type: keyword

cisco_secure_access.web.amp.disposition:
  description: The status of the files proxied and scanned by Cisco Advanced Malware
    Protection (AMP) as part of the File Inspection feature.
  name: cisco_secure_access.web.amp.disposition
  type: keyword

cisco_secure_access.web.amp.malware_name:
  description: If Malicious, the name of the malware according to AMP.
  name: cisco_secure_access.web.amp.malware_name
  type: keyword

cisco_secure_access.web.amp.score:
  description: The score of the malware from AMP.
  name: cisco_secure_access.web.amp.score
  type: keyword

cisco_secure_access.web.application_entity_category:
  description: It represents the classification grouping of application entities based
    on shared characteristics or functions.
  name: cisco_secure_access.web.application_entity_category
  type: keyword

cisco_secure_access.web.application_entity_name:
  description: It refers to the specific name of an application entity within a system.
    For example, the YouTube Channel "Cisco".
  name: cisco_secure_access.web.application_entity_name
  type: keyword

cisco_secure_access.web.application_ids:
  description: The ID of the destination application.
  name: cisco_secure_access.web.application_ids
  type: keyword

cisco_secure_access.web.av_detections:
  description: The detection name according to the antivirus engine used in file inspection.
  name: cisco_secure_access.web.av_detections
  type: keyword

cisco_secure_access.web.blocked_categories:
  description: The category that resulted in the destination being blocked.
  name: cisco_secure_access.web.blocked_categories
  type: keyword

cisco_secure_access.web.categories:
  description: The security categories for this request, such as Malware.
  name: cisco_secure_access.web.categories
  type: keyword

cisco_secure_access.web.certificate_errors:
  description: Any certificate or protocol errors in the request.
  name: cisco_secure_access.web.certificate_errors
  type: keyword

cisco_secure_access.web.data_center:
  description: The name of the data center that processed the user-generated traffic.
  name: cisco_secure_access.web.data_center
  type: keyword

cisco_secure_access.web.destination_list_ids:
  description: The ID number assigned to a destination list.
  name: cisco_secure_access.web.destination_list_ids
  type: keyword

cisco_secure_access.web.detected_response_file_type:
  description: The file type that resulted in a blocked response.
  name: cisco_secure_access.web.detected_response_file_type
  type: keyword

cisco_secure_access.web.dlp_status:
  description: If the request was Blocked for DLP.
  name: cisco_secure_access.web.dlp_status
  type: keyword

cisco_secure_access.web.egress:
  description: TRUE indicates that the egress IP was a reserved IP.
  name: cisco_secure_access.web.egress
  type: boolean

cisco_secure_access.web.egress_ip:
  description: The public IP address assigned to a session as it exits the Secure
    Access ZTA infrastructure en route to the destination application.
  name: cisco_secure_access.web.egress_ip
  type: keyword

cisco_secure_access.web.event_correlation_id:
  description: A unique identifier generated for each network request, the Event Correlation
    ID stitches together all related events across various security services (Firewall,
    SWG, ZTNA) to provide a unified, end-to-end view of a single traffic flow.
  name: cisco_secure_access.web.event_correlation_id
  type: keyword

cisco_secure_access.web.file_action:
  description: The action taken on a file in a remote browser isolation session.
  name: cisco_secure_access.web.file_action
  type: keyword

cisco_secure_access.web.forwarding_method:
  description: The method used to forward the proxy events.
  name: cisco_secure_access.web.forwarding_method
  type: keyword

cisco_secure_access.web.identities:
  description: All identities associated with this request.
  name: cisco_secure_access.web.identities
  type: keyword

cisco_secure_access.web.identity_types:
  description: The type of identities that were associated with the request.
  name: cisco_secure_access.web.identity_types
  type: keyword

cisco_secure_access.web.isolate_action:
  description: The remote browser isolation state associated with the request.
  name: cisco_secure_access.web.isolate_action
  type: keyword

cisco_secure_access.web.msp_organization_id:
  description: The Secure Access parent organization ID.
  name: cisco_secure_access.web.msp_organization_id
  type: keyword

cisco_secure_access.web.policy_identity_label:
  description: The identity that made the request.
  name: cisco_secure_access.web.policy_identity_label
  type: keyword

cisco_secure_access.web.policy_identity_type:
  description: The first identity type that made the request.
  name: cisco_secure_access.web.policy_identity_type
  type: keyword

cisco_secure_access.web.producer:
  description: The producer of the proxy events.
  name: cisco_secure_access.web.producer
  type: keyword

cisco_secure_access.web.puas:
  description: A list of all potentially unwanted application (PUA) results for the
    proxied file as returned by the antivirus scanner.
  name: cisco_secure_access.web.puas
  type: keyword

cisco_secure_access.web.security_overridden:
  description: TRUE indicates that security filtering was explicitly overridden and
    not applied during enforcement.
  name: cisco_secure_access.web.security_overridden
  type: boolean

cisco_secure_access.web.time_based_rule:
  description: TRUE indicates that a the rule was applied due to a time condition.
  name: cisco_secure_access.web.time_based_rule
  type: boolean

cisco_secure_access.web.warn_categories:
  description: The ID of one or more content categories in lists matched for a Warn
    action by the rule.
  name: cisco_secure_access.web.warn_categories
  type: keyword

cisco_secure_access.web.warn_status:
  description: The Warn page's state associated with the request.
  name: cisco_secure_access.web.warn_status
  type: keyword
