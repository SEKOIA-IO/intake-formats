cisco_secure_access.ips.application_id:
  description: The ID of the destination application.
  name: cisco_secure_access.ips.application_id
  type: keyword

cisco_secure_access.ips.attack_classification:
  description: The category of attack detected by a rule that is part of a more general
    type of attack class.
  name: cisco_secure_access.ips.attack_classification
  type: keyword

cisco_secure_access.ips.casi_category_ids:
  description: The name of the Application category to which the App ID belongs.
  name: cisco_secure_access.ips.casi_category_ids
  type: keyword

cisco_secure_access.ips.config_type:
  description: The type of the IPS configuration.
  name: cisco_secure_access.ips.config_type
  type: keyword

cisco_secure_access.ips.data_center:
  description: The name of the data center that processed the user-generated traffic.
  name: cisco_secure_access.ips.data_center
  type: keyword

cisco_secure_access.ips.direction:
  description: The direction of the packet that matches the signature.
  name: cisco_secure_access.ips.direction
  type: keyword

cisco_secure_access.ips.egress:
  description: TRUE indicates that the egress IP was a reserved IP.
  name: cisco_secure_access.ips.egress
  type: boolean

cisco_secure_access.ips.egress_ip:
  description: The public IP address assigned to a session as it exits the Secure
    Access ZTA infrastructure en route to the destination application.
  name: cisco_secure_access.ips.egress_ip
  type: keyword

cisco_secure_access.ips.enforced_by:
  description: The Secure Access component or service that enforced the policy or
    control related to this event (e.g., Firewall, Web Proxy).
  name: cisco_secure_access.ips.enforced_by
  type: keyword

cisco_secure_access.ips.event_correlation_id:
  description: A unique identifier generated for each network request, the Event Correlation
    ID stitches together all related events across various security services (Firewall,
    SWG, ZTNA) to provide a unified, end-to-end view of a single traffic flow.
  name: cisco_secure_access.ips.event_correlation_id
  type: keyword

cisco_secure_access.ips.ftd_enforcement_id:
  description: The unique identifier of the enforcement action taken by a Firepower
    Threat Defense (FTD) device integrated with Secure Access.
  name: cisco_secure_access.ips.ftd_enforcement_id
  type: keyword

cisco_secure_access.ips.ftd_enforcement_name:
  description: The name or type of enforcement action taken by a FTD device integrated
    with Secure Access (e.g., Malware Block, URL Category Block).
  name: cisco_secure_access.ips.ftd_enforcement_name
  type: keyword

cisco_secure_access.ips.generator_id:
  description: Unique ID assigned to the part of the IPS that generated the event.
  name: cisco_secure_access.ips.generator_id
  type: keyword

cisco_secure_access.ips.identities:
  description: All tunnel identities that are associated with this request.
  name: cisco_secure_access.ips.identities
  type: keyword

cisco_secure_access.ips.identity_types:
  description: The type of identity that is associated with this request.
  name: cisco_secure_access.ips.identity_types
  type: keyword

cisco_secure_access.ips.operation_mode:
  description: The mode of operation of the IPS, either detection or prevention.
  name: cisco_secure_access.ips.operation_mode
  type: keyword

cisco_secure_access.ips.policy_resource_id:
  description: The ID of the IPS policy resource.
  name: cisco_secure_access.ips.policy_resource_id
  type: keyword

cisco_secure_access.ips.session_id:
  description: The unique identifier of a session, which is used to group the correlated
    events between various services.
  name: cisco_secure_access.ips.session_id
  type: keyword

cisco_secure_access.ips.severity:
  description: The severity level of the rule.
  name: cisco_secure_access.ips.severity
  type: keyword

cisco_secure_access.ips.signature_id:
  description: Used to uniquely identify signatures.
  name: cisco_secure_access.ips.signature_id
  type: keyword

cisco_secure_access.ips.signature_list_id:
  description: Unique ID assigned to a Default or Custom Signature List.
  name: cisco_secure_access.ips.signature_list_id
  type: keyword
