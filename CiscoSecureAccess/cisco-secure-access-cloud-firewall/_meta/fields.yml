cisco_secure_access.firewall.app_id:
  description: The unique application ID identified for the current session.
  name: cisco_secure_access.firewall.app_id
  type: keyword

cisco_secure_access.firewall.casi_category_ids:
  description: Name of the Application category to which the App ID belongs.
  name: cisco_secure_access.firewall.casi_category_ids
  type: keyword

cisco_secure_access.firewall.content_category_ids:
  description: ID of one or more content categories matched by the rule.
  name: cisco_secure_access.firewall.content_category_ids
  type: keyword

cisco_secure_access.firewall.content_category_list_ids:
  description: ID of one or more content category lists that include categories matched
    by the rule.
  name: cisco_secure_access.firewall.content_category_list_ids
  type: keyword

cisco_secure_access.firewall.data_center:
  description: The name of the data center that processed the user-generated traffic.
  name: cisco_secure_access.firewall.data_center
  type: keyword

cisco_secure_access.firewall.destination_list_ids:
  description: The destination list IDs that Secure Access applied in the rule.
  name: cisco_secure_access.firewall.destination_list_ids
  type: keyword

cisco_secure_access.firewall.destination_sgt_origin_id:
  description: The Security Group Tag (SGT) ID associated with the destination resource.
    This identifies the security group classification of the traffic destination.
  name: cisco_secure_access.firewall.destination_sgt_origin_id
  type: keyword

cisco_secure_access.firewall.egress:
  description: TRUE indicates that the egress IP was a reserved IP.
  name: cisco_secure_access.firewall.egress
  type: boolean

cisco_secure_access.firewall.egress_ip:
  description: The public IP address assigned to a session as it exits the Secure
    Access ZTA infrastructure en route to the destination application.
  name: cisco_secure_access.firewall.egress_ip
  type: ip

cisco_secure_access.firewall.event_correlation_id:
  description: A unique identifier generated for each network request, the Event Correlation
    ID stitches together all related events across various security services (Firewall,
    SWG, ZTNA) to provide a unified, end-to-end view of a single traffic flow.
  name: cisco_secure_access.firewall.event_correlation_id
  type: keyword

cisco_secure_access.firewall.fqdns:
  description: The fully qualified domain names (FQDNs) that match the request.
  name: cisco_secure_access.firewall.fqdns
  type: keyword

cisco_secure_access.firewall.fw_block_reason:
  description: The specific reason why the firewall blocked the traffic.
  name: cisco_secure_access.firewall.fw_block_reason
  type: keyword

cisco_secure_access.firewall.fw_event_id:
  description: The ID of the firewall event. Populated only for traffic handled by
    Cisco Secure Firewall.
  name: cisco_secure_access.firewall.fw_event_id
  type: keyword

cisco_secure_access.firewall.identities:
  description: The names of the network tunnel.
  name: cisco_secure_access.firewall.identities
  type: keyword

cisco_secure_access.firewall.identity_type:
  description: The type of identity that made the request.
  name: cisco_secure_access.firewall.identity_type
  type: keyword

cisco_secure_access.firewall.origin_ids:
  description: The unique identity of the network tunnel.
  name: cisco_secure_access.firewall.origin_ids
  type: keyword

cisco_secure_access.firewall.packet_size:
  description: The size in bytes of the packet sent to the CDFW.
  name: cisco_secure_access.firewall.packet_size
  type: long

cisco_secure_access.firewall.posture_id:
  description: The unique ID of the endpoint posture profile.
  name: cisco_secure_access.firewall.posture_id
  type: keyword

cisco_secure_access.firewall.private_app_group_id:
  description: The unique ID of the private resource group ID that the private resource
    belongs to.
  name: cisco_secure_access.firewall.private_app_group_id
  type: keyword

cisco_secure_access.firewall.private_flow:
  description: TRUE if Secure Access applied a private access rule to the user-generated
    traffic, and FALSE if Secure Access applied an internet access rule.
  name: cisco_secure_access.firewall.private_flow
  type: boolean

cisco_secure_access.firewall.protocol:
  description: 'The actual protocol of the traffic. Valid values are: TCP, UDP, or
    ICMP.'
  name: cisco_secure_access.firewall.protocol
  type: keyword

cisco_secure_access.firewall.start_time:
  description: The timestamp when the first packet of the session was received in
    UTC in seconds. Populated only for traffic handled by Cisco Secure Firewall.
  name: cisco_secure_access.firewall.start_time
  type: date

cisco_secure_access.firewall.traffic_source:
  description: The source of the user-generated traffic.
  name: cisco_secure_access.firewall.traffic_source
  type: keyword
