cisco_secure_access.file.archive_depth:
  description: The level (if any) at which the file was nested in an archive file.
  name: cisco_secure_access.file.archive_depth
  type: long

cisco_secure_access.file.archive_filename:
  description: The name of the archive file involved with the activity.
  name: cisco_secure_access.file.archive_filename
  type: keyword

cisco_secure_access.file.archive_sha256:
  description: The SHA-256 checksum hash of the archive file.
  name: cisco_secure_access.file.archive_sha256
  type: keyword

cisco_secure_access.file.direction:
  description: The traffic direction of the file event.
  name: cisco_secure_access.file.direction
  type: keyword

cisco_secure_access.file.disposition:
  description: The status of the files proxied and scanned by Cisco Advanced Malware
    Protection (AMP) as part of the File Inspection feature.
  name: cisco_secure_access.file.disposition
  type: keyword

cisco_secure_access.file.dlp_status:
  description: The verdict of the DLP scanning service.
  name: cisco_secure_access.file.dlp_status
  type: keyword

cisco_secure_access.file.enforced_by:
  description: The Secure Access component or service that enforced the policy or
    control related to this event (e.g., Firewall, Web Proxy).
  name: cisco_secure_access.file.enforced_by
  type: keyword

cisco_secure_access.file.firewall_event_id:
  description: The ID of the firewall event. Populated only for traffic handled by
    Cisco Secure Firewall.
  name: cisco_secure_access.file.firewall_event_id
  type: keyword

cisco_secure_access.file.ftd_enforcement_id:
  description: The unique identifier of the enforcement action taken by a Firepower
    Threat Defense (FTD) device integrated with Secure Access.
  name: cisco_secure_access.file.ftd_enforcement_id
  type: keyword

cisco_secure_access.file.ftd_enforcement_name:
  description: The name or type of enforcement action taken by a FTD device integrated
    with Secure Access (e.g., Malware Block, URL Category Block).
  name: cisco_secure_access.file.ftd_enforcement_name
  type: keyword

cisco_secure_access.file.retention_policy_days:
  description: The number of days that AWS S3 stores your Secure Access File Events
    log.
  name: cisco_secure_access.file.retention_policy_days
  type: long

cisco_secure_access.file.static_analysis:
  description: The status of the file static sample analysis.
  name: cisco_secure_access.file.static_analysis
  type: keyword

cisco_secure_access.file.threat_score:
  description: The threat score most recently associated with this file. This is a
    value from 0 to 100.
  name: cisco_secure_access.file.threat_score
  type: long

cisco_secure_access.file.type_id:
  description: The type of file.
  name: cisco_secure_access.file.type_id
  type: long
