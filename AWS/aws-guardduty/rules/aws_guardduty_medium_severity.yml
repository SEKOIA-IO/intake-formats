version: 2.0
uuid: 9470d781-37eb-49f7-b994-e8cabed86c8e
format_uuid: 3e060900-4004-4754-a597-d2944a601930
rule: AWS GuardDuty Medium Severity Alert
description: >-
  GuardDuty has detected a threat with a medium severity level. A Medium severity level indicates suspicious activity that deviates from normally observed behavior and, depending on your use case, may be indicative of a resource compromise.
sources: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-active.html
effort: master
detection:
  selection:
    aws.guardduty.finding.type: '*'
    event.kind: alert
  selection_low:
    event.severity|gte: 4
  selection_high:
    event.severity|lt: 7
  condition: all of selection*
alert_category: intrusions
alert_type: application-compromise
alert_severity: 60
attack:
  - T1204
  - T1059
data_sources:
  - Services
  - Application logs
similarity_strategy:
  - sekoiaio.entity.uuid
  - aws.guardduty.finding.id
tags:
  - AWS GuardDuty
changelog:
  - date: 15/02/2024
    level: minor
    change: Effort level was adapted according to the observed hits for the rule.
  - date: 27/02/2026
    level: minor
    change: Update rule type to integration
