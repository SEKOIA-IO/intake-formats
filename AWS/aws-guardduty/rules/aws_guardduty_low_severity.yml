version: 2.0
uuid: 4417dd6a-344c-41fe-96ce-4ee1e352221a
format_uuid: 3e060900-4004-4754-a597-d2944a601930
rule: AWS GuardDuty Low Severity Alert
description: >-
  GuardDuty has detected a threat with a low severity level. A low severity level indicates attempted suspicious activity that did not compromise your network, for example, a port scan or a failed intrusion attempt.
sources: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-active.html
effort: master
detection:
  selection:
    aws.guardduty.finding.type: '*'
    event.kind: alert
    event.severity|lt: 4
  condition: selection
alert_category: intrusions
alert_type: application-compromise
alert_severity: 20
attack:
  - T1204
  - T1059 
data_sources:
  - Services
  - Application logs
similarity_strategy:
  - sekoiaio.entity.uuid
  - aws.guardduty.finding.id
tags: 
  - AWS GuardDuty
changelog:
  - date: 27/02/2026
    level: minor
    change: Update rule type to integration
