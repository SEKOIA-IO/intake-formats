openbsd.pf.carp.advbase:
  description: Base interval, in seconds, between CARP advertisements.
  name: openbsd.pf.carp.advbase
  type: keyword

openbsd.pf.carp.advskew:
  description: CARP advertisement skew value used for election priority.
  name: openbsd.pf.carp.advskew
  type: keyword

openbsd.pf.carp.type:
  description: CARP message type.
  name: openbsd.pf.carp.type
  type: keyword

openbsd.pf.carp.version:
  description: CARP protocol version.
  name: openbsd.pf.carp.version
  type: keyword

openbsd.pf.carp.vhid:
  description: The identifier of the virtual host that the appliance belong to in
    the CARP virtual group
  name: openbsd.pf.carp.vhid
  type: keyword

openbsd.pf.event.tracker.id:
  description: tracker ID
  name: openbsd.pf.event.tracker.id
  type: tracker

openbsd.pf.icmp.datalength:
  description: the length of the content of the ICMP packet
  name: openbsd.pf.icmp.datalength
  type: long

openbsd.pf.routing.class:
  description: IPv4 traffic class or type-of-service value reported by PF.
  name: openbsd.pf.routing.class
  type: keyword

openbsd.pf.routing.flags:
  description: IPv4 packet flags reported by PF.
  name: openbsd.pf.routing.flags
  type: keyword

openbsd.pf.routing.flow:
  description: IPv6 flow label value reported by PF.
  name: openbsd.pf.routing.flow
  type: keyword

openbsd.pf.routing.hoplimit:
  description: IPv4 TTL or IPv6 hop limit reported by PF.
  name: openbsd.pf.routing.hoplimit
  type: number

openbsd.pf.routing.offset:
  description: IPv4 fragment offset value reported by PF.
  name: openbsd.pf.routing.offset
  type: number

openbsd.pf.rule.subrulenr:
  description: number of the subrule
  name: openbsd.pf.rule.subrulenr
  type: integer

openbsd.pf.transport.ack:
  description: TCP acknowledgement value reported by PF.
  name: openbsd.pf.transport.ack
  type: keyword

openbsd.pf.transport.bytes:
  description: Transport payload length reported by PF.
  name: openbsd.pf.transport.bytes
  type: number

openbsd.pf.transport.classification:
  description: Transport-specific classification token reported by PF.
  name: openbsd.pf.transport.classification
  type: keyword

openbsd.pf.transport.options:
  description: Raw transport options string reported by PF.
  name: openbsd.pf.transport.options
  type: keyword

openbsd.pf.transport.seq_number:
  description: TCP sequence number or ICMP sequence token reported by PF.
  name: openbsd.pf.transport.seq_number
  type: keyword

openbsd.pf.transport.tcp_flags:
  description: TCP flags reported by PF.
  name: openbsd.pf.transport.tcp_flags
  type: keyword

openbsd.pf.transport.type:
  description: Transport subtype reported by PF for non-TCP and non-UDP events.
  name: openbsd.pf.transport.type
  type: keyword

openbsd.pf.transport.urgency:
  description: TCP urgent pointer value reported by PF.
  name: openbsd.pf.transport.urgency
  type: keyword

openbsd.pf.transport.window_size:
  description: TCP window size reported by PF.
  name: openbsd.pf.transport.window_size
  type: number
