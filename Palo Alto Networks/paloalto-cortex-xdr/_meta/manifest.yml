description: >-
  Palo Alto Networks Cortex XDR v3 (EDR) is an integrated cloud security platform that provides advanced threat detection and response features, including monitoring suspicious activities at the endpoint level and analyzing user behavior. This format parses Cortex XDR v3 alerts and endpoint events. Cortex XDR v5 Issues API events are supported by the separate Palo Alto Cortex XDR Issues format.
data_sources:
  Network device logs: Palo Alto can record traffic events flowing through their firewall
