version: 2.0
uuid: ef7947dc-23a0-4842-90dd-c2ae3f4b6f97
format_uuid: 903ec1b8-f206-4ba5-8563-db21da09cafd
rule: Palo Alto NGFW Threat Detection (High/Critical)
description: >-
  Palo Alto Next-Generation Firewall raised an alert for a threat detection with high or critical severity.
sources: https://www.paloaltonetworks.com/network-security/next-generation-firewall
effort: master
detection:
  selection:
    action.name: 'alert'
    sekoiaio.intake.dialect_uuid: '903ec1b8-f206-4ba5-8563-db21da09cafd'
  log_level:
    log.level:
      - 'high'
      - 'critical'
      - 'High'
      - 'Critical'
  condition: selection and log_level
alert_category: intrusions
alert_type: system-compromise
alert_severity: 80
attack:
  - T1204
  - T1059
  - T1569
data_sources:
  - Network intrusion detection system
similarity_strategy:
  - sekoiaio.entity.uuid
  - source.ip
  - destination.ip
event_fields:
  - field: source.ip
    description: Source IP address
  - field: destination.ip
    description: Destination IP address
  - field: rule.name
    description: NGFW Rule triggered
  - field: log.level
    description: Log severity level
  - field: reason
    description: Reason for Data Filtering action
  - field: justification
    description: Justification for Data Filtering action
  - field: nssai_sst
    description: The A Slice Service Type of the Network Slice ID
  - field: subcategory_of_app
    description: The application subcategory
  - field: category_of_app
    description: The application category
  - field: technology_of_app
    description: The application technology
  - field: risk_of_app
    description: Risk level associated with the application
  - field: characteristic_of_app
    description: Comma-separated list of applicable characteristic of the application
  - field: container_of_app
    description: The parent application for an application
  - field: tunneled_app
    description: Name of the tunneled application
  - field: is_saas_of_app
    description: Displays 1 if a SaaS application
  - field: sanctioned_state_of_app
    description: Displays 1 if application is sanctioned
  - field: cloud_reportid
    description: Unique ID for a file scanned by the DLP cloud service
  - field: cluster_name
    description: Name of the CN-Series firewall cluster
  - field: flow_type
    description: Identifies the type of proxy used for traffic
tags: 
  - Palo Alto NGFW
changelog:
  - date: 29/04/2026
    level: minor
    change: Initial rule creation
