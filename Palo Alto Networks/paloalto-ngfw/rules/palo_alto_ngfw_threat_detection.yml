rule: Palo Alto NGFW Threat Detection Critical
description: >-
  Palo Alto Next-Generation Firewall raised an alert for a threat detection with critical severity.
sources: https://www.paloaltonetworks.com/network-security/next-generation-firewall
effort: master
detection:
  selection:
    event.action: 'alert'
    sekoiaio.intake.dialect_uuid: "903ec1b8-f206-4ba5-8563-db21da09cafd" # Palo Alto NGFW
  log_level:
    log.level: 'critical'
  condition: selection and log_level
alert_category: intrusions
alert_type: system-compromise
alert_severity: 80
attack:
  - T1204
  - T1059
  - T1569
data_sources:
  - Network intrusion detection system
similarity_strategy:
  - sekoiaio.entity.uuid
  - source.ip
  - destination.ip
event_fields:
  - field: source.ip
    description: Source IP address
  - field: destination.ip
    description: Destination IP address
  - field: rule.name
    description: NGFW Rule triggered
  - field: threat.indicator.name
    description: Name of the threat
  
tags: 
  - Palo Alto NGFW
