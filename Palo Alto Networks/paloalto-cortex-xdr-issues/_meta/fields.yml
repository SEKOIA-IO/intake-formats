paloalto.cortex.xdr.issue.id:
  description: Stable Cortex XDR v5 issue identifier, shared by all revisions of the
    issue
  name: paloalto.cortex.xdr.issue.id
  type: keyword

paloalto.cortex.xdr.issue.is_excluded:
  description: Exclusion flag reported by Cortex XDR v5; does not indicate resolution
  name: paloalto.cortex.xdr.issue.is_excluded
  type: boolean

paloalto.cortex.xdr.issue.modification_time:
  description: Issue modification time as Unix milliseconds; paired with the issue
    ID to identify a revision
  name: paloalto.cortex.xdr.issue.modification_time
  type: long

paloalto.cortex.xdr.issue.severity:
  description: Original severity label reported by Cortex XDR v5
  name: paloalto.cortex.xdr.issue.severity
  type: keyword
