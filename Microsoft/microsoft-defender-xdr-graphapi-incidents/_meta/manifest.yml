name: Microsoft Defender XDR Incidents (Graph API) [BETA]
slug: microsoft-defender-xdr-graphapi-incidents
automation_module_uuid: ce491d8d-87a8-45af-a7c5-ede98c4a4ba3
automation_connector_uuid: 35700bd5-72bc-4dc5-9ca8-b905bcc180ee

description: >-
  Microsoft 365 Defender is a enterprise defense suite that coordinates detection, prevention, investigation, and response across endpoints, identities, email, and cloud applications.

  This intake collects incidents from Microsoft Defender XDR through the Microsoft Graph Security API. An incident aggregates the related alerts, assets, and evidence of a breach into a single case.

data_sources:
  Windows event logs: Microsoft Defender for Endpoint watch events logs
  Email gateway: Microsoft Defender for O365 monitors emails
  OAuth audit logs: Microsoft Defender for Cloud App monitors users, entity behavior and activities
  Authentication logs: Microsoft Defender for Identity monitors users, entity behavior and activities
