microsoft.defender.alert.classification:
  description: Specifies whether the alert represents a true threat
  name: microsoft.defender.alert.classification
  type: keyword

microsoft.defender.alert.determination:
  description: Specifies the result of the investigation, whether the alert represents
    a true attack and if so, the nature of the attack
  name: microsoft.defender.alert.determination
  type: keyword

microsoft.defender.alert.severity:
  description: The severity of the alert
  name: microsoft.defender.alert.severity
  type: keyword

microsoft.defender.alert.status:
  description: The status of the alert
  name: microsoft.defender.alert.status
  type: keyword

microsoft.defender.incident.assignee:
  description: User the incident is assigned to
  name: microsoft.defender.incident.assignee
  type: keyword

microsoft.defender.incident.id:
  description: Unique identifier to represent the incident this alert resource is
    associated with
  name: microsoft.defender.incident.id
  type: keyword

microsoft.defender.incident.name:
  description: Human-readable name of the incident
  name: microsoft.defender.incident.name
  type: keyword

microsoft.defender.incident.redirect_incident_id:
  description: When the incident was merged into another one, the target incident
    id
  name: microsoft.defender.incident.redirect_incident_id
  type: keyword

microsoft.defender.incident.reference:
  description: URL for the incident page in the Microsoft 365 Defender portal
  name: microsoft.defender.incident.reference
  type: keyword

microsoft.defender.incident.tags:
  description: Tags attached to the incident
  name: microsoft.defender.incident.tags
  type: array
