action.properties:
  description: Change details extracted from target resources, including modified
    properties and impacted targeted users
  name: action.properties
  type: array

azure.entraid.properties.appId:
  description: Application ID associated with the event, extracted from additional
    details or top-level appId
  name: azure.entraid.properties.appId
  type: keyword

azure.entraid.properties.appliedConditionalAccessPolicies:
  description: Conditional Access policies evaluated for the sign-in or operation
  name: azure.entraid.properties.appliedConditionalAccessPolicies
  type: array

azure.entraid.properties.clientAppUsed:
  description: Client application type used for the operation, such as Browser or
    Mobile Apps and Desktop clients
  name: azure.entraid.properties.clientAppUsed
  type: keyword

azure.entraid.properties.conditionalAccessPolicy.displayName:
  description: Display name of the Conditional Access policy referenced in modified
    properties
  name: azure.entraid.properties.conditionalAccessPolicy.displayName
  type: keyword

azure.entraid.properties.conditionalAccessPolicy.newState:
  description: New state of the Conditional Access policy after change
  name: azure.entraid.properties.conditionalAccessPolicy.newState
  type: keyword

azure.entraid.properties.conditionalAccessPolicy.oldState:
  description: Previous state of the Conditional Access policy before change
  name: azure.entraid.properties.conditionalAccessPolicy.oldState
  type: keyword

azure.entraid.properties.conditionalAccessStatus:
  description: Conditional Access evaluation result reported by Entra ID
  name: azure.entraid.properties.conditionalAccessStatus
  type: keyword

azure.entraid.properties.isInteractive:
  description: Indicates whether the operation or sign-in was interactive
  name: azure.entraid.properties.isInteractive
  type: keyword

azure.entraid.properties.modifiedProperties:
  description: Raw list of modified properties extracted from targetResources.modifiedProperties
  name: azure.entraid.properties.modifiedProperties
  type: array

azure.entraid.properties.operationType:
  description: Operation type reported by Entra ID, for example Add, Update, Delete,
    or Get
  name: azure.entraid.properties.operationType
  type: keyword

azure.entraid.properties.resourceId:
  description: Identifier of the impacted Entra ID resource
  name: azure.entraid.properties.resourceId
  type: keyword

azure.entraid.properties.riskDetail:
  description: Additional risk detail reported by Entra ID
  name: azure.entraid.properties.riskDetail
  type: keyword

azure.entraid.properties.riskEventTypes:
  description: Risk event type values associated with the operation or sign-in
  name: azure.entraid.properties.riskEventTypes
  type: keyword

azure.entraid.properties.riskLevelAggregated:
  description: Aggregated risk level reported by Entra ID
  name: azure.entraid.properties.riskLevelAggregated
  type: keyword

azure.entraid.properties.riskLevelDuringSignIn:
  description: Risk level evaluated at sign-in time
  name: azure.entraid.properties.riskLevelDuringSignIn
  type: keyword

azure.entraid.properties.riskState:
  description: Risk state reported by Entra ID
  name: azure.entraid.properties.riskState
  type: keyword

azure.entraid.properties.status.errorCode:
  description: Entra ID status error code for the operation
  name: azure.entraid.properties.status.errorCode
  type: keyword

azure.entraid.properties.targetServicePrincipalDisplayName:
  description: Display name of the target service principal involved in the event
  name: azure.entraid.properties.targetServicePrincipalDisplayName
  type: keyword

