name: AUBE Core anomalies
slug: aube-core
description: >-
  Anomalies confirmed by analysts in AUBE Portal: unit periods that AUBE Core flagged as singular
  and an analyst confirmed, and the withdrawal of a confirmation. Each event carries the server,
  the period, its singularity score and severity, the evaluation and the most singular commands.
data_sources:
  Process monitoring: The most singular commands of the period, with the user who ran them
  Process command-line parameters: The command lines of those commands, unless the portal redacts arguments
  System calls: AUBE Core analyses the auditd execve records of Linux servers (and process events of Windows servers)
