name: idruide
slug: idruide
description: >-
  idruide is a French Unified Endpoint Management (UEM) vendor. Its platform, idruide Sparkle, lets IT teams enroll,
  configure, secure and monitor professional fleets of Android, Apple, Windows, ChromeOS and Linux devices from a single
  console. idruide serves public and private organizations in healthcare, defense, security, local government and
  the education sector.
