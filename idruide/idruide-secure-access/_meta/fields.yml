idruide.application.previous_version:
  description: Version of the application before the update
  name: idruide.application.previous_version
  type: keyword

idruide.command.id:
  description: Identifier of the command sent to the device
  name: idruide.command.id
  type: keyword

idruide.command.status:
  description: Status of the command on the device (SUCCESS, ERROR, TIMEOUT, CANCELLED...)
  name: idruide.command.status
  type: keyword

idruide.compliance.failing_controls:
  description: Compliance checks failing on the device
  name: idruide.compliance.failing_controls
  type: array

idruide.compliance.requirements:
  description: Framework requirements the compliance check belongs to
  name: idruide.compliance.requirements
  type: array

idruide.compliance.state:
  description: 'Compliance of the device after the change: compliant or non-compliant'
  name: idruide.compliance.state
  type: keyword

idruide.compliance.status:
  description: 'Result of the compliance check: Pass or Fail'
  name: idruide.compliance.status
  type: keyword

idruide.device.serial_number:
  description: Serial number of the device
  name: idruide.device.serial_number
  type: keyword

idruide.entity.id:
  description: Identifier of the object acted on
  name: idruide.entity.id
  type: keyword

idruide.entity.name:
  description: Name of the object acted on
  name: idruide.entity.name
  type: keyword

idruide.entity.type:
  description: Type of the object an administrator or Secure Access acted on (Policy,
    Message, Profile, tag, subscription...)
  name: idruide.entity.type
  type: keyword

idruide.event.id:
  description: 'Identifier of the event (OCSF metadata.uid): the same event sent twice
    has the same identifier'
  name: idruide.event.id
  type: keyword

idruide.feature:
  description: Secure Access feature that produced the event (Compliance, Inventory,
    Vulnerabilities, Platform audit, Device management)
  name: idruide.feature
  type: keyword

idruide.finding.id:
  description: Identifier of the compliance or vulnerability finding, the same across
    its raise, updates and resolution
  name: idruide.finding.id
  type: keyword

idruide.finding.observed:
  description: Value observed on the device that made the compliance check fail
  name: idruide.finding.observed
  type: keyword

idruide.finding.resolution:
  description: 'How a finding was closed when it was not fixed: suppressed (an exception
    was granted)'
  name: idruide.finding.resolution
  type: keyword

idruide.os_patch.pending:
  description: Newer OS releases not installed on the device
  name: idruide.os_patch.pending
  type: array

idruide.os_patch.pending_count:
  description: Number of newer OS releases not installed on the device
  name: idruide.os_patch.pending_count
  type: long

idruide.remediation.description:
  description: How to fix the failing compliance check
  name: idruide.remediation.description
  type: keyword

idruide.software.count:
  description: Number of applications installed on the device
  name: idruide.software.count
  type: long

idruide.software.names:
  description: Identifiers of the applications installed on the device
  name: idruide.software.names
  type: array

idruide.vulnerability.fixed_by:
  description: OS releases that fix the vulnerabilities
  name: idruide.vulnerability.fixed_by
  type: array
