version: 2.0
uuid: 5b0285b5-9a11-404f-b949-5eb2a338151a
format_uuid: 22f2afd2-c858-443d-8e06-7b335e439c29
rule: CrowdStrike Falcon Intrusion Detection Critical Severity EppDetection
description: >-
  CrowdStrike Falcon agent raised an alert for an intrusion detection with critical severity with the new EppDetectionSummaryEvent.
sources: https://www.crowdstrike.com/
effort: master
detection:
  incident:
    crowdstrike.event_type:
      - 'EppDetectionSummaryEvent'
  severity:
    crowdstrike.severity_name: 'Critical'
  condition: incident and severity
alert_category: intrusions
alert_type: system-compromise
alert_severity: 90
attack:
  - T1204
  - T1059
  - T1569
data_sources:
  - Anti-virus
similarity_strategy:
  - sekoiaio.entity.uuid
  - crowdstrike.detect_id
event_fields:
  - field: process.command_line
    description: Process and related command line
  - field: host.name
    description: Related impacted computer
tags:
  - CrowdStrike Falcon
changelog:
  - date: 10/02/2026
    level: minor
    change: Update rule type to integration
