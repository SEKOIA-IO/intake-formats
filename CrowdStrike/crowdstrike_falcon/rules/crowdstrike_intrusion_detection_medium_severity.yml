version: 2.0
uuid: 3ac90d58-f204-40e3-9e0a-f012505dc33a
format_uuid: 22f2afd2-c858-443d-8e06-7b335e439c29
rule: CrowdStrike Falcon Intrusion Detection Medium Severity
description: >-
  CrowdStrike Falcon agent raised an alert for an intrusion detection with medium severity
sources: https://www.crowdstrike.com/
effort: master
detection:
  incident:
    crowdstrike.event_type:
      - 'DetectionSummaryEvent'
      - 'Vertex'
  severity:
    crowdstrike.severity_name: 'Medium'
  condition: incident and severity
alert_category: intrusions
alert_type: system-compromise
alert_severity: 50
attack:
  - T1204
  - T1059
  - T1569
data_sources:
  - Anti-virus
similarity_strategy:
  - sekoiaio.entity.uuid
  - crowdstrike.detect_id
event_fields:
  - field: crowdstrike.detect_description
    description: CrowdStrike description of the alert
  - field: process.command_line
    description: Process and related command line
  - field: host.name
    description: Related impacted computer
tags:
  - CrowdStrike Falcon
changelog:
  - date: 10/02/2026
    level: minor
    change: Update rule type to integration
  - date: 15/02/2024
    level: minor
    change: Effort level was adapted according to the observed hits for the rule.
