name: BlackNoise
slug: "blacknoise"
description: >-
  BlackNoise is a breach and attack simulation platform. It replays offensive techniques
  mapped to MITRE ATT&CK inside a customer network, then reports whether the defensive
  stack detected and responded to each one, so that detection coverage can be measured
  against real attacker behaviour.
