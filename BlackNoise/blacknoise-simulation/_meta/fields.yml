blacknoise.attack_vector.name:
  description: Name of the attack vector the simulation was launched from.
  name: blacknoise.attack_vector.name
  type: keyword

blacknoise.attack_vector.type:
  description: Nature of the attack vector, one of physical, virtual or simulation.
  name: blacknoise.attack_vector.type
  type: keyword

blacknoise.campaign_id:
  description: Identifier of the campaign the simulation belongs to. Groups every
    simulation run of an engagement.
  name: blacknoise.campaign_id
  type: keyword

blacknoise.cloud_domain_name:
  description: Domain name of the targeted cloud environment.
  name: blacknoise.cloud_domain_name
  type: keyword

blacknoise.detection_sources:
  description: Security products that reported the simulated attack.
  name: blacknoise.detection_sources
  type: array

blacknoise.detection_status:
  description: Whether the defensive stack saw the simulated attack, one of alerted,
    logged, undetected, unqualified or unexecuted.
  name: blacknoise.detection_status
  type: keyword

blacknoise.detection_time:
  description: Moment the simulated attack was detected. Combined with event.start
    it gives the time to detect.
  name: blacknoise.detection_time
  type: keyword

blacknoise.event_bn_id:
  description: Identifier of the simulated technique in the BlackNoise catalog.
  name: blacknoise.event_bn_id
  type: keyword

blacknoise.execution_id:
  description: Identifier of this run of the technique.
  name: blacknoise.execution_id
  type: keyword

blacknoise.execution_status:
  description: Lifecycle state of the run, one of waiting, in_progress, out_of_scope,
    error, canceled, unexecuted, executed, executed_warning or executed_without_secrets.
  name: blacknoise.execution_status
  type: keyword

blacknoise.exploit_status:
  description: Whether the target fell to the simulated attack, one of exploited,
    contained or not_applicable. Distinct from event.outcome, which only reports whether
    the simulation ran.
  name: blacknoise.exploit_status
  type: keyword

blacknoise.ip_targets:
  description: Addresses the simulation was aimed at.
  name: blacknoise.ip_targets
  type: array

blacknoise.reaction_sources:
  description: Security products that reacted to the simulated attack.
  name: blacknoise.reaction_sources
  type: array

blacknoise.reaction_time:
  description: Moment the simulated attack was reacted upon. Combined with event.start
    it gives the time to respond.
  name: blacknoise.reaction_time
  type: keyword

blacknoise.recommendations.sigma_rule:
  description: Sigma rule BlackNoise recommends to detect the simulated technique.
  name: blacknoise.recommendations.sigma_rule
  type: keyword

blacknoise.recommendations.suricata_rule:
  description: Suricata rule BlackNoise recommends to detect the simulated technique.
  name: blacknoise.recommendations.suricata_rule
  type: keyword

blacknoise.severity:
  description: Severity of the simulated technique as defined in the BlackNoise catalog,
    either low or high.
  name: blacknoise.severity
  type: keyword

blacknoise.simulation_event_id:
  description: Identifier of this simulation event record in BlackNoise.
  name: blacknoise.simulation_event_id
  type: keyword

blacknoise.simulation_id:
  description: Identifier of the simulation the run belongs to.
  name: blacknoise.simulation_id
  type: keyword

blacknoise.stop_time:
  description: Moment the run was stopped, when it did not reach its natural end.
  name: blacknoise.stop_time
  type: keyword

blacknoise.target_id:
  description: Identifier of the targeted asset in the BlackNoise inventory.
  name: blacknoise.target_id
  type: keyword

blacknoise.target_name:
  description: Name of the targeted asset, whether it is a system or a cloud environment.
  name: blacknoise.target_name
  type: keyword

blacknoise.time_offset_in_seconds:
  description: Delay applied to the run relative to the simulation schedule.
  name: blacknoise.time_offset_in_seconds
  type: long

blacknoise.time_to_detect_minutes:
  description: Whole minutes between the start of the simulation and its detection,
    the metric commonly reported as MTTD. Only present when the defensive stack raised
    an alert, and floored to the minute, so a detection under a minute reads as 0.
  name: blacknoise.time_to_detect_minutes
  type: long

blacknoise.time_to_respond_minutes:
  description: Whole minutes between the detection of the simulation and the reaction
    to it, the metric commonly reported as MTTR. Measured from the detection, not
    from the start of the simulation. Only present when the defensive stack raised
    an alert.
  name: blacknoise.time_to_respond_minutes
  type: long
