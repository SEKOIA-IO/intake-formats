name: BlackNoise Simulation
slug: blacknoise-simulation

description: >-
  BlackNoise reports one record per simulated technique: which ATT&CK tactic and techniques
  it covers, the asset it targeted, whether the target fell, and whether the defensive stack
  alerted on it, merely logged it, or missed it entirely. Records carry the detection and
  reaction timestamps needed to measure time to detect and time to respond, along with the
  Sigma and Suricata rules BlackNoise recommends to close a gap. Simulations also report the
  indicators of compromise they produce, one record per indicator, each tied back to the run
  that observed it.
data_sources:
  Application logs: BlackNoise reports the adversary simulations it executes, their outcome and whether the defensive stack detected them
