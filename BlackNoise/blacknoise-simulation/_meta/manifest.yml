name: BlackNoise Simulation
slug: blacknoise-simulation

description: >-
  BlackNoise reports one record per adversarial action it executes: which ATT&CK tactic and
  techniques it covers, the asset it targeted, whether the target was exposed, and whether the
  defensive stack alerted on it, merely logged it, or missed it entirely. Records carry the
  detection and reaction timestamps, and the durations derived from them, so that real MTTD and
  MTTR can be measured. They also carry the Sigma and Suricata rules BlackNoise recommends to
  close a gap, and the indicators of compromise each action produced, one record per indicator.
data_sources:
  Application logs: BlackNoise reports the adversary simulations it executes, their outcome and whether the defensive stack detected them
