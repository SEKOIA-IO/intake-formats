name: BlackNoise AEV
slug: blacknoise-aev

description: >-
  BlackNoise is an agentless Adversarial Exposure Validation (AEV) platform that safely executes
  real attack techniques across the information system, allowing each adversarial action to be
  correlated with the detections triggered. It enables security teams to measure and continuously
  improve their real MTTD and MTTR.
data_sources:
  Application logs: BlackNoise reports the adversarial actions it executes, whether they exposed the target, and whether the defensive stack detected them
