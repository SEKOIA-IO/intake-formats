destination.name:
  description: Hostname of the destination (target of the authentication attempt)
  name: destination.name
  type: keyword

silverfort.authentications:
  description: Number of authentications for daily statistics
  name: silverfort.authentications
  type: long

silverfort.city:
  description: City from which the authentication originated
  name: silverfort.city
  type: keyword

silverfort.coordinates:
  description: Geographic coordinates of the authentication source
  name: silverfort.coordinates
  type: keyword

silverfort.country:
  description: Country from which the authentication originated
  name: silverfort.country
  type: keyword

silverfort.data_type:
  description: Type of data contained in the event (e.g., DailyAuthStatistic)
  name: silverfort.data_type
  type: keyword

silverfort.destination_host:
  description: Target host of the authentication attempt
  name: silverfort.destination_host
  type: keyword

silverfort.mfa_response:
  description: Response from the MFA challenge
  name: silverfort.mfa_response
  type: keyword

silverfort.mfa_response_time:
  description: Time taken to respond to the MFA challenge
  name: silverfort.mfa_response_time
  type: keyword

silverfort.policy_action:
  description: Action taken by the policy
  name: silverfort.policy_action
  type: keyword

silverfort.policy_id:
  description: Unique identifier of the policy
  name: silverfort.policy_id
  type: keyword

silverfort.policy_name:
  description: Name of the policy that was applied
  name: silverfort.policy_name
  type: keyword

silverfort.request_id:
  description: Unique identifier for the authentication request
  name: silverfort.request_id
  type: keyword

silverfort.result:
  description: Result of the authentication attempt
  name: silverfort.result
  type: keyword

silverfort.risk:
  description: Risk level associated with the authentication attempt
  name: silverfort.risk
  type: keyword

silverfort.risk_indicators:
  description: Indicators that contributed to the risk assessment
  name: silverfort.risk_indicators
  type: keyword

silverfort.source_host:
  description: Host that initiated the connection
  name: silverfort.source_host
  type: keyword

silverfort.syslog_id:
  description: Syslog message identifier
  name: silverfort.syslog_id
  type: keyword
