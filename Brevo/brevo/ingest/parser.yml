name: brevo-audit-logs
ignored_values: []
pipeline:
  - name: parsed_event
    external:
      name: json.parse-json
      properties:
        input_field: '{{original.message}}'
        output_field: message
  - name: parsed_date
    external:
      name: date.parse
      properties:
        input_field: '{{parsed_event.message.date}}'
        output_field: timestamp
        format: null
        timezone: UTC
  - name: ecs_observer_mapping
  - name: ecs_event_mapping
  - name: ecs_user_agent_mapping
  - name: ecs_user_mapping
  - name: ecs_source_mapping
  - name: ecs_configuration_categorization
    filter: >-
      {{final.event.action.startswith('create') or
      final.event.action.startswith('delete') or
      final.event.action.startswith('edit') or
      final.event.action.startswith('change') or
      final.event.action.startswith('update') or
      final.event.action.startswith('set') or
      final.event.action.startswith('read') or
      final.event.action.startswith('open') or
      final.event.action.startswith('get')}}
  - name: ecs_authentication_categorization
    filter: >-
      {{'login' in final.event.action|lower or 'logon' in
      final.event.action|lower or 'authentication' in final.event.action|lower
      or 'logout' in final.event.action|lower or 'logoff' in
      final.event.action|lower}}
  - name: ecs_host_categorization
    filter: >-
      {{ not final.event.category is defined}}
  - name: ecs_outcome_categorization
    filter: >-
      {{final.event.type != 'info'}}
stages:
  ecs_observer_mapping:
    actions:
      - set:
          observer.type: email
          observer.vendor: Brevo
  ecs_event_mapping:
    actions:
      - set:
          '@timestamp': '{{parsed_date.timestamp}}'
          event.action: '{{parsed_event.message.action}}'
  ecs_user_agent_mapping:
    actions:
      - set:
          user_agent.original: '{{parsed_event.message.user_agent}}'
  ecs_user_mapping:
    actions:
      - set:
          user.email: '{{parsed_event.message.user_email}}'
  ecs_source_mapping:
    actions:
      - set:
          source.ip: '{{parsed_event.message.user_ip}}'
        filter: '{{parsed_event.message.user_ip|is_ipaddress}}'
  ecs_configuration_categorization:
    actions:
      - set:
          event.category: '{{(final.event.category|default([])) + [''configuration'']}}'
      - set:
          event.type: '{{(final.event.type|default([])) + [''creation'']}}'
        filter: >-
          {{'configuration' in final.event.category and not 'creation' in
          final.event.type and final.event.action.startswith('create')}}
      - set:
          event.type: '{{(final.event.type|default([])) + [''deletion'']}}'
        filter: >-
          {{'configuration' in final.event.category and not 'deletion' in
          final.event.type and final.event.action.startswith('delete')}}
      - set:
          event.type: '{{(final.event.type|default([])) + [''change'']}}'
        filter: >-
          {{'configuration' in final.event.category and not 'change' in
          final.event.type and (final.event.action.startswith('edit') or
          final.event.action.startswith('change') or
          final.event.action.startswith('update') or
          final.event.action.startswith('set'))}}
      - set:
          event.type: '{{(final.event.type|default([])) + [''access'']}}'
        filter: >-
          {{'configuration' in final.event.category and not 'access' in
          final.event.type and (final.event.action.startswith('read') or
          final.event.action.startswith('open') or
          final.event.action.startswith('get'))}}
      - set:
          event.type: '{{(final.event.type|default([])) + [''info'']}}'
        filter: >-
          {{'configuration' in final.event.category and not ('creation' in
          final.event.type or 'deletion' in final.event.type or 'change' in
          final.event.type or 'access' in final.event.type)}}
  ecs_authentication_categorization:
    actions:
      - set:
          event.category: '{{(final.event.category|default([])) + [''authentication'']}}'
        filter: ''
      - set:
          event.type: '{{(final.event.type|default([])) + [''end'']}}'
        filter: >-
          {{'end' not in final.event.type and 'authentication' in
          final.event.category and ('logout' in final.event.action|lower or 
          'logoff' in final.event.action|lower)}}
      - set:
          event.type: '{{(final.event.type|default([])) + [''start'']}}'
        filter: >-
          {{'start' not in final.event.type and 'authentication' in
          final.event.category and 'end' not in final.event.type and ('login' in
          final.event.action|lower or 'logon' in final.event.action|lower)}}
      - set:
          event.type: '{{(final.event.type|default([])) + [''info'']}}'
        filter: >-
          {{'info' not in final.event.type and 'authentication' in
          final.event.category and 'end' not in final.event.type and 'start' not
          in final.event.type}}
  ecs_host_categorization:
    actions:
      - set:
          event.type: info
          event.category: host
  ecs_outcome_categorization:
    actions:
      - set:
          event.outcome: failure
        filter: >-
          {{'fail' in final.event.action}}
      - set:
          event.outcome: success
        filter: >-
          {{not final.event.outcome is defined}}