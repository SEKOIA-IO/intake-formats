name: e-securemail
slug: e-securemail
description: >-
  e-securemail is the SECUSERVE email filtering service. It inspects inbound and outbound
  messages of a domain against spam, phishing, malware and content policies, then reports
  the verdict and the delivery of every recipient.
data_sources:
  Email gateway: e-securemail filters, classifies and delivers the messages of a protected domain.
  Anti-virus: e-securemail scans attachments with several antivirus engines.
