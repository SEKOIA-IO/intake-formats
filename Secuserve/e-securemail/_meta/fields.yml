secuserve.delivery.info:
  description: SMTP response of the recipient server
  name: secuserve.delivery.info
  type: keyword

secuserve.delivery.status:
  description: Delivery status towards the recipient server
  name: secuserve.delivery.status
  type: keyword

secuserve.filter.info:
  description: Raw filtering details, as a list of "RULE=score"
  name: secuserve.filter.info
  type: keyword

secuserve.filter.rules:
  description: Names of the antispam rules triggered by the message
  name: secuserve.filter.rules
  type: array

secuserve.helo_name:
  description: HELO/EHLO advertised by the sending server
  name: secuserve.helo_name
  type: keyword

secuserve.message_size:
  description: Size of the message, in bytes
  name: secuserve.message_size
  type: long

secuserve.qrcode:
  description: The message holds at least one part carrying a QR code
  name: secuserve.qrcode
  type: boolean

secuserve.verdict:
  description: Filtering verdict of the e-securemail engine
  name: secuserve.verdict
  type: keyword
