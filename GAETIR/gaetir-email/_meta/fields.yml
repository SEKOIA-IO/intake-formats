gaetir.action_status:
  description: succeeded, failed, suppressed, not_requested or unknown; refers to
    recorded primary action, not guaranteed completion of every Graph update.
  name: gaetir.action_status
  type: keyword

gaetir.actor_basis:
  description: Evidence basis for attributing the move. inferred_non_gaetir_folder_move
    does not verify a human actor.
  name: gaetir.actor_basis
  type: keyword

gaetir.actor_id:
  description: Verified actor identifier when supplied by the source; omitted when
    unknown. Current projection supplies no actor identifier.
  name: gaetir.actor_id
  type: keyword

gaetir.admin_ip_blacklist_hits:
  description: Source-reported administrator IP blacklist matches. Gated by indicator
    disclosure; a policy match alone is not proof of a threat.
  name: gaetir.admin_ip_blacklist_hits
  type: array

gaetir.alert_class:
  description: 'Derived exclusive alert class: threat_quarantined, threat_unconfirmed,
    inspection_quarantined, inspection_unconfirmed, action_failure, processing_failure,
    or none. Uses recorded actions, not independently verified remediation.'
  name: gaetir.alert_class
  type: keyword

gaetir.analysis_reused:
  description: Whether a previous analysis was reused.
  name: gaetir.analysis_reused
  type: boolean

gaetir.attachments_json:
  description: JSON-serialized attachment metadata records, preserving each attachment's
    name, extension, byte size, SHA-256 and scan verdict together. Sekoia may expose
    these as an array of JSON strings. Included only when attachment disclosure is
    enabled.
  name: gaetir.attachments_json
  type: keyword

gaetir.correlation_basis:
  description: Source basis used to correlate this feedback with a message; not proof
    of a matched prior decision.
  name: gaetir.correlation_basis
  type: keyword

gaetir.correlation_id:
  description: SHA-256 correlation of tenant, mailbox and Internet Message-ID or Graph
    ID. Not proof of anonymity; retries may have distinct event IDs.
  name: gaetir.correlation_id
  type: keyword

gaetir.customer:
  description: Configured customer name, when known.
  name: gaetir.customer
  type: keyword

gaetir.disclosure_json:
  description: JSON text of the six allowlisted source disclosure settings. Missing
    disclosure does not grant permission. Normalization cannot redact the original
    received message.
  name: gaetir.disclosure_json
  type: keyword

gaetir.emitted_time_invalid:
  description: True when emitted_utc is present but outside the supported timezone-bearing
    ISO date format or has invalid calendar/time components. Missing, null and blank
    values are not marked invalid.
  name: gaetir.emitted_time_invalid
  type: boolean

gaetir.emitted_utc:
  description: Original emission timestamp text, including malformed nonblank values
    for diagnosis. Consult gaetir.emitted_time_invalid; this is not receiver ingestion
    time.
  name: gaetir.emitted_utc
  type: keyword

gaetir.event_id:
  description: GAETIR source event identifier; distinct from the Sekoia-owned event.id.
    Retries may have distinct source event IDs.
  name: gaetir.event_id
  type: keyword

gaetir.event_type:
  description: 'Source event family: email_processing or email_feedback.'
  name: gaetir.event_type
  type: keyword

gaetir.feedback:
  description: Interpretation of the observed folder move; not a verified security
    verdict.
  name: gaetir.feedback
  type: keyword

gaetir.feedback_action:
  description: GAETIR feedback action recorded for this observation; does not identify
    the person who moved the message.
  name: gaetir.feedback_action
  type: keyword

gaetir.ground_truth_verified:
  description: Whether this feedback is verified ground truth. Current observed folder-move
    feedback sets this to false.
  name: gaetir.ground_truth_verified
  type: boolean

gaetir.instance_id:
  description: GAETIR runtime instance identifier, when known.
  name: gaetir.instance_id
  type: keyword

gaetir.intended_action:
  description: quarantine, leave_in_place, release_to_inbox or unknown.
  name: gaetir.intended_action
  type: keyword

gaetir.model_error:
  description: Whether the processing path recorded unavailable, failed or invalid
    model analysis.
  name: gaetir.model_error
  type: boolean

gaetir.network_message_id:
  description: Source network message identifier, when available. Retained for correlation;
    not the RFC Internet Message-ID.
  name: gaetir.network_message_id
  type: keyword

gaetir.original_verdict_changed:
  description: Whether this observation changes the original verdict. Current feedback
    sets this to false and preserves that decision.
  name: gaetir.original_verdict_changed
  type: boolean

gaetir.policy_version:
  description: Active policy version, when known.
  name: gaetir.policy_version
  type: keyword

gaetir.previously_processed_by_gaetir:
  description: Source indication of prior GAETIR processing. True and false are distinct;
    omitted when the source value is unknown.
  name: gaetir.previously_processed_by_gaetir
  type: boolean

gaetir.processing_status:
  description: completed or failed for this processing attempt; completed may still
    carry model_error=true.
  name: gaetir.processing_status
  type: keyword

gaetir.qr_codes:
  description: Decoded QR payload strings, gated by indicator disclosure. They can
    contain non-URL text; no automatic URL or threat indicator promotion.
  name: gaetir.qr_codes
  type: array

gaetir.reason_codes:
  description: Allowlisted final override code if recorded; empty when absent. Not
    all historical overrides can be reconstructed.
  name: gaetir.reason_codes
  type: array

gaetir.received_time_invalid:
  description: True when received_utc is present but outside the supported timezone-bearing
    ISO date format or has invalid calendar/time components. Missing, null and blank
    values are not marked invalid.
  name: gaetir.received_time_invalid
  type: boolean

gaetir.recovery_action_status:
  description: succeeded, failed or not_requested for recorded recovery action.
  name: gaetir.recovery_action_status
  type: keyword

gaetir.release_contract_id:
  description: Release contract identity, when known.
  name: gaetir.release_contract_id
  type: keyword

gaetir.release_id:
  description: Runtime release identifier, when known.
  name: gaetir.release_id
  type: keyword

gaetir.schema:
  description: 'Source contract: gaetir.decision.v2 or gaetir.feedback.v1.'
  name: gaetir.schema
  type: keyword

gaetir.sender:
  description: Source display-form sender string. Requires address disclosure; not
    an authenticated identity.
  name: gaetir.sender
  type: keyword

gaetir.sender_domain:
  description: Source-reported sender domain. Requires address disclosure; not proof
    of domain ownership or sender authentication.
  name: gaetir.sender_domain
  type: keyword

gaetir.source_folder:
  description: 'Observed source folder category: inbox, gaetir, or unknown.'
  name: gaetir.source_folder
  type: keyword

gaetir.source_ips:
  description: Source-reported IP strings, gated by indicator disclosure. Only syntactically
    valid values are additionally placed in related.ip; these are not necessarily
    the SMTP connection peer.
  name: gaetir.source_ips
  type: array

gaetir.source_network_indicators:
  description: Source-reported network indicators, gated by indicator disclosure.
    Values may be networks or other strings; not automatically threat intelligence
    or source.ip.
  name: gaetir.source_network_indicators
  type: array

gaetir.source_time_invalid:
  description: True when utc is present but outside the supported timezone-bearing
    ISO date format or has invalid calendar/time components. Missing, null and blank
    values are not marked invalid.
  name: gaetir.source_time_invalid
  type: boolean

gaetir.target_folder:
  description: 'Observed destination folder category: inbox or gaetir.'
  name: gaetir.target_folder
  type: keyword

gaetir.tenant_id:
  description: Tenant identifier, when known. Not controlled by address disclosure.
  name: gaetir.tenant_id
  type: keyword

gaetir.time_basis:
  description: Meaning of the source timestamp. feedback_observed_at identifies when
    the mailbox feedback was observed.
  name: gaetir.time_basis
  type: keyword

gaetir.timestamp_basis:
  description: 'Selected timing basis: valid source_utc, valid emitted_utc_fallback,
    or receiver_default when neither is usable. Missing and invalid timestamps remain
    distinguishable through the invalid flags.'
  name: gaetir.timestamp_basis
  type: keyword

gaetir.verdict:
  description: Final available classification, null when no decision was reached.
    A benign value with model_error=true does not prove a successful analysis.
  name: gaetir.verdict
  type: keyword
