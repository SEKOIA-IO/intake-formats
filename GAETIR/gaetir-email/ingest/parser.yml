name: gaetir
ignored_values: []
pipeline:
  - name: parsed_event
    external:
      name: json.parse-json
  - name: parsed_time
    filter:
      "{{ parsed_event.message.get('schema') in ['gaetir.decision.v2', 'gaetir.feedback.v1'] and ((parsed_event.message.get('utc')
      is string and ((parsed_event.message.get('utc') | trim) | re_match('^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'))
      and ((parsed_event.message.get('utc') | trim)[0:4] | int) > 0 and ((parsed_event.message.get('utc') | trim)[8:10]
      | int) <= (29 if ((parsed_event.message.get('utc') | trim)[5:7] | int) == 2 and (((parsed_event.message.get('utc')
      | trim)[0:4] | int) % 4 == 0 and (((parsed_event.message.get('utc') | trim)[0:4] | int) % 100 != 0 or ((parsed_event.message.get('utc')
      | trim)[0:4] | int) % 400 == 0)) else (28 if ((parsed_event.message.get('utc') | trim)[5:7] | int) == 2 else (30 if
      ((parsed_event.message.get('utc') | trim)[5:7] | int) in [4, 6, 9, 11] else 31)))) or (parsed_event.message.get('emitted_utc')
      is string and ((parsed_event.message.get('emitted_utc') | trim) | re_match('^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'))
      and ((parsed_event.message.get('emitted_utc') | trim)[0:4] | int) > 0 and ((parsed_event.message.get('emitted_utc')
      | trim)[8:10] | int) <= (29 if ((parsed_event.message.get('emitted_utc') | trim)[5:7] | int) == 2 and (((parsed_event.message.get('emitted_utc')
      | trim)[0:4] | int) % 4 == 0 and (((parsed_event.message.get('emitted_utc') | trim)[0:4] | int) % 100 != 0 or ((parsed_event.message.get('emitted_utc')
      | trim)[0:4] | int) % 400 == 0)) else (28 if ((parsed_event.message.get('emitted_utc') | trim)[5:7] | int) == 2 else
      (30 if ((parsed_event.message.get('emitted_utc') | trim)[5:7] | int) in [4, 6, 9, 11] else 31))))) }}"
    external:
      name: date.parse
      properties:
        input_field:
          "{{ (parsed_event.message.get('utc') if (parsed_event.message.get('utc') is string and ((parsed_event.message.get('utc')
          | trim) | re_match('^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'))
          and ((parsed_event.message.get('utc') | trim)[0:4] | int) > 0 and ((parsed_event.message.get('utc') | trim)[8:10]
          | int) <= (29 if ((parsed_event.message.get('utc') | trim)[5:7] | int) == 2 and (((parsed_event.message.get('utc')
          | trim)[0:4] | int) % 4 == 0 and (((parsed_event.message.get('utc') | trim)[0:4] | int) % 100 != 0 or ((parsed_event.message.get('utc')
          | trim)[0:4] | int) % 400 == 0)) else (28 if ((parsed_event.message.get('utc') | trim)[5:7] | int) == 2 else (30
          if ((parsed_event.message.get('utc') | trim)[5:7] | int) in [4, 6, 9, 11] else 31)))) else parsed_event.message.get('emitted_utc'))
          | trim }}"
        output_field: datetime
        timezone: UTC
  - name: decision_fields
    filter: "{{ parsed_event.message.get('schema') == 'gaetir.decision.v2' }}"
  - name: feedback_fields
    filter: "{{ parsed_event.message.get('schema') == 'gaetir.feedback.v1' }}"
  - name: time_fields
    filter: "{{ parsed_event.message.get('schema') in ['gaetir.decision.v2', 'gaetir.feedback.v1'] }}"
  - name: additional_fields
    filter: "{{ parsed_event.message.get('schema') in ['gaetir.decision.v2', 'gaetir.feedback.v1'] }}"
  - name: alert_classification
    filter: "{{ parsed_event.message.get('schema') in ['gaetir.decision.v2', 'gaetir.feedback.v1'] }}"
stages:
  decision_fields:
    actions:
      - set:
          event.module: gaetir
          event.provider: GAETIR
          event.dataset: gaetir.decision
          event.action: email_processing
          event.category:
            - email
          event.type:
            - info
          observer.vendor: Gaetir
          observer.product: GAETIR
          email.local_id: "{{ parsed_event.message.message_id }}"
          email.message_id: "{{ parsed_event.message.internet_message_id }}"
          gaetir.schema: "{{ parsed_event.message.schema }}"
          gaetir.event_type: "{{ parsed_event.message.event_type }}"
          gaetir.event_id: "{{ parsed_event.message.event_id }}"
          gaetir.correlation_id: "{{ parsed_event.message.correlation_id }}"
          gaetir.tenant_id: "{{ parsed_event.message.tenant_id }}"
          gaetir.customer: "{{ parsed_event.message.customer }}"
          gaetir.instance_id: "{{ parsed_event.message.instance_id }}"
          gaetir.release_id: "{{ parsed_event.message.release_id }}"
          gaetir.release_contract_id: "{{ parsed_event.message.release_contract_id }}"
          gaetir.policy_version: "{{ parsed_event.message.policy_version }}"
          gaetir.verdict: "{{ parsed_event.message.verdict }}"
          gaetir.processing_status: "{{ parsed_event.message.processing_status }}"
          gaetir.analysis_reused: "{{ parsed_event.message.analysis_reused }}"
          gaetir.model_error: "{{ parsed_event.message.model_error }}"
          gaetir.reason_codes: "{{ parsed_event.message.reason_codes }}"
          gaetir.intended_action: "{{ parsed_event.message.intended_action }}"
          gaetir.action_status: "{{ parsed_event.message.action_status }}"
          gaetir.recovery_action_status: "{{ parsed_event.message.recovery_action_status }}"
      - set:
          destination.user.email: "{{ parsed_event.message.get('recipient_address') }}"
        filter:
          "{{ parsed_event.message.get('disclosure') is mapping and parsed_event.message.get('disclosure').get('include_addresses')
          is sameas true and (parsed_event.message.get('recipient_address') is string and (parsed_event.message.get('recipient_address')
          | trim) != '') }}"
      - set:
          email.from.address: "{{ [parsed_event.message.get('sender_address')] }}"
        filter:
          "{{ parsed_event.message.get('disclosure') is mapping and parsed_event.message.get('disclosure').get('include_addresses')
          is sameas true and (parsed_event.message.get('sender_address') is string and (parsed_event.message.get('sender_address')
          | trim) != '') }}"
      - set:
          email.subject: "{{ parsed_event.message.get('subject') }}"
        filter:
          "{{ parsed_event.message.get('disclosure') is mapping and parsed_event.message.get('disclosure').get('include_subject')
          is sameas true and (parsed_event.message.get('subject') is string and (parsed_event.message.get('subject') | trim)
          != '') }}"
      - set:
          event.reason: "{{ parsed_event.message.get('explanation') }}"
        filter:
          "{{ parsed_event.message.get('disclosure') is mapping and parsed_event.message.get('disclosure').get('include_explanation')
          is sameas true and (parsed_event.message.get('explanation') is string and (parsed_event.message.get('explanation')
          | trim) != '') }}"
  feedback_fields:
    actions:
      - set:
          event.module: gaetir
          event.provider: GAETIR
          event.dataset: gaetir.feedback
          event.action: email_feedback_observed
          event.category:
            - email
          event.type:
            - info
          observer.vendor: Gaetir
          observer.product: GAETIR
          gaetir.schema: "{{ parsed_event.message.schema }}"
          gaetir.event_type: "{{ parsed_event.message.event_type }}"
          gaetir.event_id: "{{ parsed_event.message.event_id }}"
          gaetir.correlation_id: "{{ parsed_event.message.correlation_id }}"
          gaetir.tenant_id: "{{ parsed_event.message.tenant_id }}"
          gaetir.customer: "{{ parsed_event.message.customer }}"
          gaetir.instance_id: "{{ parsed_event.message.instance_id }}"
          gaetir.release_id: "{{ parsed_event.message.release_id }}"
          gaetir.release_contract_id: "{{ parsed_event.message.release_contract_id }}"
          gaetir.policy_version: "{{ parsed_event.message.policy_version }}"
          gaetir.correlation_basis: "{{ parsed_event.message.correlation_basis }}"
          gaetir.time_basis: "{{ parsed_event.message.time_basis }}"
          gaetir.source_folder: "{{ parsed_event.message.source_folder }}"
          gaetir.target_folder: "{{ parsed_event.message.target_folder }}"
          gaetir.feedback: "{{ parsed_event.message.feedback }}"
          gaetir.feedback_action: "{{ parsed_event.message.feedback_action }}"
          gaetir.actor_basis: "{{ parsed_event.message.actor_basis }}"
          gaetir.ground_truth_verified: "{{ parsed_event.message.ground_truth_verified }}"
          gaetir.original_verdict_changed: "{{ parsed_event.message.original_verdict_changed }}"
      - set:
          email.local_id: "{{ parsed_event.message.message_id }}"
        filter: "{{ parsed_event.message.message_id != None }}"
      - set:
          email.message_id: "{{ parsed_event.message.internet_message_id }}"
        filter: "{{ parsed_event.message.internet_message_id != None }}"
      - set:
          gaetir.actor_id: "{{ parsed_event.message.actor_id }}"
        filter: "{{ parsed_event.message.actor_id != None }}"
      - set:
          gaetir.previously_processed_by_gaetir: "{{ parsed_event.message.previously_processed_by_gaetir }}"
        filter: "{{ parsed_event.message.previously_processed_by_gaetir != None }}"
      - set:
          destination.user.email: "{{ parsed_event.message.get('recipient_address') }}"
        filter:
          "{{ parsed_event.message.get('disclosure') is mapping and parsed_event.message.get('disclosure').get('include_addresses')
          is sameas true and (parsed_event.message.get('recipient_address') is string and (parsed_event.message.get('recipient_address')
          | trim) != '') }}"
      - set:
          email.from.address: "{{ [parsed_event.message.get('sender_address')] }}"
        filter:
          "{{ parsed_event.message.get('disclosure') is mapping and parsed_event.message.get('disclosure').get('include_addresses')
          is sameas true and (parsed_event.message.get('sender_address') is string and (parsed_event.message.get('sender_address')
          | trim) != '') }}"
      - set:
          event.reason: "{{ parsed_event.message.get('explanation') }}"
        filter:
          "{{ parsed_event.message.get('disclosure') is mapping and parsed_event.message.get('disclosure').get('include_explanation')
          is sameas true and (parsed_event.message.get('explanation') is string and (parsed_event.message.get('explanation')
          | trim) != '') }}"
  time_fields:
    actions:
      - set:
          gaetir.timestamp_basis:
            "{{ 'source_utc' if (parsed_event.message.get('utc') is string and ((parsed_event.message.get('utc')
            | trim) | re_match('^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'))
            and ((parsed_event.message.get('utc') | trim)[0:4] | int) > 0 and ((parsed_event.message.get('utc') | trim)[8:10]
            | int) <= (29 if ((parsed_event.message.get('utc') | trim)[5:7] | int) == 2 and (((parsed_event.message.get('utc')
            | trim)[0:4] | int) % 4 == 0 and (((parsed_event.message.get('utc') | trim)[0:4] | int) % 100 != 0 or ((parsed_event.message.get('utc')
            | trim)[0:4] | int) % 400 == 0)) else (28 if ((parsed_event.message.get('utc') | trim)[5:7] | int) == 2 else (30
            if ((parsed_event.message.get('utc') | trim)[5:7] | int) in [4, 6, 9, 11] else 31)))) else ('emitted_utc_fallback'
            if (parsed_event.message.get('emitted_utc') is string and ((parsed_event.message.get('emitted_utc') | trim)
            | re_match('^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'))
            and ((parsed_event.message.get('emitted_utc') | trim)[0:4] | int) > 0 and ((parsed_event.message.get('emitted_utc')
            | trim)[8:10] | int) <= (29 if ((parsed_event.message.get('emitted_utc') | trim)[5:7] | int) == 2 and (((parsed_event.message.get('emitted_utc')
            | trim)[0:4] | int) % 4 == 0 and (((parsed_event.message.get('emitted_utc') | trim)[0:4] | int) % 100 != 0 or
            ((parsed_event.message.get('emitted_utc') | trim)[0:4] | int) % 400 == 0)) else (28 if ((parsed_event.message.get('emitted_utc')
            | trim)[5:7] | int) == 2 else (30 if ((parsed_event.message.get('emitted_utc') | trim)[5:7] | int) in [4, 6, 9,
            11] else 31)))) else 'receiver_default') }}"
          gaetir.source_time_invalid:
            "{{ (parsed_event.message.get('utc') is not none and (parsed_event.message.get('utc')
            is not string or (parsed_event.message.get('utc') | trim) != '')) and not (parsed_event.message.get('utc')
            is string and ((parsed_event.message.get('utc') | trim) | re_match('^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'))
            and ((parsed_event.message.get('utc') | trim)[0:4] | int) > 0 and ((parsed_event.message.get('utc') | trim)[8:10]
            | int) <= (29 if ((parsed_event.message.get('utc') | trim)[5:7] | int) == 2 and (((parsed_event.message.get('utc')
            | trim)[0:4] | int) % 4 == 0 and (((parsed_event.message.get('utc') | trim)[0:4] | int) % 100 != 0 or ((parsed_event.message.get('utc')
            | trim)[0:4] | int) % 400 == 0)) else (28 if ((parsed_event.message.get('utc') | trim)[5:7] | int) == 2 else (30
            if ((parsed_event.message.get('utc') | trim)[5:7] | int) in [4, 6, 9, 11] else 31)))) }}"
          gaetir.emitted_time_invalid:
            "{{ (parsed_event.message.get('emitted_utc') is not none and (parsed_event.message.get('emitted_utc')
            is not string or (parsed_event.message.get('emitted_utc') | trim) != '')) and not (parsed_event.message.get('emitted_utc')
            is string and ((parsed_event.message.get('emitted_utc') | trim) | re_match('^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'))
            and ((parsed_event.message.get('emitted_utc') | trim)[0:4] | int) > 0 and ((parsed_event.message.get('emitted_utc')
            | trim)[8:10] | int) <= (29 if ((parsed_event.message.get('emitted_utc') | trim)[5:7] | int) == 2 and (((parsed_event.message.get('emitted_utc')
            | trim)[0:4] | int) % 4 == 0 and (((parsed_event.message.get('emitted_utc') | trim)[0:4] | int) % 100 != 0 or
            ((parsed_event.message.get('emitted_utc') | trim)[0:4] | int) % 400 == 0)) else (28 if ((parsed_event.message.get('emitted_utc')
            | trim)[5:7] | int) == 2 else (30 if ((parsed_event.message.get('emitted_utc') | trim)[5:7] | int) in [4, 6, 9,
            11] else 31)))) }}"
          gaetir.received_time_invalid:
            "{{ (parsed_event.message.get('received_utc') is not none and (parsed_event.message.get('received_utc')
            is not string or (parsed_event.message.get('received_utc') | trim) != '')) and not (parsed_event.message.get('received_utc')
            is string and ((parsed_event.message.get('received_utc') | trim) | re_match('^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'))
            and ((parsed_event.message.get('received_utc') | trim)[0:4] | int) > 0 and ((parsed_event.message.get('received_utc')
            | trim)[8:10] | int) <= (29 if ((parsed_event.message.get('received_utc') | trim)[5:7] | int) == 2 and (((parsed_event.message.get('received_utc')
            | trim)[0:4] | int) % 4 == 0 and (((parsed_event.message.get('received_utc') | trim)[0:4] | int) % 100 != 0 or
            ((parsed_event.message.get('received_utc') | trim)[0:4] | int) % 400 == 0)) else (28 if ((parsed_event.message.get('received_utc')
            | trim)[5:7] | int) == 2 else (30 if ((parsed_event.message.get('received_utc') | trim)[5:7] | int) in [4, 6,
            9, 11] else 31)))) }}"
      - set:
          "@timestamp": "{{ parsed_time.datetime }}"
        filter:
          "{{ ((parsed_event.message.get('utc') is string and ((parsed_event.message.get('utc') | trim) | re_match('^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'))
          and ((parsed_event.message.get('utc') | trim)[0:4] | int) > 0 and ((parsed_event.message.get('utc') | trim)[8:10]
          | int) <= (29 if ((parsed_event.message.get('utc') | trim)[5:7] | int) == 2 and (((parsed_event.message.get('utc')
          | trim)[0:4] | int) % 4 == 0 and (((parsed_event.message.get('utc') | trim)[0:4] | int) % 100 != 0 or ((parsed_event.message.get('utc')
          | trim)[0:4] | int) % 400 == 0)) else (28 if ((parsed_event.message.get('utc') | trim)[5:7] | int) == 2 else (30
          if ((parsed_event.message.get('utc') | trim)[5:7] | int) in [4, 6, 9, 11] else 31)))) or (parsed_event.message.get('emitted_utc')
          is string and ((parsed_event.message.get('emitted_utc') | trim) | re_match('^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'))
          and ((parsed_event.message.get('emitted_utc') | trim)[0:4] | int) > 0 and ((parsed_event.message.get('emitted_utc')
          | trim)[8:10] | int) <= (29 if ((parsed_event.message.get('emitted_utc') | trim)[5:7] | int) == 2 and (((parsed_event.message.get('emitted_utc')
          | trim)[0:4] | int) % 4 == 0 and (((parsed_event.message.get('emitted_utc') | trim)[0:4] | int) % 100 != 0 or ((parsed_event.message.get('emitted_utc')
          | trim)[0:4] | int) % 400 == 0)) else (28 if ((parsed_event.message.get('emitted_utc') | trim)[5:7] | int) == 2
          else (30 if ((parsed_event.message.get('emitted_utc') | trim)[5:7] | int) in [4, 6, 9, 11] else 31))))) }}"
      - set:
          event.start: "{{ parsed_time.datetime }}"
        filter:
          "{{ parsed_event.message.get('schema') == 'gaetir.decision.v2' and (parsed_event.message.get('utc') is
          string and ((parsed_event.message.get('utc') | trim) | re_match('^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'))
          and ((parsed_event.message.get('utc') | trim)[0:4] | int) > 0 and ((parsed_event.message.get('utc') | trim)[8:10]
          | int) <= (29 if ((parsed_event.message.get('utc') | trim)[5:7] | int) == 2 and (((parsed_event.message.get('utc')
          | trim)[0:4] | int) % 4 == 0 and (((parsed_event.message.get('utc') | trim)[0:4] | int) % 100 != 0 or ((parsed_event.message.get('utc')
          | trim)[0:4] | int) % 400 == 0)) else (28 if ((parsed_event.message.get('utc') | trim)[5:7] | int) == 2 else (30
          if ((parsed_event.message.get('utc') | trim)[5:7] | int) in [4, 6, 9, 11] else 31)))) }}"
      - set:
          gaetir.emitted_utc: "{{ parsed_event.message.get('emitted_utc') }}"
        filter:
          "{{ (parsed_event.message.get('emitted_utc') is string and (parsed_event.message.get('emitted_utc') | trim)
          != '') }}"
      - set:
          email.delivery_timestamp: "{{ parsed_event.message.get('received_utc') | trim }}"
        filter:
          "{{ (parsed_event.message.get('received_utc') is string and ((parsed_event.message.get('received_utc') |
          trim) | re_match('^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'))
          and ((parsed_event.message.get('received_utc') | trim)[0:4] | int) > 0 and ((parsed_event.message.get('received_utc')
          | trim)[8:10] | int) <= (29 if ((parsed_event.message.get('received_utc') | trim)[5:7] | int) == 2 and (((parsed_event.message.get('received_utc')
          | trim)[0:4] | int) % 4 == 0 and (((parsed_event.message.get('received_utc') | trim)[0:4] | int) % 100 != 0 or ((parsed_event.message.get('received_utc')
          | trim)[0:4] | int) % 400 == 0)) else (28 if ((parsed_event.message.get('received_utc') | trim)[5:7] | int) == 2
          else (30 if ((parsed_event.message.get('received_utc') | trim)[5:7] | int) in [4, 6, 9, 11] else 31)))) }}"
  additional_fields:
    actions:
      - set:
          gaetir.network_message_id: "{{ parsed_event.message.get('network_message_id') }}"
        filter:
          "{{ (parsed_event.message.get('network_message_id') is string and (parsed_event.message.get('network_message_id')
          | trim) != '') }}"
      - set:
          gaetir.sender: "{{ parsed_event.message.get('sender') }}"
        filter:
          "{{ (parsed_event.message.get('disclosure') is mapping and parsed_event.message.get('disclosure').get('include_addresses')
          is sameas true) and (parsed_event.message.get('sender') is string and (parsed_event.message.get('sender') | trim)
          != '') }}"
      - set:
          gaetir.sender_domain: "{{ parsed_event.message.get('sender_domain') }}"
        filter:
          "{{ (parsed_event.message.get('disclosure') is mapping and parsed_event.message.get('disclosure').get('include_addresses')
          is sameas true) and (parsed_event.message.get('sender_domain') is string and (parsed_event.message.get('sender_domain')
          | trim) != '') }}"
      - set:
          error.type: "{{ parsed_event.message.get('error_type') }}"
        filter:
          "{{ parsed_event.message.get('schema') == 'gaetir.decision.v2' and (parsed_event.message.get('error_type')
          is string and (parsed_event.message.get('error_type') | trim) != '') }}"
      - set:
          gaetir.source_ips:
            "{{ parsed_event.message.get('source_ips') | select('string') | map('trim') | reject('equalto',
            '') | list }}"
        filter:
          "{{ (parsed_event.message.get('disclosure') is mapping and parsed_event.message.get('disclosure').get('include_indicators')
          is sameas true) and (parsed_event.message.get('source_ips') is sequence and parsed_event.message.get('source_ips')
          is not string and parsed_event.message.get('source_ips') is not mapping) }}"
      - set:
          gaetir.source_network_indicators:
            "{{ parsed_event.message.get('source_network_indicators') | select('string')
            | map('trim') | reject('equalto', '') | list }}"
        filter:
          "{{ (parsed_event.message.get('disclosure') is mapping and parsed_event.message.get('disclosure').get('include_indicators')
          is sameas true) and (parsed_event.message.get('source_network_indicators') is sequence and parsed_event.message.get('source_network_indicators')
          is not string and parsed_event.message.get('source_network_indicators') is not mapping) }}"
      - set:
          gaetir.admin_ip_blacklist_hits:
            "{{ parsed_event.message.get('admin_ip_blacklist_hits') | select('string') | map('trim')
            | reject('equalto', '') | list }}"
        filter:
          "{{ (parsed_event.message.get('disclosure') is mapping and parsed_event.message.get('disclosure').get('include_indicators')
          is sameas true) and (parsed_event.message.get('admin_ip_blacklist_hits') is sequence and parsed_event.message.get('admin_ip_blacklist_hits')
          is not string and parsed_event.message.get('admin_ip_blacklist_hits') is not mapping) }}"
      - set:
          gaetir.qr_codes:
            "{{ parsed_event.message.get('qr_codes') | select('string') | map('trim') | reject('equalto',
            '') | list }}"
        filter:
          "{{ (parsed_event.message.get('disclosure') is mapping and parsed_event.message.get('disclosure').get('include_indicators')
          is sameas true) and (parsed_event.message.get('qr_codes') is sequence and parsed_event.message.get('qr_codes')
          is not string and parsed_event.message.get('qr_codes') is not mapping) }}"
      - set:
          related.ip:
            "[{% for ip in (((parsed_event.message.get('source_ips') if (parsed_event.message.get('source_ips')
            is sequence and parsed_event.message.get('source_ips') is not string and parsed_event.message.get('source_ips')
            is not mapping) else []) + (parsed_event.message.get('admin_ip_blacklist_hits') if (parsed_event.message.get('admin_ip_blacklist_hits')
            is sequence and parsed_event.message.get('admin_ip_blacklist_hits') is not string and parsed_event.message.get('admin_ip_blacklist_hits')
            is not mapping) else [])) | select('string') | map('trim') | unique | list) if ip | is_ipaddress %}{{ ip | to_json
            }}{% if not loop.last %},{% endif %}{% endfor %}]"
        filter:
          "{{ (parsed_event.message.get('disclosure') is mapping and parsed_event.message.get('disclosure').get('include_indicators')
          is sameas true) and ((parsed_event.message.get('source_ips') is sequence and parsed_event.message.get('source_ips')
          is not string and parsed_event.message.get('source_ips') is not mapping) or (parsed_event.message.get('admin_ip_blacklist_hits')
          is sequence and parsed_event.message.get('admin_ip_blacklist_hits') is not string and parsed_event.message.get('admin_ip_blacklist_hits')
          is not mapping)) }}"
      - set:
          gaetir.attachments_json:
            "{{ parsed_event.message.get('attachments') | select('mapping') | map('to_json') |
            list }}"
        filter:
          "{{ ((parsed_event.message.get('disclosure') is mapping and parsed_event.message.get('disclosure').get('include_attachments')
          is sameas true) and (parsed_event.message.get('attachments') is sequence and parsed_event.message.get('attachments')
          is not string and parsed_event.message.get('attachments') is not mapping)) and ((parsed_event.message.get('attachments')
          | select('mapping') | map('dictsort') | sum(start=[]) | map('first') | reject('in', ['name', 'ext', 'size_bytes',
          'sha256', 'scan_verdict']) | list | length) == 0) }}"
      - set:
          gaetir.disclosure_json:
            "{{ {'include_addresses': parsed_event.message.get('disclosure').get('include_addresses'),
            'include_subject': parsed_event.message.get('disclosure').get('include_subject'), 'include_explanation':
            parsed_event.message.get('disclosure').get('include_explanation'), 'include_indicators': parsed_event.message.get('disclosure').get('include_indicators'),
            'include_attachments': parsed_event.message.get('disclosure').get('include_attachments'), 'event_coverage':
            parsed_event.message.get('disclosure').get('event_coverage')} | to_json }}"
        filter: "{{ parsed_event.message.get('disclosure') is mapping }}"
  alert_classification:
    actions:
      - set:
          gaetir.alert_class:
            "{{ (('threat_quarantined' if (parsed_event.message.get('intended_action') == 'quarantine'
            and parsed_event.message.get('action_status') == 'succeeded') else 'threat_unconfirmed') if (((parsed_event.message.get('reason_codes')
            is sequence and parsed_event.message.get('reason_codes') is not string and parsed_event.message.get('reason_codes')
            is not mapping) and ('malware_detected' in parsed_event.message.get('reason_codes') or 'pdf_threat_rule' in
            parsed_event.message.get('reason_codes') or 'office_threat_rule' in parsed_event.message.get('reason_codes')
            or 'deceptive_link_rule' in parsed_event.message.get('reason_codes'))) or (parsed_event.message.get('verdict')
            == 'phishing' and not ((parsed_event.message.get('reason_codes') is sequence and parsed_event.message.get('reason_codes')
            is not string and parsed_event.message.get('reason_codes') is not mapping) and 'pdf_inspection_incomplete' in
            parsed_event.message.get('reason_codes')))) else (('inspection_quarantined' if (parsed_event.message.get('intended_action')
            == 'quarantine' and parsed_event.message.get('action_status') == 'succeeded') else 'inspection_unconfirmed')
            if ((parsed_event.message.get('reason_codes') is sequence and parsed_event.message.get('reason_codes') is not
            string and parsed_event.message.get('reason_codes') is not mapping) and 'pdf_inspection_incomplete' in parsed_event.message.get('reason_codes'))
            else ('action_failure' if (parsed_event.message.get('action_status') == 'failed' or parsed_event.message.get('recovery_action_status')
            == 'failed') else ('processing_failure' if (parsed_event.message.get('processing_status') == 'failed' or
            parsed_event.message.get('model_error') is sameas true) else 'none')))) if parsed_event.message.get('schema')
            == 'gaetir.decision.v2' else 'none' }}"
      - set:
          event.kind: alert
        filter:
          "{{ (parsed_event.message.get('schema') == 'gaetir.decision.v2' and (((parsed_event.message.get('reason_codes')
          is sequence and parsed_event.message.get('reason_codes') is not string and parsed_event.message.get('reason_codes')
          is not mapping) and ('malware_detected' in parsed_event.message.get('reason_codes') or 'pdf_threat_rule' in
          parsed_event.message.get('reason_codes') or 'office_threat_rule' in parsed_event.message.get('reason_codes')
          or 'deceptive_link_rule' in parsed_event.message.get('reason_codes'))) or (parsed_event.message.get('verdict')
          == 'phishing' and not ((parsed_event.message.get('reason_codes') is sequence and parsed_event.message.get('reason_codes')
          is not string and parsed_event.message.get('reason_codes') is not mapping) and 'pdf_inspection_incomplete' in
          parsed_event.message.get('reason_codes'))))) or (parsed_event.message.get('schema') == 'gaetir.decision.v2'
          and (((parsed_event.message.get('reason_codes') is sequence and parsed_event.message.get('reason_codes') is not
          string and parsed_event.message.get('reason_codes') is not mapping) and 'pdf_inspection_incomplete' in parsed_event.message.get('reason_codes'))
          or parsed_event.message.get('action_status') == 'failed' or parsed_event.message.get('recovery_action_status')
          == 'failed' or parsed_event.message.get('processing_status') == 'failed' or parsed_event.message.get('model_error')
          is sameas true)) }}"
