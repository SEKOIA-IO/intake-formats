action.properties.__policy_id_tag:
  description: Policy tag identifier attached by the firewall policy engine.
  name: action.properties.__policy_id_tag
  type: keyword

action.properties.community:
  description: VPN community name associated with the connection.
  name: action.properties.community
  type: keyword

action.properties.destination_key_id:
  description: Key identifier used for destination-side encryption context.
  name: action.properties.destination_key_id
  type: keyword

action.properties.encryption_methods:
  description: Encryption methods negotiated or applied to the session.
  name: action.properties.encryption_methods
  type: keyword

action.properties.encryption_scheme:
  description: Encryption scheme negotiated for the connection.
  name: action.properties.encryption_scheme
  type: keyword

action.properties.flags:
  description: Vendor-specific connection or packet processing flags.
  name: action.properties.flags
  type: keyword

action.properties.icmp_code:
  description: ICMP code observed for ICMP network traffic.
  name: action.properties.icmp_code
  type: keyword

action.properties.icmp_message:
  description: ICMP message text reported by Check Point.
  name: action.properties.icmp_message
  type: keyword

action.properties.icmp_type:
  description: ICMP type observed for ICMP network traffic.
  name: action.properties.icmp_type
  type: keyword

action.properties.ike_ids:
  description: IKE identity values exchanged during VPN negotiation.
  name: action.properties.ike_ids
  type: keyword

action.properties.ike_initiator_cookie:
  description: IKE initiator cookie associated with the VPN session.
  name: action.properties.ike_initiator_cookie
  type: keyword

action.properties.ike_mode:
  description: IKE mode used during VPN negotiation.
  name: action.properties.ike_mode
  type: keyword

action.properties.ike_responder_cookie:
  description: IKE responder cookie associated with the VPN session.
  name: action.properties.ike_responder_cookie
  type: keyword

action.properties.loguid:
  description: Unique Check Point log record identifier.
  name: action.properties.loguid
  type: keyword

action.properties.nat_addtnl_rulenum:
  description: Additional NAT rule number applied to the flow.
  name: action.properties.nat_addtnl_rulenum
  type: keyword

action.properties.nat_rulenum:
  description: Primary NAT rule number applied to the flow.
  name: action.properties.nat_rulenum
  type: keyword

action.properties.observer_type:
  description: Vendor observer type from DeviceProduct or product.
  name: action.properties.observer_type
  type: keyword

action.properties.origin:
  description: Raw origin value before ECS normalization.
  name: action.properties.origin
  type: keyword

action.properties.origin_sic_name:
  description: SIC identity name of the originating Check Point component.
  name: action.properties.origin_sic_name
  type: keyword

action.properties.originsicname:
  description: Original SIC distinguished name of the reporting gateway.
  name: action.properties.originsicname
  type: keyword

action.properties.product:
  description: Raw Check Point product value before ECS observer.product mapping.
  name: action.properties.product
  type: keyword

action.properties.reject_category:
  description: Category describing why the traffic was rejected.
  name: action.properties.reject_category
  type: keyword

action.properties.rule_name:
  description: Rule name from CEF Rule Name label or rule_name key.
  name: action.properties.rule_name
  type: keyword

action.properties.signature:
  description: Signature names or identifiers associated with the event.
  name: action.properties.signature
  type: array

action.properties.source_key_id:
  description: Key identifier used for source-side encryption context.
  name: action.properties.source_key_id
  type: keyword

action.properties.subproduct:
  description: Check Point subproduct value reported for the event.
  name: action.properties.subproduct
  type: keyword

action.properties.vpn_feature_name:
  description: VPN feature name associated with the event.
  name: action.properties.vpn_feature_name
  type: keyword

action.properties.vpn_peer_gateway:
  description: Peer VPN gateway name or address.
  name: action.properties.vpn_peer_gateway
  type: keyword

action.target:
  description: High-level target category assigned to the action.
  name: action.target
  type: keyword

checkpoint.application_name:
  description: Application name parsed from the CEF header Name field for Application
    Control logs.
  name: checkpoint.application_name
  type: keyword

checkpoint.firewall.tcp_flags:
  description: TCP control flags of the data flow.
  name: checkpoint.firewall.tcp_flags
  type: keyword

checkpoint.malware_action_or_attack_information:
  description: Malware action or attack information extracted from labeled fields.
  name: checkpoint.malware_action_or_attack_information
  type: keyword

checkpoint.malware_family:
  description: Malware family name reported by Check Point.
  name: checkpoint.malware_family
  type: keyword

checkpoint.protection_name:
  description: Name of the malware or threat protection that matched.
  name: checkpoint.protection_name
  type: keyword

checkpoint.protection_type:
  description: Type of malware or threat protection that generated the event.
  name: checkpoint.protection_type
  type: keyword

checkpoint.threat_prevention_rule_id:
  description: Threat Prevention rule identifier reported by Check Point.
  name: checkpoint.threat_prevention_rule_id
  type: keyword

destination.size_in_char:
  description: Character length of destination.domain.
  name: destination.size_in_char
  type: number

source.size_in_char:
  description: Character length of source.domain.
  name: source.size_in_char
  type: number
